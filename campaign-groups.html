<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조 분류</title>
<link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F5F5F7;color:#1D1D1F;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:800;margin:0 8px 0 0}
  .tabs{display:flex;gap:2px;padding:3px;background:#E3E3E8;border-radius:12px}
  .tab{height:34px;padding:0 16px;font:inherit;font-size:14.5px;font-weight:600;border-radius:9px;border:0;background:transparent;color:#6E6E73;cursor:pointer}
  .tab.on{background:#fff;color:#1D1D1F;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sp{flex:1}
  #msg{font-size:13px;color:#86868B}
  main{max-width:1320px;margin:0 auto;padding:22px 24px 80px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
  .center{grid-column:1/-1;text-align:center;color:#86868B;padding:80px 0}
  .folders{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px;padding-top:10px}
  .f{position:relative;background:#fff;border-radius:6px 18px 18px 18px;padding:14px 14px 12px;min-height:150px;border:2px solid transparent;transition:border-color .12s,background .12s}
  .f:before{content:"";position:absolute;left:-2px;top:-12px;width:44%;height:14px;background:inherit;border:2px solid transparent;border-bottom:0;border-radius:8px 12px 0 0}
  .f.sel{border-color:#0071E3;background:#F2F8FF}
  .f.sel:before{border-color:#0071E3}
  .f .hd{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;cursor:pointer}
  .f .no{font-size:16px;font-weight:800;color:#0071E3}
  .f .nm{font-size:13px;font-weight:700;color:#1D1D1F;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .f .ct{font-size:12px;font-weight:700;color:#86868B}
  .m{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:4px 6px;border-radius:8px;cursor:pointer}
  .m:hover{background:#FFF0F0}
  .redo{margin-top:8px;font:inherit;font-size:12px;font-weight:700;border:0;border-radius:999px;padding:5px 10px;background:#FFF0F0;color:#D70015;cursor:pointer}
  .m small{font-size:11.5px;font-weight:700;color:#0071E3}
  .m .x{margin-left:auto;color:#C7C7CC;font-size:13px}
  .m:hover .x{color:#D70015}
  .side{background:#fff;border-radius:20px;padding:16px 18px;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto}
  .side h2{font-size:15px;font-weight:800;margin:0 0 4px}
  .side .h{font-size:12.5px;color:#86868B;margin:0 0 10px}
  .r{display:flex;align-items:center;gap:8px;padding:5px 4px;border-top:1px solid #F0F0F3}
  .r .n{flex:1;font-size:13.5px;font-weight:600;min-width:0}
  .r .n i{font-style:normal;color:#86868B;font-weight:500;margin-right:4px}
  .gb{display:flex;gap:3px}
  .gb button{width:26px;height:26px;border-radius:7px;border:1px solid #DCDCE0;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:#6E6E73;cursor:pointer;padding:0}
  .gb button:hover{border-color:#0071E3;color:#0071E3}
  .gb button.on{background:#0071E3;border-color:#0071E3;color:#fff}
  .r.un .n{color:#D70015}
  .hb{height:34px;padding:0 14px;font:inherit;font-size:14px;font-weight:700;border-radius:10px;border:1px solid #DCDCE0;background:#fff;color:#1D1D1F;cursor:pointer}
  .hb.pri{background:#0071E3;border-color:#0071E3;color:#fff}.hb:disabled{opacity:.5;cursor:default}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
  .modal[hidden]{display:none}
  .mbox{background:#F5F5F7;border-radius:22px;width:min(1240px,100%);padding:18px 20px 24px}
  .mhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mhd h2{font-size:18px;font-weight:800;margin:0}
  .gcnt{font-size:13px;font-weight:700;color:#6E6E73}.gcnt input{width:56px;height:32px;margin-left:4px;border:1px solid #DCDCE0;border-radius:8px;font:inherit;text-align:center}
  .mst{font-size:13.5px;color:#6E6E73;margin:10px 0 14px;font-weight:600}
  .agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .ag{background:#fff;border-radius:16px;padding:12px 14px}
  .ag h3{font-size:15px;font-weight:800;color:#0071E3;margin:0 0 8px}.ag h3 small{color:#86868B;font-weight:700;margin-left:4px}
  .am{display:grid;grid-template-columns:48px 1fr 58px;align-items:center;font-size:13.5px;font-weight:600;padding:5px 0;border-top:1px solid #F0F0F3}
  .am i{font-style:normal;color:#86868B;font-weight:500}
  .am .tg{display:flex;justify-content:flex-end}
  .am .tg span{font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;background:#F0F0F3;color:#6E6E73;white-space:nowrap}
  .am .tg span.fr{background:#E8F2FD;color:#0071E3}.am .tg span.no{background:#FFF0F0;color:#D70015}
  .spr{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0}.spr b{font-size:13.5px;font-weight:800;color:#AF52DE;padding-top:5px;white-space:nowrap}
  #apSp{display:flex;flex-wrap:wrap;gap:5px}#apSp button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid #DCDCE0;background:#fff;color:#3A3A3C;border-radius:999px;padding:4px 10px;cursor:pointer}
  #apSp button.c1,.am .tg span.c1,.m small.c1{background:#F5EBFA;border-color:#F5EBFA;color:#AF52DE}
  #apSp button.c2,.am .tg span.c2,.m small.c2{background:#FFF4E5;border-color:#FFF4E5;color:#C76A00}
  #apSp button.c3,.am .tg span.c3,.m small.c3{background:#FFF0F0;border-color:#FFF0F0;color:#D70015}
  #apSp button.c4,.am .tg span.c4,.m small.c4{background:#E9F8EE;border-color:#E9F8EE;color:#1E8E3E}
  #apSp{display:grid!important;grid-template-columns:repeat(5,1fr);gap:0 18px!important;flex:1}
  #apSp .cr{display:grid;grid-template-columns:48px 1fr 74px;align-items:center;padding:4px 0;border-bottom:1px solid #EBEBEF;font-size:13px;font-weight:600}
  #apSp .cr i{font-style:normal;color:#86868B;font-weight:500}
  #apSp .cr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #apSp .cr select{width:74px;font:inherit;font-size:12.5px;font-weight:700;border:1px solid #DCDCE0;border-radius:7px;background:#fff;color:#86868B;padding:2px 4px;cursor:pointer}
  #apSp .cr.c1 select{color:#AF52DE;border-color:#E5CCF2}#apSp .cr.c2 select{color:#C76A00;border-color:#FFD9A8}
  #apSp .cr.c3 select{color:#D70015;border-color:#FFC2C2}#apSp .cr.c4 select{color:#1E8E3E;border-color:#BFE5CB}
  .ag.spg{box-shadow:inset 0 0 0 2px #E5CCF2}
  .m select{margin-left:4px;font:inherit;font-size:11.5px;font-weight:700;border:1px solid #E5CCF2;border-radius:6px;color:#AF52DE;background:#fff;padding:1px 2px}
  @media (max-width:980px){.agrid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:980px){main{grid-template-columns:1fr}.side{position:static;max-height:none}.folders{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1 id="ttl">조 분류</h1><div class="tabs" id="tabs"></div><span class="sp"></span><span id="msg"></span><button class="hb" id="autoBtn">설문으로 자동 편성</button></header>
<div class="modal" id="ap" hidden><div class="mbox"><div class="mhd"><h2 id="apTitle">자동 편성</h2><span class="sp"></span><label class="gcnt">조 수 <input type="number" id="apN" min="2" max="10"></label><button class="hb" id="apAgain">다시 섞기</button><button class="hb pri" id="apApply">적용</button><button class="hb" id="apClose">닫기</button></div><div class="spr"><b>구분</b><div id="apSp"></div></div><p class="mst" id="apStat"></p><div class="agrid" id="apGrid"></div></div></div>
<main id="main"><div class="center">불러오는 중…</div></main>
<script>
/* 3차 수행평가(윤리문제 알림 캠페인) 조 분류 — campaign-groups.html?ws=학습지ID (싯다르타 제출 현황의 [조 분류] 버튼)
   - 반별 학생을 1~8조로 나눔 → campaign_members(학생별 조·역할). 다른 조로 옮기면 역할은 비움
   - 학생 화면(games/campaign-groups.js)은 자기 조에서 역할만 고르고, 조장이 모둠 이름(campaign_groups)을 바꿈 */
const CG_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co',CG_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const cg=supabase.createClient(CG_URL,CG_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});
const WS=+(new URLSearchParams(location.search).get('ws')||0),NG=10,ROLES=['조장','서기','자료조사','제작','발표'];
let USER=null,W=null,STU=[],MEM=[],GN={},GL={},CLS='',SEL=1,BUSY=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function msg(t){$('msg').textContent=t||'';}

async function init(){
  if(!WS){$('main').innerHTML='<div class="center">학습지 번호(?ws=)가 없어요.</div>';return;}
  const{data:{session}}=await cg.auth.getSession();
  if(!session){$('main').innerHTML='<div class="center">싯다르타에 로그인한 상태에서 열어 주세요.</div>';return;}
  USER=session.user;
  try{
    const r1=await cg.from('worksheets').select('id,title,class_name,class_category').eq('id',WS).single();
    if(r1.error||!r1.data)throw new Error('학습지를 찾을 수 없어요.');
    W=r1.data;document.title=W.title+' · 조 분류';
    let q=cg.from('students').select('id,class_name,name,number').eq('user_id',USER.id);
    if(W.class_name)q=q.eq('class_name',W.class_name);else if(W.class_category)q=q.eq('class_category',W.class_category);
    const r2=await q;if(r2.error)throw r2.error;
    STU=(r2.data||[]).filter(s=>s.name&&String(s.name).trim()&&+s.number!==0).sort((a,b)=>(+a.number||0)-(+b.number||0));
  }catch(e){$('main').innerHTML='<div class="center">불러오지 못했어요: '+esc(e.message||e)+'</div>';return;}
  const cls=[...new Set(STU.map(s=>s.class_name))].sort();
  CLS=cls[0]||'';
  $('tabs').innerHTML=cls.map(c=>`<button class="tab${c===CLS?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('tabs').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;CLS=b.dataset.c;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));render();};
  await load();render();
  setInterval(async()=>{if(document.hidden||BUSY)return;await load();render();},10000);
}
async function load(){
  const[a,b]=await Promise.all([cg.from('campaign_members').select('student_id,class_name,group_no,name,role,special,care').eq('worksheet_id',WS),cg.from('campaign_groups').select('class_name,group_no,name,locked').eq('worksheet_id',WS)]);
  if(!a.error)MEM=a.data||[];
  if(!b.error){GN={};GL={};(b.data||[]).forEach(g=>{GN[g.class_name+'|'+g.group_no]=g.name||'';GL[g.class_name+'|'+g.group_no]=!!g.locked;});}
}
function render(){
  const studs=STU.filter(s=>s.class_name===CLS),mem={};MEM.forEach(m=>{if(m.class_name===CLS)mem[m.student_id]=m;});
  const nameOf=id=>{const s=STU.find(x=>x.id===id);return s?s.name:(mem[id]&&mem[id].name)||'';};
  let f='';
  for(let g=1;g<=NG;g++){
    const ms=Object.values(mem).filter(m=>m.group_no===g).sort((a,b)=>(a.role?ROLES.indexOf(a.role):9)-(b.role?ROLES.indexOf(b.role):9));
    f+=`<div class="f${g===SEL?' sel':''}" data-f="${g}"><div class="hd" data-pick="${g}"><span class="no">${g}조</span><span class="nm">${esc(GN[CLS+'|'+g]||'')}</span><span class="ct">${ms.length}명</span></div>${GL[CLS+'|'+g]?`<button class="redo" data-redo="${g}">역할 다시 뽑기</button>`:''}`
      +ms.map(m=>`<div class="m" data-out="${m.student_id}">${esc(nameOf(m.student_id))}${m.care?`<small class="${CG_CARE_CL[m.care]||''}">${esc(m.care)}</small>`:''}${m.care==='통합반'?`<select data-rl="${m.student_id}"><option value="">역할</option>${ROLES.map(r=>`<option${m.role===r?' selected':''}>${r}</option>`).join('')}</select>`:(m.role?`<small>${esc(m.role)}</small>`:'')}<span class="x">✕</span></div>`).join('')+`</div>`;
  }
  const un=studs.filter(s=>!mem[s.id]).length;
  const side=`<div class="side"><h2>${esc(CLS)} 학생 <span style="color:#86868B;font-weight:600">· 미배정 ${un}명</span></h2>`
    +studs.map(s=>{const m=mem[s.id];let bs='';for(let g=1;g<=NG;g++)bs+=`<button data-s="${s.id}" data-g="${g}" class="${m&&m.group_no===g?'on':''}">${g}</button>`;
      return `<div class="r${m?'':' un'}"><span class="n" data-s="${s.id}" data-g="sel" style="cursor:pointer"><i>${esc(s.number)}</i>${esc(s.name)}</span><span class="gb">${bs}</span></div>`;}).join('')+`</div>`;
  $('main').innerHTML=`<div class="folders">${f}</div>${side}`;
  $('main').onchange=e=>{const sl=e.target.closest('[data-rl]');if(sl)setFixedRole(+sl.dataset.rl,sl.value);};
  $('main').onclick=e=>{
    if(e.target.closest('select'))return;
    const rd=e.target.closest('[data-redo]');if(rd){redo(+rd.dataset.redo);return;}
    const p=e.target.closest('[data-pick]');if(p){SEL=+p.dataset.pick;render();return;}
    const o=e.target.closest('[data-out]');if(o){setGroup(+o.dataset.out,0);return;}
    const b=e.target.closest('[data-s]');if(b){const g=b.dataset.g==='sel'?SEL:+b.dataset.g;const m=mem[+b.dataset.s];setGroup(+b.dataset.s,m&&m.group_no===g&&b.dataset.g!=='sel'?0:g);return;}
    const fd=e.target.closest('[data-f]');if(fd){SEL=+fd.dataset.f;render();}
  };
}
async function setGroup(id,g){
  const s=STU.find(x=>x.id===id);if(!s||BUSY)return;
  const m=MEM.find(x=>x.student_id===id);if(m&&m.group_no===g)return;
  BUSY=true;msg('저장 중…');
  const r=g?await cg.from('campaign_members').upsert({worksheet_id:WS,student_id:id,class_name:s.class_name,group_no:g,name:s.name,number:s.number==null?null:+s.number||null,role:null,pref:null,by_teacher:true,updated_at:new Date().toISOString()},{onConflict:'worksheet_id,student_id'})
           :await cg.from('campaign_members').delete().eq('worksheet_id',WS).eq('student_id',id);
  msg(r.error?'저장 실패: '+r.error.message:'저장됨');
  await load();BUSY=false;render();
}
// 역할 추첨을 되돌림: 확정 풀고 역할만 비움(희망은 남김) → 학생들이 다시 [역할 추첨]
// 통합반 학생 역할은 선생님이 정함(추첨은 나머지 역할로만)
async function setFixedRole(id,role){
  if(BUSY)return;BUSY=true;msg('저장 중…');
  const r=await cg.from('campaign_members').update({role:role||null}).eq('worksheet_id',WS).eq('student_id',id);
  msg(r.error?(String(r.error.message||'').includes('duplicate')||r.error.code==='23505'?'그 조에 이미 있는 역할':'저장 실패'):'저장됨');
  await load();BUSY=false;render();
}
async function redo(g){
  if(BUSY||!confirm(CLS+' '+g+'조 역할을 다시 뽑을까요?'))return;
  BUSY=true;msg('저장 중…');
  const a=await cg.from('campaign_members').update({role:null}).eq('worksheet_id',WS).eq('class_name',CLS).eq('group_no',g).or('care.is.null,care.neq.통합반');
  const b=await cg.from('campaign_groups').update({locked:false}).eq('worksheet_id',WS).eq('class_name',CLS).eq('group_no',g);
  msg(a.error||b.error?'저장 실패':'다시 뽑기로 바뀜');
  await load();BUSY=false;render();
}

/* ---------- 설문으로 자동 편성 (2026-11-17) ----------
   - 모둠 구성 설문 학습지(games/group-survey.html)의 답: 같이 하고 싶은 친구 1~3지망, 관심 분야, 희망 역할
   - 싯다르타 희망 진로(students.changye._career.goal)를 분야로 묶어서 비슷한 학생끼리
   - 점수: 고른 친구가 같은 조면 1지망3·2지망2·3지망1.5(서로 고르면 +1), 설문에 친구를 썼는데 조에 한 명도 없으면 -50(아는 친구 최소 1명 보장),
     같은 진로 분야 +1, 같은 관심 분야 +0.5, 같은 희망 역할이 겹치면 -0.3 → 무작위 시작 여러 번 + 자리 바꾸기로 가장 높은 안
   - [적용]하면 그 반 기존 조·역할·모둠 기록을 지우고 새로 배정(by_teacher=true → 학생은 조를 옮길 수 없음) */
const AP_FIELD=[['의료·보건',/의사|간호|약사|약학|치료|보건|의료|한의|수의|병원|재활|임상|방사선|치위생|응급|의학/],['교육',/교사|선생|교육|유치원|보육|강사|교수/],
  ['공학·IT',/개발|프로그래|소프트웨어|컴퓨터|IT|엔지니어|공학|인공지능|AI|데이터|게임|로봇|기계|전자|전기|건축|토목|화이트해커|보안/],['자연과학',/연구원|과학|화학|생물|생명|물리|천문|환경|지구/],
  ['경영·경제',/경영|경제|회계|금융|마케팅|사업|CEO|창업|무역|은행|세무|증권|투자|유통/],['법·행정',/변호사|판사|검사|법|공무원|경찰|소방|군인|장교|외교|행정|정치|교도/],
  ['미디어·예술',/디자인|디자이너|작가|PD|기자|아나운서|방송|영상|예술|음악|배우|가수|미술|웹툰|사진|연출|작곡|댄서|패션|애니/],['상담·복지',/상담|사회복지|심리|복지|청소년지도/],
  ['체육',/체육|운동|선수|스포츠|트레이너|코치|태권/],['서비스',/요리|셰프|조리|제과|제빵|바리스타|승무원|호텔|관광|뷰티|미용|메이크업|항공/]];
function apField(goal){const g=Array.isArray(goal)?goal.join(' '):String(goal||'');if(!g.trim())return '';for(const[f,re]of AP_FIELD)if(re.test(g))return f;return '기타';}
let AP=null;
async function autoOpen(){
  if(BUSY)return;BUSY=true;msg('설문 불러오는 중…');
  try{
    const studs=STU.filter(s=>s.class_name===CLS);
    const sw=await cg.from('worksheets').select('id').eq('user_id',USER.id).ilike('custom_html','%group-survey.html%').order('id',{ascending:false}).limit(1);
    const sid=sw.data&&sw.data[0]&&sw.data[0].id;
    if(!sid){msg('모둠 구성 설문 학습지가 없어요');return;}
    const [sub,car]=await Promise.all([cg.from('worksheet_submissions').select('student_id,answers').eq('worksheet_id',sid).in('student_id',studs.map(s=>s.id)),cg.from('students').select('id,changye').in('id',studs.map(s=>s.id))]);
    const A={},C={};(sub.data||[]).forEach(r=>{A[r.student_id]=(r.answers&&r.answers.fields)||{};});
    (car.data||[]).forEach(r=>{let g='';try{g=(JSON.parse(r.changye||'{}')._career||{}).goal||'';}catch(e){}C[r.id]={goal:Array.isArray(g)?g.join(', '):String(g||''),field:apField(g)};});
    const ids=new Set(studs.map(s=>s.id));
    const P=studs.map(s=>{const f=A[s.id]||{},w=['f1','f2','f3'].map(k=>+String(f[k]||'').split('|')[0]).filter(x=>x&&ids.has(x)&&x!==s.id);
      return{id:s.id,name:s.name,number:s.number,wish:w,answered:!!A[s.id],interest:String(f.interest||'').split(',').filter(Boolean),role:f.rolePref||'',goal:(C[s.id]||{}).goal||'',field:(C[s.id]||{}).field||''};});
    let cr=null;try{cr=JSON.parse(localStorage.getItem('cg_care_'+WS+'_'+CLS)||'null');}catch(e){}
    if(!cr||typeof cr!=='object'){cr={};MEM.forEach(m=>{if(m.class_name===CLS&&m.care)cr[m.student_id]=m.care;});}
    const CARE={};Object.keys(cr).forEach(k=>{if(ids.has(+k)&&CG_CARE.includes(cr[k]))CARE[+k]=cr[k];});
    AP={P,sid,CARE};AP.G=apDefG();
    $('apN').value=AP.G;apSpPaint();apRun();$('ap').hidden=false;msg('');
  }catch(e){msg('불러오지 못했어요: '+(e.message||e));}finally{BUSY=false;}
}
// 학생 구분 (2026-11-21): 통합반·출석↓은 보통 조원(4명)에 한 명 더 붙는 특별조로, 미참여는 보통 조원으로 넣음.
// 구분된 학생은 종류와 상관없이 한 조에 한 명까지. 역할: 출석↓은 추첨 뒤 남는 역할, 통합반은 선생님이 정함(안 정하면 남는 역할).
// Ace: 조마다 한 명씩 흩어 넣고, 구분 학생(통합반·미참여·출석↓)이 있는 조에 먼저 (2026-11-21)
const CG_CARE=['통합반','미참여','출석↓','Ace'],CG_CARE_CL={'통합반':'c1','미참여':'c2','출석↓':'c3','Ace':'c4'};
const apC=i=>{const c=AP.CARE[i];return !!c&&c!=='Ace';};          // 구분 학생(조마다 한 명까지)
const apX=i=>{const c=AP.CARE[i];return c==='통합반'||c==='출석↓';};   // 한 명 더 붙는 학생
const apT=i=>AP.CARE[i]==='Ace'?'a':AP.CARE[i]?(apX(i)?'x':'m'):'n';                        // 바꾸기는 같은 종류끼리만
function apDefG(){const n=AP.P.filter(p=>!apX(p.id)).length;return Math.max(2,Math.min(NG,Math.ceil(n/4)));}
function apSpPaint(){
  $('apSp').innerHTML=AP.P.slice().sort((a,b)=>(+a.number||0)-(+b.number||0)).map(p=>{const c=AP.CARE[p.id]||'';
    return `<label class="cr ${c?CG_CARE_CL[c]:''}"><i>${esc(p.number)}</i><span>${esc(p.name)}</span><select data-sp="${p.id}"><option value="">-</option>${CG_CARE.map(k=>`<option${k===c?' selected':''}>${k}</option>`).join('')}</select></label>`;}).join('');
}
$('apSp').onchange=e=>{const sl=e.target.closest('[data-sp]');if(!sl||!AP)return;const i=+sl.dataset.sp;
  if(sl.value)AP.CARE[i]=sl.value;else delete AP.CARE[i];
  try{localStorage.setItem('cg_care_'+WS+'_'+CLS,JSON.stringify(AP.CARE));}catch(e){}
  AP.G=apDefG();$('apN').value=AP.G;apSpPaint();apRun();};
function apScore(groups){
  const P=AP.P,by={};P.forEach(p=>by[p.id]=p);let sc=0;
  groups.forEach(g=>{const set=new Set(g);
    g.forEach(i=>{const p=by[i];let fr=0;p.wish.forEach((w,k)=>{if(set.has(w)){fr++;sc+=[3,2,1.5][k];if(by[w].wish.includes(i))sc+=.5;}});if(p.wish.length&&!fr)sc-=50;if(fr>2)sc-=40*(fr-2);});
    const tg=g.filter(i=>apC(i)).length;if(tg>1)sc-=100*(tg-1);const ac=g.filter(i=>AP.CARE[i]==='Ace').length;if(ac>1)sc-=100*(ac-1);
    for(let a=0;a<g.length;a++)for(let b=a+1;b<g.length;b++){const x=by[g[a]],y=by[g[b]];
      if(x.field&&x.field!=='기타'&&x.field===y.field)sc+=1;
      sc+=.5*x.interest.filter(v=>y.interest.includes(v)).length;
      if(x.role&&x.role!=='상관없음'&&x.role===y.role)sc-=.3;}});
  return sc;
}
function apRun(){
  const P=AP.P,n=P.length,G=Math.max(2,Math.min(NG,+$('apN').value||AP.G));AP.G=G;
  let best=null,bs=-1e9;
  for(let rs=0;rs<12;rs++){
    const sh=a=>a.sort(()=>Math.random()-.5),groups=Array.from({length:G},()=>[]);
    const tg=g=>g.filter(x=>apC(x)).length,ac=g=>g.filter(x=>AP.CARE[x]==='Ace').length,nx=g=>g.filter(x=>!apX(x)).length;
    const pick=(id,better)=>{let gi=-1;groups.forEach((g,k)=>{if(gi<0||better(g,groups[gi]))gi=k;});groups[gi].push(id);};
    // ① 미참여: 한 조에 한 명씩 ② 통합반·출석↓: 구분 학생 없는 조에 한 명씩(보통 조원 4명 + 1) ③ Ace: 한 조에 한 명씩, 구분 학생 있는 조 먼저 ④ 나머지: 보통 조원 적은 조부터
    sh(P.filter(p=>apT(p.id)==='m').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>tg(g)<tg(h)));
    sh(P.filter(p=>apT(p.id)==='x').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>tg(g)<tg(h)));
    sh(P.filter(p=>apT(p.id)==='a').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>ac(g)<ac(h)||(ac(g)===ac(h)&&(tg(g)>tg(h)||(tg(g)===tg(h)&&nx(g)<nx(h))))));
    sh(P.filter(p=>apT(p.id)==='n').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>nx(g)<nx(h)));
    let cur=apScore(groups);
    for(let it=0;it<n*400;it++){
      const a=Math.floor(Math.random()*G),b=Math.floor(Math.random()*G);if(a===b)continue;
      const ia=Math.floor(Math.random()*groups[a].length),ib=Math.floor(Math.random()*groups[b].length);
      const x=groups[a][ia],y=groups[b][ib];if(apT(x)!==apT(y))continue;groups[a][ia]=y;groups[b][ib]=x;
      const s2=apScore(groups);if(s2>=cur)cur=s2;else{groups[a][ia]=x;groups[b][ib]=y;}
    }
    if(cur>bs){bs=cur;best=groups.map(g=>g.slice());}
  }
  AP.groups=best;apPaint();
}
function apPaint(){
  const by={};AP.P.forEach(p=>by[p.id]=p);let lonely=0,over=0;
  $('apGrid').innerHTML=AP.groups.map((g,gi)=>{const set=new Set(g);
    const spn=g.filter(i=>apX(i)).length;
    return`<div class="ag${spn?' spg':''}"><h3>${gi+1}조<small>${g.length}명${spn?' · 특별조':''}</small></h3>`+g.slice().sort((a,b)=>(+by[a].number||0)-(+by[b].number||0)).map(i=>{const p=by[i],fr=p.wish.filter(w=>set.has(w)).length;if(p.wish.length&&!fr)lonely++;if(fr>2)over++;
      const tag=AP.CARE[i]?`<span class="${CG_CARE_CL[AP.CARE[i]]}">${esc(AP.CARE[i])}</span>`:!p.answered?'<span>설문 X</span>':(p.wish.length&&!fr)?'<span class="no">친구 X</span>':'';
      return`<div class="am"><i>${esc(p.number)}</i><span title="${esc([p.goal,p.field].filter(Boolean).join(' · '))}">${esc(p.name)}</span><span class="tg">${tag}</span></div>`;}).join('')+`</div>`;}).join('');
  const ans=AP.P.filter(p=>p.answered).length;
  $('apStat').textContent=`${CLS} · 설문 응답 ${ans}/${AP.P.length}명 ${CG_CARE.map(c=>{const n=Object.values(AP.CARE).filter(v=>v===c).length;return n?` · ${c} ${n}명`:'';}).join('')} · 구분 겹친 조 ${AP.groups.filter(g=>g.filter(i=>apC(i)).length>1).length}개 · 친구 없는 학생 ${lonely}명 · 친구 3명 같이 ${over}명`;
}
async function apApply(){
  const has=MEM.some(m=>m.class_name===CLS);
  if(has&&!confirm(CLS+'의 지금 조·역할·모둠 기록을 지우고 이 안으로 새로 배정할까요?'))return;
  BUSY=true;$('apApply').disabled=true;msg('저장 중…');
  try{
    const by={};AP.P.forEach(p=>by[p.id]=p);
    let r=await cg.from('campaign_members').delete().eq('worksheet_id',WS).eq('class_name',CLS);if(r.error)throw r.error;
    r=await cg.from('campaign_groups').delete().eq('worksheet_id',WS).eq('class_name',CLS);if(r.error)throw r.error;
    const rows=[];AP.groups.forEach((g,gi)=>g.forEach(i=>{const p=by[i];rows.push({worksheet_id:WS,student_id:i,class_name:CLS,group_no:gi+1,name:p.name,number:p.number==null?null:+p.number||null,role:null,pref:null,by_teacher:true,special:apX(i),care:AP.CARE[i]||null,updated_at:new Date().toISOString()});}));
    r=await cg.from('campaign_members').insert(rows);if(r.error)throw r.error;
    $('ap').hidden=true;msg('배정됨');
  }catch(e){msg('저장 실패: '+(e.message||e));}
  BUSY=false;$('apApply').disabled=false;await load();render();
}
$('autoBtn').onclick=autoOpen;$('apAgain').onclick=apRun;$('apApply').onclick=apApply;$('apClose').onclick=()=>{$('ap').hidden=true;};
$('apN').onchange=()=>{if(AP)apRun();};
init();
</script>
