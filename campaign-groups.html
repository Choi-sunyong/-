<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조 편성</title>
<link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden;margin:0;background:#F5F5F7;color:#1D1D1F;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  header{flex:0 0 auto;z-index:20;background:rgba(245,245,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
  .hin{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tabs{display:flex;gap:2px;padding:3px;background:#E3E3E8;border-radius:12px}
  .tab{height:34px;width:56px;padding:0;font:inherit;font-size:14.5px;font-weight:600;border-radius:9px;border:0;background:transparent;color:#6E6E73;cursor:pointer}
  .tab.on{background:#fff;color:#1D1D1F;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sp{flex:1}
  #msg{font-size:13px;color:#86868B}
  .gcnt{font-size:13.5px;font-weight:700;color:#6E6E73;display:flex;align-items:center;gap:6px}
  .gcnt input{width:56px;height:34px;border:1px solid #DCDCE0;border-radius:9px;font:inherit;text-align:center;background:#fff}
  .hb{height:34px;padding:0 14px;font:inherit;font-size:14px;font-weight:700;border-radius:10px;border:1px solid #DCDCE0;background:#fff;color:#1D1D1F;cursor:pointer}
  .hb.pri{background:#0071E3;border-color:#0071E3;color:#fff}.hb:disabled{opacity:.5;cursor:default}
  .stat{flex:0 0 auto;width:100%;max-width:1280px;margin:0 auto;padding:10px 20px 0;font-size:13.5px;font-weight:600;color:#6E6E73;text-align:center}
  main{flex:1;min-height:0;width:100%;max-width:1280px;margin:0 auto;padding:14px 20px 16px;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px;align-items:stretch}
  .center{grid-column:1/-1;text-align:center;color:#86868B;padding:80px 0}
  .folders{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start;overflow-y:auto;min-height:0;padding-right:2px}
  .f{background:#fff;border-radius:16px;padding:12px 12px 8px;border:2px solid transparent;min-height:120px}
  .f.spg{border-color:#E5CCF2}
  .f .hd{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-bottom:6px}
  .f .no{font-size:16px;font-weight:800;color:#0071E3}
  .f .nm{font-size:13px;font-weight:700;color:#1D1D1F;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .f .ct{font-size:12px;font-weight:700;color:#86868B}
  .m{display:grid;grid-template-columns:52px minmax(0,1fr) 64px 18px;align-items:center;text-align:center;font-size:13.5px;font-weight:600;padding:5px 0;border-top:1px solid #F0F0F3}
  .m i{font-style:normal;color:#86868B;font-weight:500}
  .m .x{color:#C7C7CC;cursor:pointer;font-size:12px}.m .x:hover{color:#D70015}
  .tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;background:#F0F0F3;color:#6E6E73;white-space:nowrap;justify-self:center}
  .tag.no{background:#FFF0F0;color:#D70015}
  .c1{background:#F5EBFA;color:#AF52DE}.c2{background:#FFF4E5;color:#C76A00}.c3{background:#FFF0F0;color:#D70015}.c4{background:#E9F8EE;color:#1E8E3E}
  .m select{width:62px;font:inherit;font-size:11.5px;font-weight:700;border:1px solid #E5CCF2;border-radius:6px;color:#AF52DE;background:#fff;padding:1px 2px;justify-self:center}
  .redo{display:block;margin:6px auto 2px;font:inherit;font-size:12px;font-weight:700;border:0;border-radius:999px;padding:4px 10px;background:#FFF0F0;color:#D70015;cursor:pointer}
  .side{background:#fff;border-radius:16px;padding:0 12px 10px;overflow-y:auto;min-height:0}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  td.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  th{font-size:12px;color:#86868B;font-weight:700;padding:8px 4px;border-bottom:1px solid #E5E5EA;text-align:center;position:sticky;top:0;background:#fff}
  td{padding:5px 4px;border-bottom:1px solid #F0F0F3;text-align:center;font-size:13.5px;font-weight:600}
  td.nb{color:#86868B;font-weight:500}
  tr.un td.nm{color:#D70015}
  td select{width:88px;font:inherit;font-size:12.5px;font-weight:700;border:1px solid #DCDCE0;border-radius:7px;background:#fff;color:#3A3A3C;padding:3px 4px;text-align:center}
  td select.c1{border-color:#E5CCF2}td select.c2{border-color:#FFD9A8}td select.c3{border-color:#FFC2C2}td select.c4{border-color:#BFE5CB}
  td select.c1,td select.c2,td select.c3,td select.c4{background:#fff}
  td select.c1{color:#AF52DE}td select.c2{color:#C76A00}td select.c3{color:#D70015}td select.c4{color:#1E8E3E}
  body.draft .f{background:#FBFCFF}
  @media (max-width:1100px){body{overflow:auto;height:auto}main{grid-template-columns:1fr}.folders{grid-template-columns:repeat(2,1fr);overflow:visible}.side{overflow:visible}}
</style>
</head>
<body>
<header><div class="hin"><div class="tabs" id="tabs"></div><span class="sp"></span><span id="msg"></span>
  <label class="gcnt">조 수<input type="number" id="apN" min="2" max="10"></label>
  <button class="hb" id="autoBtn">설문으로 편성</button>
  <button class="hb" id="apAgain" hidden>다시 섞기</button><button class="hb" id="apCancel" hidden>취소</button><button class="hb pri" id="apApply" hidden>적용</button>
</div></header>
<div class="stat" id="stat"></div>
<main id="main"><div class="center">불러오는 중…</div></main>
<script>
/* 3차 수행평가(윤리문제 알림 캠페인) 조 편성 — campaign-groups.html?ws=학습지ID (학습지 카드 톱니바퀴 환경설정 창 안, 2026-11-21 한 화면으로)
   - 왼쪽: 조 폴더(설문으로 편성 중이면 그 안, 아니면 저장된 조) / 오른쪽: 학생 표(학번·이름·구분·조)
   - 저장된 상태에서 조·구분을 바꾸면 바로 저장. [설문으로 편성] → 안이 나오고 [적용]해야 저장(그 반 기존 조·역할·모둠 기록을 지우고 새로)
   - 학생 화면(games/campaign-groups.js)은 자기 조에서 역할을 고르고, 조장이 모둠 이름(campaign_groups)을 바꿈 */
const CG_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co',CG_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const cg=supabase.createClient(CG_URL,CG_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});
const WS=+(new URLSearchParams(location.search).get('ws')||0),NG=10,ROLES=['조장','서기','자료조사','제작','발표'];
let USER=null,W=null,STU=[],MEM=[],GN={},GL={},CLS='',BUSY=false,AP=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function msg(t){$('msg').textContent=t||'';}
// 학생 구분: 통합반·출석↓은 보통 조원(4명)에 한 명 더 붙는 특별조, 미참여는 보통 조원, 구분 학생은 조마다 한 명까지.
// 역할: 출석↓은 추첨 뒤 남는 역할, 통합반은 선생님이 정함(안 정하면 남는 역할). Ace: 조마다 한 명씩, 구분 학생 있는 조 먼저
const CG_CARE=['통합반','미참여','출석↓','Ace'],CG_CARE_CL={'통합반':'c1','미참여':'c2','출석↓':'c3','Ace':'c4'};
const isX=c=>c==='통합반'||c==='출석↓';

async function init(){
  if(!WS){$('main').innerHTML='<div class="center">학습지 번호(?ws=)가 없어요.</div>';return;}
  const{data:{session}}=await cg.auth.getSession();
  if(!session){$('main').innerHTML='<div class="center">싯다르타에 로그인한 상태에서 열어 주세요.</div>';return;}
  USER=session.user;
  try{
    const r1=await cg.from('worksheets').select('id,title,class_name,class_category').eq('id',WS).single();
    if(r1.error||!r1.data)throw new Error('학습지를 찾을 수 없어요.');
    W=r1.data;document.title=W.title+' · 조 편성';
    let q=cg.from('students').select('id,class_name,name,number').eq('user_id',USER.id);
    if(W.class_name)q=q.eq('class_name',W.class_name);else if(W.class_category)q=q.eq('class_category',W.class_category);
    const r2=await q;if(r2.error)throw r2.error;
    STU=(r2.data||[]).filter(s=>s.name&&String(s.name).trim()&&+s.number!==0).sort((a,b)=>(+a.number||0)-(+b.number||0));
  }catch(e){$('main').innerHTML='<div class="center">불러오지 못했어요: '+esc(e.message||e)+'</div>';return;}
  const cls=[...new Set(STU.map(s=>s.class_name))].sort();
  CLS=cls[0]||'';
  $('tabs').innerHTML=cls.map(c=>`<button class="tab${c===CLS?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('tabs').onclick=e=>{const b=e.target.closest('[data-c]');if(!b||b.dataset.c===CLS)return;
    if(AP&&!confirm('적용하지 않은 편성 안이 사라져요. 반을 바꿀까요?'))return;
    AP=null;CLS=b.dataset.c;delete $('apN').dataset.touched;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));render();};
  await load();render();
  setInterval(async()=>{if(document.hidden||BUSY||AP||(document.activeElement&&document.activeElement.tagName==='SELECT'))return;await load();render();},10000);
}
async function load(){
  const[a,b]=await Promise.all([cg.from('campaign_members').select('student_id,class_name,group_no,name,role,special,care').eq('worksheet_id',WS),cg.from('campaign_groups').select('class_name,group_no,name,locked').eq('worksheet_id',WS)]);
  if(!a.error)MEM=a.data||[];
  if(!b.error){GN={};GL={};(b.data||[]).forEach(g=>{GN[g.class_name+'|'+g.group_no]=g.name||'';GL[g.class_name+'|'+g.group_no]=!!g.locked;});}
}
// 구분: 저장된 조 기록 + 이 컴퓨터에 적어 둔 것
function careMap(){
  const ids=new Set(STU.filter(s=>s.class_name===CLS).map(s=>s.id)),M={};
  MEM.forEach(m=>{if(m.class_name===CLS&&m.care)M[m.student_id]=m.care;});
  try{const lc=JSON.parse(localStorage.getItem('cg_care_'+WS+'_'+CLS)||'null');if(lc&&typeof lc==='object')Object.keys(lc).forEach(k=>{if(!MEM.some(m=>m.student_id===+k))M[+k]=lc[k];});}catch(e){}
  Object.keys(M).forEach(k=>{if(!ids.has(+k)||!CG_CARE.includes(M[k]))delete M[k];});
  return M;
}
function render(){
  // 다시 그려도 보던 자리 그대로 (표 스크롤·화면 스크롤)
  const keepY=window.scrollY,keepS=(document.querySelector('.side')||{}).scrollTop||0,keepF=(document.querySelector('.folders')||{}).scrollTop||0;
  const studs=STU.filter(s=>s.class_name===CLS),by={};STU.forEach(s=>by[s.id]=s);
  const CARE=AP?AP.CARE:careMap();
  // 조 → 학생 목록
  const G={};let groupOf={};
  if(AP){AP.groups.forEach((g,gi)=>{G[gi+1]=g.slice();g.forEach(i=>groupOf[i]=gi+1);});}
  else MEM.forEach(m=>{if(m.class_name!==CLS)return;(G[m.group_no]=G[m.group_no]||[]).push(m.student_id);groupOf[m.student_id]=m.group_no;});
  const memOf={};MEM.forEach(m=>{if(m.class_name===CLS)memOf[m.student_id]=m;});
  const nG=Math.max(0,...Object.keys(G).map(Number));
  const sugG=Math.max(2,Math.min(NG,Math.ceil(studs.filter(s=>!isX(CARE[s.id])).length/4)));
  if(!AP&&!$('apN').matches(':focus')&&!$('apN').dataset.touched)$('apN').value=nG||sugG;
  const gCount=AP?Math.max(AP.G,nG):Math.max(nG,Math.min(NG,+$('apN').value||sugG));
  const P=AP?Object.fromEntries(AP.P.map(p=>[p.id,p])):{};
  let lonely=0;
  let f='';
  for(let g=1;g<=gCount;g++){
    const ms=(G[g]||[]).slice().sort((a,b)=>(+(by[a]||{}).number||0)-(+(by[b]||{}).number||0)),set=new Set(ms);
    const sp=ms.some(i=>isX(CARE[i]));
    f+=`<div class="f${sp?' spg':''}"><div class="hd"><span class="no">${g}조</span>${!AP&&GN[CLS+'|'+g]?`<span class="nm">${esc(GN[CLS+'|'+g])}</span>`:''}<span class="ct">${ms.length}명${sp?' · 특별조':''}</span></div>`
      +ms.map(i=>{const s=by[i]||{},m=memOf[i],c=CARE[i];let tag='';
        if(AP){const p=P[i]||{wish:[]},fr=p.wish.filter(w=>set.has(w)).length;if(p.wish.length&&!fr)lonely++;
          tag=c?`<span class="tag ${CG_CARE_CL[c]}">${esc(c)}</span>`:!p.answered?'<span class="tag">설문 X</span>':(p.wish.length&&!fr)?'<span class="tag no">친구 X</span>':'';}
        else tag=c==='통합반'?`<select data-rl="${i}"><option value="">역할</option>${ROLES.map(r=>`<option${m&&m.role===r?' selected':''}>${r}</option>`).join('')}</select>`
          :(m&&m.role?`<span class="tag">${esc(m.role)}</span>`:(c?`<span class="tag ${CG_CARE_CL[c]}">${esc(c)}</span>`:''));
        return `<div class="m"><i>${esc(s.number)}</i><span>${esc(s.name||'')}</span>${tag||'<span></span>'}<span class="x" data-out="${i}" title="빼기">✕</span></div>`;}).join('')
      +(!AP&&GL[CLS+'|'+g]?`<button class="redo" data-redo="${g}">역할 다시 뽑기</button>`:'')+`</div>`;
  }
  const opt=(cur)=>`<option value="0"${cur?'':' selected'}>-</option>`+Array.from({length:gCount},(_,k)=>k+1).map(g=>`<option value="${g}"${cur===g?' selected':''}>${g}조</option>`).join('');
  const rows=studs.map(s=>{const c=CARE[s.id]||'',g=groupOf[s.id]||0;
    return `<tr class="${g?'':'un'}"><td class="nb">${esc(s.number)}</td><td class="nm">${esc(s.name)}</td>
      <td><select data-care="${s.id}" class="${c?CG_CARE_CL[c]:''}"><option value="">-</option>${CG_CARE.map(k=>`<option${k===c?' selected':''}>${k}</option>`).join('')}</select></td>
      <td><select data-grp="${s.id}">${opt(g)}</select></td></tr>`;}).join('');
  $('main').innerHTML=`<div class="folders">${f}</div><div class="side"><table><colgroup><col style="width:70px"><col><col style="width:104px"><col style="width:104px"></colgroup><thead><tr><th>학번</th><th>이름</th><th>구분</th><th>조</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  {const sd=document.querySelector('.side'),fd=document.querySelector('.folders');if(sd)sd.scrollTop=keepS;if(fd)fd.scrollTop=keepF;window.scrollTo(0,keepY);}
  document.body.classList.toggle('draft',!!AP);
  ['apAgain','apCancel','apApply'].forEach(id=>$(id).hidden=!AP);
  if(AP&&!$('apN').matches(':focus'))$('apN').value=AP.G;
  const un=studs.filter(s=>!groupOf[s.id]).length;
  const cnt=CG_CARE.map(c=>{const n=Object.values(CARE).filter(v=>v===c).length;return n?` · ${c} ${n}명`:'';}).join('');
  $('stat').textContent=AP?`${CLS} 편성 안 · 설문 응답 ${AP.P.filter(p=>p.answered).length}/${AP.P.length}명${cnt} · 친구 X ${lonely}명`:`${CLS} · ${studs.length}명 · 미배정 ${un}명${cnt}`;
}
$('main').addEventListener('change',e=>{
  const rl=e.target.closest('[data-rl]');if(rl){setFixedRole(+rl.dataset.rl,rl.value);return;}
  const cs=e.target.closest('[data-care]');if(cs){setCare(+cs.dataset.care,cs.value);return;}
  const gs=e.target.closest('[data-grp]');if(gs){moveTo(+gs.dataset.grp,+gs.value);return;}
});
$('main').addEventListener('click',e=>{
  const rd=e.target.closest('[data-redo]');if(rd){redo(+rd.dataset.redo);return;}
  const o=e.target.closest('[data-out]');if(o){moveTo(+o.dataset.out,0);return;}
});
// 조 옮기기: 편성 안이면 안에서만, 아니면 바로 저장
function moveTo(id,g){
  if(AP){AP.groups.forEach(x=>{const k=x.indexOf(id);if(k>-1)x.splice(k,1);});if(g){while(AP.groups.length<g)AP.groups.push([]);AP.groups[g-1].push(id);AP.G=AP.groups.length;}render();return;}
  setGroup(id,g);
}
function setCare(id,v){
  const lk='cg_care_'+WS+'_'+CLS;let lc={};try{lc=JSON.parse(localStorage.getItem(lk)||'{}')||{};}catch(e){}
  if(v)lc[id]=v;else delete lc[id];try{localStorage.setItem(lk,JSON.stringify(lc));}catch(e){}
  if(AP){if(v)AP.CARE[id]=v;else delete AP.CARE[id];AP.G=apDefG();$('apN').value=AP.G;apRun();return;}
  const m=MEM.find(x=>x.student_id===id&&x.class_name===CLS);
  if(m)saveRow(id,{care:v||null,special:isX(v)});else render();
}
async function saveRow(id,patch){
  if(BUSY)return;BUSY=true;msg('저장 중…');
  const r=await cg.from('campaign_members').update(patch).eq('worksheet_id',WS).eq('student_id',id);
  msg(r.error?(r.error.code==='23505'?'그 조에 이미 있는 역할':'저장 실패'):'저장됨');
  await load();BUSY=false;render();
}
function setFixedRole(id,role){saveRow(id,{role:role||null});}
async function setGroup(id,g){
  const s=STU.find(x=>x.id===id);if(!s||BUSY)return;
  const m=MEM.find(x=>x.student_id===id);if(m&&m.group_no===g)return;
  const c=careMap()[id]||null;
  BUSY=true;msg('저장 중…');
  const r=g?await cg.from('campaign_members').upsert({worksheet_id:WS,student_id:id,class_name:s.class_name,group_no:g,name:s.name,number:s.number==null?null:+s.number||null,role:null,pref:null,by_teacher:true,care:c,special:isX(c),updated_at:new Date().toISOString()},{onConflict:'worksheet_id,student_id'})
           :await cg.from('campaign_members').delete().eq('worksheet_id',WS).eq('student_id',id);
  msg(r.error?'저장 실패: '+r.error.message:'저장됨');
  await load();BUSY=false;render();
}
// 역할 추첨을 되돌림: 확정 풀고 역할만 비움(희망은 남김, 통합반에 정해 둔 역할은 그대로) → 학생들이 다시 [역할 추첨]
async function redo(g){
  if(BUSY||!confirm(CLS+' '+g+'조 역할을 다시 뽑을까요?'))return;
  BUSY=true;msg('저장 중…');
  const a=await cg.from('campaign_members').update({role:null}).eq('worksheet_id',WS).eq('class_name',CLS).eq('group_no',g).or('care.is.null,care.neq.통합반');
  const b=await cg.from('campaign_groups').update({locked:false}).eq('worksheet_id',WS).eq('class_name',CLS).eq('group_no',g);
  msg(a.error||b.error?'저장 실패':'다시 뽑기로 바뀜');
  await load();BUSY=false;render();
}

/* ---------- 설문으로 편성 (2026-11-17) ----------
   - 모둠 구성 설문(games/group-survey.html)의 답: 같이 하고 싶은 친구 1~3지망, 관심 분야, 희망 역할
   - 싯다르타 희망 진로(students.changye._career.goal)를 분야로 묶어서 비슷한 학생끼리
   - 점수: 고른 친구가 같은 조면 1지망3·2지망2·3지망1.5(서로 고르면 +.5), 친구를 썼는데 조에 한 명도 없으면 -50(아는 친구 최소 1명 보장), 고른 친구 3명이 다 같은 조면 감점(최대 2명),
     같은 진로 분야 +1, 같은 관심 분야 +0.5, 같은 희망 역할 -0.3, 구분 학생·Ace가 한 조에 둘 이상이면 감점 → 무작위 시작 여러 번 + 같은 종류끼리 자리 바꾸기로 가장 높은 안 */
const AP_FIELD=[['의료·보건',/의사|간호|약사|약학|치료|보건|의료|한의|수의|병원|재활|임상|방사선|치위생|응급|의학/],['교육',/교사|선생|교육|유치원|보육|강사|교수/],
  ['공학·IT',/개발|프로그래|소프트웨어|컴퓨터|IT|엔지니어|공학|인공지능|AI|데이터|게임|로봇|기계|전자|전기|건축|토목|화이트해커|보안/],['자연과학',/연구원|과학|화학|생물|생명|물리|천문|환경|지구/],
  ['경영·경제',/경영|경제|회계|금융|마케팅|사업|CEO|창업|무역|은행|세무|증권|투자|유통/],['법·행정',/변호사|판사|검사|법|공무원|경찰|소방|군인|장교|외교|행정|정치|교도/],
  ['미디어·예술',/디자인|디자이너|작가|PD|기자|아나운서|방송|영상|예술|음악|배우|가수|미술|웹툰|사진|연출|작곡|댄서|패션|애니/],['상담·복지',/상담|사회복지|심리|복지|청소년지도/],
  ['체육',/체육|운동|선수|스포츠|트레이너|코치|태권/],['서비스',/요리|셰프|조리|제과|제빵|바리스타|승무원|호텔|관광|뷰티|미용|메이크업|항공/]];
function apField(goal){const g=Array.isArray(goal)?goal.join(' '):String(goal||'');if(!g.trim())return '';for(const[f,re]of AP_FIELD)if(re.test(g))return f;return '기타';}
async function autoOpen(){
  if(BUSY)return;BUSY=true;msg('설문 불러오는 중…');
  try{
    const studs=STU.filter(s=>s.class_name===CLS);
    const sw=await cg.from('worksheets').select('id').eq('user_id',USER.id).ilike('custom_html','%group-survey.html%').order('id',{ascending:false}).limit(1);
    const sid=sw.data&&sw.data[0]&&sw.data[0].id;
    if(!sid){msg('모둠 구성 설문 학습지가 없어요');return;}
    const [sub,car]=await Promise.all([cg.from('worksheet_submissions').select('student_id,answers').eq('worksheet_id',sid).in('student_id',studs.map(s=>s.id)),cg.from('students').select('id,changye').in('id',studs.map(s=>s.id))]);
    const A={},C={};(sub.data||[]).forEach(r=>{A[r.student_id]=(r.answers&&r.answers.fields)||{};});
    (car.data||[]).forEach(r=>{let g='';try{g=(JSON.parse(r.changye||'{}')._career||{}).goal||'';}catch(e){}C[r.id]={goal:Array.isArray(g)?g.join(', '):String(g||''),field:apField(g)};});
    const ids=new Set(studs.map(s=>s.id));
    const P=studs.map(s=>{const f=A[s.id]||{},w=['f1','f2','f3'].map(k=>+String(f[k]||'').split('|')[0]).filter(x=>x&&ids.has(x)&&x!==s.id);
      return{id:s.id,name:s.name,number:s.number,wish:w,answered:!!A[s.id],interest:String(f.interest||'').split(',').filter(Boolean),role:f.rolePref||'',goal:(C[s.id]||{}).goal||'',field:(C[s.id]||{}).field||''};});
    AP={P,sid,CARE:careMap()};AP.G=apDefG();$('apN').value=AP.G;apRun();msg('');
  }catch(e){msg('불러오지 못했어요: '+(e.message||e));}finally{BUSY=false;}
}
const apC=i=>{const c=AP.CARE[i];return !!c&&c!=='Ace';};
const apX=i=>isX(AP.CARE[i]);
const apT=i=>AP.CARE[i]==='Ace'?'a':AP.CARE[i]?(apX(i)?'x':'m'):'n';
function apDefG(){const n=AP.P.filter(p=>!apX(p.id)).length;return Math.max(2,Math.min(NG,Math.ceil(n/4)));}
function apScore(groups){
  const P=AP.P,by={};P.forEach(p=>by[p.id]=p);let sc=0;
  groups.forEach(g=>{const set=new Set(g);
    g.forEach(i=>{const p=by[i];let fr=0;p.wish.forEach((w,k)=>{if(set.has(w)){fr++;sc+=[3,2,1.5][k];if(by[w].wish.includes(i))sc+=.5;}});if(p.wish.length&&!fr)sc-=50;if(fr>2)sc-=40*(fr-2);});
    const tg=g.filter(i=>apC(i)).length;if(tg>1)sc-=100*(tg-1);const ac=g.filter(i=>AP.CARE[i]==='Ace').length;if(ac>1)sc-=100*(ac-1);
    for(let a=0;a<g.length;a++)for(let b=a+1;b<g.length;b++){const x=by[g[a]],y=by[g[b]];
      if(x.field&&x.field!=='기타'&&x.field===y.field)sc+=1;
      sc+=.5*x.interest.filter(v=>y.interest.includes(v)).length;
      if(x.role&&x.role!=='상관없음'&&x.role===y.role)sc-=.3;}});
  return sc;
}
function apRun(){
  const P=AP.P,n=P.length,G=Math.max(2,Math.min(NG,+$('apN').value||AP.G));AP.G=G;
  let best=null,bs=-1e9;
  for(let rs=0;rs<12;rs++){
    const sh=a=>a.sort(()=>Math.random()-.5),groups=Array.from({length:G},()=>[]);
    const tg=g=>g.filter(x=>apC(x)).length,ac=g=>g.filter(x=>AP.CARE[x]==='Ace').length,nx=g=>g.filter(x=>!apX(x)).length;
    const pick=(id,better)=>{let gi=-1;groups.forEach((g,k)=>{if(gi<0||better(g,groups[gi]))gi=k;});groups[gi].push(id);};
    // ① 미참여: 한 조에 한 명씩 ② 통합반·출석↓: 구분 학생 없는 조에 한 명씩(보통 조원 4명 + 1) ③ Ace: 한 조에 한 명씩, 구분 학생 있는 조 먼저 ④ 나머지: 보통 조원 적은 조부터
    sh(P.filter(p=>apT(p.id)==='m').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>tg(g)<tg(h)));
    sh(P.filter(p=>apT(p.id)==='x').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>tg(g)<tg(h)));
    sh(P.filter(p=>apT(p.id)==='a').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>ac(g)<ac(h)||(ac(g)===ac(h)&&(tg(g)>tg(h)||(tg(g)===tg(h)&&nx(g)<nx(h))))));
    sh(P.filter(p=>apT(p.id)==='n').map(p=>p.id)).forEach(id=>pick(id,(g,h)=>nx(g)<nx(h)));
    let cur=apScore(groups);
    for(let it=0;it<n*400;it++){
      const a=Math.floor(Math.random()*G),b=Math.floor(Math.random()*G);if(a===b)continue;
      const ia=Math.floor(Math.random()*groups[a].length),ib=Math.floor(Math.random()*groups[b].length);
      const x=groups[a][ia],y=groups[b][ib];if(apT(x)!==apT(y))continue;groups[a][ia]=y;groups[b][ib]=x;
      const s2=apScore(groups);if(s2>=cur)cur=s2;else{groups[a][ia]=x;groups[b][ib]=y;}
    }
    if(cur>bs){bs=cur;best=groups.map(g=>g.slice());}
  }
  AP.groups=best;render();
}
async function apApply(){
  const has=MEM.some(m=>m.class_name===CLS);
  if(has&&!confirm(CLS+'의 지금 조·역할·모둠 기록을 지우고 이 안으로 새로 배정할까요?'))return;
  BUSY=true;$('apApply').disabled=true;msg('저장 중…');
  try{
    const by={};AP.P.forEach(p=>by[p.id]=p);
    let r=await cg.from('campaign_members').delete().eq('worksheet_id',WS).eq('class_name',CLS);if(r.error)throw r.error;
    r=await cg.from('campaign_groups').delete().eq('worksheet_id',WS).eq('class_name',CLS);if(r.error)throw r.error;
    const rows=[];AP.groups.forEach((g,gi)=>g.forEach(i=>{const p=by[i];rows.push({worksheet_id:WS,student_id:i,class_name:CLS,group_no:gi+1,name:p.name,number:p.number==null?null:+p.number||null,role:null,pref:null,by_teacher:true,special:apX(i),care:AP.CARE[i]||null,updated_at:new Date().toISOString()});}));
    if(rows.length){r=await cg.from('campaign_members').insert(rows);if(r.error)throw r.error;}
    AP=null;msg('배정됨');
  }catch(e){msg('저장 실패: '+(e.message||e));}
  BUSY=false;$('apApply').disabled=false;await load();render();
}
$('autoBtn').onclick=autoOpen;$('apAgain').onclick=()=>{if(AP)apRun();};$('apApply').onclick=apApply;
$('apCancel').onclick=()=>{AP=null;render();};
$('apN').onchange=()=>{$('apN').dataset.touched='1';if(AP)apRun();else render();};
init();
</script>
