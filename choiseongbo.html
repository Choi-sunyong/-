<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>최소성취수준보장지도 대상 학생 계산기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: #1c2430;
    background: #f6f7f9;
    margin: 0;
    padding: 24px;
  }
  input, textarea, button, select { font-family: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .title { font-family: Georgia, 'Noto Serif KR', serif; font-weight: 700; font-size: 22px; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #5b6472; margin-bottom: 20px; }
  .grid3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 960px) { .grid3 { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 20px; }
  .card-title { font-family: Georgia, 'Noto Serif KR', serif; font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  label.field-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  input[type=text], input[type=number] {
    border: 1px solid #cfd5dd; border-radius: 6px; padding: 8px 10px; font-size: 14px; width: 100%;
    margin-bottom: 14px;
  }
  .timetable-wrap { text-align: center; }
  .timetable { display: inline-grid; grid-template-columns: 54px repeat(5, 40px); gap: 2px; margin-top: 8px; margin-bottom: 6px; }
  .th-cell { text-align: center; font-size: 12px; color: #5b6472; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .period-cell { font-size: 12px; display: flex; align-items: center; justify-content: center; color: #5b6472; white-space: nowrap; }
  .slot-cell {
    width: 100%; height: 28px; display: flex; align-items: center; justify-content: center;
    border: 1px solid #d7dbe1; cursor: pointer; font-size: 12px; user-select: none; background: #fff;
  }
  .slot-select {
    width: 100%; height: 28px; border: 1px solid #d7dbe1; border-radius: 4px; font-size: 11px;
    text-align: center; text-align-last: center; background: #fff; cursor: pointer; color: #1c2430; padding: 0;
  }
  .slot-select.assigned { background: #1e3a5f; color: #fff; border-color: #1e3a5f; font-weight: 700; }
  .slot-select:disabled { background: #f3f4f6; cursor: not-allowed; color: #c3c9d1; }
  .slot-cell.on { background: #1e3a5f; color: #fff; border-color: #1e3a5f; font-weight: 700; }
  .selected-note { font-size: 12px; color: #5b6472; margin-bottom: 14px; }
  .checkbox-row { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .checkbox-hint { font-size: 12px; color: #8a93a0; margin-bottom: 14px; }
  .btn {
    background: #1e3a5f; color: #fff; border: none; border-radius: 6px; padding: 10px 18px;
    font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: #163050; }
  .btn:disabled { background: #b7bec9; cursor: not-allowed; }
  .btn-row { margin-top: 20px; text-align: center; }
  .nav-btn {
    background: #eef1f5; color: #1c2430; border: 1px solid #d7dbe1; border-radius: 6px;
    width: 30px; height: 30px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .nav-btn:disabled { color: #cfd5dd; cursor: not-allowed; }
  .error-box { background: #fbe4e4; color: #b3261e; border-radius: 6px; padding: 10px; font-size: 12px; margin-bottom: 10px; }
  .empty-note { font-size: 13px; color: #8a93a0; }

  /* 그룹 요약 리스트 (출결 시트 / 수강생 명단 공통) */
  .group-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #eef1f5; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
  }
  .group-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .group-name { font-weight: 700; color: #1c2430; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #d7dbe1;
    border-radius: 20px; padding: 2px 8px; font-size: 12px; color: #33404f;
  }
  .tag button { border: none; background: transparent; color: #b3261e; cursor: pointer; font-size: 12px; padding: 0; line-height: 1; }
  .group-count { font-size: 12px; color: #8a93a0; }
  .group-del { border: none; background: transparent; color: #b3261e; cursor: pointer; font-size: 12px; }

  table.ac-table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
  table.ac-table th, table.ac-table td { border: 1px solid #e2e5ea; padding: 8px 10px; text-align: left; vertical-align: top; }
  table.ac-table th { background: #eef1f5; font-weight: 700; white-space: nowrap; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .badge.ok { background: #e5f3ea; color: #1f7a3f; }
  .badge.warn { background: #fff3d6; color: #9a6b00; }
  .badge.fail { background: #fbe4e4; color: #b3261e; }
  .detail-list { margin: 0; padding-left: 16px; font-size: 12px; color: #555; }
  .result-note { font-size: 12px; color: #8a93a0; margin-bottom: 14px; }

  .dropzone {
    border: 2px dashed #cfd5dd; border-radius: 10px; padding: 20px; text-align: center;
    cursor: pointer; transition: all .15s ease; background: #fafbfc; margin-bottom: 10px;
  }
  .dropzone:hover { border-color: #9aa6b5; background: #f2f4f7; }
  .dropzone.drag-over { border-color: #1e3a5f; background: #eaf0f7; }
  .dropzone .dz-icon { font-size: 24px; margin-bottom: 6px; }
  .dropzone .dz-main { font-size: 13px; font-weight: 600; color: #33404f; }
  .dropzone .dz-sub { font-size: 11px; color: #8a93a0; margin-top: 2px; }

  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .cal-nav .cal-month-label { font-size: 15px; font-weight: 700; min-width: 60px; text-align: center; }
  .cal-single { max-width: 420px; margin: 0 auto; }
  .cal-week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: 12px; color: #9aa3b0; text-align: center; margin-bottom: 4px; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 13px; border-radius: 6px; user-select: none; padding: 2px;
  }
  .cal-cell.on { background: #1e3a5f; color: #fff; cursor: pointer; font-weight: 700; }
  .cal-cell.off { background: #fbe4e4; color: #b3261e; cursor: pointer; }
  .cal-cell.disabled { color: #d3d7dd; }
  .cal-legend { font-size: 11px; color: #8a93a0; margin-top: 14px; display: flex; gap: 14px; align-items: center; justify-content: center; }
  .cal-legend span.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
  @media (max-width: 700px) { .summary-grid { grid-template-columns: 1fr; } }
  .summary-box { border-radius: 8px; padding: 14px 16px; }
  .summary-box.fail-box { background: #fef3f3; border: 1px solid #f4c8c8; }
  .summary-box.warn-box { background: #fffaf0; border: 1px solid #f3dfa8; }
  .summary-box-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .summary-box ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
  .summary-empty { font-size: 13px; color: #8a93a0; }

  /* 날짜별 출석률 랭킹 */
  .rank-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .rank-tab-btn {
    border: 1px solid #d7dbe1; background: #fff; border-radius: 20px; padding: 6px 14px;
    font-size: 13px; cursor: pointer; color: #33404f;
  }
  .rank-tab-btn.active { background: #1e3a5f; color: #fff; border-color: #1e3a5f; font-weight: 700; }
  .student-picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; padding: 10px; background: #fafbfc; border-radius: 8px; }
  .student-chip { border: 1px solid #d7dbe1; border-radius: 16px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: #fff; user-select: none; }
  .student-chip.on { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #e2e5ea; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .rank-num { font-weight: 700; color: #8a93a0; font-size: 12px; width: 24px; flex-shrink: 0; }
  .rank-date { font-size: 13px; font-weight: 600; width: 90px; flex-shrink: 0; }
  .gauge-track { flex: 1; height: 14px; background: #eef1f5; border-radius: 8px; overflow: hidden; }
  .gauge-fill { height: 100%; background: linear-gradient(90deg, #1e3a5f, #3b6ea5); border-radius: 8px; }
  .rank-pct { font-size: 12px; font-weight: 700; width: 70px; text-align: right; flex-shrink: 0; }

  /* ===== 2026-11 개편: 생기부 탭처럼 한 화면 (왼쪽 입력 · 오른쪽 결과) ===== */
  html, body { height:100%; }
  body { margin:0; padding:0; background:#f0f2f5; color:#1d1d1f; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  .wrap { max-width:none; margin:0; height:100vh; display:flex; flex-direction:column; text-align:center; }
  .top { flex:none; height:64px; display:flex; align-items:center; gap:14px; padding:0 20px; background:#fff; border-bottom:1px solid #E3E8EF; }
  .top-t { font-size:20px; font-weight:800; letter-spacing:-.3px; white-space:nowrap; }
  .kind { display:inline-flex; background:#eef1f5; border-radius:12px; padding:3px; gap:3px; }
  .kind-btn { border:0; background:transparent; border-radius:9px; padding:8px 18px; font-size:15px; font-weight:600; color:#6e6e73; cursor:pointer; font-family:inherit; }
  .kind-btn.on { background:#fff; color:#1d1d1f; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .subj { width:240px; height:40px; border:1px solid #DCE2EA !important; border-radius:10px !important; padding:0 12px !important; font-size:15px !important; text-align:center; margin:0 !important; font-family:inherit; }
  .subj:focus { outline:0; border-color:#378ADD !important; box-shadow:0 0 0 3px rgba(55,138,221,.12); }
  .sp { flex:1; }
  .top .subj { width:260px !important; flex:none; }
  .kind-btn, .go, .top-t { white-space:nowrap; flex:none; }
  .kind { flex:none; }
  .go { height:42px; border:0; border-radius:12px; background:#0071e3; color:#fff; font-size:16px; font-weight:700; padding:0 26px; cursor:pointer; font-family:inherit; }
  .go:hover { background:#0077ed; }
  .body { flex:1; min-height:0; display:grid; grid-template-columns:400px minmax(0,1fr); gap:16px; padding:16px; }
  .left { min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .pane { background:#fff; border:1px solid #E3E8EF; border-radius:14px; padding:16px; }
  .pane-h { font-size:14px; font-weight:800; color:#6e6e73; margin-bottom:10px; }
  .tt-cap { font-size:13px; font-weight:600; color:#378ADD; margin:-4px 0 10px; line-height:1.45; word-break:keep-all; }
  .timetable-wrap { text-align:center; }
  .timetable { display:inline-grid; grid-template-columns:40px repeat(5,56px); gap:4px; align-items:center; margin:0; }
  .th-cell { font-size:13px; font-weight:600; color:#6e6e73; height:20px; display:flex; align-items:center; justify-content:center; }
  .period-cell { font-size:12px; color:#8a94a8; height:32px; display:flex; align-items:center; justify-content:center; }
  .slot-select { height:32px; margin:0 !important; border-radius:8px; border:1px solid #DCE2EA; font-size:13px; background:#fff; color:#1d1d1f; padding:0 !important; }
  .slot-select:focus { outline:0; border-color:#378ADD; box-shadow:0 0 0 3px rgba(55,138,221,.12); }
  .slot-select.assigned { background:#1d1d1f; border-color:#1d1d1f; color:#fff; font-weight:700; }
  .frow { border:1.5px dashed #DCE2EA; border-radius:12px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:8px; align-items:center; transition:border-color .15s, background .15s; }
  .frow + .frow { margin-top:10px; }
  .frow:hover { border-color:#9fb4cc; }
  .frow.drag-over { border-color:#0071e3; background:#EEF4FD; }
  .frow-h { display:flex; align-items:center; gap:8px; justify-content:center; }
  .frow-h b { font-size:15px; }
  .frow-h .up { font-size:13px; color:#0066cc; }
  body[data-kind="common"] [data-only="elective"] { display:none; }
  .need { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
  .need:empty { display:none; }
  .need span { font-size:12.5px; font-weight:700; border-radius:980px; padding:3px 10px; background:#f0f2f5; color:#8a94a8; }
  .need span.ok { background:#e3f3e8; color:#1f7a3f; }
  .lst { width:100%; }
  .lst .empty-note { display:none; }
  .group-row { justify-content:center; background:#f5f7fa; border-radius:10px; padding:7px 10px; margin-bottom:6px; }
  .group-left { justify-content:center; font-size:13px; }
  .tag { border:0; background:#fff; }
  .opts { text-align:center; }
  .opts summary { cursor:pointer; font-size:14px; font-weight:800; color:#6e6e73; list-style:none; }
  .opts summary::-webkit-details-marker { display:none; }
  .opts[open] summary { margin-bottom:14px; }
  .opts .checkbox-row { justify-content:center; margin-bottom:12px; font-size:13px; }
  .opts textarea { width:100%; border:1px solid #DCE2EA; border-radius:10px; padding:8px 10px; font-size:13px; text-align:center; margin-bottom:14px; font-family:inherit; }
  .opts .field-label { text-align:center; color:#6e6e73; font-size:12.5px; }
  .grades { display:flex; gap:12px; justify-content:center; margin:6px 0 10px; font-size:13px; }
  .sems { display:inline-flex; background:#eef1f5; border-radius:10px; padding:3px; gap:3px; margin:4px 0 8px; }
  .sem-btn { border:0; background:transparent; border-radius:8px; padding:6px 16px; font-size:13px; color:#6e6e73; cursor:pointer; font-family:inherit; }
  .sem-btn.on { background:#fff; color:#1d1d1f; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .mini { display:block; font-size:12px; color:#8a94a8; margin-top:10px; }
  .mini.danger { color:#b3261e; }
  .mini-frow { margin:4px 0 12px; }
  .right { min-height:0; display:flex; flex-direction:column; gap:12px; }
  .stats { flex:none; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .stat { background:#fff; border:1px solid #E3E8EF; border-radius:14px; padding:14px 16px; min-height:92px; }
  .stat-h { font-size:13px; font-weight:700; color:#6e6e73; }
  .stat-n { font-size:32px; font-weight:800; letter-spacing:-.5px; margin:2px 0 4px; }
  .stat.fail .stat-n { color:#d70015; } .stat.warn .stat-n { color:#b25000; } .stat.days .stat-n { color:#0071e3; }
  .stat-l { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; font-size:13px; }
  .stat-l span { background:#f5f7fa; border-radius:980px; padding:2px 9px; }
  .stat-l span.part { color:#8a94a8; }
  .acts { flex:none; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .acts:empty { display:none; }
  .acts button { height:40px; border:0; border-radius:12px; padding:0 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; background:#0071e3 !important; color:#fff; }
  .acts button + button { background:#eef1f5 !important; color:#1d1d1f; }
  .warns:empty { display:none; }
  .warns .error-box { margin:0 0 6px; font-size:13px; }
  .tbl { flex:1; min-height:0; overflow:auto; background:#fff; border:1px solid #E3E8EF; border-radius:14px; }
  .tbl table { width:100%; border-collapse:collapse; font-size:14px; }
  .tbl th { position:sticky; top:0; background:#f5f7fa; color:#6e6e73; font-weight:700; padding:10px 8px; border-bottom:1px solid #E3E8EF; text-align:center; z-index:1; }
  .tbl td { padding:9px 8px; border-bottom:1px solid #f0f2f5; text-align:center; }
  .tbl tr.fail td { background:#fff5f5; } .tbl tr.warn td { background:#fffaf0; }
  .tbl td.miss { color:#8a94a8; font-size:12.5px; max-width:380px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { display:inline-block; width:80px; height:6px; border-radius:3px; background:#eef1f5; vertical-align:middle; margin-right:8px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#378ADD; }
  tr.fail .bar i { background:#d70015; } tr.warn .bar i { background:#e08a00; }
  .empty-big { height:100%; display:flex; align-items:center; justify-content:center; color:#a0a8b5; font-size:16px; }
  #resultArea, #rankingArea, #neisResultArea { display:none !important; }
  .error-box { border-radius:10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-t">최성보 계산기</div>
    <div class="kind"><button type="button" class="kind-btn" data-kind="common">공통과목</button><button type="button" class="kind-btn" data-kind="elective">선택과목</button></div>
    <input type="text" id="subjectName" class="subj" placeholder="과목명" autocomplete="off">
    <div class="sp"></div>
    <button class="go" id="computeBtn">계산하기</button>
  </header>

  <div class="body">
    <aside class="left">
      <div class="pane">
        <div class="pane-h">시간표</div>
        <div class="tt-cap" id="ttCap">반</div>
        <div class="timetable-wrap"><div id="timetable" class="timetable"></div><div class="selected-note" id="selectedNote" hidden></div></div>
      </div>
      <div class="pane">
        <div class="pane-h">파일</div>
        <div id="errorBox"></div>
        <div class="frow" id="sheetDropzone"><div class="frow-h"><b>학급출결현황</b><span class="up">올리기</span></div><div class="need" id="needSheet"></div><div class="lst" id="fileList"><div class="empty-note"></div></div></div>
        <div class="frow" id="rosterDropzone" data-only="elective"><div class="frow-h"><b>수강생 명단</b><span class="up">올리기</span></div><div class="need" id="needRoster"></div><div class="lst" id="rosterList"><div class="empty-note"></div></div></div>
        <div class="frow" id="preventionDropzone"><div class="frow-h"><b>예방지도 출석부 양식</b><span class="up">올리기</span></div><div class="lst" id="preventionList"><div class="empty-note"></div></div></div>
        <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" multiple hidden>
        <input type="file" id="rosterFile" accept=".csv,.xlsx,.xls" multiple hidden>
        <input type="file" id="preventionFile" accept=".xls,.xlsx" multiple hidden>
        <div id="preventionCheckArea"></div>
      </div>
      <details class="pane opts">
        <summary>설정</summary>
        <label class="checkbox-row"><input type="checkbox" id="includeRecognized"> 출석인정 결석·조퇴·지각·결과 포함</label>
        <label class="field-label">제외할 학생</label>
        <textarea id="excludeStudentsInput" rows="2" placeholder="이름, 이름"></textarea>
        <label class="field-label">수업일</label>
        <div class="sems"><button type="button" class="sem-btn" data-sem="1">1학기</button><button type="button" class="sem-btn" data-sem="2">2학기</button></div>
        <div class="grades">
          <label><input type="checkbox" id="grade1Check"> 1학년</label>
          <label><input type="checkbox" id="grade2Check" checked> 2학년</label>
          <label><input type="checkbox" id="grade3Check"> 3학년</label>
        </div>
        <div class="cal-nav">
          <button class="nav-btn" id="prevMonth">◀</button>
          <div class="cal-month-label" id="monthLabel">3월</div>
          <button class="nav-btn" id="nextMonth">▶</button>
        </div>
        <div class="cal-single"><div class="cal-week-row" id="calWeekRow"></div><div class="cal-days" id="calDays"></div></div>
        <div class="cal-legend">
          <span><span class="dot" style="background:#1e3a5f;"></span>수업</span>

<script>
const DAYS = ["월", "화", "수", "목", "금"];
const PERIODS = [1,2,3,4,5,6,7];
let sheets = [];       // 출결 시트들
let rosterFiles = [];  // 수강생 명단 파일들 {fileName, label, names}
let preventionFiles = []; // 여러 개의 예방지도 출석부 양식 {fileName, rawData, isXlsx, workbook}
const DOW_KR = ["일","월","화","수","목","금","토"];
const classDates = {}; // 날짜별 수업 여부 (true=수업, false=수업없음)
// 학기: 오늘 날짜로 자동(3~7월 1학기, 그 외 2학기). 2학기는 8월~다음 해 1월 → 1월은 13으로 셈
let CSB_SEM = (() => { const m = new Date().getMonth() + 1; return (m >= 3 && m <= 7) ? 1 : 2; })();
let MIN_MONTH = CSB_SEM === 1 ? 3 : 8, MAX_MONTH = CSB_SEM === 1 ? 7 : 13;
let currentMonth = Math.min(MAX_MONTH, Math.max(MIN_MONTH, (() => { const m = new Date().getMonth() + 1; return m <= 2 ? m + 12 : m; })()));

// ---------- 로컬 저장(새로고침해도 시간표·명단·과목명 유지) ----------
const STORAGE_KEY = "attendanceChecker_savedSettings_v1";
function saveSettings() {
  try {
    const data = {
      subjectName: document.getElementById("subjectName") ? document.getElementById("subjectName").value : "",
      slotAssignment: slotAssignment,
      roster: rosterFiles.map(f => ({ fileName: f.fileName, label: f.label, names: f.names, ids: f.ids || {} })),
      includeRecognized: document.getElementById("includeRecognized") ? document.getElementById("includeRecognized").checked : false,
      excludeStudentsText: document.getElementById("excludeStudentsInput") ? document.getElementById("excludeStudentsInput").value : "",
      grade1: document.getElementById("grade1Check") ? document.getElementById("grade1Check").checked : false,
      grade2: document.getElementById("grade2Check") ? document.getElementById("grade2Check").checked : true,
      grade3: document.getElementById("grade3Check") ? document.getElementById("grade3Check").checked : false
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { /* localStorage 사용 불가 환경이면 조용히 무시 */ }
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function clearSettings() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// ---------- 시간표 (칸마다 반 이름 직접 입력 - 수강반 또는 홈룸반) ----------
const slotAssignment = {}; // "day-period" -> 입력한 반 이름 (예: "A반" 또는 "2학년 3반")

function activeSlotsForClass(label) {
  // 1) 시간표에 입력된 값과 정확히 일치
  let keys = Object.keys(slotAssignment).filter(k => slotAssignment[k] === label);
  if (keys.length === 0) {
    // 2) label이 정식 명칭(예: "A반")이고 시간표엔 짧게("A") 입력된 경우 - 각 입력값을 정규화해서 비교
    keys = Object.keys(slotAssignment).filter(k => {
      const raw = slotAssignment[k];
      if (!raw) return false;
      const resolved = resolveLabelStudents(raw);
      return resolved && resolved.canonicalLabel === label;
    });
  }
  return keys.map(k => {
    const [day, period] = k.split("-");
    return { day, period: Number(period) };
  });
}

function buildTimetable() {
  const el = document.getElementById("timetable");
  el.innerHTML = "";
  const corner = document.createElement("div");
  corner.className = "th-cell";
  el.appendChild(corner);
  DAYS.forEach(day => {
    const d = document.createElement("div");
    d.className = "th-cell"; d.textContent = day;
    el.appendChild(d);
  });
  PERIODS.forEach(p => {
    const pcell = document.createElement("div");
    pcell.className = "period-cell"; pcell.textContent = p + "교시";
    el.appendChild(pcell);
    DAYS.forEach(day => {
      const key = day + "-" + p;
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "slot-select";
      inp.placeholder = "-";
      inp.dataset.key = key;
      inp.dataset.day = day;
      inp.dataset.period = String(p);
      inp.addEventListener("input", () => {
        const v = inp.value.trim();
        slotAssignment[key] = v || undefined;
        inp.classList.toggle("assigned", !!v);
        updateSelectedNote();
        saveSettings();
      });
      inp.addEventListener("keydown", (e) => {
        const dayIdx = DAYS.indexOf(inp.dataset.day);
        const periodIdx = PERIODS.indexOf(Number(inp.dataset.period));
        let nd = dayIdx, np = periodIdx;
        if (e.key === "ArrowRight") np += 0, nd += 1;
        else if (e.key === "ArrowLeft") nd -= 1;
        else if (e.key === "ArrowDown") np += 1;
        else if (e.key === "ArrowUp") np -= 1;
        else return;
        if (nd < 0 || nd >= DAYS.length || np < 0 || np >= PERIODS.length) return;
        e.preventDefault();
        const targetKey = DAYS[nd] + "-" + PERIODS[np];
        const target = document.querySelector(`#timetable input[data-key="${targetKey}"]`);
        if (target) { target.focus(); target.select(); }
      });
      el.appendChild(inp);
    });
  });
  updateSelectedNote();
}
buildTimetable();

// 저장된 설정 복원 (시간표만 우선 - 명단/과목명은 각 요소 준비 후 별도로 복원)
(function restoreTimetable() {
  const saved = loadSettings();
  if (!saved || !saved.slotAssignment) return;
  Object.keys(saved.slotAssignment).forEach(key => {
    const v = saved.slotAssignment[key];
    if (!v) return;
    slotAssignment[key] = v;
    const inp = document.querySelector(`#timetable input[data-key="${key}"]`);
    if (inp) { inp.value = v; inp.classList.add("assigned"); }
  });
  updateSelectedNote();
})();

// 과목명 / 수강생 명단 / 출석인정 체크박스 복원
(function restoreRest() {
  const saved = loadSettings();

  if (saved.subjectName && document.getElementById("subjectName")) {
    document.getElementById("subjectName").value = saved.subjectName;

  if (typeof saved.includeRecognized === "boolean" && document.getElementById("includeRecognized")) {

  }
  if (typeof saved.excludeStudentsText === "string" && document.getElementById("excludeStudentsInput")) {
    document.getElementById("excludeStudentsInput").value = saved.excludeStudentsText;
  }
  if (Array.isArray(saved.roster) && saved.roster.length > 0) {
    rosterFiles = saved.roster.map(r => ({ fileName: r.fileName, label: r.label, names: r.names, ids: r.ids || {} }));
    renderRosterList();
  }
})();
document.getElementById("subjectName").addEventListener("input", saveSettings);
["grade1Check","grade2Check","grade3Check"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => {

document.getElementById("excludeStudentsInput").addEventListener("input", saveSettings);

// 수동으로 입력한 제외 학생 목록
function getManualExcludedStudents() {
  const el = document.getElementById("excludeStudentsInput");
  if (!el) return new Set();
  return new Set(el.value.split(/[\n,]/).map(s => s.trim()).filter(Boolean));
}
// 출결 사유에 자퇴/전출/전학 등이 있으면 자동으로 제외 대상으로 판단
function isWithdrawnStudent(events) {
  return events.some(ev => /자퇴|전출|전학|퇴학/.test((ev.typeText || "") + (ev.reasonText || "")));
}

  e.preventDefault();

function updateSelectedNote() {
  const assigned = Object.keys(slotAssignment).filter(k => slotAssignment[k]);
  document.getElementById("selectedNote").textContent =
    "선택됨: " + (assigned.length === 0 ? "없음" : assigned.map(k => {

// ---------- 반 이름 매칭: 수강반 명단 우선, 없으면 출결시트의 홈룸 반으로 매칭 ----------
function normalizeHomeroomInput(text) {
  const t = (text || "").trim();
  if (!t) return null;
  // "2학년 3반", "2학년3반", "2-3", "2 3", "2/3", "2.3" 등 숫자 사이에 구분자가 있는 경우
  let m = /^(\d{1,2})\D+(\d{1,2})\D*$/.exec(t);
  if (m) return `${Number(m[1])}학년 ${Number(m[2])}반`;
  // 붙여쓴 숫자: "203" -> 2학년 03반, "1109" -> 1학년 109반 등 (첫 글자=학년, 나머지=반)
  m = /^([1-3])(\d{1,3})$/.exec(t);
  if (m) return `${Number(m[1])}학년 ${Number(m[2])}반`;
  return null;
}

// label(수강반 이름 또는 홈룸반 표현)에 해당하는 학생 이름 목록과 출처를 반환
function resolveLabelStudents(label) {
  const trimmed = (label || "").trim();
  if (!trimmed) return null;

  // 1) 수강반 명단과 정확히 일치
  let rosterMatch = rosterFiles.find(f => f.label === trimmed);
  // 2) 대소문자 무시 일치 (a반 -> A반)
  if (!rosterMatch) rosterMatch = rosterFiles.find(f => f.label.toLowerCase() === trimmed.toLowerCase());
  // 3) "반" 생략 표기 (A -> A반)
  if (!rosterMatch && !/반$/.test(trimmed)) {
    const withBan = (trimmed + "반").toLowerCase();
    rosterMatch = rosterFiles.find(f => f.label.toLowerCase() === withBan);
  }
  if (rosterMatch) {
    return { source: "roster", names: rosterMatch.names, ids: rosterMatch.ids || {}, canonicalLabel: rosterMatch.label };
  }

  // 4) 홈룸반(출결시트 기준) 매칭
  const homeroomKey = normalizeHomeroomInput(trimmed);
  const allClassLabels = new Set(sheets.map(s => s.classLabel).filter(Boolean));
  const target = allClassLabels.has(trimmed) ? trimmed : (homeroomKey && allClassLabels.has(homeroomKey) ? homeroomKey : null);
  if (target) {
    const names = new Set();
    sheets.forEach(s => { if (s.classLabel === target) s.students.forEach(st => names.add(st.name)); });
    return { source: "homeroom", names: [...names], ids: {}, canonicalLabel: target };
  }
  return null;
}

const GRADE_EXAM_DATES = {

  "2026-05-07": [3],       // 전국연합(3)

// label(수강반/홈룸반)에 실제로 어느 학년 학생이 있는지 추정
function getLabelGrades(label) {
  const resolved = resolveLabelStudents(label);
  if (!resolved) return [];
  const grades = new Set();
  resolved.names.forEach(name => {
    const id = resolved.ids && resolved.ids[name];
    if (id && /^[1-3]/.test(id)) { grades.add(Number(id[0])); return; }
    for (const sheet of sheets) {
      const st = sheet.students.find(s => s.name === name);
      if (st && st.classLabel) {
        const m = /(\d+)학년/.exec(st.classLabel);
        if (m) { grades.add(Number(m[1])); return; }
      }
    }
  });
  if (grades.size === 0) {
    const m = /(\d+)학년/.exec(label) || /(\d+)학년/.exec(resolved.canonicalLabel || "");
    if (m) grades.add(Number(m[1]));
  }
  return [...grades];
}
// 이 날짜가 이 반(학년 기준)에 실제로 수업이 없는 날인지 판단 (기본 제외일 + 해당 학년 모의고사일)
function isDateOffForLabel(iso, labelGrades) {
  if (DEFAULT_OFF.has(iso)) return true;
  if (iso in classDates && classDates[iso] === false) return true; // 사용자가 캘린더에서 직접 끈 날
  const examGrades = GRADE_EXAM_DATES[iso];
  if (examGrades && labelGrades.some(g => examGrades.includes(g))) return true;
  return false;
}

let ACADEMIC_CAL = ACADEMIC_CAL_PREBUILT; // 향남고 2026 학사력 기본 적용
function getSelectedGrades() {
  const grades = [];
  if (document.getElementById("grade1Check") && document.getElementById("grade1Check").checked) grades.push(1);
  if (document.getElementById("grade2Check") && document.getElementById("grade2Check").checked) grades.push(2);
  if (document.getElementById("grade3Check") && document.getElementById("grade3Check").checked) grades.push(3);
  return grades.length ? grades : [1, 2, 3]; // 아무것도 안 체크하면 전체
}

// 이벤트 텍스트에서 대상 학년 추출: "(1,2,3)", "(2)", "(3)" 등
function getEventGrades(text) {
  if (!text) return [1, 2, 3]; // 학년 표기 없으면 전체 해당
  const m = text.match(/\(([1-3,\s]+)\)/);
  if (!m) return [1, 2, 3];
  const grades = m[1].split(/[,\s]+/).map(Number).filter(n => n >= 1 && n <= 3);
  return grades.length ? grades : [1, 2, 3];
}

function buildClassDatesFromAcademic(calData) {
  const selectedGrades = getSelectedGrades();
  const d = new Date(SEM_START);
  while (d <= SEM_END) {
    const dow = d.getDay();
    if (dow >= 1 && dow <= 5) {
      const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      const entry = calData[iso];
      if (entry) {
        if (entry.text) DATE_REASONS[iso] = entry.text;
        const gbg = entry.gbg || [true, true, true];
        const anyOff = selectedGrades.some(g => gbg[g-1] === false);
        classDates[iso] = !anyOff;
      } else {
        classDates[iso] = true;
      }
    }
    d.setDate(d.getDate() + 1);
  }
}

function initClassDates() {
  // 학사력이 업로드된 경우에만 달력 초기화 (업로드 전엔 빈 달력)
  if (Object.keys(ACADEMIC_CAL).length > 0) {
    buildClassDatesFromAcademic(ACADEMIC_CAL);
  }
}

function renderCalendarMonth() {
  const calY = currentMonth > 12 ? 2027 : 2026, calM = currentMonth > 12 ? currentMonth - 12 : currentMonth;
  document.getElementById("monthLabel").textContent = calM + "월";
  document.getElementById("prevMonth").disabled = currentMonth <= MIN_MONTH;
  document.getElementById("nextMonth").disabled = currentMonth >= MAX_MONTH;

  const weekRow = document.getElementById("calWeekRow");
  weekRow.innerHTML = "";
  DOW_KR.forEach(w => { const s = document.createElement("div"); s.textContent = w; weekRow.appendChild(s); });

  const daysGrid = document.getElementById("calDays");
  daysGrid.innerHTML = "";

  const firstDay = new Date(calY, calM - 1, 1);
  const lastDate = new Date(calY, calM, 0).getDate();
  const leadBlank = firstDay.getDay();
  for (let i = 0; i < leadBlank; i++) daysGrid.appendChild(document.createElement("div"));

  for (let day = 1; day <= lastDate; day++) {
    const iso = isoOf(calY, calM, day);
    const cell = document.createElement("div");

    const numSpan = document.createElement("div");
    numSpan.textContent = day;
    cell.appendChild(numSpan);

    if (iso in classDates) {
      const active = classDates[iso];
      cell.className = "cal-cell " + (active ? "on" : "off");
      const reason = !active ? getDateReason(iso) : null;
      if (reason) {
        const rsSpan = document.createElement("div");
        rsSpan.style.fontSize = "8px";
        rsSpan.style.lineHeight = "1.2";
        rsSpan.style.wordBreak = "keep-all";
        rsSpan.style.marginTop = "2px";
        rsSpan.style.opacity = "0.85";
        rsSpan.textContent = reason;
        cell.appendChild(rsSpan);
      }
      cell.addEventListener("click", () => {
        classDates[iso] = !classDates[iso];
        renderCalendarMonth();
      });
    } else {
      cell.className = "cal-cell disabled";
    }
    daysGrid.appendChild(cell);
  }
}

function setupDropzone(zoneEl, inputEl, onFiles) {
  (window.__dz = window.__dz || {})[zoneEl.id] = onFiles;
  zoneEl.addEventListener("click", (e) => { if (e.target.closest && e.target.closest(".lst")) return; inputEl.click(); });
  ["dragenter","dragover"].forEach(evt => zoneEl.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation(); zoneEl.classList.add("drag-over");
  }));
  ["dragleave","drop"].forEach(evt => zoneEl.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation(); zoneEl.classList.remove("drag-over");
  }));
  zoneEl.addEventListener("drop", (e) => { onFiles(e.dataTransfer.files); });
  inputEl.addEventListener("change", (e) => { onFiles(e.target.files); e.target.value = ""; });
}

function parseSheet(rows, fileName) {
  // 파일명에 월 정보가 있으면 우선 사용 (시트 제목행은 복사·붙여넣기로 월이 잘못 남아있는 경우가 실제로 있음)
  let month = null;
  const mFile = /\((\d{1,2})\s*월\)/.exec(fileName) || /(\d{1,2})\s*월/.exec(fileName);
  if (mFile) month = Number(mFile[1]);
  if (!month) {
    for (const r of rows.slice(0, 6)) {
      for (const cell of r) {
        const c = (cell || "").toString().trim();
        const m = /\((\d{1,2})\s*월\)/.exec(c) || /^(\d{1,2})\s*월$/.exec(c);
        if (m) { month = Number(m[1]); break; }
      }
      if (month) break;
    }
  }

  let classLabel = findClassLabelInRows(rows, 3);
  if (!classLabel) {
    const m2 = /(\d+)\s*-\s*(\d+)\s*$/.exec(fileName);
    if (m2) classLabel = `${m2[1]}학년 ${m2[2]}반`;
  }
  const classMatch = /(\d+)학년\s*(\d+)반/.exec(classLabel);
  const grade = classMatch ? classMatch[1] : null;
  const ban = classMatch ? classMatch[2] : null;

  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if ((rows[i][0] || "").trim() === "번호" && (rows[i][1] || "").trim() === "성명") { headerIdx = i; break; }
  }
  if (headerIdx === -1) throw new Error(`"${fileName}": 헤더행(번호/성명)을 찾을 수 없음`);
  const dowRow = rows[headerIdx];
  const dayNumRow = rows[headerIdx + 1];

  let stop = 2;
  while (stop < dayNumRow.length && /^\d+$/.test((dayNumRow[stop] || "").trim())) stop++;
  const dateStart = 2, dateEnd = stop;
  let reasonIdx = -1;
  for (let j = stop; j <= stop + 3 && j < dowRow.length; j++) {
    if ((dowRow[j] || "").trim() === "비고") { reasonIdx = j; break; }
  }
  if (reasonIdx === -1) reasonIdx = stop + 1; // 헤더에서 못 찾으면 기존 방식으로 대체
  const typeIdx = reasonIdx + 1;

  const dow = dowRow.slice(dateStart, dateEnd).map(s => (s || "").trim());
  const dayNum = dayNumRow.slice(dateStart, dateEnd).map(s => (s || "").trim());

  const students = [];
  let r = headerIdx + 2;
  while (r < rows.length && /^\d+$/.test((rows[r][0] || "").trim())) {
    const row = rows[r];
    const no = row[0].trim();
    const name = (row[1] || "").replace(/\s+/g, " ").trim();
    const marks = row.slice(dateStart, dateEnd);
    const reasonCol = row[reasonIdx] || "";
    const typeCol = row[typeIdx] || "";
    const reasons = reasonCol.split("\n").map(s => s.trim()).filter(Boolean);
    const types = typeCol.split("\n").map(s => s.trim()).filter(Boolean);

    const events = [];
    let ri = 0;
    let remaining = 0; // 현재 사유/유형 줄이 아직 몇 개의 마크에 더 적용되어야 하는지 (예: "6일"이면 6)
    let curType = "", curReason = "";
    for (let i = 0; i < marks.length; i++) {
      const mark = (marks[i] || "").trim();
      if (!mark) continue;
      const dateKey = `${month}/${dayNum[i]}`;
      if (remaining <= 0) {
        curType = types[ri] !== undefined ? types[ri] : "";
        curReason = reasons[ri] !== undefined ? reasons[ri] : "";
        ri++;
        // 유형 텍스트 끝의 "N일"/"N회"를 읽어 이 사유가 며칠치(마크 몇 개)에 해당하는지 파악
        // (하루짜리는 항상 정확히 1개 마크에 대응, 연속 대회 출전·현장체험학습 등은 여러 날 동안 같은 사유 하나로 표기됨)
        const countMatch = /(\d+)\s*(?:일|회)\s*$/.exec(curType);
        remaining = countMatch ? Number(countMatch[1]) : 1;
      }
      events.push({ date: dateKey, dow: dow[i], mark, typeText: curType, reasonText: curReason });
      remaining--;
    }
    let studentId = null;
    if (grade && ban) studentId = `${grade}${String(ban).padStart(2,"0")}${String(no).padStart(2,"0")}`;
    students.push({ name, events, no, classLabel, studentId });
    r++;
  }

  const DOW_NUM_TO_KR = ["일","월","화","수","목","금","토"];
  const calendarDates = dayNum.map((d, i) => {
    const dateStr = `${month}/${d}`;
    const isoStr = `${month <= 2 ? 2027 : 2026}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const entry = ACADEMIC_CAL[isoStr];
    // dow_override가 있으면 그 요일로 매칭 (예: 월요일이지만 금요일 수업 운영)
    const effectiveDow = (entry && entry.dow_override != null) ? DOW_NUM_TO_KR[entry.dow_override] : dow[i];
    return { date: dateStr, dow: effectiveDow, originalDow: dow[i] };
  }).filter(d => d.date && d.dow);
  return { fileName, month, classLabel, students, calendarDates };
}

function classifyEvent(ev) {
  const t = ev.typeText || "";
  const recognized = t.includes("인정") && !t.includes("미인정");
  let category = "unknown";
  if (t.includes("결석")) category = "absence_full";
  else if (t.includes("조퇴")) category = "early_leave";
  else if (t.includes("지각")) category = "late";
  else if (t.includes("결과")) category = "period_absence";
  const m = /\((\d+)(~)?\)/.exec(ev.reasonText || "");
  const num = m ? Number(m[1]) : null;
  return { category, recognized, periodNum: num };
}

function isPeriodMissed(ev, period, includeRecognized) {
  const c = classifyEvent(ev);
  if (c.recognized && !includeRecognized) return false;
  switch (c.category) {
    case "absence_full": return true;
    case "early_leave":
      if (c.periodNum == null) return true; // 정확한 교시를 모르면 빠졌다고 보수적으로 처리
      return period >= c.periodNum;
    case "late":
      if (c.periodNum == null) return true;
      return period < c.periodNum;
    case "period_absence":
      if (c.periodNum == null) return true;
      return period === c.periodNum;
    default: return true;
  }
}

function readRowsFromFile(file, cb) {
  const isExcel = /\.(xlsx|xls)$/i.test(file.name);
  if (isExcel) {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array" });
        let allRows = [];
        wb.SheetNames.forEach(sn => {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: false })
            .map(row => row.map(c => (c === null || c === undefined) ? "" : String(c)));
          allRows = allRows.concat(rows);
        });
        cb(null, allRows);
      } catch (err) { cb(err); }
    };
    reader.onerror = () => cb(new Error("파일을 읽을 수 없음"));
    reader.readAsArrayBuffer(file);
  } else {
    Papa.parse(file, {
      skipEmptyLines: false,
      encoding: "utf-8",
      complete: (res) => cb(null, res.data),
      error: (err) => cb(err)
    });
  }
}

// ---------- 수강생 명단 (여러 반 파일) ----------
function rowsToNames(rows) {
  const headerNames = ["이름", "성명", "학생명", "성 명"];
  let headerRow = -1, col = -1;
  for (let i = 0; i < rows.length; i++) {
    for (let j = 0; j < rows[i].length; j++) {
      const cell = (rows[i][j] || "").toString().trim();
      if (headerNames.includes(cell)) { headerRow = i; col = j; break; }
    }
    if (headerRow !== -1) break;
  }
  // 같은 헤더행에서 "학번"이 포함된 열도 찾음 (있으면 반/번호 추정 대신 이 값을 사용)
  let idCol = -1;
  if (headerRow !== -1) {
    for (let j = 0; j < rows[headerRow].length; j++) {
      const cell = (rows[headerRow][j] || "").toString().trim();
      if (cell.includes("학번")) { idCol = j; break; }
    }
  }

  const entries = [];
  if (headerRow !== -1) {
    for (let i = headerRow + 1; i < rows.length; i++) {
      const raw = (rows[i][col] || "").toString().replace(/\s+/g, " ").trim();
      if (!raw) continue;
      if (/^\d+$/.test(raw)) continue;
      const idRaw = idCol !== -1 ? (rows[i][idCol] || "").toString().trim() : "";
      entries.push({ name: raw, rosterId: idRaw || null });
    }
  } else {
    const seen = new Set();
    rows.forEach(row => row.forEach(cell => {
      const raw = (cell || "").toString().trim();
      if (/^[가-힣]{2,4}$/.test(raw) && raw !== "번호" && raw !== "성명") {
        if (!seen.has(raw)) { seen.add(raw); entries.push({ name: raw, rosterId: null }); }
      }
    }));
  }
  return entries;
}

function rosterLabelFor(rows, fileName) {
  let label = findClassLabelInRows(rows, rows.length);
  if (!label) label = fileName.replace(/\.(xlsx|xls|csv)$/i, "");
  return label;
}

function getRosterSet() {
  const set = new Set();
  rosterFiles.forEach(f => f.names.forEach(n => set.add(n)));
  return set;
}

function renderRosterList() {
  const el = document.getElementById("rosterList");
  el.innerHTML = "";
  if (rosterFiles.length === 0) {
    el.innerHTML = '<div class="empty-note">업로드된 명단이 없습니다 (전체 학생 계산)</div>';
    saveSettings();
    return;
  }
  rosterFiles.forEach(f => {
    const row = document.createElement("div");
    row.className = "group-row";
    const left = document.createElement("div");
    left.className = "group-left";
    const nameSpan = document.createElement("span");
    nameSpan.className = "group-name"; nameSpan.textContent = f.label;
    const countSpan = document.createElement("span");
    countSpan.className = "group-count"; countSpan.textContent = `${f.names.length}명`;
    left.appendChild(nameSpan); left.appendChild(countSpan);
    const del = document.createElement("button");
    del.className = "group-del"; del.textContent = "삭제";
    del.addEventListener("click", () => {
      rosterFiles = rosterFiles.filter(x => x !== f);
      renderRosterList();
    });
    row.appendChild(left); row.appendChild(del);
    el.appendChild(row);
  });
  saveSettings();
}

setupDropzone(document.getElementById("rosterDropzone"), document.getElementById("rosterFile"), (fileList) => {
  const files = Array.from(fileList);
  files.forEach(file => {
    readRowsFromFile(file, (err, rows) => {
      if (err) return;
      const entries = rowsToNames(rows);
      if (entries.length === 0) return;
      const names = entries.map(e => e.name);
      const ids = {};
      entries.forEach(e => { if (e.rosterId) ids[e.name] = e.rosterId; });
      const label = rosterLabelFor(rows, file.name);
      rosterFiles.push({ fileName: file.name, label, names, ids });
      renderRosterList();
    });
  });
});

// ---------- 출결 시트 업로드 (반별 · 월별로 그룹 표시) ----------
setupDropzone(document.getElementById("sheetDropzone"), document.getElementById("fileInput"), (fileList) => {
  const files = Array.from(fileList);
  const errorBox = document.getElementById("errorBox");
  errorBox.innerHTML = "";
  let pending = files.length;
  const done = () => { pending--; if (pending === 0) renderFileList(); };

  files.forEach(file => {
    const isExcel = /\.(xlsx|xls)$/i.test(file.name);
    if (isExcel) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, { type: "array" });
          let anyParsed = false;
          wb.SheetNames.forEach(sheetName => {
            try {
              const ws = wb.Sheets[sheetName];
              const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false })
                .map(row => row.map(c => (c === null || c === undefined) ? "" : String(c)));
              const sheet = parseSheet(rows, `${file.name} - ${sheetName}`);
              sheets.push(sheet);
              anyParsed = true;
            } catch (err) { /* 요약 탭 등은 조용히 건너뜀 */ }
          });
          if (!anyParsed) addError(errorBox, `${file.name}: 출결 형식으로 인식되는 탭이 없음`);
        } catch (err) {
          addError(errorBox, `${file.name}: ${err.message}`);
        }
        done();
      };
      reader.onerror = () => { addError(errorBox, `${file.name}: 파일을 읽을 수 없음`); done(); };
      reader.readAsArrayBuffer(file);
    } else {
      Papa.parse(file, {
        skipEmptyLines: false,
        encoding: "utf-8",
        complete: (res) => {
          try {
            const sheet = parseSheet(res.data, file.name);
            sheets.push(sheet);
          } catch (err) {
            addError(errorBox, `${file.name}: ${err.message}`);
          }
          done();
        },
        error: (err) => { addError(errorBox, `${file.name}: ${err.message}`); done(); }
      });
    }
  });
});

// ---------- 예방지도 출석부 양식 ----------
function findPreventionHeaderRow(rows) {
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if ((r[0] || "").toString().trim() === "학년" && (r[2] || "").toString().trim() === "번호") return i;
  }
  return -1;
}

function parsePreventionSheet(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });
  const headerIdx = findPreventionHeaderRow(rows);
  if (headerIdx === -1) return null;
  const headerRow = rows[headerIdx];

  // 회차 열: "차시" 다음(col4)부터 숫자인 동안
  let sessionStartCol = 5;
  let sessionEndCol = sessionStartCol;
  while (sessionEndCol < headerRow.length && /^\d+$/.test((headerRow[sessionEndCol] || "").toString().trim())) sessionEndCol++;
  const sessionCount = sessionEndCol - sessionStartCol;

  const dateRow = rows[headerIdx + 2] || [];
  const dates = [];
  for (let c = sessionStartCol; c < sessionEndCol; c++) {
    const raw = (dateRow[c] || "").toString().trim();
    dates.push(raw);
  }

  const hoursRow = rows[headerIdx + 3] || []; // 운영시수 행 (정서적지원=1, 수업시간별도지도=0.2 등)
  const hours = [];
  for (let c = sessionStartCol; c < sessionEndCol; c++) {
    const raw = (hoursRow[c] || "").toString().trim();
    const num = Number(raw);
    hours.push(Number.isFinite(num) && raw !== "" ? num : 1);
  }

  const students = [];
  let r = headerIdx + 4; // 학년/반/번호/이름/차시 헤더 + 운영방법/날짜/운영시수 서브헤더 3줄 다음부터 학생 행
  while (r < rows.length) {
    const row = rows[r];
    const grade = (row[0] || "").toString().trim();
    if (!grade || grade === "지도교사 확인") break;
    const ban = (row[1] || "").toString().trim();
    const no = (row[2] || "").toString().trim();
    const name = (row[3] || "").toString().trim();
    const records = [];
    for (let c = sessionStartCol; c < sessionEndCol; c++) {
      const mark = (row[c] || "").toString().trim();
      records.push({ session: c - sessionStartCol + 1, date: dates[c - sessionStartCol] || "", mark });
    }
    students.push({ rowIdx: r, grade, ban, no, name, records });
    r++;
  }
  return { headerIdx, sessionStartCol, sessionEndCol, sessionCount, dates, hours, students };
}

function colToLetterXml(c) {
  let s = ""; c++;
  while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - m - 1) / 26); }
  return s;
}

function dateStrToMMDD(dateStr) {
  const [m, d] = dateStr.split("/").map(Number);
  return `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

// 반의 취약(출석률 낮은) 학생 우선 - 그 학생들이 실제 출석한 날을 1순위, 전체 출석률을 2순위로 최적 날짜 N개 선정
function computeBestDatesForLabel(label, count) {
  const data = computeDateRanking(label);
  if (!data || data.dayResults.length === 0) return null;
  const totalDays = data.dayResults.length;

  const presentCount = {};
  data.names.forEach(n => presentCount[n] = 0);
  data.dayResults.forEach(d => d.present.forEach(n => presentCount[n]++));
  const rates = data.names.map(n => ({ name: n, rate: presentCount[n] / totalDays }));
  rates.sort((a, b) => a.rate - b.rate);
  const weakCount = Math.max(1, Math.round(rates.length * 0.2)); // 하위 20%를 취약 학생으로 정의
  const weakNames = new Set(rates.slice(0, weakCount).map(r => r.name));

  const scored = data.dayResults.map(d => ({ ...d, weakPresent: d.present.filter(n => weakNames.has(n)).length }));
  scored.sort((a, b) => b.weakPresent - a.weakPresent || b.rate - a.rate);
  const chosen = scored.slice(0, count).sort((a, b) => {
    const [am, ad] = a.date.split("/").map(Number), [bm, bd] = b.date.split("/").map(Number);
    return am - bm || ad - bd;
  });
  return { names: data.names, weakNames: [...weakNames], chosen };
}

// 예방지도 출석부의 빈 회차(날짜 없는 칸)에 우선순위 날짜를 채우고, 학생별 출석 여부를 O/X로 표시 (서식 100% 보존)
async function fillSessionAttendance(fileEntry, subjectName, label) {
  if (!fileEntry) return { ok: false, msg: "예방지도 출석부 양식을 먼저 업로드해 주세요." };
  if (!fileEntry.isXlsx) return { ok: false, msg: `"${fileEntry.fileName}"은 .xls라서 이 기능을 쓸 수 없습니다. xlsx로 저장 후 다시 올려주세요.` };

  const readWb = XLSX.read(fileEntry.rawData, { type: "array", cellDates: false });
  const sheetName = findSubjectSheet(readWb, subjectName);
  if (!sheetName) return { ok: false, msg: `"${subjectName}"과 일치하는 탭을 "${fileEntry.fileName}"에서 찾지 못했습니다.` };
  const parsed = parsePreventionSheet(readWb.Sheets[sheetName]);
  if (!parsed) return { ok: false, msg: `"${sheetName}" 탭 구조를 인식하지 못했습니다.` };

  const blankCols = [];
  parsed.dates.forEach((d, i) => { if (!d) blankCols.push(parsed.sessionStartCol + i); });
  if (blankCols.length === 0) return { ok: false, msg: "채울 수 있는 빈 회차 칸이 없습니다 (전부 이미 날짜가 채워져 있음)." };

  const best = computeBestDatesForLabel(label, blankCols.length);
  if (!best || best.chosen.length === 0) return { ok: false, msg: `"${label}"의 수업일 데이터를 찾지 못했습니다. ①시간표에 이 반이 설정돼 있는지 확인해 주세요.` };

  const zip = await JSZip.loadAsync(fileEntry.rawData);
  const sheetPath = await getSheetXmlPath(zip, sheetName);
  if (!sheetPath) return { ok: false, msg: "시트 내부 경로를 찾지 못했습니다." };
  let sheetXml = await zip.file(sheetPath).async("string");

  const dateRowNum = parsed.headerIdx + 3; // rows[]는 0-idx, 엑셀 행은 1-idx이므로 +1

  best.chosen.forEach((d, i) => {
    const colLetter = colToLetterXml(blankCols[i]);
    const info = getRowXml(sheetXml, dateRowNum);
    const rowXml = setCellValueXml(info.xml, colLetter, dateRowNum, dateStrToMMDD(d.date), true);
    sheetXml = sheetXml.slice(0, info.index) + rowXml + sheetXml.slice(info.index + info.length);
  });

  let filledStudents = 0;
  parsed.students.forEach(st => {
    if (!st.name) return;
    const rowNum = st.rowIdx + 1;
    const info = getRowXml(sheetXml, rowNum);
    let rowXml = info.xml;
    best.chosen.forEach((d, i) => {
      const colLetter = colToLetterXml(blankCols[i]);
      const present = d.present.includes(st.name);
      rowXml = setCellValueXml(rowXml, colLetter, rowNum, present ? "O" : "X", true);
    });
    sheetXml = sheetXml.slice(0, info.index) + rowXml + sheetXml.slice(info.index + info.length);
    filledStudents++;
  });

  zip.file(sheetPath, sheetXml);
  const blob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const baseName = fileEntry.fileName.replace(/\.(xlsx|xls)$/i, "");
  a.download = `회차채움_${baseName}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  return { ok: true, filledDates: best.chosen.length, filledStudents, weakNames: best.weakNames, dates: best.chosen.map(d => d.date) };
}

// ---------- xlsx 내부 XML을 직접 수정 (서식 100% 보존) ----------
function escapeXmlText(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

async function getSheetXmlPath(zip, sheetName) {
  const workbookXml = await zip.file("xl/workbook.xml").async("string");
  const relsXml = await zip.file("xl/_rels/workbook.xml.rels").async("string");
  const escaped = sheetName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const sheetMatch = new RegExp(`<sheet\\b[^>]*name="${escaped}"[^>]*/>`).exec(workbookXml);
  if (!sheetMatch) return null;
  const ridMatch = /r:id="(rId\d+)"/.exec(sheetMatch[0]);
  if (!ridMatch) return null;
  const relMatch = new RegExp(`<Relationship\\b[^>]*Id="${ridMatch[1]}"[^>]*/>`).exec(relsXml);
  if (!relMatch) return null;
  const targetMatch = /Target="([^"]+)"/.exec(relMatch[0]);
  if (!targetMatch) return null;
  let target = targetMatch[1].replace(/^\.?\//, "");
  if (!target.startsWith("xl/")) target = "xl/" + target;
  return target;
}

function normalizeSelfClosingRow(rowXml) {
  const m = /^(<row\b[^>]*)\/>$/.exec(rowXml.trim());
  return m ? m[1] + "></row>" : rowXml;
}

function getRowXml(sheetXml, rowNum) {
  const re = new RegExp(`<row\\b[^>]*\\br="${rowNum}"[^>]*/>|<row\\b[^>]*\\br="${rowNum}"[^>]*>[\\s\\S]*?</row>`);
  const m = re.exec(sheetXml);
  return m ? { xml: normalizeSelfClosingRow(m[0]), index: m.index, length: m[0].length } : null;
}

function setCellValueXml(rowXml, colLetter, rowNum, value, isString) {
  const addr = colLetter + rowNum;
  const cellRe = new RegExp(`<c r="${addr}"([^>]*)/>|<c r="${addr}"([^>]*)>([\\s\\S]*?)</c>`);
  const m = cellRe.exec(rowXml);
  let styleAttr = "";
  if (m) {
    const attrs = m[1] !== undefined ? m[1] : m[2];
    const sMatch = /\bs="(\d+)"/.exec(attrs || "");
    if (sMatch) styleAttr = ` s="${sMatch[1]}"`;
  } else {
    const aMatch = new RegExp(`<c r="A${rowNum}"([^>]*?)(?:/>|>)`).exec(rowXml);
    if (aMatch) {
      const sMatch = /\bs="(\d+)"/.exec(aMatch[1] || "");
      if (sMatch) styleAttr = ` s="${sMatch[1]}"`;
    }
  }
  const newCell = isString
    ? `<c r="${addr}"${styleAttr} t="inlineStr"><is><t xml:space="preserve">${escapeXmlText(value)}</t></is></c>`
    : `<c r="${addr}"${styleAttr} t="n"><v>${value}</v></c>`;
  if (m) return rowXml.slice(0, m.index) + newCell + rowXml.slice(m.index + m[0].length);
  return rowXml.replace(/<\/row>\s*$/, newCell + "</row>");
}

function shiftRowNumberXml(rowXml, oldRow, newRow) {
  let out = rowXml.replace(new RegExp(`(<row\\b[^>]*\\br=")${oldRow}(")`), `$1${newRow}$2`);
  out = out.replace(/r="([A-Z]+)(\d+)"/g, (full, col, rnum) => Number(rnum) === oldRow ? `r="${col}${newRow}"` : full);
  return out;
}

// 워크북(SheetJS로 읽은 것)에서 과목명과 가장 잘 맞는 시트 찾기
function findSubjectSheet(workbook, subjectName) {
  if (workbook.SheetNames.includes(subjectName)) return subjectName;
  const norm = s => (s || "").replace(/\s+/g, "");
  const target = norm(subjectName);
  const exact = workbook.SheetNames.find(sn => norm(sn) === target);
  if (exact) return exact;
  const found = workbook.SheetNames.find(sn => norm(sn).includes(target) || target.includes(norm(sn)));
  return found || null;
}

function deriveGradeBanNo(st) {
  const idMatch = /^(\d)(\d{2})(\d{2})$/.exec((st.studentId || "").trim());
  if (idMatch) return { grade: Number(idMatch[1]), ban: Number(idMatch[2]), no: Number(idMatch[3]) };
  const gradeMatch = /(\d+)학년\s*(\d+)반/.exec(st.classLabel || "");
  return {
    grade: gradeMatch ? Number(gradeMatch[1]) : "",
    ban: gradeMatch ? Number(gradeMatch[2]) : "",
    no: st.no ? Number(st.no) : ""
  };
}

// 확정·위험 대상(또는 전체) 학생을 예방지도 출석부의 빈 행에 채워 넣고 다운로드 (xlsx 내부 XML 직접 수정 - 서식 100% 보존)
async function fillPreventionTemplate(fileEntry, subjectName, targetStudents) {
  if (!fileEntry) return { ok: false, msg: "먼저 ④에 예방지도 출석부 양식을 업로드해 주세요." };

  if (!fileEntry.isXlsx) {
    return { ok: false, msg: `"${fileEntry.fileName}"은 .xls(예전 엑셀) 형식이라 서식을 100% 보존하며 채울 수 없습니다.\nExcel에서 이 파일을 열어 "다른 이름으로 저장" -> 파일 형식을 .xlsx로 바꿔서 저장한 뒤, 그 xlsx 파일을 다시 ④에 올려주세요. xlsx로 올리시면 서식이 전혀 깨지지 않습니다.` };
  }

  // 구조 파악(빈 행 위치 등)은 SheetJS로 읽어서 확인
  const readWb = XLSX.read(fileEntry.rawData, { type: "array", cellDates: false });
  const sheetName = findSubjectSheet(readWb, subjectName);
  if (!sheetName) return { ok: false, msg: `"${subjectName}"과 일치하는 탭을 "${fileEntry.fileName}" 양식에서 찾지 못했습니다. 과목명을 양식의 탭 이름과 똑같이 입력해 주세요. (탭 목록: ${readWb.SheetNames.join(", ")})` };
  const parsed = parsePreventionSheet(readWb.Sheets[sheetName]);
  if (!parsed) return { ok: false, msg: `"${sheetName}" 탭에서 양식 구조(학년/반/번호/이름 헤더)를 찾지 못했습니다.` };

  const zip = await JSZip.loadAsync(fileEntry.rawData);
  const sheetPath = await getSheetXmlPath(zip, sheetName);
  if (!sheetPath) return { ok: false, msg: `"${sheetName}" 탭의 내부 파일 경로를 찾지 못했습니다.` };
  let sheetXml = await zip.file(sheetPath).async("string");

  // 엑셀 실제 행 번호(1-based) = rowIdx(0-based) + 1
  let blankRowNums = parsed.students.filter(s => !s.name).map(s => s.rowIdx + 1);
  const needed = targetStudents.length - blankRowNums.length;

  if (needed > 0) {
    const lastStudentRowNum = parsed.students.length > 0 ? parsed.students[parsed.students.length - 1].rowIdx + 1 : parsed.headerIdx + 5;
    const lastBlank = blankRowNums.length > 0 ? blankRowNums[blankRowNums.length - 1] : lastStudentRowNum;
    const templateRowInfo = getRowXml(sheetXml, lastBlank) || getRowXml(sheetXml, lastStudentRowNum);
    const templateRowXml = templateRowInfo.xml;

    // 삽입 지점 이후 기존 행들을 뒤에서부터(큰 번호부터) needed만큼 밀기
    const allRowNums = [...sheetXml.matchAll(/<row\b[^>]*\br="(\d+)"/g)].map(m => Number(m[1])).sort((a, b) => b - a);
    for (const rn of allRowNums) {
      if (rn > lastBlank) {
        const info = getRowXml(sheetXml, rn);
        const shifted = shiftRowNumberXml(info.xml, rn, rn + needed);
        sheetXml = sheetXml.slice(0, info.index) + shifted + sheetXml.slice(info.index + info.length);
      }
    }
    // 마지막 빈 행을 복제해 새 행 삽입 (같은 스타일)
    let newRowsXml = "";
    for (let i = 0; i < needed; i++) newRowsXml += shiftRowNumberXml(templateRowXml, lastBlank, lastBlank + 1 + i);
    const lastBlankInfo = getRowXml(sheetXml, lastBlank);
    const insertPos = lastBlankInfo.index + lastBlankInfo.length;
    sheetXml = sheetXml.slice(0, insertPos) + newRowsXml + sheetXml.slice(insertPos);

    // dimension, mergeCells 보정
    sheetXml = sheetXml.replace(/(<dimension ref="[A-Z]+1:[A-Z]+)(\d+)("\/>)/, (full, a, rn, c) => `${a}${Number(rn) + needed}${c}`);
    sheetXml = sheetXml.replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g, (full, c1, r1, c2, r2) => {
      let nr1 = Number(r1), nr2 = Number(r2);
      if (nr1 > lastBlank) nr1 += needed;
      if (nr2 > lastBlank) nr2 += needed;
      return `<mergeCell ref="${c1}${nr1}:${c2}${nr2}"/>`;
    });

    for (let i = 0; i < needed; i++) blankRowNums.push(lastBlank + 1 + i);
  }

  const n = targetStudents.length;
  for (let i = 0; i < n; i++) {
    const rn = blankRowNums[i];
    const st = targetStudents[i];
    const { grade, ban, no } = deriveGradeBanNo(st);
    const info = getRowXml(sheetXml, rn);
    let rowXml = info.xml;
    if (grade !== "") rowXml = setCellValueXml(rowXml, "A", rn, grade, false);
    if (ban !== "") rowXml = setCellValueXml(rowXml, "B", rn, ban, false);
    if (no !== "") rowXml = setCellValueXml(rowXml, "C", rn, no, false);
    rowXml = setCellValueXml(rowXml, "D", rn, st.name, true);
    sheetXml = sheetXml.slice(0, info.index) + rowXml + sheetXml.slice(info.index + info.length);
  }

  zip.file(sheetPath, sheetXml);
  const blob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const baseName = fileEntry.fileName.replace(/\.(xlsx|xls)$/i, "");
  a.download = `채움_${baseName}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  return { ok: true, filled: n, overflow: 0, sheetName };
}

// 이름/반/번호 채우기 + 회차 날짜/O·X 채우기를 한 번에 처리 (다운로드 1회)
async function fillTemplateComplete(fileEntry, subjectName, label, targetStudents) {
  if (!fileEntry) return { ok: false, msg: "먼저 ④에 예방지도 출석부 양식을 업로드해 주세요." };
  if (!fileEntry.isXlsx) {
    return { ok: false, msg: `"${fileEntry.fileName}"은 .xls(예전 엑셀) 형식이라 서식을 100% 보존하며 채울 수 없습니다.\nExcel에서 "다른 이름으로 저장" -> xlsx로 바꿔서 다시 올려주세요.` };
  }

  const readWb = XLSX.read(fileEntry.rawData, { type: "array", cellDates: false });
  const sheetName = findSubjectSheet(readWb, subjectName);
  if (!sheetName) return { ok: false, msg: `"${subjectName}"과 일치하는 탭을 "${fileEntry.fileName}" 양식에서 찾지 못했습니다. (탭 목록: ${readWb.SheetNames.join(", ")})` };
  const parsed = parsePreventionSheet(readWb.Sheets[sheetName]);
  if (!parsed) return { ok: false, msg: `"${sheetName}" 탭에서 양식 구조를 찾지 못했습니다.` };

  const zip = await JSZip.loadAsync(fileEntry.rawData);
  const sheetPath = await getSheetXmlPath(zip, sheetName);
  if (!sheetPath) return { ok: false, msg: `"${sheetName}" 탭의 내부 파일 경로를 찾지 못했습니다.` };
  let sheetXml = await zip.file(sheetPath).async("string");

  // ---- 1단계: 학년/반/번호/이름 채우기 ----
  const alreadyFilled = parsed.students.filter(s => s.name).map(s => ({ rowNum: s.rowIdx + 1, name: s.name }));
  let blankRowNums = parsed.students.filter(s => !s.name).map(s => s.rowIdx + 1);
  const needed = targetStudents.length - blankRowNums.length;

  if (needed > 0) {
    const lastStudentRowNum = parsed.students.length > 0 ? parsed.students[parsed.students.length - 1].rowIdx + 1 : parsed.headerIdx + 5;
    const lastBlank = blankRowNums.length > 0 ? blankRowNums[blankRowNums.length - 1] : lastStudentRowNum;
    const templateRowInfo = getRowXml(sheetXml, lastBlank) || getRowXml(sheetXml, lastStudentRowNum);
    const templateRowXml = templateRowInfo.xml;

    const allRowNums = [...sheetXml.matchAll(/<row\b[^>]*\br="(\d+)"/g)].map(m => Number(m[1])).sort((a, b) => b - a);
    for (const rn of allRowNums) {
      if (rn > lastBlank) {
        const info = getRowXml(sheetXml, rn);
        const shifted = shiftRowNumberXml(info.xml, rn, rn + needed);
        sheetXml = sheetXml.slice(0, info.index) + shifted + sheetXml.slice(info.index + info.length);
      }
    }
    let newRowsXml = "";
    for (let i = 0; i < needed; i++) newRowsXml += shiftRowNumberXml(templateRowXml, lastBlank, lastBlank + 1 + i);
    const lastBlankInfo = getRowXml(sheetXml, lastBlank);
    const insertPos = lastBlankInfo.index + lastBlankInfo.length;
    sheetXml = sheetXml.slice(0, insertPos) + newRowsXml + sheetXml.slice(insertPos);

    sheetXml = sheetXml.replace(/(<dimension ref="[A-Z]+1:[A-Z]+)(\d+)("\/>)/, (full, a, rn, c) => `${a}${Number(rn) + needed}${c}`);
    sheetXml = sheetXml.replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g, (full, c1, r1, c2, r2) => {
      let nr1 = Number(r1), nr2 = Number(r2);
      if (nr1 > lastBlank) nr1 += needed;
      if (nr2 > lastBlank) nr2 += needed;
      return `<mergeCell ref="${c1}${nr1}:${c2}${nr2}"/>`;
    });
    for (let i = 0; i < needed; i++) blankRowNums.push(lastBlank + 1 + i);
  }

  const n = targetStudents.length;
  const newlyFilled = [];
  for (let i = 0; i < n; i++) {
    const rn = blankRowNums[i];
    const st = targetStudents[i];
    const { grade, ban, no } = deriveGradeBanNo(st);
    const info = getRowXml(sheetXml, rn);
    let rowXml = info.xml;
    if (grade !== "") rowXml = setCellValueXml(rowXml, "A", rn, grade, false);
    if (ban !== "") rowXml = setCellValueXml(rowXml, "B", rn, ban, false);
    if (no !== "") rowXml = setCellValueXml(rowXml, "C", rn, no, false);
    rowXml = setCellValueXml(rowXml, "D", rn, st.name, true);
    sheetXml = sheetXml.slice(0, info.index) + rowXml + sheetXml.slice(info.index + info.length);
    newlyFilled.push({ rowNum: rn, name: st.name });
  }

  // ---- 2단계: 회차(빈 날짜) 자동 채우기 + 학생별 O/X ----
  let sessionInfo = null;
  const blankCols = [];
  parsed.dates.forEach((d, i) => { if (!d) blankCols.push(parsed.sessionStartCol + i); });
  if (blankCols.length > 0) {
    const best = computeBestDatesForLabel(label, blankCols.length);
    if (best && best.chosen.length > 0) {
      const dateRowNum = parsed.headerIdx + 3;
      best.chosen.forEach((d, i) => {
        const colLetter = colToLetterXml(blankCols[i]);
        const info = getRowXml(sheetXml, dateRowNum);
        const rowXml = setCellValueXml(info.xml, colLetter, dateRowNum, dateStrToMMDD(d.date), true);
        sheetXml = sheetXml.slice(0, info.index) + rowXml + sheetXml.slice(info.index + info.length);
      });
      const allStudentRows = [...alreadyFilled, ...newlyFilled];
      allStudentRows.forEach(sr => {
        const info = getRowXml(sheetXml, sr.rowNum);
        let rowXml = info.xml;
        best.chosen.forEach((d, i) => {
          const colLetter = colToLetterXml(blankCols[i]);
          const present = d.present.includes(sr.name);
          const hourVal = parsed.hours[blankCols[i] - parsed.sessionStartCol];
          rowXml = setCellValueXml(rowXml, colLetter, sr.rowNum, present ? hourVal : 0, false);
        });
        sheetXml = sheetXml.slice(0, info.index) + rowXml + sheetXml.slice(info.index + info.length);
      });
      sessionInfo = { filledDates: best.chosen.length, dates: best.chosen.map(d => d.date), weakNames: best.weakNames };
    }
  }

function excelSerialToMD(serial) {
  const epochMs = Date.UTC(1899, 11, 30);
  const d = new Date(epochMs + Number(serial) * 86400000);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}
function presetDateToMD(raw) {
  const t = (raw || "").toString().trim();
  if (!t) return null;
  const num = parseFloat(t);
  // 엑셀 날짜 일련번호 범위(대략 2000~2100년) - 깨진 46086 같은 숫자도 정상 날짜로 변환
  if (Number.isFinite(num) && num > 36526 && num < 73415 && /^\d+(\.\d+)?$/.test(t)) {
    return excelSerialToMD(Math.round(num));
  }
  const m = /^(\d{1,2})\s*-\s*(\d{1,2})$/.exec(t); // "03-05" 형식
  if (m) return `${Number(m[1])}/${Number(m[2])}`;
  return null; // 알 수 없는 형식이면 대조하지 않음(임의로 O/X 채우지 않음)
}

  // ---- 3단계: 이미 날짜가 정해진 회차(정서적지원 등)도 출결시트와 대조해서 O/X 채우기 ----
  // SheetJS의 문자열 변환에 의존하지 않고, 날짜 행의 XML 원본 값을 직접 읽어서 판정 (더 확실함)
  function getCellRawXmlValue(rowXml, addr) {
    const cellRe = new RegExp(`<c r="${addr}"([^>]*)(?:/>|>([\\s\\S]*?)</c>)`);
    const m = cellRe.exec(rowXml);
    if (!m) return "";
    const attrs = m[1] || "", inner = m[2] || "";
    if (/t="inlineStr"/.test(attrs)) {
      const tm = /<t[^>]*>([\s\S]*?)<\/t>/.exec(inner);
      return tm ? tm[1] : "";
    }
    const vm = /<v>([\s\S]*?)<\/v>/.exec(inner);
    return vm ? vm[1] : "";
  }
  const dateRowNum3 = parsed.headerIdx + 3;
  const dateRowXmlNow = getRowXml(sheetXml, dateRowNum3).xml;
  const presetCols = [];
  for (let c = parsed.sessionStartCol; c < parsed.sessionEndCol; c++) {
    if (blankCols.includes(c)) continue; // 2단계에서 이미 새로 채운 컬럼은 제외 (중복 처리 방지)
    const colLetter = colToLetterXml(c);
    const raw = getCellRawXmlValue(dateRowXmlNow, colLetter + dateRowNum3);
    if (raw && raw.trim()) presetCols.push({ col: c, mmdd: raw.trim() });
  }
  let presetFilled = 0;
  if (presetCols.length > 0) {
    const includeRecognized = document.getElementById("includeRecognized").checked;
    const resolved = resolveLabelStudents(label);
    const studentEventsByDate = {}; // name -> { "M/D": event }
    if (resolved) {
      sheets.forEach(sheet => {
        sheet.students.forEach(st => {
          if (!resolved.names.includes(st.name)) return;
          if (!studentEventsByDate[st.name]) studentEventsByDate[st.name] = {};
          st.events.forEach(ev => { studentEventsByDate[st.name][ev.date] = ev; });
        });
      });
    }
    const allStudentRows2 = [...alreadyFilled, ...newlyFilled];
    allStudentRows2.forEach(sr => {
      const info = getRowXml(sheetXml, sr.rowNum);
      let rowXml = info.xml;
      presetCols.forEach(pc => {
        const dateKey = presetDateToMD(pc.mmdd);
        if (!dateKey) return; // 날짜를 못 읽으면 건드리지 않음
        const ev = (studentEventsByDate[sr.name] || {})[dateKey];
        let present = true;
        if (ev) {
          const c = classifyEvent(ev);
          const skip = c.recognized && !includeRecognized;
          if (!skip && c.category === "absence_full") present = false;
        }
        const colLetter = colToLetterXml(pc.col);
        const hourVal = parsed.hours[pc.col - parsed.sessionStartCol];
        rowXml = setCellValueXml(rowXml, colLetter, sr.rowNum, present ? hourVal : 0, false);
      });
      sheetXml = sheetXml.slice(0, info.index) + rowXml + sheetXml.slice(info.index + info.length);
      presetFilled++;
    });
  }

  zip.file(sheetPath, sheetXml);

  // 워크북을 열 때 모든 수식(합계 등)을 강제로 재계산하도록 설정 - 안 하면 예전 캐시 값(0)이 그대로 보임
  try {
    let workbookXml = await zip.file("xl/workbook.xml").async("string");
    if (/fullCalcOnLoad=/.test(workbookXml)) {
      workbookXml = workbookXml.replace(/fullCalcOnLoad="[^"]*"/, 'fullCalcOnLoad="1"');
    } else if (/<calcPr\b[^>]*\/>/.test(workbookXml)) {
      workbookXml = workbookXml.replace(/<calcPr\b([^>]*)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>');
    } else {
      workbookXml = workbookXml.replace("</workbook>", '<calcPr fullCalcOnLoad="1"/></workbook>');
    }
    zip.file("xl/workbook.xml", workbookXml);
  } catch (e) { /* 실패해도 나머지 채우기는 정상 진행 */ }

  const blob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const baseName = fileEntry.fileName.replace(/\.(xlsx|xls)$/i, "");
  a.download = `채움_${baseName}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  return { ok: true, filled: n, sheetName, session: sessionInfo, presetFilled };
}

// 이미 체크가 채워진 예방지도 출석부에서 결시 현황 확인 (빈 칸이 아니면 결시로 간주)
function checkPreventionAttendance() {
  const area = document.getElementById("preventionCheckArea");
  area.innerHTML = "";
  if (preventionFiles.length === 0) return;
  const results = [];
  preventionFiles.forEach(pf => {
    pf.workbook.SheetNames.forEach(sn => {
      const parsed = parsePreventionSheet(pf.workbook.Sheets[sn]);
      if (!parsed) return;
      parsed.students.forEach(st => {
        if (!st.name) return;
        const missed = st.records.filter(rec => {
          if (!rec.mark) return false;
          const m = rec.mark.trim();
          if (m.toUpperCase() === "O") return false; // 출석 표시
          if (/^-?\d+(\.\d+)?$/.test(m)) return parseFloat(m) <= 0; // 숫자(운영시수)면 0 이하만 결시
          return true; // 그 외 텍스트(X, 결석 등)는 결시로 간주
        });
        if (missed.length > 0) results.push({ file: pf.fileName, subject: sn, ...st, missed });
      });
    });
  });
  if (results.length === 0) {
    area.innerHTML = '<div class="empty-note" style="margin-top:8px;">체크(결시 표시)가 있는 학생이 없습니다. 아직 빈 양식이거나, 체크된 칸이 없는 것 같습니다.</div>';
    return;
  }
  const wrap = document.createElement("div");
  wrap.style.marginTop = "10px";
  results.forEach(r => {
    const d = document.createElement("details");
    d.style.border = "1px solid #e2e5ea"; d.style.borderRadius = "6px"; d.style.marginBottom = "6px"; d.style.padding = "8px 12px";
    const s = document.createElement("summary");
    s.style.cursor = "pointer"; s.style.fontSize = "13px";
    s.textContent = `[${r.file} · ${r.subject}] ${r.grade}학년 ${r.ban}반 ${r.no}번 ${r.name} - 결시 ${r.missed.length}회`;
    d.appendChild(s);
    const ul = document.createElement("ul"); ul.className = "detail-list";
    r.missed.forEach(m => { const li = document.createElement("li"); li.textContent = `${m.session}차시${m.date ? " (" + m.date + ")" : ""} - ${m.mark}`; ul.appendChild(li); });
    d.appendChild(ul);
    wrap.appendChild(d);
  });
  area.appendChild(wrap);
}

setupDropzone(document.getElementById("preventionDropzone"), document.getElementById("preventionFile"), (fileList) => {
  const files = Array.from(fileList);
  let pending = files.length;
  const errors = [];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const isXlsx = /\.xlsx$/i.test(file.name);
        const workbook = XLSX.read(data, { type: "array", cellDates: false });
        const matchingTabs = workbook.SheetNames.filter(sn => parsePreventionSheet(workbook.Sheets[sn]));
        if (matchingTabs.length === 0) {
          errors.push(`"${file.name}"은 예방지도 출석부 양식처럼 보이지 않습니다 (학년/반/번호/이름 헤더 구조를 못 찾음). 수강생 명단 파일을 잘못 올리신 건 아닌지 확인해 주세요.`);
        } else {
          preventionFiles.push({ fileName: file.name, rawData: data, isXlsx, workbook });
        }
      } catch (err) {
        errors.push(`"${file.name}": ${err.message}`);
      }
      pending--;
      if (pending === 0) { renderPreventionList(errors); checkPreventionAttendance(); }
    };
    reader.onerror = () => { errors.push(`"${file.name}": 파일을 읽을 수 없습니다.`); pending--; if (pending === 0) { renderPreventionList(errors); checkPreventionAttendance(); } };
    reader.readAsArrayBuffer(file);
  });
});

    errors.forEach(msg => {

// 예방지도 출석부 양식 파일명에서 어느 수강반용인지 추정 (예: "...A반.xls" -> A반 명단)
function detectTemplateRosterFile(fileEntry) {
  if (!fileEntry || rosterFiles.length === 0) return null;
  const norm = s => (s || "").replace(/\s+/g, "");
  const fname = norm(fileEntry.fileName);
  const matches = rosterFiles.filter(f => fname.includes(norm(f.label)));
  return matches.length === 1 ? matches[0] : null;
}
