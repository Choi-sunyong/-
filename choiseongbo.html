// ---------- 계산 ----------
document.getElementById("computeBtn").addEventListener("click", () => {
  const resultArea = document.getElementById("resultArea");
  if (sheets.length === 0) {
    resultArea.innerHTML = '<div class="error-box" style="text-align:center; margin-top:16px;">학급출결현황을 먼저 올려 주세요.</div>';
    return;
  }
  const labels = [...new Set(Object.values(slotAssignment).filter(Boolean))];
  if (labels.length === 0) {
    resultArea.innerHTML = '<div class="error-box" style="text-align:center; margin-top:16px;">시간표에 반을 하나 이상 넣어 주세요.</div>';
    return;
  }

  const includeRecognized = document.getElementById("includeRecognized").checked;
  const subjectName = document.getElementById("subjectName").value.trim() || "과목";
  const MONTH_DOW = ["일","월","화","수","목","금","토"];

  // 각 라벨(수강반 또는 홈룸반)이 가리키는 학생 목록 파악
  const resolved = {}; // label -> {source, names, ids}
  const unresolvedLabels = [];
  labels.forEach(label => {
    const r = resolveLabelStudents(label);
    if (r) resolved[label] = r; else unresolvedLabels.push(label);
  });

  const studentCourseSection = {};
  const rosterIdMap = {};
  Object.keys(resolved).forEach(label => {
    resolved[label].names.forEach(n => { studentCourseSection[n] = resolved[label].canonicalLabel || label; });
    Object.keys(resolved[label].ids || {}).forEach(n => { rosterIdMap[n] = resolved[label].ids[n]; });
  });

  // 전체 출결 시트에서 실제 수업일(달력 날짜) 취합 - 학교 전체 공통
  // 단, 오늘 이후 날짜는 아직 수업이 일어나지 않았으므로 "이미 진행된 수업"에서 제외
  const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  const YEAR = 2026;
  function dateStrToDate(s) {
    const [m, d] = s.split("/").map(Number);
    return new Date(m <= 2 ? YEAR + 1 : YEAR, m - 1, d);
  }
  const allCalendarDates = [];
  sheets.forEach(s => allCalendarDates.push(...s.calendarDates));
  // "M/D" -> 학사일정 캘린더(④) 조회용 "YYYY-MM-DD"
  function toIso(dateStr) {
    const [m, d] = dateStr.split("/").map(Number);
    return `${m <= 2 ? YEAR + 1 : YEAR}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  const pastCalendarDatesBase = allCalendarDates.filter(d => dateStrToDate(d.date) <= TODAY);

  // 라벨별로 수업 세션(so far) / 총 예정 수업 계산 (반에 실제로 있는 학년의 모의고사일만 자동 제외)
  const classCalc = {};
  const allSessionDatesSet = new Set();
  Object.keys(resolved).forEach(label => {
    const labelGrades = getLabelGrades(label);
    const pastCalendarDates = pastCalendarDatesBase.filter(d => !isDateOffForLabel(toIso(d.date), labelGrades));
    const slotsSel = activeSlotsForClass(label);
    const sessionsBySlot = slotsSel.map(slot => {
      const dates = [...new Set(pastCalendarDates.filter(d => d.dow === slot.day).map(d => d.date))];
      dates.forEach(d => allSessionDatesSet.add(d));
      return { ...slot, dates };
    });
    const totalSessions = sessionsBySlot.reduce((sum, s) => sum + s.dates.length, 0);

    let totalPlanned = 0;
    Object.keys(classDates).forEach(iso => {
      if (isDateOffForLabel(iso, labelGrades)) return;
      const d = new Date(iso + "T00:00:00");
      const dowKr = MONTH_DOW[d.getDay()];
      totalPlanned += slotsSel.filter(s => s.day === dowKr).length;
    });

    classCalc[resolved[label].canonicalLabel || label] = { slotsSel, sessionsBySlot, totalSessions, totalPlanned };
  });

  // 출결 시트에서 학생별 실제 출결 이벤트(홈룸 반/번호 포함) 수집 - 계산 대상 학생만
  const manualExcluded = getManualExcludedStudents();
  const withdrawnAuto = new Set();
  sheets.forEach(sheet => sheet.students.forEach(st => {
    if ((st.name in studentCourseSection) && isWithdrawnStudent(st.events)) withdrawnAuto.add(st.name);
  }));
  const studentMap = {};
  const studentInfo = {};
  sheets.forEach(sheet => {
    sheet.students.forEach(st => {
      if (!(st.name in studentCourseSection)) return;
      if (manualExcluded.has(st.name)) return;
      if (withdrawnAuto.has(st.name)) return;
      if (!studentMap[st.name]) studentMap[st.name] = [];
      studentMap[st.name].push(...st.events);
      if (!studentInfo[st.name]) studentInfo[st.name] = { classLabel: st.classLabel, no: st.no, studentId: st.studentId };
    });
  });

  // 명단(수강반, roster 출처)에는 있으나 출결시트에서 못 찾은 학생만 확인 (공통과목/홈룸 출처는 애초에 출결시트에서 뽑은 것이라 해당 없음)
  const rosterOnlyNames = new Set();
  Object.keys(resolved).forEach(label => { if (resolved[label].source === "roster") resolved[label].names.forEach(n => rosterOnlyNames.add(n)); });
  const notFound = [...rosterOnlyNames].filter(n => !studentMap[n] && !withdrawnAuto.has(n) && !manualExcluded.has(n));

  const names = Object.keys(studentMap).sort((a, b) => a.localeCompare(b, "ko"));
  const rows = [];
  const skipped = [];
  const missedCountByDate = {};

  names.forEach(name => {
    const events = studentMap[name];
    const info = studentInfo[name] || {};
    const courseSection = studentCourseSection[name];
    const calc = classCalc[courseSection];
    if (!calc || calc.slotsSel.length === 0) { skipped.push(`${courseSection} ${info.classLabel || ""} ${info.no || ""}번 ${name}`); return; }

    const eventByDate = {};
    events.forEach(ev => { eventByDate[ev.date] = ev; });

    let missed = 0;
    const missedDetail = [];
    const presentDates = [];

    calc.sessionsBySlot.forEach(slot => {
      slot.dates.forEach(date => {
        const ev = eventByDate[date];
        if (ev && isPeriodMissed(ev, slot.period, includeRecognized)) {
          missed++;
          missedCountByDate[date] = (missedCountByDate[date] || 0) + 1;
          missedDetail.push(`${date}(${slot.day}${slot.period}교시) - ${ev.typeText}${ev.reasonText ? " · " + ev.reasonText.replace(/\s*\(\d+~?\)/, "") : ""}`);
        } else {
          presentDates.push(`${date}(${slot.day}${slot.period}교시)`);
        }
      });
    });

    // 날짜순(3월->7월) 정렬
    const byDateAsc = (a, b) => {
      const parseMD = s => { const m = /^(\d+)\/(\d+)/.exec(s); return m ? Number(m[1]) * 100 + Number(m[2]) : 0; };
      return parseMD(a) - parseMD(b);
    };
    missedDetail.sort(byDateAsc);
    presentDates.sort(byDateAsc);

    const totalSessions = calc.totalSessions;
    const totalPlanned = calc.totalPlanned;
    const attended = totalSessions - missed;
    const rate = totalSessions > 0 ? attended / totalSessions : 1;

    let projection = null;
    if (totalPlanned && totalPlanned > totalSessions) {
      const maxAllowedAbsence = totalPlanned - Math.ceil(totalPlanned * 2 / 3);
      const remainingAllowance = maxAllowedAbsence - missed;
      if (remainingAllowance < 0) projection = { status: "확정", remainingAllowance };
      else if (remainingAllowance === 0) projection = { status: "경고", remainingAllowance };
      else projection = { status: "여유", remainingAllowance };
    }

    const status = rate < 2/3 ? "확정 미달" :
      (projection && (projection.status === "확정" || projection.status === "경고") ? "위험" : "정상");

    rows.push({
      name, courseSection, classLabel: info.classLabel || "", no: info.no || "",
      studentId: rosterIdMap[name] || info.studentId || "",
      totalSessions, totalPlanned, missed, attended, rate, missedDetail, presentDates, projection, status
    });
  });

  renderResult(subjectName, rows, notFound, skipped, unresolvedLabels, [...withdrawnAuto]);
  triggerRanking();

  // 예방지도 출석부가 업로드돼 있으면 계산 결과 기반으로 자동 채우기
  if (preventionFiles.length > 0 && rows.length > 0) {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const sortByIdOrClass = (a, b) => {
      const aid = a.studentId || "", bid = b.studentId || "";
      if (aid && bid) return aid.localeCompare(bid);
      return (a.classLabel || "").localeCompare(b.classLabel || "", "ko") || Number(a.no) - Number(b.no);
    };
    (async () => {
      const summaries = [];
      for (const pf of preventionFiles) {
        const detected = detectTemplateRosterFile(pf);
        const scoped = detected ? rows.filter(r => r.courseSection === detected.label) : rows;
        if (scoped.length === 0) continue;
        const targets = [...scoped].sort(sortByIdOrClass);
        const res = await fillTemplateComplete(pf, subjectName, detected ? detected.label : "", targets);
        if (!res.ok) { summaries.push(`[${pf.fileName}] 실패: ${res.msg}`); continue; }
        let line = `[${detected ? detected.label : pf.fileName}] ${targets.length}명 채움`;
        if (res.session) line += ` + 회차 ${res.session.filledDates}일`;
        if (res.presetFilled) line += ` + 기존 회차 O/X`;
        summaries.push(line);
        await sleep(400);
      }
      if (summaries.length > 0) {
        const notice = document.createElement("div");
        notice.className = "result-note";
        notice.style.color = "#1f7a3f";
        notice.style.fontWeight = "600";
        notice.textContent = "예방지도 출석부 자동 채우기 완료: " + summaries.join(", ");
        const area = document.getElementById("resultArea");
        if (area && area.firstChild) area.insertBefore(notice, area.firstChild);
        else if (area) area.appendChild(notice);
      }
    })();
  }
});

function formatStudentTag(r) {
  const id = r.studentId || ((r.classLabel && r.no) ? (r.classLabel.replace(/(\d+)학년\s*(\d+)반/, (m, g, b) => g + String(b).padStart(2, "0")) + String(r.no).padStart(2, "0")) : "");
  const sec = r.courseSection && !/^\d+학년/.test(r.courseSection) ? r.courseSection + " · " : "";
  return `${sec}${id ? id + " " : ""}${r.name}`;
}

function renderResult(subjectName, rows, notFound, skipped, unresolvedLabels, withdrawnAuto) {
  const card = document.createElement("div");
  card.className = "card";
  card.style.marginTop = "16px";

  const title = document.createElement("div");
  title.className = "card-title";
  title.textContent = subjectName;
  card.appendChild(title);

  if (unresolvedLabels && unresolvedLabels.length > 0) {
    const warn = document.createElement("div");
    warn.className = "error-box";
    warn.textContent = `시간표에 입력했지만 어떤 반인지 인식하지 못한 이름: ${unresolvedLabels.join(", ")} - 수강반이면 ②에 같은 이름으로 명단을 올리거나, 홈룸반이면 "2학년 3반"처럼 입력해 주세요.`;
    card.appendChild(warn);
  }
  if (notFound && notFound.length > 0) {
    const warn = document.createElement("div");
    warn.className = "error-box";
    warn.textContent = `명단에는 있으나 출결 시트에서 찾지 못한 이름 (오타 확인 필요): ${notFound.join(", ")}`;
    card.appendChild(warn);
  }
  if (skipped && skipped.length > 0) {
    const warn = document.createElement("div");
    warn.className = "error-box";
    warn.textContent = `반별 시간표가 설정되지 않아 계산에서 제외된 학생: ${skipped.join(", ")}`;
    card.appendChild(warn);
  }
  if (withdrawnAuto && withdrawnAuto.length > 0) {
    const warn = document.createElement("div");
    warn.className = "error-box";
    warn.textContent = `출결 사유에 자퇴/전출/전학이 감지되어 자동으로 제외된 학생: ${withdrawnAuto.join(", ")}`;
    card.appendChild(warn);
  }
  if (rows.length === 0) {
    const e = document.createElement("div");
    e.className = "error-box";
    e.textContent = "계산된 학생이 없습니다. ②명단/③출결시트/①시간표가 모두 준비됐는지, 명단의 이름이 출결시트의 이름과 정확히 일치하는지 확인해 주세요.";
    card.appendChild(e);
    const old0 = document.getElementById("resultArea");
    old0.innerHTML = ""; old0.appendChild(card);
    return;
  }

  const failList = rows.filter(r => r.status === "확정 미달");
  const warnList = rows.filter(r => r.status === "위험");

  const summaryGrid = document.createElement("div");
  summaryGrid.className = "summary-grid";

  const failBox = document.createElement("div");
  failBox.className = "summary-box fail-box";
  const failTitle = document.createElement("div");
  failTitle.className = "summary-box-title";
  failTitle.textContent = `출석 2/3 미만 · ${failList.length}명`;
  failBox.appendChild(failTitle);
  if (failList.length === 0) {
    const e = document.createElement("div"); e.className = "summary-empty"; e.textContent = "해당 없음";
    failBox.appendChild(e);
  } else {
    const ul = document.createElement("ul");
    failList.forEach(r => { const li = document.createElement("li"); li.textContent = formatStudentTag(r); ul.appendChild(li); });
    failBox.appendChild(ul);
  }

  const warnBox = document.createElement("div");
  warnBox.className = "summary-box warn-box";
  const warnTitle = document.createElement("div");
  warnTitle.className = "summary-box-title";
  warnTitle.textContent = `2/3 미만 위험 · ${warnList.length}명`;
  warnBox.appendChild(warnTitle);
  if (warnList.length === 0) {
    const e = document.createElement("div"); e.className = "summary-empty"; e.textContent = "해당 없음";
    warnBox.appendChild(e);
  } else {
    const ul = document.createElement("ul");
    warnList.forEach(r => { const li = document.createElement("li"); li.textContent = formatStudentTag(r); ul.appendChild(li); });
    warnBox.appendChild(ul);
  }

  summaryGrid.appendChild(failBox);
  summaryGrid.appendChild(warnBox);
  card.appendChild(summaryGrid);

  if (preventionFiles.length > 0 && rows.length > 0) {
    const sortByIdOrClass = (a, b) => {
      const aid = a.studentId || "", bid = b.studentId || "";
      if (aid && bid) return aid.localeCompare(bid);
      return (a.classLabel || "").localeCompare(b.classLabel || "", "ko") || Number(a.no) - Number(b.no);
    };

    const fillAllRow = document.createElement("div");
    fillAllRow.style.textAlign = "center";
    fillAllRow.style.marginBottom = "10px";
    const fillAllBtn = document.createElement("button");
    fillAllBtn.className = "pill lg";
    fillAllBtn.textContent = "전원 출석한 날로 예방지도 출석부 채우기";
    fillAllBtn.addEventListener("click", async () => {
      const liveSubjectName = document.getElementById("subjectName").value.trim() || "과목";
      const summaries = [];
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      for (const pf of preventionFiles) {
        const detected = detectTemplateRosterFile(pf);
        const scoped = detected ? rows.filter(r => r.courseSection === detected.label) : rows;
        if (scoped.length === 0) continue;

        summaries.push(line);
        await sleep(400);

      if (summaries.length === 0) summaries.push("채울 수 있는 조합을 찾지 못했습니다.");

// ---------- ⑧ 나이스 출결 현황 직접 확인 ----------
let neisFiles = []; // {fileName, students: [...]}

function findNeisHeaderRow(rows) {
  for (let i = 0; i < Math.min(rows.length, 5); i++) {
    const r = rows[i].map(c => (c || "").toString().trim());
    if (r.includes("학년") && r.includes("반") && r.includes("번호") && r.includes("성명")) return { idx: i, header: r };
  }
  return null;
}
function findColByKeywords(header, keywords) {
  return header.findIndex(h => keywords.every(k => h.includes(k)));
}

function parseNeisSheet(rows) {
  const found = findNeisHeaderRow(rows);
  if (!found) return null;
  const { idx, header } = found;
  const col = {
    subject: findColByKeywords(header, ["과목명"]),
    grade: findColByKeywords(header, ["학년"]),
    ban: header.indexOf("반"),
    no: header.indexOf("번호"),
    name: header.indexOf("성명"),
    total: findColByKeywords(header, ["총", "수업시수"]),
    current: findColByKeywords(header, ["현재", "수업시수"]),
    attended: findColByKeywords(header, ["출석시수"]),
    missed: findColByKeywords(header, ["결과시수"]),
    completion: findColByKeywords(header, ["이수기준", "충족"])
  };
  if ([col.grade, col.no, col.name, col.current, col.attended].some(i => i === -1)) return null;

  const students = [];
  for (let r = idx + 1; r < rows.length; r++) {
    const row = rows[r];
    const name = (row[col.name] || "").toString().trim();
    if (!name) continue;
    const grade = (row[col.grade] || "").toString().trim();
    const ban = (row[col.ban] || "").toString().trim();
    const no = (row[col.no] || "").toString().trim();
    const subject = col.subject !== -1 ? (row[col.subject] || "").toString().trim() : "";
    const totalRaw = col.total !== -1 ? (row[col.total] || "").toString().trim() : "";
    const totalMatch = /^(\d+)(?:\((\d+)\))?/.exec(totalRaw);
    const totalNum = totalMatch ? Number(totalMatch[1]) : null;
    const creditNum = totalMatch && totalMatch[2] ? Number(totalMatch[2]) : totalNum;
    const current = Number((row[col.current] || "0").toString().trim()) || 0;
    const attended = Number((row[col.attended] || "0").toString().trim()) || 0;
    const missed = col.missed !== -1 ? (Number((row[col.missed] || "0").toString().trim()) || 0) : (current - attended);
    const completionText = col.completion !== -1 ? (row[col.completion] || "").toString().trim() : "";

    const rate = current > 0 ? attended / current : 1;
    let status = "정상";
    if (rate < 2 / 3) {
      status = "확정 미달";
    } else if (creditNum && current < creditNum) {
      const maxAllowed = creditNum - Math.ceil(creditNum * 2 / 3);
      const remaining = maxAllowed - missed;
      if (remaining <= 0) status = "위험";
    }
    if (completionText.includes("미충족")) {
      if (status === "정상") status = "위험";
    }

    students.push({ subject, grade, ban, no, name, total: totalRaw, current, attended, missed, rate, completionText, status });
  }
  return students;
}

// ---------- ⑦ 날짜별 출석률 랭킹 ----------
const rankingSelectedStudents = {}; // label -> Set(name)

function computeDateRanking(label) {
  const includeRecognized = document.getElementById("includeRecognized").checked;
  const resolved = resolveLabelStudents(label);
  if (!resolved || resolved.names.length === 0) return null;
  const slotsSel = activeSlotsForClass(label);
  if (slotsSel.length === 0) return null;

  const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  const YEAR = 2026;
  const dateStrToDate = s => { const [m, d] = s.split("/").map(Number); return new Date(m <= 2 ? YEAR + 1 : YEAR, m - 1, d); };

  const allCalendarDates = [];
  sheets.forEach(s => allCalendarDates.push(...s.calendarDates));
  function toIsoRank(dateStr) {
    const [m, d] = dateStr.split("/").map(Number);
    return `${m <= 2 ? YEAR + 1 : YEAR}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  const labelGrades = getLabelGrades(label);
  const pastCalendarDates = allCalendarDates.filter(d => {
    if (dateStrToDate(d.date) > TODAY) return false;
    const iso = toIsoRank(d.date);
    if (isDateOffForLabel(iso, labelGrades)) return false;
    return true;
  });

  // 학생별 이벤트 모으기 (반/번호 정보도 함께)
  const studentEvents = {};
  const studentInfo = {};
  const manualExcludedRank = getManualExcludedStudents();
  const withdrawnAutoRank = new Set();
  sheets.forEach(sheet => sheet.students.forEach(st => {
    if (resolved.names.includes(st.name) && isWithdrawnStudent(st.events)) withdrawnAutoRank.add(st.name);
  }));
  sheets.forEach(sheet => {
    sheet.students.forEach(st => {
      if (!resolved.names.includes(st.name)) return;
      if (manualExcludedRank.has(st.name)) return;
      if (withdrawnAutoRank.has(st.name)) return;
      if (!studentEvents[st.name]) studentEvents[st.name] = {};
      st.events.forEach(ev => { studentEvents[st.name][ev.date] = ev; });
      if (!studentInfo[st.name]) studentInfo[st.name] = { classLabel: st.classLabel || "", no: st.no || "", studentId: (resolved.ids && resolved.ids[st.name]) || st.studentId || "" };
    });
  });

  // 날짜 -> 그 날 해당하는 교시들
  const dateToPeriods = {};
  slotsSel.forEach(slot => {
    pastCalendarDates.filter(d => d.dow === slot.day).forEach(d => {
      if (!dateToPeriods[d.date]) dateToPeriods[d.date] = [];
      dateToPeriods[d.date].push(slot.period);
    });
  });

  // 학번 순으로 정렬 - 출결시트에서 아예 못 찾은 학생(전학 등)은 "항상 출석"으로 잘못 나오므로 제외
  const notFoundNames = resolved.names.filter(n => !(n in studentEvents) && !manualExcludedRank.has(n) && !withdrawnAutoRank.has(n));
  const names = resolved.names.filter(n => n in studentEvents).sort((a, b) => {
    const ia = studentInfo[a] || {}, ib = studentInfo[b] || {};
    if (ia.studentId && ib.studentId) return ia.studentId.localeCompare(ib.studentId);
    const cl = (ia.classLabel || "").localeCompare(ib.classLabel || "", "ko");
    if (cl !== 0) return cl;
    const na = Number(ia.no), nb = Number(ib.no);
    if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return na - nb;
    return a.localeCompare(b, "ko");
  });
  const dates = Object.keys(dateToPeriods).sort((a, b) => {
    const [am, ad] = a.split("/").map(Number), [bm, bd] = b.split("/").map(Number);
    return am - bm || ad - bd;
  });

  const dayResults = dates.map(date => {
    const periods = dateToPeriods[date];
    const present = [], absent = [];
    names.forEach(name => {
      const ev = (studentEvents[name] || {})[date];
      const missedAny = ev ? periods.some(p => isPeriodMissed(ev, p, includeRecognized)) : false;
      if (missedAny) absent.push(name); else present.push(name);
    });
    return { date, present, absent, rate: names.length > 0 ? present.length / names.length : 0 };
  });

  return { label, names, dayResults, studentInfo, notFoundNames, withdrawnAuto: [...withdrawnAutoRank] };
}

function renderRankingPanel(label) {
  const panel = document.getElementById("rankingPanel");
  panel.innerHTML = "";
  const data = computeDateRanking(label);
  if (!data) {
    panel.innerHTML = '<div class="empty-note">이 반은 시간표(①)에 설정된 요일·교시가 없거나 학생을 찾지 못했습니다.</div>';
    return;
  }
  if (!rankingSelectedStudents[label]) rankingSelectedStudents[label] = new Set();
  const selected = rankingSelectedStudents[label];

  if (data.notFoundNames && data.notFoundNames.length > 0) {
    const warn = document.createElement("div");
    warn.className = "error-box";
    warn.textContent = `명단에는 있으나 출결 시트에서 찾지 못한 학생(전학 등 - 랭킹·선택 목록에서 제외됨): ${data.notFoundNames.join(", ")}`;
    panel.appendChild(warn);
  }
  if (data.withdrawnAuto && data.withdrawnAuto.length > 0) {
    const warn = document.createElement("div");
    warn.className = "error-box";
    warn.textContent = `출결 사유에 자퇴/전출/전학이 감지되어 자동 제외된 학생: ${data.withdrawnAuto.join(", ")}`;
    panel.appendChild(warn);
  }

  const picker = document.createElement("div");
  picker.className = "student-picker";
  data.names.forEach(name => {
    const info = (data.studentInfo && data.studentInfo[name]) || {};
    const chip = document.createElement("span");
    chip.className = "student-chip" + (selected.has(name) ? " on" : "");
    chip.textContent = info.studentId ? `${info.studentId} ${name}` : (info.no ? `${info.no}번 ${name}` : name);
    chip.addEventListener("click", () => {
      if (selected.has(name)) selected.delete(name); else selected.add(name);
      renderRankingPanel(label);
    });
    picker.appendChild(chip);
  });
  panel.appendChild(picker);

  if (selected.size > 0) {
    const hint = document.createElement("div");
    hint.className = "checkbox-hint";
    hint.textContent = `선택한 ${selected.size}명이 전부 출석한 날만 표시합니다.`;
    panel.appendChild(hint);
  }

  let filtered = data.dayResults;
  if (selected.size > 0) {
    filtered = filtered.filter(d => [...selected].every(n => d.present.includes(n)));
  }

  const perfectDays = filtered.filter(d => d.rate === 1).map(d => d.date);
  const perfectBox = document.createElement("div");
  perfectBox.style.background = "#e5f3ea";
  perfectBox.style.border = "1px solid #bfe3cc";
  perfectBox.style.borderRadius = "8px";
  perfectBox.style.padding = "10px 14px";
  perfectBox.style.margin = "10px 0";
  perfectBox.style.fontSize = "13px";
  perfectBox.innerHTML = `<b style="color:#1f7a3f;">${label} 완전 출석일 (${perfectDays.length}일)</b><br>` +
    (perfectDays.length > 0 ? perfectDays.join(", ") : '<span style="color:#8a93a0;">해당 없음</span>') +
    `<div style="margin-top:6px; font-size:11px; color:#5b6472;">예방지도 출석부 채우기(이름+회차 날짜/O·X)는 ④의 "계산 없이 채우기" 버튼 하나로 한 번에 처리됩니다.</div>`;
  panel.appendChild(perfectBox);

  const sorted = [...filtered].sort((a, b) => b.rate - a.rate);

  if (sorted.length === 0) {
    const e = document.createElement("div");
    e.className = "empty-note";
    e.textContent = "조건에 맞는 날짜가 없습니다.";
    panel.appendChild(e);
    return;
  }

  sorted.forEach((d, i) => {
    const row = document.createElement("div");
    row.className = "rank-row";
    const num = document.createElement("span"); num.className = "rank-num"; num.textContent = (i + 1) + "위";
    const dateSpan = document.createElement("span"); dateSpan.className = "rank-date"; dateSpan.textContent = d.date;
    const track = document.createElement("div"); track.className = "gauge-track";
    const fill = document.createElement("div"); fill.className = "gauge-fill"; fill.style.width = (d.rate * 100).toFixed(0) + "%";
    track.appendChild(fill);
    const pct = document.createElement("span"); pct.className = "rank-pct"; pct.textContent = `${(d.rate*100).toFixed(0)}% (${d.present.length}/${data.names.length})`;
    row.appendChild(num); row.appendChild(dateSpan); row.appendChild(track); row.appendChild(pct);

    const detailBody = document.createElement("div");
    detailBody.style.display = "none";
    detailBody.style.marginTop = "8px";
    detailBody.style.marginBottom = "6px";
    detailBody.style.fontSize = "12px";
    detailBody.innerHTML = `
      <div style="color:#1f7a3f; margin-bottom:4px;"><b>출석(${d.present.length}명)</b>: ${d.present.join(", ") || "-"}</div>
      <div style="color:#b3261e;"><b>결시(${d.absent.length}명)</b>: ${d.absent.join(", ") || "-"}</div>
    `;
    row.addEventListener("click", () => {
      detailBody.style.display = detailBody.style.display === "none" ? "block" : "none";
    });

    const wrap = document.createElement("div");
    wrap.appendChild(row);
    wrap.appendChild(detailBody);
    panel.appendChild(wrap);
  });
}

function triggerRanking() {
  const area = document.getElementById("rankingArea");
  if (!area) return;
  const labels = [...new Set(Object.values(slotAssignment).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
  if (labels.length === 0) return;
  area.style.display = "";
  area.innerHTML = "";
  const tabs = document.createElement("div");
  tabs.className = "rank-tabs";
  labels.forEach((label, i) => {
    const btn = document.createElement("button");
    btn.className = "rank-tab-btn" + (i === 0 ? " active" : "");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      tabs.querySelectorAll(".rank-tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderRankingPanel(label);
    });
    tabs.appendChild(btn);
  });
  area.appendChild(tabs);
  const panel = document.createElement("div");
  panel.id = "rankingPanel";
  area.appendChild(panel);
  renderRankingPanel(labels[0]);
}



// ===== 파일 한 곳에 올리기: 내용을 보고 출결·명단·예방지도 출석부·나이스·학사력으로 알아서 나눔 =====
function sdtClassifyFile(file) {
  return new Promise(resolve => {
    if (/\.pdf$/i.test(file.name)) return resolve("academicCalDropzone");
    const decide = (sheetsRows, wb) => {
      try {
        // 나이스 과목별 수업일수 현황
        for (const rows of sheetsRows) { const f = findNeisHeaderRow(rows); if (f && f.header.some(h => /수업시수|출석시수|결과시수/.test(h))) return "neisDropzone"; }
        // 예방지도 출석부 양식
        if (wb) for (const sn of wb.SheetNames) { try { if (parsePreventionSheet(wb.Sheets[sn])) return "preventionDropzone"; } catch (e) {} }
        // 출결 시트 (날짜 칸이 있는 반별 출결)
        for (let i = 0; i < sheetsRows.length; i++) { try { const sh = parseSheet(sheetsRows[i], file.name); if (sh && sh.calendarDates && sh.calendarDates.length) return "sheetDropzone"; } catch (e) {} }
        // 나머지: 이름 목록이면 수강생 명단
        for (const rows of sheetsRows) { try { if (rowsToNames(rows).length) return "rosterDropzone"; } catch (e) {} }
      } catch (e) {}
      return null;
    };
    if (/\.(xlsx|xls)$/i.test(file.name)) {
      const r = new FileReader();
      r.onload = ev => {
        try {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
          const sr = wb.SheetNames.map(sn => XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: false }).map(row => row.map(c => (c === null || c === undefined) ? "" : String(c))));
          resolve(decide(sr, wb));
        } catch (e) { resolve(null); }
      };
      r.onerror = () => resolve(null);
      r.readAsArrayBuffer(file);
    } else {
      Papa.parse(file, { skipEmptyLines: false, encoding: "utf-8", complete: res => resolve(decide([res.data], null)), error: () => resolve(null) });
    }
  });
}
if (document.getElementById("allDropzone")) setupDropzone(document.getElementById("allDropzone"), document.getElementById("allFile"), async (fileList) => {
  const files = Array.from(fileList), groups = {}, bad = [];
  for (const f of files) { const z = await sdtClassifyFile(f); if (z) (groups[z] = groups[z] || []).push(f); else bad.push(f.name); }
  Object.keys(groups).forEach(z => { const fn = window.__dz && window.__dz[z]; if (fn) fn(groups[z]); });
  const el = document.getElementById("allErr");
  el.innerHTML = bad.map(n => `<div class="error-box">${escapeXmlText(n)} · 알 수 없는 파일</div>`).join("");
});
// 시간표에 반 번호(204 등)를 넣으면 수업일 학년을 자동으로 맞춤
function sdtAutoGrades() {
  const gs = new Set(Object.values(slotAssignment || {}).filter(Boolean).map(v => (/^\s*([1-3])\d{2}\s*$/.exec(String(v)) || [])[1]).filter(Boolean));
  if (!gs.size) return;
  let changed = false;
  [1, 2, 3].forEach(g => { const c = document.getElementById("grade" + g + "Check"); if (c && c.checked !== gs.has(String(g))) { c.checked = gs.has(String(g)); changed = true; } });
  if (changed) { try { buildClassDatesFromAcademic(ACADEMIC_CAL); renderCalendarMonth(); saveSettings(); } catch (e) {} }
}
document.getElementById("timetable").addEventListener("change", sdtAutoGrades);

// ===== 공통과목 / 선택과목: 고르면 시간표에 넣을 것(반 / 수강반)과 필요한 파일 칸이 바뀜 =====
const CSB_KIND_KEY = "csb_kind_v1";
function csbSetKind(k) {
  document.body.dataset.kind = k;
  try { localStorage.setItem(CSB_KIND_KEY, k); } catch (e) {}
  document.querySelectorAll(".kind-btn").forEach(b => b.classList.toggle("on", b.dataset.kind === k));
  const cap = document.getElementById("ttCap"); if (cap) cap.textContent = k === "common" ? "수업 들어가는 칸에 반 번호를 쓰세요 (예: 2학년 4반 → 204)" : "수업 들어가는 칸에 수강반을 쓰세요 (예: A반 → A)";
  document.querySelectorAll("#timetable .slot-select").forEach(i => { i.placeholder = ""; });
  const tiles = document.querySelector(".tiles"); if (tiles) tiles.style.gridTemplateColumns = "";
}
document.querySelectorAll(".kind-btn").forEach(b => b.addEventListener("click", () => csbSetKind(b.dataset.kind)));
(function () {
  let k = null; try { k = localStorage.getItem(CSB_KIND_KEY); } catch (e) {}
  if (!k) { const v = Object.values(slotAssignment || {}).filter(Boolean); k = v.length && v.every(x => !/^\s*\d{3}\s*$/.test(x)) ? "elective" : "common"; }
  csbSetKind(k);
})();

// ===== 필요한 파일 확인: 시간표에 쓴 반·수강반마다 출결/명단이 올라왔는지 칩으로 보여 줌 =====
function csbLabels() { return [...new Set(Object.values(slotAssignment || {}).filter(Boolean).map(v => String(v).trim()))].sort((a, b) => a.localeCompare(b, "ko")); }
function csbNeedsRender() {
  const kind = document.body.dataset.kind || "common";
  const labs = csbLabels();
  const have = new Set(sheets.map(s => s.classLabel).filter(Boolean));
  const ns = document.getElementById("needSheet"), nr = document.getElementById("needRoster");
  const short = h => h.replace(/학년\s*/, "-").replace("반", "");
  if (ns) {
    if (kind === "common") ns.innerHTML = labs.map(l => { const h = normalizeHomeroomInput(l); const ok = h && have.has(h); return `<span class="${ok ? "ok" : ""}">${escapeXmlText(h ? short(h) : l)}</span>`; }).join("");
    else ns.innerHTML = [...have].sort((a, b) => a.localeCompare(b, "ko")).map(h => `<span class="ok">${escapeXmlText(short(h))}</span>`).join("");
  }
  if (nr) nr.innerHTML = kind === "elective" ? labs.map(l => { const ok = rosterFiles.some(f => [l, l + "반"].map(x => x.toLowerCase()).includes(String(f.label).toLowerCase())); return `<span class="${ok ? "ok" : ""}">${escapeXmlText(/반$/.test(l) ? l : l + "반")}</span>`; }).join("") : "";
}
(function () {
  const wrap = name => { const f = window[name]; if (typeof f !== "function") return; window[name] = function () { const r = f.apply(this, arguments); try { csbNeedsRender(); } catch (e) {} return r; }; };
  ["renderFileList", "renderRosterList"].forEach(wrap);
  document.getElementById("timetable").addEventListener("input", () => { try { csbNeedsRender(); } catch (e) {} });
  document.querySelectorAll(".kind-btn").forEach(b => b.addEventListener("click", () => { try { csbNeedsRender(); } catch (e) {} }));
  try { csbNeedsRender(); } catch (e) {}
})();
// ===== 결과: 오른쪽 한 화면 — 2/3 미만 · 위험 · 전원 출석한 날 + 학생 표 =====
function csbLabelName(l) { return /^\d{3}$/.test(l) ? l[0] + "-" + Number(l.slice(1)) : (/반$/.test(l) ? l : l + "반"); }
function csbRenderResult(rows) {
  const esc = escapeXmlText, id = r => formatStudentTag(r);
  const fail = rows.filter(r => r.status === "확정 미달"), warn = rows.filter(r => r.status === "위험");
  document.getElementById("stFail").textContent = fail.length + "명";
  document.getElementById("stWarn").textContent = warn.length + "명";
  document.getElementById("stFailL").innerHTML = fail.map(r => `<span>${esc(id(r))}</span>`).join("");
  document.getElementById("stWarnL").innerHTML = warn.map(r => `<span>${esc(id(r))}</span>`).join("");
  // 전원 출석한 날
  let total = 0; const parts = [];
  csbLabels().forEach(l => {
    let r = null; try { r = computeDateRanking(l); } catch (e) {}
    if (!r || !r.dayResults || !r.dayResults.length) return;
    const full = r.dayResults.filter(d => d.rate === 1);
    total += full.length;
    if (full.length) parts.push(`<span><b>${esc(csbLabelName(l))}</b> ${full.map(d => esc(d.date)).join(" · ")}</span>`);
    else { const best = [...r.dayResults].sort((a, b) => b.rate - a.rate)[0]; if (best) parts.push(`<span class="part"><b>${esc(csbLabelName(l))}</b> 없음 · ${esc(best.date)} 결석 ${best.absent.length}</span>`); }
  });
  document.getElementById("stDays").textContent = total + "일";
  document.getElementById("stDaysL").innerHTML = parts.join("");
  // 학생 표
  const ord = { "확정 미달": 0, "위험": 1, "정상": 2 };
  const sorted = [...rows].sort((a, b) => (ord[a.status] - ord[b.status]) || (a.status !== "정상" ? a.rate - b.rate : 0) || id(a).localeCompare(id(b), "ko", { numeric: true }));
  const multi = new Set(rows.map(r => r.courseSection).filter(Boolean)).size > 1;
  document.getElementById("csbTbl").innerHTML = rows.length ? `<table><thead><tr>${multi ? "<th>반</th>" : ""}<th>학번</th><th>이름</th><th>출석</th><th>출석률</th><th>상태</th><th>결시</th></tr></thead><tbody>${sorted.map(r => {
    const cls = r.status === "확정 미달" ? "fail" : r.status === "위험" ? "warn" : "";
    const pct = Math.round((r.rate || 0) * 1000) / 10;
    const sid = id(r).replace(/^.* · /, "").replace(new RegExp("\\s*" + r.name + "$"), "");
    return `<tr class="${cls}">${multi ? `<td>${esc(csbLabelName(r.courseSection || ""))}</td>` : ""}<td>${esc(sid)}</td><td><b>${esc(r.name)}</b></td><td>${r.attended}/${r.totalSessions}</td><td><span class="bar"><i style="width:${Math.min(100, pct)}%"></i></span>${pct}%</td><td>${r.status === "확정 미달" ? "2/3 미만" : r.status}</td><td class="miss" title="${esc((r.missedDetail || []).join("\n"))}">${esc((r.missedDetail || []).slice(0, 4).join(", "))}${(r.missedDetail || []).length > 4 ? " …" : ""}</td></tr>`;
  }).join("")}</tbody></table>` : `<div class="empty-big">학생 없음</div>`;
  // 원래 결과 화면의 경고·출석부 채우기 버튼을 오른쪽으로 옮김
  const src = document.getElementById("resultArea");
  const warns = document.getElementById("csbWarns"), acts = document.getElementById("csbActs");
  warns.innerHTML = ""; acts.innerHTML = "";
  src.querySelectorAll(".error-box").forEach(e => warns.appendChild(e));
  src.querySelectorAll("button").forEach(btn => { if (/채우기/.test(btn.textContent)) { btn.removeAttribute("style"); btn.className = ""; acts.appendChild(btn); } });
}
(function () {
  const f = window.renderResult; if (typeof f !== "function") return;
  window.renderResult = function (subjectName, rows) { const r = f.apply(this, arguments); try { csbRenderResult(rows || []); } catch (e) { console.error(e); } return r; };
})();

// 계산 전 오류·출석부 채우기 완료 알림도 오른쪽에 보이게 (원래 결과 칸은 숨김)
(function () {
  const src = document.getElementById("resultArea"), warns = document.getElementById("csbWarns");
  if (!src || !warns || !window.MutationObserver) return;
  new MutationObserver(() => { src.querySelectorAll(":scope > .error-box, .result-note[style]").forEach(e => { e.removeAttribute("style"); warns.prepend(e); }); }).observe(src, { childList: true, subtree: true });
})();

// 예방지도일 후보에서 행사일 빼기 — 체육대회·현장체험·학교주도활동·축제·방학식 등은 수업이 아니어서 다 출석해도 지도일로 못 씀
// (시험·모의고사는 학사력에서 이미 수업 없는 날로 빠짐) 학년 표시 "(1,2)"가 있으면 그 학년에만 적용
const CSB_EVENT_RE = /(체육|한마당|현장체험|학교주도|자율과정|향남제|축제|방학식|종업식|졸업식|입학식|개학식)[^\s(]*\s*(?:\(([\d,\s]+)\))?/g;
function csbIsEventDay(iso, grades) {
  const ent = (typeof ACADEMIC_CAL === "object" && ACADEMIC_CAL && ACADEMIC_CAL[iso]) || null;
  const text = (ent && ent.text) || (typeof DATE_REASONS === "object" && DATE_REASONS[iso]) || "";
  if (!text) return false;
  let m; CSB_EVENT_RE.lastIndex = 0;
  while ((m = CSB_EVENT_RE.exec(text))) {
    if (!m[2]) return true;
    const gs = m[2].split(",").map(x => Number(x.trim())).filter(Boolean);
    if (!grades || !grades.length || grades.some(g => gs.includes(g))) return true;
  }
  return false;
}
(function () {
  const orig = computeDateRanking;
  computeDateRanking = function (label) {
    const r = orig.apply(this, arguments);
    if (!r || !r.dayResults) return r;
    let grades = []; try { grades = getLabelGrades(label) || []; } catch (e) {}
    r.dayResults = r.dayResults.filter(d => {
      const mm = /(\d+)\/(\d+)/.exec(d.date); if (!mm) return true;
      const mo = Number(mm[1]), iso = (mo <= 2 ? 2027 : 2026) + "-" + String(mo).padStart(2, "0") + "-" + String(mm[2]).padStart(2, "0");
      return !csbIsEventDay(iso, grades);
    });
    return r;
  };
})();
