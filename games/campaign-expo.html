<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤리문제 캠페인 박람회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#F5F5F7;--card:#fff;--ink:#1D1D1F;--sub:#6E6E73;--faint:#86868B;--line:#E5E5EA;--field:#F2F2F5;--blue:#0071E3;--red:#FF375F;--green:#1d8a3a;--r:22px}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 120px}
  button{font-family:inherit;letter-spacing:inherit}
  .hero{text-align:center;padding:44px 8px 26px}
  .eyebrow{font-size:14px;font-weight:600;color:var(--sub);margin:0 0 8px}
  .hero h1{font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.035em;margin:0}
  .hero p{font-size:17px;color:var(--sub);margin:14px auto 0;max-width:600px;line-height:1.55}
  .stats{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--sub)}
  .pill b{color:var(--ink)}
  .pill.dark{background:var(--ink);color:#fff}.pill.dark b{color:#fff}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
  .seg{display:flex;gap:2px;padding:3px;background:#E3E3E8;border-radius:12px;flex-wrap:wrap}
  .seg button{height:34px;padding:0 14px;font-size:14px;font-weight:600;border-radius:9px;border:0;background:transparent;color:var(--sub);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sp{flex:1}
  .btn{height:40px;padding:0 18px;font-size:14.5px;font-weight:600;border-radius:999px;border:0;background:#E8E8ED;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn.pri{background:var(--blue);color:#fff}
  .btn.sm{height:32px;padding:0 13px;font-size:13px}
  .btn.danger{background:#FFE5EA;color:#C1123B}
  .btn:disabled{opacity:.45;cursor:default}
  .mine{background:var(--card);border-radius:var(--r);padding:22px 24px;margin:0 0 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .mine .t{flex:1;min-width:220px}
  .mine h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
  .mine p{margin:0;color:var(--sub);font-size:14.5px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.08)}
  .cover{aspect-ratio:4/3;background:linear-gradient(135deg,#EDEDF2,#F7F7FA);display:flex;align-items:center;justify-content:center;color:#B0B0B8;font-size:13px;font-weight:600;overflow:hidden;position:relative}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .n{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
  .cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .who{font-size:12.5px;font-weight:700;color:var(--blue)}
  .card h3{font-size:17px;line-height:1.3;margin:0;letter-spacing:-.02em}
  .card .sl{font-size:13.5px;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:12px;font-size:13px;color:var(--faint);font-weight:600;margin-top:auto;padding-top:6px;align-items:center}
  .meta .on{color:var(--red)}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E8F2FD;color:#0B5CAD;margin-left:4px}
  .tag.v{background:#FFF0D6;color:#9A5B00}
  .empty{text-align:center;color:var(--faint);padding:60px 10px;font-size:15px;background:var(--card);border-radius:var(--r)}
  /* 모달 */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:28px 12px}
  .modal{background:var(--card);border-radius:26px;width:100%;max-width:820px;overflow:hidden;position:relative}
  .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;z-index:2}
  .gal{background:#111;position:relative}
  .gal img{width:100%;max-height:70vh;object-fit:contain;display:block}
  .gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px;cursor:pointer}
  .gal .prev{left:12px}.gal .next{right:12px}
  .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.dots i.on{background:#fff}
  .vid{aspect-ratio:16/9;width:100%;border:0;display:block;background:#000}
  .mb{padding:22px 26px 26px}
  .mb h2{font-size:26px;margin:4px 0 6px;letter-spacing:-.025em;line-height:1.25}
  .mb .slg{font-size:16px;color:var(--sub);margin:0 0 16px}
  .kv{margin:0 0 14px}
  .kv dt{font-size:12.5px;font-weight:700;color:var(--faint);margin-bottom:3px}
  .kv dd{margin:0;font-size:15px;line-height:1.6;white-space:pre-wrap}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
  .like{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
  .like.on{background:#FFF0F3;border-color:#FFC2CF;color:var(--red)}
  .vote{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .vote.on{background:#FFF6E5;border-color:#FFD48A;color:#9A5B00}
  .cm h4{font-size:15px;margin:0 0 10px}
  .cmi{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
  .cmi b{white-space:nowrap;font-size:13.5px}
  .cmi .del{margin-left:auto;border:0;background:none;color:#C1123B;font-size:12.5px;cursor:pointer}
  .cmf{display:flex;gap:8px;margin-top:10px}
  .in,.ta{width:100%;border:1px solid transparent;border-radius:12px;background:var(--field);font:inherit;font-size:15px;padding:11px 14px;color:var(--ink)}
  .in:focus,.ta:focus{outline:none;background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.14)}
  .ta{resize:vertical;min-height:80px;line-height:1.55}
  .fl{display:block;font-size:13.5px;font-weight:700;margin:14px 0 6px}
  .fl small{font-weight:500;color:var(--faint);margin-left:6px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumbs div{width:92px;height:92px;border-radius:12px;overflow:hidden;position:relative;background:var(--field)}
  .thumbs img{width:100%;height:100%;object-fit:cover}
  .thumbs button{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px}
  .add{width:92px;height:92px;border-radius:12px;border:2px dashed #C9C9D0;background:#fff;color:var(--faint);font-size:28px;cursor:pointer}
  .msg{font-size:13.5px;color:var(--sub);margin-top:10px}.msg.err{color:#C1123B;font-weight:600}
  .panel{background:var(--card);border-radius:var(--r);padding:22px 24px;margin:26px 0 0}
  .panel h2{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .panel>p{margin:0 0 6px;color:var(--sub);font-size:14.5px;line-height:1.55}
  .rank{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:10px}
  .rank td,.rank th{padding:9px 8px;border-top:1px solid var(--line);text-align:left}
  .rank th{font-size:12.5px;color:var(--faint);font-weight:700}
  .ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sw{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600}
  .sw input{width:18px;height:18px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  @media (max-width:640px){.hero h1{font-size:32px}.mb{padding:18px}.mb h2{font-size:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card h3{font-size:15px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty" style="margin-top:60px">불러오는 중…</div></div>
<script type="application/json" id="sdt-quiz">[]</script>
<script>
/* 윤리문제 캠페인 박람회 (3차 수행평가 후속, 2026-11-10)
   - 모든 반의 모둠 캠페인을 한 곳에서 둘러봄. 모둠당 부스 1개(조장이 만들고 조원도 함께 고칠 수 있음)
   - 관람: 좋아요·응원 댓글, 최고의 캠페인 투표(기본 1인 3표, 자기 모둠 제외), 관람 소감(학습지 제출 → 선생님만 봄, 세특 참고)
   - 모둠·조장 정보는 3차 수행평가 학습지(data-ws-grade="campaign3")의 '모둠 이름'·'조장/조원'에서 가져옴
   - 이미지는 Storage(files 버킷)에 줄여서 올리고 DB에는 주소만 — DB 부하 최소화(2026-11-10 과부하 교훈). 목록은 1분마다만 새로 읽음
   - 설정(부스 올리기·투표 열기·결과 공개)은 싯다르타 연결 파일의 sdt-quiz에 저장(선생님 화면에서) */
const SB_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co';
const SB_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const PUB=SB_URL+'/storage/v1/object/public/files/';
let sbc=null;function sb(){if(!sbc&&window.supabase)sbc=window.supabase.createClient(SB_URL,SB_KEY);return sbc;}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=v=>String(v||'').trim().length>0;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}

let ID=null,MODE='pending',CFG={post:'on',vote:'off',reveal:'off',votes:3,src:0};
let BOOTHS=[],MYLIKES=new Set(),MYVOTES=new Set(),VOTECNT={},ME={cls:'',grp:'',pos:'',src:null},FILTER='all',SORT='new',OPEN=null,GAL=0;
let REFL={fav:'',why:'',pledge:''},SUBMITTED=false;

/* ---------- 설정 (sdt-quiz) ---------- */
function readCfg(html){
  const c={post:'on',vote:'off',reveal:'off',votes:3,src:0};
  try{let txt;if(html){const m=String(html).match(/<script type="application\/json" id="sdt-quiz">([\s\S]*?)<\/script>/);txt=m&&m[1];}else txt=$('sdt-quiz').textContent;
    (JSON.parse(txt||'[]')||[]).forEach(o=>{const v=(o.a||[])[0];if(o.q==='__expo_post')c.post=v;if(o.q==='__expo_vote')c.vote=v;if(o.q==='__expo_reveal')c.reveal=v;if(o.q==='__expo_votes')c.votes=Math.max(1,Math.min(5,+v||3));if(o.q==='__expo_src')c.src=+v||0;});}catch(e){}
  return c;
}
function cfgList(c){return [{q:'__expo_post',a:[c.post]},{q:'__expo_vote',a:[c.vote]},{q:'__expo_reveal',a:[c.reveal]},{q:'__expo_votes',a:[String(c.votes)]},{q:'__expo_src',a:[String(c.src||0)]}];}
async function refreshCfg(){
  if(!ID||!ID.worksheetId)return;
  try{const{data}=await sb().from('worksheets').select('custom_html').eq('id',ID.worksheetId).maybeSingle();if(data)CFG=readCfg(data.custom_html);}catch(e){}
}
let cfgWait=null;
function saveCfg(next){
  return new Promise(res=>{cfgWait=d=>{cfgWait=null;if(d.ok)CFG=next;res(!!d.ok);if(!d.ok)toast('저장하지 못했어요: '+(d.msg||''));};
    try{parent.postMessage({type:'sdt_quiz_save',list:cfgList(next)},'*');}catch(e){}
    setTimeout(()=>{if(cfgWait){cfgWait=null;res(false);toast('응답이 없어요. 싯다르타에서 선생님으로 들어왔는지 확인해 주세요.');}},8000);});
}

/* ---------- 시작 ---------- */
window.addEventListener('message',ev=>{
  const d=ev.data;if(!d)return;
  if(d.type==='sittdartha_identity'&&MODE==='pending')boot(d);
  if(d.type==='sdt_quiz_saved'&&cfgWait)cfgWait(d);
  if(d.type==='sittdartha_ws_submit_result'){if(d.ok){SUBMITTED=true;toast('관람 소감을 제출했어요');render();}else toast('제출하지 못했어요. 다시 눌러 주세요.');}
});
setTimeout(()=>{if(MODE==='pending'){MODE='preview';ID={worksheetId:null,student:{name:'미리보기'}};render();}},4000);
function gnorm(t){t=String(t||'').trim();if(!t)return '';const m=t.match(/(\d+)\s*모둠/)||t.match(/^(\d+)/);return m?m[1]+'모둠':t.slice(0,20);}
async function boot(d){
  ID=d;CFG=readCfg();
  MODE=d.staff?'staff':(d.preview||!d.teacherId)?'preview':'student';
  if(MODE==='student'){
    ME.cls=String((d.student&&d.student.class)||'').trim();
    try{const f=(d.prevAnswers&&d.prevAnswers.fields)||{};REFL={fav:f.fav||'',why:f.why||'',pledge:f.pledge||''};}catch(e){}
    SUBMITTED=!!d.readonly;
  }
  await refreshCfg();
  await findSrc();
  if(MODE==='student')await loadMe();
  await loadAll();render();
  setInterval(async()=>{if(document.hidden||OPEN)return;await refreshCfg();await loadAll();render();},55000+Math.random()*15000);
}
// 3차 수행평가 학습지(모둠·조장 정보) 찾기: 설정에 정해 둔 번호가 없으면 같은 선생님 학습지 중 data-ws-grade="campaign3"
async function findSrc(){
  if(CFG.src){ME.src=CFG.src;return;}
  if(!ID||!ID.teacherId)return;
  try{const{data}=await sb().from('worksheets').select('id,created_at').eq('user_id',ID.teacherId).ilike('custom_html','%data-ws-grade="campaign3"%').order('created_at',{ascending:false}).limit(1);
    if(data&&data[0])ME.src=data[0].id;}catch(e){}
}
async function loadMe(){
  if(!ME.src||!ID.student||ID.student.id==null)return;
  try{const{data}=await sb().from('worksheet_submissions').select('answers').eq('worksheet_id',ME.src).eq('student_id',ID.student.id).maybeSingle();
    const f=(data&&data.answers&&data.answers.fields)||{};ME.grp=gnorm(f.team);ME.pos=f.myPos||'';ME.f=f;}catch(e){}
}
async function loadAll(){
  if(!ID||!ID.worksheetId)return;
  try{
    const{data,error}=await sb().from('expo_booths').select('id,class_name,group_name,title,slogan,issue,action,body,media,video,owner_student_id,updated_by,created_at,updated_at,expo_likes(count),expo_comments(count)').eq('worksheet_id',ID.worksheetId);
    if(!error)BOOTHS=(data||[]).map(b=>Object.assign(b,{likes:(b.expo_likes&&b.expo_likes[0]&&b.expo_likes[0].count)||0,comments:(b.expo_comments&&b.expo_comments[0]&&b.expo_comments[0].count)||0}));
    if(MODE==='student'&&ID.student&&ID.student.id!=null){
      const ids=BOOTHS.map(b=>b.id);
      if(ids.length){const{data:lk}=await sb().from('expo_likes').select('booth_id').eq('student_id',ID.student.id).in('booth_id',ids);MYLIKES=new Set((lk||[]).map(x=>x.booth_id));}
      const{data:vt}=await sb().from('expo_votes').select('booth_id').eq('worksheet_id',ID.worksheetId).eq('student_id',ID.student.id);MYVOTES=new Set((vt||[]).map(x=>x.booth_id));
    }
    if(MODE==='staff'||CFG.reveal==='on'){
      const{data:all}=await sb().from('expo_votes').select('booth_id').eq('worksheet_id',ID.worksheetId);
      VOTECNT={};(all||[]).forEach(v=>VOTECNT[v.booth_id]=(VOTECNT[v.booth_id]||0)+1);
    }
  }catch(e){}
}

/* ---------- 화면 ---------- */
function myBooth(){return BOOTHS.find(b=>b.class_name===ME.cls&&b.group_name===ME.grp);}
function isMine(b){return MODE==='student'&&ME.grp&&b.class_name===ME.cls&&b.group_name===ME.grp;}
function cover(b){const m=(b.media||[]).find(x=>x.type==='img');return m?`<img src="${esc(m.url)}" alt="" loading="lazy">${(b.media||[]).length>1?`<span class="n">${(b.media||[]).length}장</span>`:''}`:(has(b.video)?'영상 캠페인':'아직 사진이 없어요');}
function render(){
  const app=$('app');
  const classes=[...new Set(BOOTHS.map(b=>b.class_name).concat((ID&&ID.classes)||[]))].filter(Boolean).sort();
  let list=BOOTHS.filter(b=>FILTER==='all'||b.class_name===FILTER);
  list.sort(SORT==='like'?(a,b)=>b.likes-a.likes||b.comments-a.comments:(a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));
  const left=CFG.votes-MYVOTES.size;
  let h=`<header class="hero"><p class="eyebrow">2026학년도 2학기 · 윤리문제 탐구</p><h1>윤리문제 캠페인 박람회</h1>
    <p>우리 지역과 학교의 윤리문제를 알리는 친구들의 캠페인을 둘러보고, 응원하고, 가장 마음을 움직인 캠페인에 투표해 보세요.</p>
    <div class="stats"><span class="pill">부스 <b>${BOOTHS.length}</b></span><span class="pill">좋아요 <b>${BOOTHS.reduce((s,b)=>s+b.likes,0)}</b></span><span class="pill">응원 댓글 <b>${BOOTHS.reduce((s,b)=>s+b.comments,0)}</b></span>
    ${CFG.vote==='on'&&MODE==='student'?`<span class="pill dark">남은 투표 <b>${Math.max(0,left)}</b> / ${CFG.votes}</span>`:''}</div></header>`;
  if(MODE==='staff')h+=staffPanel();
  if(MODE==='student')h+=minePanel();
  h+=`<div class="bar"><div class="seg">${['all',...classes].map(c=>`<button class="${FILTER===c?'on':''}" onclick="FILTER='${esc(c)}';render()">${c==='all'?'전체':esc(c)}</button>`).join('')}</div><span class="sp"></span>
    <div class="seg"><button class="${SORT==='new'?'on':''}" onclick="SORT='new';render()">최신순</button><button class="${SORT==='like'?'on':''}" onclick="SORT='like';render()">좋아요순</button></div></div>`;
  h+=list.length?`<div class="grid">${list.map(b=>`<div class="card" onclick="openBooth(${b.id})"><div class="cover">${cover(b)}</div><div class="cbody">
      <div class="who">${esc(b.class_name)} · ${esc(b.group_name)}${isMine(b)?'<span class="tag">우리 모둠</span>':''}${MYVOTES.has(b.id)?'<span class="tag v">투표함</span>':''}</div>

function ytId(u){const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);return m&&m[1];}
let cmTimer=null;
async function openBooth(id){
  const b=BOOTHS.find(x=>x.id===id);if(!b)return;OPEN=id;GAL=0;
  const imgs=(b.media||[]).filter(x=>x.type==='img'),yt=ytId(b.video);
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.onclick=e=>{if(e.target===ov)closeBooth();};

    ${imgs.length?`<div class="gal" id="gal"></div>`:''}${yt?`<iframe class="vid" src="https://www.youtube-nocookie.com/embed/${esc(yt)}" allowfullscreen></iframe>`:''}

      ${has(b.video)&&!yt?`<p><a href="${/^https?:/i.test(b.video)?esc(b.video):'#'}" target="_blank" rel="noopener" class="btn sm" style="display:inline-flex;align-items:center;text-decoration:none">영상 보러 가기 ↗</a></p>`:''}

      ${has(b.action)?`<dl class="kv"><dt>이렇게 해 주세요</dt><dd>${esc(b.action)}</dd></dl>`:''}
      ${has(b.body)?`<dl class="kv"><dt>캠페인 소개</dt><dd>${esc(b.body)}</dd></dl>`:''}
      <div class="acts" id="acts"></div>
      <div class="cm"><h4>응원 댓글</h4><div id="cmList"><p class="msg">불러오는 중…</p></div>

function closeBooth(){const o=$('ov');if(o)o.remove();document.body.style.overflow='';OPEN=null;clearInterval(cmTimer);render();}
function galDraw(){

  g.innerHTML=`<img src="${esc(imgs[GAL].url)}" alt="">${imgs.length>1?`<button class="nav prev" onclick="GAL=(GAL+${imgs.length}-1)%${imgs.length};galDraw()">‹</button><button class="nav next" onclick="GAL=(GAL+1)%${imgs.length};galDraw()">›</button><div class="dots">${imgs.map((_,i)=>`<i class="${i===GAL?'on':''}"></i>`).join('')}</div>`:''}`;
}
function actsDraw(){
  const b=BOOTHS.find(x=>x.id===OPEN),a=$('acts');if(!b||!a)return;
  let h='';
  if(MODE==='student'){
    h+=`<button class="like ${MYLIKES.has(b.id)?'on':''}" onclick="likeToggle(${b.id})">♥ ${b.likes}</button>`;
    if(CFG.vote==='on'&&!isMine(b))h+=`<button class="vote ${MYVOTES.has(b.id)?'on':''}" onclick="voteToggle(${b.id})">${MYVOTES.has(b.id)?'🏆 투표 취소':'🏆 최고의 캠페인에 투표'}</button>`;
    if(isMine(b)&&CFG.post==='on')h+=`<button class="btn" onclick="closeBooth();editBooth(${b.id})">함께 고치기</button>`;
  }else h+=`<span class="pill">♥ ${b.likes}</span>`;

async function likeToggle(id){
  const b=BOOTHS.find(x=>x.id===id);if(!b||!ID.student)return;const sid=ID.student.id,on=MYLIKES.has(id);
  if(on){MYLIKES.delete(id);b.likes--;}else{MYLIKES.add(id);b.likes++;}actsDraw();
  try{const r=on?await sb().from('expo_likes').delete().eq('booth_id',id).eq('student_id',sid):await sb().from('expo_likes').insert({booth_id:id,student_id:sid});if(r.error&&!/duplicate/.test(r.error.message))throw r.error;}
  catch(e){if(on){MYLIKES.add(id);b.likes++;}else{MYLIKES.delete(id);b.likes--;}actsDraw();toast('지금은 반영하지 못했어요');}
}
async function voteToggle(id){
  if(!ID.student)return;const sid=ID.student.id,on=MYVOTES.has(id);
  if(!on&&MYVOTES.size>=CFG.votes){toast(`투표는 ${CFG.votes}표까지예요. 다른 투표를 취소하면 옮길 수 있어요.`);return;}
  try{const r=on?await sb().from('expo_votes').delete().eq('worksheet_id',ID.worksheetId).eq('student_id',sid).eq('booth_id',id):await sb().from('expo_votes').insert({worksheet_id:ID.worksheetId,student_id:sid,booth_id:id});if(r.error)throw r.error;
    if(on)MYVOTES.delete(id);else MYVOTES.add(id);actsDraw();toast(on?'투표를 취소했어요':`투표했어요 · 남은 ${CFG.votes-MYVOTES.size}표`);}
  catch(e){toast('지금은 반영하지 못했어요');}
}
async function cmLoad(){
  const l=$('cmList');if(!l||!OPEN)return;
  try{const{data}=await sb().from('expo_comments').select('id,student_id,name,text,created_at').eq('booth_id',OPEN).order('created_at',{ascending:true}).limit(200);
    l.innerHTML=(data||[]).length?(data||[]).map(c=>`<div class="cmi"><b>${esc(c.name)}</b><span>${esc(c.text)}</span>${MODE==='staff'||(MODE==='student'&&ID.student&&c.student_id===ID.student.id)?`<button class="del" onclick="cmDel(${c.id})">삭제</button>`:''}</div>`).join(''):'<p class="msg">첫 응원을 남겨 주세요.</p>';
    const b=BOOTHS.find(x=>x.id===OPEN);if(b)b.comments=(data||[]).length;}catch(e){}
}
async function cmSend(){
  const i=$('cmIn');const t=String(i&&i.value||'').trim();if(!t||!ID.student)return;
  i.disabled=true;
  try{const{error}=await sb().from('expo_comments').insert({booth_id:OPEN,student_id:ID.student.id,name:`${ID.student.class||''} ${ID.student.name||''}`.trim(),text:t.slice(0,150)});if(error)throw error;i.value='';await cmLoad();}
  catch(e){toast('댓글을 남기지 못했어요');}finally{i.disabled=false;i.focus();}
}
async function cmDel(id){if(!confirm('이 댓글을 삭제할까요?'))return;try{await sb().from('expo_comments').delete().eq('id',id);}catch(e){}cmLoad();}
async function boothDel(id){if(!confirm('이 부스를 삭제할까요? 사진·좋아요·댓글·투표가 모두 지워지고 되돌릴 수 없어요.'))return;

  ED=b?{id:b.id,title:b.title,slogan:b.slogan,issue:b.issue,action:b.action,body:b.body,video:b.video,media:(b.media||[]).slice()}
      :{id:0,title:f.slogan||'',slogan:f.message||'',issue:f.issue||'',action:f.action||'',body:'',video:'',media:[]};

  document.body.appendChild(ov);document.body.style.overflow='hidden';edThumbs();

function edClose(){const o=$('ov');if(o)o.remove();document.body.style.overflow='';ED=null;}
function edThumbs(){const t=$('eThumbs');if(!t||!ED)return;
  t.innerHTML=ED.media.filter(m=>m.type==='img').map((m,i)=>`<div><img src="${esc(m.url)}" alt=""><button onclick="ED.media.splice(${i},1);edThumbs()">✕</button></div>`).join('')+(ED.media.length<6?`<button class="add" onclick="$('eFile').click()">＋</button>`:'');}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=1600,s=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('변환 실패')),'image/jpeg',0.84);};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('이미지를 읽지 못했어요'));};img.src=u;});}
async function edFiles(files){
  const msg=$('eMsg');const list=[...files].slice(0,6-ED.media.length);if(!list.length)return;
  for(let i=0;i<list.length;i++){
    msg.className='msg';msg.textContent=`사진 올리는 중… ${i+1}/${list.length}`;
    try{const blob=await shrink(list[i]);const path=`expo/${ID.worksheetId}/${Date.now()}_${Math.random().toString(36).slice(2,9)}.jpg`;  // 한글 없이(주소 깨짐 방지)
      const{error}=await sb().storage.from('files').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;
      ED.media.push({type:'img',url:PUB+path});edThumbs();}
    catch(e){msg.className='msg err';msg.textContent='사진을 올리지 못했어요: '+(e.message||e);return;}
  }
  msg.textContent='';$('eFile').value='';
}
async function edSave(){
  const v=id=>String(($(id)||{}).value||'').trim();
  const row={worksheet_id:ID.worksheetId,class_name:ME.cls,group_name:ME.grp,title:v('eTitle'),slogan:v('eSlogan'),issue:v('eIssue'),action:v('eAction'),body:v('eBody'),video:v('eVideo'),media:ED.media,updated_by:ID.student.name||'',updated_at:new Date().toISOString()};
  const msg=$('eMsg');if(!row.title){msg.className='msg err';msg.textContent='캠페인 제목을 적어 주세요';return;}
  if(!ED.media.length&&!row.video&&!confirm('사진이나 영상 없이 부스를 열까요? 나중에 추가할 수 있어요.'))return;
  $('eSave').disabled=true;msg.className='msg';msg.textContent='저장하는 중…';
  try{let r;if(ED.id)r=await sb().from('expo_booths').update(row).eq('id',ED.id);
    else{row.owner_student_id=ID.student.id;r=await sb().from('expo_booths').upsert(row,{onConflict:'worksheet_id,class_name,group_name'});}
    if(r.error)throw r.error;edClose();toast(ED&&ED.id?'저장했어요':'부스를 열었어요');await loadAll();render();}
  catch(e){$('eSave').disabled=false;msg.className='msg err';msg.textContent='저장하지 못했어요: '+(e.message||e);}
}

      <span class="muted" style="font-size:13px;color:var(--faint)">${ME.src?`모둠 정보: 학습지 #${ME.src}`:'3차 수행평가 학습지를 찾지 못했어요'}</span></div>
    <h3 style="margin:20px 0 4px;font-size:17px">투표 결과 <span style="font-weight:500;color:var(--faint);font-size:14px">총 ${total}표</span></h3>
    ${rows.length?`<table class="rank"><tr><th>순위</th><th>반 · 모둠</th><th>캠페인</th><th>투표</th><th>좋아요</th><th>댓글</th></tr>${rows.slice(0,10).map((r,i)=>`<tr><td><b>${i+1}</b></td><td>${esc(r.b.class_name)} ${esc(r.b.group_name)}</td><td>${esc(r.b.title)}</td><td><b>${r.v}</b></td><td>${r.b.likes}</td><td>${r.b.comments}</td></tr>`).join('')}</table>
      <p style="margin:12px 0 0;font-size:14px;color:var(--sub)">반별 1위: ${Object.keys(byCls).sort().map(c=>`${esc(c)} ${esc(byCls[c][0].b.group_name)}(${byCls[c][0].v}표)`).join(' · ')}</p>`:'<p class="msg">아직 부스가 없어요.</p>'}</section>`;
}
async function cfgSet(k,on){const next=Object.assign({},CFG,{[k]:on?'on':'off'});if(await saveCfg(next)){toast('저장했어요');render();}else render();}
async function cfgVotes(n){const next=Object.assign({},CFG,{votes:+n});if(await saveCfg(next)){toast('저장했어요');render();}}
</script>
</body>
</html>
