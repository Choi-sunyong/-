<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>윤리 토론장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
/* 수행평가용 윤리 토론장 — 학생: 주제 선택 → 준비지 → 1라운드 → 역할 교체 재토론 → 조정 메모 → 성찰 → 제출
   선생님('선생님으로 들어가기'): 토론 열기/닫기, 학생 기록 보기, 평가요소별 AI 채점 보조, 점수 확정, CSV */
:root{
  --bg:#ECEFF2; --card:#FFFFFF; --ink:#1B2230; --muted:#5E6675; --faint:#98A0AD; --line:#D9DEE5;
  --pro:#136F63; --pro-soft:#E3F1EE; --con:#8C2F5A; --con-soft:#F5E6ED;
  --warn:#B4531A; --ok:#2D6A2E; --focus:#2F6FDE;
  --speech:"Gowun Batang","Noto Serif KR",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#sdtDraftBtn{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;padding:18px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto}
.steps.pv>div{cursor:pointer}.steps.pv>div:hover{text-decoration:underline}
.pvjump{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;margin-right:6px}
body.watch textarea,body.watch input,body.watch button,body.watch select,body.watch a{pointer-events:none}
body.wide .wrap{max-width:1600px}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
textarea,input[type=text]{font:inherit;color:var(--ink);width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;resize:vertical}
textarea{min-height:70px}
textarea:focus,input[type=text]:focus{border-color:var(--ink);outline:none}

/* 상단 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.who{font-size:13px;color:var(--muted)}
.top .sp{flex:1}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;font-weight:600}
.btn.pro{background:var(--pro);border-color:var(--pro)}
.btn.con{background:var(--con);border-color:var(--con)}

/* 단계 표시 — 실제 순서이므로 번호를 씀 */
.steps{display:flex;gap:4px;margin-bottom:16px}
.steps div{flex:1;font-size:12px;color:var(--faint);padding-top:8px;border-top:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps div.done{color:var(--muted);border-color:#A9B1BD}
.steps div.now{color:var(--ink);font-weight:700;border-color:var(--ink)}

.card{background:var(--card);border-radius:12px;padding:22px;border:1px solid var(--line)}
.card+.card{margin-top:12px}
h1{font-size:24px;line-height:1.35;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}

/* 주제 고르기 */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.topic{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.topic:hover{border-color:var(--ink)}
.topic.sel{border:2px solid var(--ink);padding:15px}
.topic b{font-size:15.5px;line-height:1.45}
.topic .vs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.pill{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:600}
.pill.pro{background:var(--pro-soft);color:var(--pro)}
.pill.con{background:var(--con-soft);color:var(--con)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.side{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px;text-align:left}
.side.pro.sel{border:2px solid var(--pro);background:var(--pro-soft);padding:13px}
.side.con.sel{border:2px solid var(--con);background:var(--con-soft);padding:13px}
.side .lb{font-weight:800}
.side.pro .lb{color:var(--pro)} .side.con .lb{color:var(--con)}
.side .op{font-size:12.5px;color:var(--muted);margin-top:4px}

/* 준비지 */
.fs{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.fs:first-of-type{border-top:0;margin-top:0;padding-top:0}
.fl{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.fl small{font-weight:400;color:var(--muted);margin-left:6px}
.reason{background:#F6F8FA;border-radius:10px;padding:4px 14px 14px;margin-top:10px}
.check{font-size:12.5px;color:var(--faint);margin-left:4px}
.check.ok{color:var(--ok)}

/* 평가요소 연결 표시: 준비지·재토론·성찰의 각 칸이 평가계획서의 어느 기준과 이어지는지 */
.rub{display:flex;gap:10px;align-items:flex-start;background:#F1F4F8;border-left:3px solid var(--ink);border-radius:0 8px 8px 0;padding:10px 12px;margin:0 0 14px;font-size:13px;color:var(--muted)}
.rub b{color:var(--ink);white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--muted);background:#EEF1F4;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.recap{background:#F6F8FA;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.recap .q{margin-top:6px}
.rec h3.el-h{border-top:1px solid var(--line);padding-top:14px;margin-top:22px}
/* 토론 무대: 학생(왼쪽)과 AI(오른쪽)가 마주 봄. 역할을 바꾸면 두 편의 색이 서로 바뀜 */
.stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.seat{padding:14px 16px;display:flex;gap:12px;align-items:center;transition:background .6s ease}
.seat.r{flex-direction:row-reverse;text-align:right}
.seat .mono{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--speech);font-weight:700;font-size:20px;color:#fff;flex:none;transition:background .6s ease}
.seat .nm{font-weight:800;font-size:15px}
.seat .sd{font-size:12.5px}
.seat.pro{background:var(--pro-soft)} .seat.pro .mono{background:var(--pro)} .seat.pro .sd{color:var(--pro)}
.seat.con{background:var(--con-soft)} .seat.con .mono{background:var(--con)} .seat.con .sd{color:var(--con)}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 14px;border-left:1px solid var(--line);border-right:1px solid var(--line);min-width:96px}
.mid .rd{font-weight:800;font-size:13px}
.mid .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.swapped .seat{animation:seatIn .7s ease}
@keyframes seatIn{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.swapped .seat{animation:none}.seat,.seat .mono{transition:none}}

.log{display:flex;flex-direction:column;gap:14px;padding:18px 4px;min-height:200px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:4px}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who2{font-size:12px;color:var(--muted)}
.msg .bub{padding:12px 15px;border-radius:12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.msg.ai .bub{background:#fff;border:1px solid var(--line);font-family:var(--speech);font-size:15.5px;line-height:1.75;border-top-left-radius:3px}
.msg.me .bub{background:var(--ink);color:#fff;border-top-right-radius:3px}
.msg.me.star .bub{box-shadow:0 0 0 3px #F2C14E}
.star-btn{border:0;background:none;font-size:12.5px;color:var(--faint);padding:0}
.star-btn.on{color:#9A6B00;font-weight:700}
.typing{font-family:var(--speech);color:var(--muted)}
.composer{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.composer textarea{border:0;padding:4px;min-height:84px}
.composer textarea:focus{outline:none}
.tips{font-size:12.5px;color:var(--muted);margin:2px 4px 8px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.bar .sp{flex:1}
.err{color:#B42318;font-size:13px}

/* 요약/기록 보기 */
.rec h3{font-size:15px;margin:18px 0 6px}
.rec .q{font-size:13px;color:var(--muted);margin-top:8px}
.rec .a{white-space:pre-wrap;background:#F6F8FA;border-radius:8px;padding:8px 12px;margin-top:3px}
.rec .t{font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line);white-space:pre-wrap}
.rec .t b{display:inline-block;min-width:54px}
.rec .t.star{background:#FFF7DD}

/* 선생님 화면 */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.cfg{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cfg-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.cfg-h b{font-size:14px}
.cfg-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.cfg-g{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cf{display:flex;flex-direction:column;gap:5px;background:#F6F8FA;border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--muted)}
.cf .num{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.cf input,.cf select{font:inherit;font-size:14px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff}
.cf input{width:64px;text-align:center}.cf select{width:100%}
.cfg-t{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;margin:12px 2px 0;font-size:13px;align-items:center}
@media (max-width:720px){.cfg-t{grid-template-columns:1fr}}
.tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tg input{position:absolute;opacity:0;width:0;height:0}
.tg i{width:34px;height:20px;border-radius:999px;background:#CBD2DB;position:relative;transition:background .15s;flex:none}
.tg i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg input:checked+i{background:var(--ink)}.tg input:checked+i::after{left:16px}
.cfg-u{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.tblw{overflow-x:auto}
table.stu .nw{white-space:nowrap;word-break:keep-all}
.gate{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.gate b{font-size:14px}
.sw{width:46px;height:26px;border-radius:999px;border:0;background:#C5CBD3;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)} .sw.on::after{left:23px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px}
.ctabs{flex-wrap:nowrap;overflow-x:auto;align-items:center}.ctabs .tab{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C8CFD8;vertical-align:1px;margin-right:4px}.ctabs .tab .dot{margin:0}.dot.open{background:#22A06B}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);font-size:13.5px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#F6F8FA}
td{padding:9px 10px;border-bottom:1px solid #EEF1F4;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#F6F8FA}
.st{font-size:12px;padding:2px 8px;border-radius:999px;background:#EEF1F4;color:var(--muted);white-space:nowrap}
.st.done{background:#E3F1E3;color:var(--ok)}
.st.mid2{background:#FDF0E1;color:var(--warn)}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.drawer{position:fixed;inset:0;background:rgba(20,26,36,.45);display:flex;justify-content:flex-end;z-index:50}
.drawer .pane{width:min(980px,100%);height:100%;overflow:auto;background:var(--bg);padding:18px}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.el{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.el:first-child{border-top:0;margin-top:0;padding-top:0}
.lv{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.lv input{margin-top:4px}
.lv.ai{background:#EEF3FC}
.lv .pt{font-weight:800;min-width:24px}
.aibox{font-size:13px;background:#EEF3FC;border-radius:8px;padding:8px 10px;margin-top:6px}
.aibox q{display:block;font-family:var(--speech);margin-top:4px;quotes:"“" "”"}
.sticky{position:sticky;top:0}
.drawer .pane{overscroll-behavior:contain}
body.noscroll,html.noscroll{overflow:hidden!important}
/* 실시간 모니터링 */
.mbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.mbar .seg{padding:6px 12px;font-size:12.5px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);font-family:inherit}
.mbar .seg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mbar input{padding:7px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;width:150px;font-family:inherit}
.livedot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#16A34A;font-weight:600}
.livedot i{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;animation:liveB 1.4s infinite}
@keyframes liveB{50%{opacity:.25}}
.mgrid{display:grid;gap:10px;align-content:start}
.mtile{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.mtile.alert{border:2px solid #DC2626;animation:redGlow 1.1s ease-in-out infinite}
.mtile .mh{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.mtile .mh .bd{font-size:11px;padding:2px 7px;border-radius:999px;background:#EEF1F5;color:var(--muted)}
.mtile .mh .bd.go{background:#FEF3C7;color:#92400E}.mtile .mh .bd.ok{background:#DCFCE7;color:#166534}.mtile .mh .bd.no{background:#FDECEA;color:#B3261E}
.mtile .mh .fl{font-size:11px;padding:2px 7px;border-radius:999px;background:#FEE2E2;color:#B42318;font-weight:700}
.mtile .mh .wn{margin-left:auto;font-size:11px;color:var(--muted)}
.mtile .mb{overflow-y:auto;padding:8px 10px;font-size:12px;line-height:1.55;background:#FAFBFC}
.mtile .mb .q{font-size:11px;margin-top:6px}.mtile .mb .a{font-size:12px;padding:5px 8px;margin:2px 0 0}
.mtile .mb .ml{display:flex;flex-direction:column;gap:5px}
.mtile .mb .mm2{max-width:88%;padding:5px 8px;border-radius:8px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.mtile .mb .mm2.me{align-self:flex-end;background:var(--ink);color:#fff}
.mtile .mb .mm2.ai{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.mtile .mb .mm2.pa{box-shadow:0 0 0 2px #DC2626}
.mtile .mb .typing{margin-top:6px;border:1px dashed #94A3B8;border-radius:8px;padding:5px 8px;color:#334155;background:#fff;white-space:pre-wrap}
.mtile .mb .empty{color:#9AA3AF;text-align:center;padding-top:30px}
.mon{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px;line-height:1.5}
.mcard b{font-size:14px}
.mcard .mm{color:var(--muted);font-size:12px}
.mcard.idle{opacity:.55}
.mcard.alert{border:2px solid #DC2626;padding:9px 11px;animation:redGlow 1.1s ease-in-out infinite}
@keyframes redGlow{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.0)}50%{box-shadow:0 0 0 6px rgba(220,38,38,.35)}}
.alog{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px;color:#991B1B}
.alog div{padding:2px 0}
.lvnote{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#1F2937;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.intro{max-width:720px;margin:0 auto;min-height:80vh;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding-bottom:24px;position:relative}
.intro-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.intro-flow{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;justify-content:center;max-width:100%}
.intro-flow i{color:#B6C0CC;font-style:normal}
.intro-flow .if{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:#9AA4B1;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;min-width:0;flex:1 1 0;white-space:nowrap;transition:all .25s}
.intro-flow .if span{width:26px;height:26px;border-radius:50%;background:#EEF1F5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.intro-flow .if.all{color:var(--ink)}
.intro-flow .if.on{color:var(--ink);border-color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-3px)}
.intro-flow .if.on span{background:var(--ink);color:#fff}
.intro-step{font-size:12px;color:var(--muted);padding:6px 2px}
.intro-box{background:#1F2733;color:#F4F6F8;border-radius:14px;padding:18px 20px 14px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.18);min-height:130px;display:flex;flex-direction:column;gap:8px;user-select:none}
.intro-who{font-size:13px;font-weight:700;color:#9FB3C8;letter-spacing:.02em}
.intro-line{font-size:17px;line-height:1.75;word-break:keep-all;flex:1}
.intro-next{align-self:flex-end;font-size:12px;color:#9FB3C8;animation:liveB 1.4s infinite}
.intro-skip{align-self:flex-end}
.toast{position:fixed;right:16px;top:16px;z-index:90;background:#DC2626;color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:320px}
.flash{position:fixed;inset:0;pointer-events:none;z-index:80;box-shadow:inset 0 0 0 6px rgba(220,38,38,.85);animation:flashOut 1.6s ease-out forwards}
@keyframes flashOut{0%{opacity:1}100%{opacity:0}}

function svIn(el,block,smooth){if(!el)return;if(MODE!=='watch'){try{el.scrollIntoView({block:block,behavior:smooth?'smooth':'auto'});}catch(e){}return;}

function readCfg(html){
  const cfg=Object.assign({},CFG_DEF,{open:[]});
  try{
    let txt;
    if(html){const m=String(html).match(/<script type="application\/json" id="sdt-quiz">([\s\S]*?)<\/script>/);txt=m&&m[1];}
    else{const el=document.getElementById('sdt-quiz');txt=el&&el.textContent;}
    if(!txt)return cfg;
    (JSON.parse(txt)||[]).forEach(it=>{
      if(it.q==='__arena_open')cfg.open=(it.a||[]).map(String);
      else if(it.q==='__arena_set'){try{const o=JSON.parse(it.a[0]);cfg._set=true;['minT','maxT','mins'].forEach(k=>{if(+o[k]>0)cfg[k]=+o[k];});}catch(e){}}
      else if(it.q==='__arena_mode')cfg.mode=String((it.a||[])[0]||'');
      else if(it.q==='__arena_engine')cfg.engine=String((it.a||[])[0]||'');
      else if(it.q==='__arena_leave')cfg.leave=String((it.a||[])[0]||'');
      else if(it.q==='__arena_reveal')cfg.reveal=String((it.a||[])[0]||'');
      else if(it.q==='__arena_custom')cfg.custom=String((it.a||[])[0]||'');
      else if(it.q==='__arena_intro')cfg.intro=String((it.a||[])[0]||'');
      else if(it.q==='__arena_auto'){try{const o=JSON.parse(it.a[0]);cfg.auto=o.on?'on':'off';cfg.sched=o.sched||[];cfg.times=o.times||{};}catch(e){}}
      else if(it.q==='__arena_extra'){try{cfg.extra=JSON.parse(it.a[0])||{};}catch(e){}}
      else if(it.q==='__arena'){try{if(JSON.parse(it.a[0]).open)cfg.open=['*'];}catch(e){}}
    });
  }catch(e){}
  if(cfg.mode==='practice'&&!cfg._set){cfg.minT=cfg.minT===CFG_DEF.minT?2:cfg.minT;cfg.maxT=cfg.maxT===CFG_DEF.maxT?4:cfg.maxT;cfg.mins=cfg.mins===CFG_DEF.mins?8:cfg.mins;}
  return cfg;
}
function cfgList(c){

    &&filled(p.reasons)&&filled(p.example)&&filled(p.sources)
    &&filled(p.counter)&&filled(p.rebut)&&filled(p.weak)&&filled(p.weakFix);
}

function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?'':a[k],o)??'';}
function setPrep(path,v){
  if(!S.prepStart)S.prepStart=Date.now();
  const ks=path.split('.');let o=S.prep;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;persist();
  const ok=prepReady();const b=$('enterBtn');if(b)b.disabled=!ok;
  const st=$('prepState');if(st)st.textContent=ok?'준비지가 다 채워졌어요.':PREP_TODO;
}
function submitPrep(){
  if(!prepReady())return;
  if(!lvConfirm('준비지를 제출할까요? 제출하면 더 이상 고칠 수 없어요.'))return;
  S.prepSubmittedAt=new Date().toISOString();
  if(isPractice()){S.r1Start=Date.now();go('r1');return;}
  go('wait');
}

function roundInfo(n){
  const t=topicOf();
  const meSide=n===1?S.side:other(S.side);
  return{t,meSide,aiSide:other(meSide),ai:t[other(meSide)],log:n===1?S.r1:S.r2,startKey:n===1?'r1Start':'r2Start'};
}
function myTurns(log){return log.filter(m=>m.role==='me').length;}
function renderRound(n){
  const R=roundInfo(n),s=(ID&&ID.student)||{};
  const turns=myTurns(R.log),stars=R.log.filter(m=>m.role==='me'&&m.star).length,full=turns>=maxT();

    <div class="stage ${n===2?'swapped':''}">

      <div class="mid"><span class="rd">${n===1?'1라운드':'역할 교체'}</span><span class="tm" id="tm">00:00</span><span class="hint" style="font-size:11.5px" id="tmHint">권장 ${roundMins()}분</span></div>
      <div class="seat r ${R.aiSide}"><div class="mono">${esc(R.ai.mono)}</div><div><div class="nm">${esc(R.ai.name)}</div><div class="sd">${esc(sideLabel(R.t,R.aiSide))}</div></div></div>

      ${aiErr?`<div class="err">${esc(aiErr)} <button class="btn ghost sm" onclick="aiTurn(${n})">다시 시도</button></div>`:''}</div>
    <div class="composer">
      <textarea id="say" placeholder="${full?'이번 라운드 발언 기회를 모두 썼어요.':'내 주장과 근거를 써 보세요.'}" ${full||aiBusy||lastMe?'disabled':''} onpaste="S.pastes=(S.pastes||0)+1;flagPaste=true">${full||aiBusy||lastMe?'':esc(S.sayDraft||'')}</textarea>
      <div class="row"><span class="hint">내 발언 ${turns}/${maxT()}</span><span class="sp" style="flex:1"></span>
        <button class="btn" onclick="sendMsg(${n})" ${full||aiBusy||lastMe?'disabled':''}>보내기</button></div>
    </div>
    <div class="bar"><span class="hint">${turns<minT()?`최소 ${minT()}번 발언하면 라운드를 마칠 수 있어요.`:n===2?'준비가 되면 재토론을 마쳐요.':'준비가 되면 1라운드를 마치고 역할을 바꿔요.'}</span>
      <span class="sp"></span><button class="btn ghost" ${turns>=minT()&&!aiBusy?'':'disabled'} onclick="endRound(${n})">${n===1?'1라운드 마치기':'재토론 마치기'}</button></div>`;
  const ta=$('say');if(ta){ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMsg(n);}});if(!ta.disabled&&MODE!=='watch')ta.focus();}
  const lg=$('log');if(lg&&lg.lastElementChild)svIn(lg.lastElementChild,'nearest');
  // 시계는 '이 화면을 실제로 보고 있던 시간'만 셈 — 전날 시작했거나 오래 나가 있다 돌아와도 600분처럼 튀지 않게
  if(!S[R.startKey])S[R.startKey]=Date.now();
  const ek=R.startKey+'El';if(S[ek]==null)S[ek]=Math.min(Math.max(0,Date.now()-S[R.startKey]),roundMins()*60000);
  let last=Date.now();
  const tick=()=>{const now=Date.now(),gap=now-last;last=now;if(!document.hidden&&gap<5000)S[ek]+=gap;const e=$('tm'),el=S[ek];if(e)e.textContent=mmss(el);const h=$('tmHint');if(h&&el>roundMins()*60000){h.textContent='시간이 지났어요. 마무리하세요';h.style.color='var(--warn)';}};tick();timerH=setInterval(tick,1000);
  // 다시 들어왔을 때 마지막이 내 발언이면(상대방 답을 받기 전에 나갔던 경우) 상대방 답을 다시 요청 — 안 하면 입력칸이 계속 잠김
  if(MODE!=='watch'&&!aiBusy&&!aiErr&&(!R.log.length||R.log[R.log.length-1].role==='me'))aiTurn(n);

function msgHtml(n,m,i,R){
  if(m.role==='ai')return `<div class="msg ai"><span class="who2">${esc(R.ai.name)}</span><div class="bub">${esc(m.text)}</div></div>`;
  return `<div class="msg me ${m.star?'star':''}"><div class="bub">${esc(m.text)}</div></div>`;
}
let flagPaste=false;
function toggleStar(n,i){
  const log=n===1?S.r1:S.r2,m=log[i];
  if(!m.star&&log.filter(x=>x.star).length>=MAX_STARS){lvAlert(`대표 발언은 라운드마다 ${MAX_STARS}개까지 고를 수 있어요. 다른 것을 먼저 해제해 주세요.`);return;}
  m.star=!m.star;persist();renderRound(n);
}
function sendMsg(n){
  const ta=$('say');const v=(ta&&ta.value||'').trim();if(!v||aiBusy)return;
  const log=n===1?S.r1:S.r2;if(myTurns(log)>=maxT())return;
  log.push({role:'me',text:v,t:Date.now(),pasted:flagPaste||undefined});flagPaste=false;S.sayDraft='';monSend('beat');
  persist('q');aiTurn(n);
}
function endRound(n){
  const log=n===1?S.r1:S.r2;
  if(!lvConfirm(n===1?'1라운드를 마치고 역할을 바꿀까요? 마치면 다시 돌아올 수 없어요.':'재토론을 마칠까요? 마치면 다시 돌아올 수 없어요.'))return;
  go(n===1?'swap':'adjust');
}

/* AI 호출 */
/* 선생님 PC의 싯다르타 앱이 켜져 있고 Claude 구독이 연결돼 있으면 그쪽으로 먼저 보냄(구독 사용).
   앱이 꺼져 있거나, 한도가 찼거나, 대기가 많으면 null → 아래 API 키 방식으로 처리 */
let relayCh=null,relayReady=null;const relayWait={};
async function relayAI(system,messages){
  const c=sbClient();if(!c||!ID||!ID.teacherId)return null;
  if(!relayCh){
    relayCh=c.channel('sdt-ai-'+ID.teacherId,{config:{broadcast:{self:false}}});
    relayCh.on('broadcast',{event:'res'},m=>{const p=m.payload||{};const w=relayWait[p.rid];if(w)w(p);});
    relayCh.on('presence',{event:'sync'},()=>{});
    relayReady=new Promise(res=>{relayCh.subscribe(st=>{if(st==='SUBSCRIBED')setTimeout(res,600);});setTimeout(res,4000);});
  }
  await relayReady;
  if(!Object.keys(relayCh.presenceState()||{}).length)return null;
  const rid=Math.random().toString(36).slice(2)+Date.now().toString(36);
  return await new Promise(resolve=>{
    let acked=false;const done=v=>{delete relayWait[rid];clearTimeout(t1);clearTimeout(t2);resolve(v);};
    relayWait[rid]=p=>{if(p.ack){acked=true;clearTimeout(t1);return;}if(p.fallback)return done(null);if(p.text)return done(String(p.text).trim());};
    const t1=setTimeout(()=>{if(!acked)done(null);},5000);
    const t2=setTimeout(()=>done(null),25000);
    relayCh.send({type:'broadcast',event:'req',payload:{rid,system,messages}});
  });
}
let lastAI=null;
async function callAI(system,messages,maxTokens,temperature){
  lastAI=null;
  if(MODE==='watch')return '';
  if(MODE==='preview'){await new Promise(r=>setTimeout(r,500));return '(미리보기에서는 상대방이 답하지 않아요.)';}
  if(aiEngine()==='claude'){try{const t=await relayAI(system,messages);if(t)return t;}catch(e){}}
  // 선생님이 고른 AI가 막히면(구독 한도·크레딧 소진·지연) 자동으로 Gemma로 넘어가서 학생이 기다리지 않게 함
  const eng0=aiEngine()==='claude'?undefined:aiEngine();
  const plan=[[0,eng0],[1500,eng0],[0,eng0==='gemma'?'gemini':'gemma'],[3000,'gemma'],[6000,'gemma']];let last;
  // 무한 대기 방지: 토론 답은 전체 45초(채점처럼 긴 답은 2분)가 지나면 멈추고 '다시 시도' 버튼을 보여 줌
  const t0=Date.now(),budget=(maxTokens||600)<=800?45000:120000;
  for(const [w,eng] of plan){
    if(w)await new Promise(r=>setTimeout(r,w+Math.random()*1000));
    const left=budget-(Date.now()-t0);if(left<3000)break;
    try{
      const ac=new AbortController();const to=setTimeout(()=>ac.abort(),Math.min(40000,left));
      const r=await fetch('/api/chat',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({teacherId:ID.teacherId,systemPrompt:system,messages,maxTokens:maxTokens||600,temperature:temperature==null?0.5:temperature,engine:eng})}).finally(()=>clearTimeout(to));
      const j=await r.json().catch(()=>({}));
      if(r.ok){lastAI={via:j.via||'claude-api',usage:j.usage||null,vertexError:j.vertexError||''};return String(j.text||'').trim();}
      last=new Error(j.error||('응답 오류 '+r.status));
    }catch(e){last=e;}
  }
  throw new Error('지금 요청이 몰려 응답이 늦어요. 잠시 뒤 다시 시도해 주세요');
}
function prepText(p){
  p=p||{};const r=p.r||[];const rs=p.reasons!=null?`근거: ${p.reasons||''}\n구체적 사례·자료: ${p.example||'(없음)'}`:r.map((x,i)=>`근거${i+1}: ${x.point||''}\n  구체적 사례·자료: ${x.example||'(없음)'}`).join('\n');
  return `쟁점: ${p.issue||''}\n내 입장이 지키려는 가치: ${p.valMine||''} / 반대 입장이 지키려는 가치: ${p.valOther||''}\n입장: ${p.claim||''}\n${rs}\n예상 반론: ${p.counter||''}\n재반박: ${p.rebut||''}\n스스로 꼽은 약점: ${p.weak||''}\n약점 보완: ${p.weakFix||''}${p.sources?`\n자료 출처: ${p.sources}`:''}`;
}
// 라운드 끝무렵 자연스러운 마무리: 학생 발언 수가 최대에 가까워지면 쟁점을 좁히고, 마지막 답에서는 정리하며 마무리
function wrapNote(R){
  const t=myTurns(R.log),mx=maxT();
  if(R.log.length&&R.log[R.log.length-1].role!=='me')return '';
  if(t>=mx)return `\n\n[이번이 이 라운드의 마지막 답] 학생은 더 이상 발언할 수 없다. 규칙 2의 '질문으로 끝내기'는 이번에는 하지 않는다. 학생의 방금 발언에 짧게 응답한 뒤, 이번 라운드에서 오간 핵심 쟁점을 한두 가지로 정리하고, 학생 논리에서 설득력 있던 점과 더 생각해 볼 지점을 한 문장씩 남기고, "좋은 토론이었습니다"처럼 자연스럽게 마무리한다. 3~4문장. 점수나 승패는 말하지 않는다.`;
  if(t===mx-1)return `\n\n[라운드가 곧 끝남] 학생에게 남은 발언은 한 번이다. 지금까지 나온 쟁점 중 가장 중요한 하나로 좁혀서, 학생이 마지막 발언에서 자기 입장을 정리할 수 있도록 핵심을 찌르는 마지막 질문을 던진다. "마지막으로 하나만 묻겠습니다"처럼 끝나 간다는 느낌을 자연스럽게 준다.`;
  return '';
}
function debatePrompt(n){
  const R=roundInfo(n),t=R.t,p=S.prep,ai=R.ai;
  const prepTxt=prepText(p);
  let ctx;
  if(n===1){
    ctx=`[1라운드] 학생은 "${sideLabel(t,S.side)}" 입장이다. 아래는 학생이 미리 쓴 준비지다.\n${prepTxt}\n준비지에서 근거가 약하거나 학생이 예상하지 못한 지점을 골라 공략하라. 학생이 예상한 반론을 그대로 반복하지 말고, 그보다 한 걸음 더 들어간 반론을 하라. 학생이 스스로 약점이라고 적은 부분도 토론 중 한 번은 다룬다.`;
  }else{
    const mine=S.r1.filter(m=>m.role==='me').map((m,i)=>`(${i+1}) ${m.text}`).join('\n');
    ctx=`[역할 교체 재토론] 학생은 1라운드에서 "${sideLabel(t,S.side)}" 입장이었고, 이제는 반대인 "${sideLabel(t,R.meSide)}" 입장을 맡는다. 너는 학생이 1라운드에서 썼던 입장("${sideLabel(t,R.aiSide)}")을 대변한다.\n학생의 준비지:\n${prepTxt}\n학생이 1라운드에서 한 발언:\n${mine}\n학생의 위 논리를 적극적으로 이어받아 더 정교하게 다듬어 사용하라. 가끔 "앞선 라운드에서 당신도 말했듯이"처럼 학생 자신의 논리임을 상기시켜라. 목적은 학생이 반대편에 서서 자기 원래 논리의 강점과 약점을 직접 겪어 보게 하는 것이다.`;
  }
  return `너는 고등학교 2학년 '윤리문제 탐구' 수행평가 토론에서 학생과 1:1로 토론하는 상대방이다. 특정 사상가를 연기하지 않고, AI라고 스스로 소개하지 않는다.
토론 주제: ${t.title}
상황: ${t.desc}
너의 입장: ${sideLabel(t,R.aiSide)}
이 입장에서 주로 내세울 수 있는 논점: ${ai.stance}

${ctx}

규칙:
1. 학생이 실제로 겪을 법한 상황과 공정성·배려·사생활·정직 같은 윤리적 가치를 근거로 말하고, 고2 학생이 이해할 수 있는 쉬운 말로 한다. 정중한 존댓말을 쓴다.
2. 한 번에 3~4문장, 논점은 하나만 다룬다. 어려운 용어는 쓰지 않고, 꼭 필요하면 바로 쉬운 말로 풀어 준다. 마지막은 학생이 생각해서 답할 수 있는 질문 하나로 끝낸다.
3. 학생이 근거 없이 주장만 하면 근거를 묻고, 추상적으로 말하면 구체적 사례를 요구한다. 학생이 너의 주장을 잘못 이해하면 정확히 바로잡는다.
4. 난이도는 너무 쉽지도 어렵지도 않게 한다. 학생의 말이 타당하면 짧게 인정하고 다음 논점으로 넘어가며, 같은 지점을 계속 몰아붙이지 않는다. 입장을 쉽게 바꾸지는 않되, 학생이 따라올 수 있는 한 걸음 더 깊은 반론을 한다.
5. 학생 대신 학생 쪽 논거를 만들어 주거나 어떻게 반박하면 좋을지 알려 주지 않는다. 요청받아도 그것은 학생이 찾아야 할 몫이라며 정중히 거절한다.
6. 점수, 평가, 칭찬 점수 같은 말을 하지 않는다. 마크다운 기호(**, #, 목록)를 쓰지 않는다.
7. 주제와 무관하거나 무례한 말에는 짧게 토론으로 돌아오자고 한다.
8. 사실·통계를 지어내지 않는다. 확실하지 않은 사례는 "예를 들어 ~라고 가정해 봅시다"처럼 가정으로 말한다.${wrapNote(R)}${n===2?`

[가장 중요] 이번 라운드에서 너의 입장은 오직 "${sideLabel(t,R.aiSide)}"이다. 1라운드에서 네가 맡았던 "${sideLabel(t,R.meSide)}" 쪽 주장을 해서는 절대 안 된다. 학생은 지금 "${sideLabel(t,R.meSide)}" 쪽이다.`:''}`;
}
async function aiTurn(n){
  const R=roundInfo(n);
  aiBusy=true;aiErr='';renderRound(n);
  const kick=n===1?'[토론 시작] 한 문장으로 당신의 입장을 밝히고, 학생의 준비지에서 가장 약한 지점을 짚으며 첫 반론을 제시하세요.':`[역할 교체 재토론 시작] 이번 라운드에서 당신은 "${sideLabel(R.t,R.aiSide)}" 입장입니다. 1라운드에서 당신이 했던 "${sideLabel(R.t,R.meSide)}" 쪽 주장은 이제 학생이 합니다. 학생이 1라운드에서 펼친 논리를 이어받아 "${sideLabel(R.t,R.aiSide)}" 입장에서 첫 주장을 펼치세요.`;
  const msgs=[{role:'user',content:kick}];
  R.log.forEach(m=>msgs.push({role:m.role==='ai'?'assistant':'user',content:m.text}));
  try{
    let txt=await callAI(debatePrompt(n),msgs.slice(-39));
    if(!txt)throw new Error('빈 응답');
    if(n===2&&await sideWrong(R,txt)){
      const fix=msgs.slice(-39).concat([{role:'assistant',content:txt},{role:'user',content:`[주의] 방금 답은 "${sideLabel(R.t,R.meSide)}" 쪽 주장이었습니다. 이번 라운드에서 당신은 "${sideLabel(R.t,R.aiSide)}" 입장입니다. 방금 답은 없던 것으로 하고, "${sideLabel(R.t,R.aiSide)}" 입장에서 다시 답하세요.`}]);
      const t2=await callAI(debatePrompt(n),fix);if(t2)txt=t2;
    }
    R.log.push({role:'ai',text:txt,t:Date.now()});
    if(lastAI){const U=S.usage=S.usage||{n:0,in:0,out:0,via:{}};U.n++;U.via[lastAI.via]=(U.via[lastAI.via]||0)+1;if(lastAI.usage){U.in+=lastAI.usage.in||0;U.out+=lastAI.usage.out||0;}}
    persist('q');
  }catch(e){aiErr='상대방의 답을 받지 못했어요. ('+e.message+')';}
  aiBusy=false;if(S.stage===(n===1?'r1':'r2'))renderRound(n);
}

// 재토론에서 상대방이 학생 쪽 입장을 말해 버렸는지 확인(가볍게 한 번 물어봄). 확인이 안 되면 그대로 둠
async function sideWrong(R,txt){
  try{const A=sideLabel(R.t,R.aiSide),B=sideLabel(R.t,R.meSide);
    const r=await callAI(`토론 발언이 어느 입장을 지지하는지 판정한다. 주제: ${R.t.title}\nA: ${A}\nB: ${B}\nA 또는 B 한 글자만 출력한다. 판단이 어려우면 A.`,[{role:'user',content:txt}],20,0);
    return /^\s*B/.test(String(r||''));}catch(e){return false;}
}

/* ================== 화면 이탈 감지 ==================
   2차시 활동(토론~성찰) 중에만 셈. 잠그지 않고 기록만 남김(와이파이 끊김으로 설정에 다녀오는 학생 때문에 2026-11 변경). */
const LV_STAGES=['r1','swap','r2','adjust','reflect'];
const STAGE_NAME={r1:'1라운드',swap:'역할 교체',r2:'재토론',adjust:'조정 메모',reflect:'성찰'};
let lvSuppress=false,lvAway=null,lvPollH=null,lvTick=Date.now(),lvBackAt=0;
function lvAlert(m){lvSuppress=true;alert(m);lvTick=Date.now();setTimeout(()=>{lvSuppress=false;},400);}
function lvConfirm(m){lvSuppress=true;const r=confirm(m);lvTick=Date.now();setTimeout(()=>{lvSuppress=false;},400);return r;}
function leaveOn(){return CFG.leave?CFG.leave==='on':!isPractice();}
function lvWatching(){return leaveOn()&&(MODE==='student'||MODE==='demo')&&S&&!S.locked&&LV_STAGES.includes(S.stage);}
function lvLeft(kind){
  if(!lvWatching()||lvSuppress||lvAway)return;
  lvAway={t:Date.now(),stage:S.stage,kind};
  S.leaves=S.leaves||[];S.leaves.push(lvAway);
  S.leaveCount=(S.leaveCount||0)+1;
  persist(true);
}
function lvBack(){
  if(!lvAway)return;
  lvAway.back=Date.now();lvAway=null;lvBackAt=Date.now();persist(true);monSend('beat');
  // 잠그지 않음(와이파이 다시 잡으러 설정에 다녀온 학생도 바로 이어서 하게). 기록만 남기고 짧게 안내
  const d=document.createElement('div');d.className='lvnote';d.textContent='화면을 벗어난 것이 기록되었어요.';document.body.appendChild(d);setTimeout(()=>d.remove(),2500);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lvLeft('hidden');else lvBack();});
window.addEventListener('blur',()=>{
  setTimeout(()=>{
    if(document.hidden||document.hasFocus())return;
    let parentFocus=false;try{parentFocus=window.parent!==window&&window.parent.document.hasFocus();}catch(e){}
    if(!parentFocus)lvLeft('blur');
  },60);
});
window.addEventListener('focus',()=>{if(!document.hidden)lvBack();});
window.addEventListener('pagehide',()=>{if(lvWatching()&&!lvSuppress)lvLeft('close');});

/* ================== 코멘트 중복 방지 ================== */
function sdBigrams(x){x=String(x||'').replace(/\s+/g,'');const g=new Set();for(let i=0;i<x.length-1;i++)g.add(x.slice(i,i+2));return g;}
function sdSim(a,b){const A=sdBigrams(a),B=sdBigrams(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++;});return n/(A.size+B.size-n);}
function sdOtherComments(exceptId){
  const L=[];T.subs.forEach(sub=>{if(String(sub.student_id)===String(exceptId))return;const g=(sub.answers&&sub.answers.grade)||{};
    ['e1','e2','e3'].forEach(k=>{const c=(g.comments&&g.comments[k])||(g.ai&&g.ai[k]&&g.ai[k].comment);if(c)L.push(c);});});
  return L;
}

/* ================== 입력 녹화 · 붙여넣기/급작스런 입력 감지 ==================
   학생이 쓰는 모든 칸의 입력을 [시각, 위치, 지운 글자 수, 넣은 글자] 단위로 기록해 선생님이 그대로 다시 볼 수 있게 함.
   붙여넣기, 한 번에 25자 이상 들어온 입력, 1초 안에 40자 넘게 늘어난 경우를 '의심 입력'으로 표시하고 선생님께 바로 알림. */
const REC_LABEL={f_issue:'쟁점',f_valMine:'내 입장의 가치',f_valOther:'반대 입장의 가치',f_claim:'입장',f_reasons:'근거',f_example:'사례·자료',f_sources:'출처',f_counter:'예상 반론',f_rebut:'재반박',f_weak:'약점',f_weakFix:'약점 보완',say:'토론 발언',ad1:'반대편 논리',ad2:'조정 내용',rf1:'변화의 이유',rf3:'최종 입장'};
const recPrev={},recWin={};let recPasteAt=0,recPasteF='';
function recOn(){return (MODE==='student'||MODE==='demo')&&S&&S.stage!=='done'&&!S.locked;}
function recEl(el){return el&&el.id&&REC_LABEL[el.id]&&(el.tagName==='TEXTAREA'||el.tagName==='INPUT');}
document.addEventListener('focusin',e=>{if(recEl(e.target))recPrev[e.target.id]=e.target.value;},true);
document.addEventListener('paste',e=>{
  if(!recOn()||!recEl(e.target))return;
  let n=0;try{n=(e.clipboardData&&e.clipboardData.getData('text')||'').length;}catch(x){}
  recPasteAt=Date.now();recPasteF=e.target.id;recFlag(e.target.id,'paste',n);
},true);
document.addEventListener('input',e=>{
  const el=e.target;if(!recOn()||!recEl(el))return;
  const id=el.id,prev=recPrev[id]!=null?recPrev[id]:'',cur=el.value;recPrev[id]=cur;
  let p=0;while(p<prev.length&&p<cur.length&&prev[p]===cur[p])p++;
  let q=0;while(q<prev.length-p&&q<cur.length-p&&prev[prev.length-1-q]===cur[cur.length-1-q])q++;
  const del=prev.length-p-q,ins=cur.slice(p,cur.length-q);
  if(!S.recStart)S.recStart=Date.now();
  const t=Date.now()-S.recStart;
  S.rec=S.rec||{};const L=S.rec[id]=S.rec[id]||[];
  const last=L[L.length-1];
  if(last&&!del&&!last[2]&&t-last[0]<1500&&p===last[1]+last[3].length&&ins.length<3)last[3]+=ins;
  else if(L.length<400)L.push([t,p,del,ins]);
  // 의심 입력 판정 (붙여넣기 직후 입력은 붙여넣기로 이미 기록)
  const now=Date.now();
  const undo=/^history/.test(e.inputType||'');
  if(!undo&&(now-recPasteAt>800||recPasteF!==id)){
    if(ins.length>=25)recFlag(id,'burst',ins.length);
    else{const w=recWin[id]=(recWin[id]||[]).filter(x=>now-x[0]<1000);w.push([now,ins.length]);const sum=w.reduce((a,x)=>a+x[1],0);
      if(sum>=40){recFlag(id,'fast',sum);recWin[id]=[];}}
  }
},true);
function recFlag(f,kind,n){
  if(f==='f_sources')return; // 출처는 기사 제목·주소를 붙여 넣는 게 자연스러워서 감시하지 않음(녹화는 그대로)
  S.flags=S.flags||[];
  const last=S.flags[S.flags.length-1];if(last&&last.f===f&&Date.now()-last.at<2000)return;
  S.flags.push({at:Date.now(),t:S.recStart?Date.now()-S.recStart:0,f,kind,n,stage:S.stage});
  persist(true);monSend('flag',{f,kind,n});
  if(MODE==='student'||MODE==='demo'){const d=document.createElement('div');d.className='flash';document.body.appendChild(d);setTimeout(()=>d.remove(),1700);}
}
const REC_STAGE={topic:'주제 선택',prep:'준비지',wait:'대기',r1:'1라운드',swap:'역할 교체',r2:'재토론',adjust:'조정 메모',reflect:'성찰'};
const FLAG_NAME={paste:'붙여넣기',burst:'한 번에 많은 글자 입력',fast:'1초 안에 문장 완성'};

/* ================== 실시간 모니터링 채널 ==================
   학생 화면 → 'sdt-mon-<학습지id>'로 진행 상황(단계·발언 수·의심 입력·이탈)을 보내고, 선생님 화면이 받아 바로 표시 */
let monCh=null,monReady=null,monBeatAt=0;
/* 무료 요금제 한도(초당 100건) 안에서 돌게: 학생은 보고 채널에 '구독하지 않고 보내기만' 함(→ 다른 학생에게 안 퍼짐, 선생님만 받음).
   선생님의 '현재 화면 보내 줘' 요청만 별도 채널로 학생들이 받음 */
let monAsk=null;
function monJoin(){
  const c=sbClient();if(!c||!ID||!ID.worksheetId)return null;
  if(!monCh){monCh=c.channel('sdt-mon-'+ID.worksheetId,{config:{broadcast:{self:false}}});
    monAsk=c.channel('sdt-monq-'+ID.worksheetId,{config:{broadcast:{self:false}}});
    if(MODE==='staff'){monCh.on('broadcast',{event:'beat'},m=>monOnBeat(m.payload,false));monCh.on('broadcast',{event:'flag'},m=>monOnBeat(m.payload,true));monCh.on('broadcast',{event:'live'},m=>rtOnLive(m.payload));monCh.on('broadcast',{event:'snap'},m=>rtOnSnap(m.payload));
      monReady=new Promise(r=>{monCh.subscribe(st=>{if(st==='SUBSCRIBED')r();});setTimeout(r,4000);});}
    else{monAsk.on('broadcast',{event:'hello'},()=>{if(MODE==='student'&&S&&S.stage!=='done')setTimeout(rtSnap,Math.random()*3000);});monAsk.on('broadcast',{event:'cfg'},()=>{setTimeout(()=>lockCheck(true),Math.random()*1500);});monAsk.subscribe();monReady=Promise.resolve();}}
  return monCh;
}
function monHello(){if(!monAsk)return;try{monAsk.send({type:'broadcast',event:'hello',payload:{}});}catch(e){}}
function monBeat(){
  const st=ID&&ID.student||{};
  return {sid:st.id,name:st.name,cls:st.class,stage:S.stage,t1:myTurns(S.r1||[]),t2:myTurns(S.r2||[]),flags:(S.flags||[]).length,leaves:(S.leaves||[]).length,locked:!!S.locked,at:Date.now()};
}
async function monSend(ev,extra){
  if(MODE!=='student')return;
  const ch=monJoin();if(!ch)return;await monReady;
  const pl=Object.assign(monBeat(),extra||{});
  try{if(ch.httpSend)ch.httpSend(ev,pl).catch(()=>{});else ch.send({type:'broadcast',event:ev,payload:pl});}catch(e){}
  monBeatAt=Date.now();
}
setInterval(()=>{if(MODE==='student'&&S&&Date.now()-monBeatAt>60000)monSend('beat');},10000);

/* 선생님 쪽 */
T.live={};T.alerts=[];T.unack={};T.view=T.view||'list';
function monOnBeat(b,isFlag){
  if(!b||b.sid==null)return;
  T.live[b.sid]=b;
  if(isFlag){T.unack[b.sid]=true;T.alerts.unshift(b);T.alerts=T.alerts.slice(0,30);monAlarm(b);}
  if(T.view==='mon'&&!T.open)monPaint(b.sid);else if(isFlag&&!T.open)drawStaff();
}
function monAlarm(b){
  const msg=`${b.cls||''} ${b.name||''} · ${FLAG_NAME[b.kind]||'의심 입력'}${b.n?` (${b.n}자)`:''} · ${REC_LABEL[b.f]||''}`;
  const t=document.createElement('div');t.className='toast';t.textContent='⚠ '+msg;document.body.appendChild(t);setTimeout(()=>t.remove(),6000);
  try{const A=new (window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(A.destination);o.start();setTimeout(()=>{o.frequency.value=660;},150);setTimeout(()=>{o.stop();A.close();},320);}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')new Notification('윤리 토론장 알림',{body:msg});}catch(e){}
}
function sdAck(id){delete T.unack[id];}
function monAskNotify(){try{Notification.requestPermission().then(()=>drawStaff());}catch(e){alert('이 브라우저는 알림을 지원하지 않아요.');}}
function monStatus(r){
  const sub=subOf(r.id),st=stOf(sub),b=T.live[r.id];
  const stage=(b&&b.stage)||(st&&st.stage)||'';
  const done=sub&&sub.submitted;
  const lab=done?'제출 완료':({topic:'주제 선택',prep:'준비지',wait:'대기',r1:'1라운드',swap:'역할 교체',r2:'재토론',adjust:'조정 메모',reflect:'성찰'}[stage]||'미시작');
  const flags=Math.max((b&&b.flags)||0,(st&&(st.flags||[]).length)||0),leaves=Math.max((b&&b.leaves)||0,(st&&(st.leaves||[]).length)||0);
  const t1=Math.max((b&&b.t1)||0,st?myTurns(st.r1||[]):0),t2=Math.max((b&&b.t2)||0,st?myTurns(st.r2||[]):0);
  const at=(b&&b.at)||(sub&&sub.updated_at?new Date(sub.updated_at).getTime():0);
  return{lab,flags,leaves,t1,t2,at,locked:(b&&b.locked)||(st&&st.locked),done};
}
function monAgo(t){if(!t)return '';const x=Math.round((Date.now()-t)/1000);return x<5?'방금':x<60?`${x}초 전`:x<3600?`${Math.round(x/60)}분 전`:'오래 전';}
function monState(r){const sub=subOf(r.id),st=rtMerge(r.id,stOf(sub)),m=monStatus(r);
  const k=m.done?'submitted':m.lab==='미시작'?'notstarted':'inprogress';return{sub,st,m,k};}
function monBody(st,sub){
  if(!st||!st.stage)return '<div class="empty">아직 시작 안 함</div>';
  const t=topicOf(st);
  const qa=(q,a)=>`<div class="q">${q}</div><div class="a">${esc(a)||'<span class="hint">-</span>'}</div>`;
  const chat=(log)=>`<div class="ml">${(log||[]).map(m=>`<div class="mm2 ${m.role==='me'?'me':'ai'} ${m.pasted?'pa':''}">${esc(m.text)}</div>`).join('')||'<div class="hint">아직 발언 없음</div>'}</div>`;
  const typing=st.sayDraft&&st.sayDraft.trim()?`<div class="typing">✎ ${esc(st.sayDraft)}</div>`:'';
  const head=t?`<div style="font-weight:700;margin-bottom:4px">${esc(t.title)} <span class="pill ${st.side}" style="font-size:10.5px">${esc(sideLabel(t,st.side))}</span></div>`:'';
  if(sub&&sub.submitted)return head+qa('최종 입장',(st.reflect||{}).final);
  switch(st.stage){
    case 'topic':return '<div class="empty">주제 고르는 중</div>';
    case 'prep':case 'wait':return head+prepHtml(st,false);
    case 'r1':return head+chat(st.r1)+typing;
    case 'swap':return head+'<div class="empty">역할 바꾸는 중</div>';
    case 'r2':return head+chat(st.r2)+typing;
    case 'adjust':{const a=st.adjust||{};return head+qa('반대편의 가장 강한 논리',a.oppLogic)+qa('입장·근거 조정',a.fix);}
    case 'reflect':{const r=st.reflect||{};return head+qa('바뀐(유지된) 이유',r.why)+qa('최종 입장',r.final);}
  }
  return head;
}
function monTileInner(r){
  const{sub,st,m,k}=monState(r);
  const bd=k==='submitted'?'<span class="bd ok">제출완료</span>':k==='notstarted'?'<span class="bd no">미시작</span>':`<span class="bd go">${esc(m.lab)}</span>`;
  return `<div class="mh"><b>${esc(r.number)} ${esc(r.name)}</b>${bd}${m.locked?'<span class="fl">잠김</span>':''}${m.flags?`<span class="fl">의심 ${m.flags}</span>`:''}${m.leaves?`<span class="bd">이탈 ${m.leaves}</span>`:''}<span class="wn" data-at="${m.at||''}">${monAgo(m.at)}</span></div>
    <div class="mb" style="height:${T.mH||260}px">${monBody(st,sub)}</div>`;
}
function monPaint(id){
  const el=document.querySelector(`.mtile[data-sid="${CSS.escape(String(id))}"]`);if(!el)return;
  const r=T.roster.find(x=>String(x.id)===String(id));if(!r)return;

function monFilter(){

function monHtml(list){
  T.mCols=T.mCols||3;
  const notif=window.Notification?(Notification.permission==='granted'?'<span class="hint">컴퓨터 알림 켜짐</span>':'<button class="btn ghost sm" onclick="monAskNotify()">컴퓨터 알림 켜기</button>'):'';
  const alerts=T.alerts.filter(a=>list.some(r=>String(r.id)===String(a.sid)));

      ${notif}</div>
    ${alerts.length?`<div class="alog"><b>의심 입력 알림</b>${alerts.slice(0,6).map(a=>`<div>${new Date(a.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · ${esc(a.name||'')} · ${esc(FLAG_NAME[a.kind]||'')}${a.n?` ${a.n}자`:''} · ${esc(REC_LABEL[a.f]||'')}</div>`).join('')}</div>`:''}
    <div class="mgrid" style="grid-template-columns:repeat(${T.mCols},minmax(0,1fr))">${list.map(r=>`<div class="mtile ${T.unack[r.id]?'alert':''}" data-sid="${esc(String(r.id))}" onclick="openStu('${esc(String(r.id))}')">${monTileInner(r)}</div>`).join('')||'<p class="hint">학생이 없어요.</p>'}</div>`;
}
function monAfterDraw(){document.querySelectorAll('.mtile .mb').forEach(b=>{b.scrollTop=b.scrollHeight;});monFilter();}
/* 화면은 방송 채널(실시간)로 바로 바뀜. DB는 20초마다 '바뀐 학생'만 확인해 놓친 것만 보충 — DB 부하 최소화(2026-11-05 과부하 후) */
let monBusy=false;
setInterval(async()=>{
  if(MODE!=='staff'||T.view!=='mon'||T.open||monBusy||!ID||!ID.worksheetId)return;
  const c=sbClient();if(!c)return;monBusy=true;
  try{
    const{data:heads}=await c.from('worksheet_submissions').select('student_id,updated_at').eq('worksheet_id',ID.worksheetId);
    const changed=(heads||[]).filter(h=>{const o=subOf(h.student_id);return !o||o.updated_at!==h.updated_at;}).map(h=>h.student_id);
    if(changed.length){
      const{data:fresh}=await c.from('worksheet_submissions').select('student_id,answers,submitted,submitted_at,updated_at').eq('worksheet_id',ID.worksheetId).in('student_id',changed);
      (fresh||[]).forEach(sub=>{const i=T.subs.findIndex(x=>String(x.student_id)===String(sub.student_id));if(i>=0)T.subs[i]=sub;else T.subs.push(sub);
        monPaint(sub.student_id);});
    }
    document.querySelectorAll('.mtile .wn').forEach(w=>{const at=+w.dataset.at;if(at)w.textContent=monAgo(at);});
  }catch(e){}finally{monBusy=false;}
},20000);

/* ================== 완전 실시간 화면 전송 ==================
   저장(DB)을 기다리지 않고, 학생이 치는 글자와 화면 변화를 방송 채널로 바로 보냄 → 선생님 타일에 즉시 반영.
   타이핑은 1초에 한 번(무료 요금제 초당 100건 한도 고려), 대화·단계 변화는 바로 전체 요약을 보냄. */
const RT_MAP={say:['sayDraft'],ad1:['adjust','oppLogic'],ad2:['adjust','fix'],rf1:['reflect','why'],rf3:['reflect','final']};
let rtPend={},rtTimer=null,rtSnapT=null;
function rtCompact(){
  const strip=L=>(L||[]).map(m=>({role:m.role,text:m.text,pasted:m.pasted,star:m.star}));
  return {sid:ID&&ID.student&&ID.student.id,stage:S.stage,topicId:S.topicId,side:S.side,prep:S.prep,adjust:S.adjust,reflect:S.reflect,r1:strip(S.r1),r2:strip(S.r2),sayDraft:S.sayDraft||'',flags:(S.flags||[]).length,leaves:(S.leaves||[]).length,locked:!!S.locked,at:Date.now()};
}
const RT_OFF=true;

document.addEventListener('input',e=>{

function rtOnLive(b){

  const o=T.rt[b.sid]=T.rt[b.sid]||{at:0};
  o.f=Object.assign(o.f||{},b.f);o.at=Date.now();o.stage=b.stage;

function rtOnSnap(b){
  if(!b||b.sid==null)return;
  T.rt[b.sid]={snap:b,at:Date.now(),f:{}};
  T.live[b.sid]=Object.assign(T.live[b.sid]||{},{stage:b.stage,flags:b.flags,leaves:b.leaves,locked:b.locked,at:Date.now()});

function rtMerge(id,st){
  const o=T.rt&&T.rt[id];if(!o)return st;
  const sub=subOf(id);const dbAt=st&&st.savedAt||0;
  let m=st?JSON.parse(JSON.stringify(st)):null;
  if(o.snap&&(!m||o.snap.at>dbAt))m=Object.assign(m||freshState(),o.snap);
  if(o.f&&o.at>dbAt){m=m||freshState();if(o.stage)m.stage=o.stage;
    Object.entries(o.f).forEach(([k,v])=>{const p=RT_MAP[k];
      if(p){if(p.length===1)m[p[0]]=v;else{m[p[0]]=m[p[0]]||{};m[p[0]][p[1]]=v;}}
      else if(/^f_/.test(k)){m.prep=m.prep||{};m.prep[k.slice(2)]=v;}});}
  if(sub&&sub.submitted)return st||m;
  return m;
}

let rpTimer=null;
function recPlay(id,f){
  const st=stOf(subOf(id));if(!st||!st.rec||!st.rec[f])return;
  const L=st.rec[f],fl=(st.flags||[]).filter(x=>x.f===f);
  document.getElementById('rp')?.remove();clearTimeout(rpTimer);
  const d=document.createElement('div');d.className='rp';d.id='rp';d.onclick=e=>{if(e.target===d){clearTimeout(rpTimer);d.remove();}};
  d.innerHTML=`<div class="box"><div class="row"><h2 style="margin:0">${esc(REC_LABEL[f]||f)} 입력 재생</h2><span class="sp" style="flex:1"></span>
    <select id="rpSp"><option value="1">1배</option><option value="2" selected>2배</option><option value="3">3배</option><option value="4">4배</option><option value="5">5배</option></select>
    <button class="btn ghost sm" onclick="recPlay('${esc(String(id))}','${f}')">처음부터</button>
    <button class="btn ghost sm" onclick="clearTimeout(rpTimer);document.getElementById('rp').remove()">닫기</button></div>
    <p class="hint" id="rpT" style="margin:8px 0 4px">0초</p><pre id="rpBox"></pre>
    <div class="tl">${fl.map(x=>`<span class="bad">${Math.round(x.t/1000)}초 · ${esc(FLAG_NAME[x.kind]||x.kind)}${x.n?` ${x.n}자`:''}</span>`).join('')}</div></div>`;
  document.body.appendChild(d);
  let text='',i=0;
  const step=()=>{
    if(i>=L.length){$('rpT').textContent+=' · 끝';return;}
    const [t,p,del,ins]=L[i];text=text.slice(0,p)+ins+text.slice(p+del);
    const box=$('rpBox');if(!box)return;box.textContent=text;
    const bad=fl.some(x=>Math.abs(x.t-t)<1500);box.style.boxShadow=bad?'inset 0 0 0 3px #DC2626':'none';
    $('rpT').textContent=`${Math.round(t/1000)}초${ins.length>=25?` · 한 번에 ${ins.length}자`:''}`;
    i++;const next=L[i];const sp=+(($('rpSp')||{}).value||2);
    rpTimer=setTimeout(step,next?Math.min(2000,Math.max(30,next[0]-t))/sp:0);
  };
  step();
}

function subOf(stuId){return T.subs.find(s=>String(s.student_id)===String(stuId));}
function stOf(sub){
  if(!sub)return null;
  try{if(sub.answers&&sub.answers.fields&&sub.answers.fields.sdtState)return JSON.parse(sub.answers.fields.sdtState);}catch(e){}

}

function totalOf(g){

async function aiGrade(st,avoidList){
  const avoid=(avoidList&&avoidList.length)?`\n\n다른 학생에게 이미 쓴 코멘트(아래와 같은 문장이나 같은 짜임으로 쓰지 말 것):\n${avoidList.slice(-24).map(x=>'- '+x).join('\n')}`:'';
  const rub=Object.entries(RUBRIC).map(([k,R])=>`${k} ${R.name} (${R.max}점)\n${R.levels.map(([p,d])=>`  ${p}점: ${d}`).join('\n')}`).join('\n\n');
  const sys=`너는 고등학교 '윤리문제 탐구' 수행평가(역할 교체 토론)의 채점 보조자다. 아래 채점 기준표에 따라 학생 기록을 평가요소별로 판단해 수준을 제안한다. 최종 점수는 교사가 정한다.
채점 기준표:
${rub}

판단 원칙:
- 발언 횟수나 글 길이는 고려하지 않는다. 내용의 질만 본다.
- 준비지의 예상 반론이나 재반박을 실제 토론에서 그대로 사용했는지는 평가 기준이 아니다. 쓰지 않았다는 이유로 낮게 평가하지 않는다.
- 이유에 기준표에 없는 조건을 끌어오지 않는다.
- e1은 [e1 근거] 준비지로 판단한다. 기준 문구를 나눠서 본다: 쟁점을 정확히 이해했는가(쟁점·가치), 입장이 명확한가, 근거가 구체적 사례로 뒷받침되는가, 예상 반론이 상대측이 실제로 제기할 법한 구체적·설득력 있는 반론인가. 1라운드는 참고만 한다.
- e2는 [e2 근거]로 판단한다: 상대측 논리를 정확히 파악했는가(조정 메모의 요약과 재토론 발언), 그것을 근거로 입장이나 근거를 실제로 조정·보완했는가(준비지와 비교해 무엇이 달라졌는가), 재토론에서 상대 발언을 경청·존중하며 적극적으로 참여했는가.
- e3는 [e3 근거]로 판단한다: 생각의 변화(또는 유지)를 구체적 근거와 경험에 비추어 서술했는가, 최종 입장과 이유가 논리적으로 일관되는가, 앞선 토론 내용과 명확히 연결되는가.
- quotes에는 판단 근거가 된 학생의 글을 원문 그대로 짧게(각 60자 이내) 1~2개 옮긴다. 학생 글이 아닌 것은 넣지 않는다.
- reason은 교사가 바로 이해할 수 있게 한두 문장으로 쓴다.
- comment는 학생에게 보여 줄 피드백이다. 교사가 채점표에 적는 개조식 문장으로, 모든 문장을 '~음', '~함', '~임', '~없음', '~부족함' 같은 명사형 어미로 끝낸다(존댓말·'~요'·'~습니다'·'~했어요' 금지). 1~2문장, 모두 합쳐 100자 안팎(AI 제안 근거 정도의 길이). 이 수준을 받은 이유와 한 단계 위로 가려면 무엇이 필요했는지를 이 학생이 실제로 쓴 내용(주장·사례·발언)을 구체적으로 짚어서 쓴다. 잘한 점이 있으면 먼저 짧게 쓴다. '~할 수 있었을 것', '전반적으로', '돋보임', '인상적임', '아쉬움이 남음' 같은 AI·상투 표현과 다른 학생에게도 그대로 붙일 수 있는 일반 문장은 쓰지 않는다. 예) '자율주행 사고 책임을 제조사에 두는 근거는 분명함. 다만 예상 반론이 "비용이 든다" 한 줄에 그쳐 상대가 실제로 펼칠 반박을 예측하지 못함.'
- note에는 준비지의 수준과 1라운드에서 학생이 자기 근거를 설명·방어하는 수준이 크게 다른 경우(예: 준비지는 전문적인데 토론에서는 자기 근거를 설명하지 못함)처럼 교사가 확인할 점이 있을 때만 한 문장으로 쓴다. 없으면 빈 문자열.
반드시 아래 JSON만 출력한다. 다른 글은 쓰지 않는다.
{"note":"...","e1":{"level":9|7|5|3,"reason":"...","comment":"...","quotes":["..."]},"e2":{"level":8|6|4|2,"reason":"...","comment":"...","quotes":["..."]},"e3":{"level":3|1,"reason":"...","comment":"...","quotes":["..."]}}${avoid}`;
  const txt=await callAI(sys,[{role:'user',content:gradeInput(st)}],1600,0);
  const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error('AI 응답을 읽지 못했어요');
  const j=JSON.parse(m[0]);
  const fix=(k)=>{const lv=RUBRIC[k].levels.map(x=>x[0]);const o=j[k]||{};let v=+o.level;if(!lv.includes(v))v=lv.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);return{level:v,reason:String(o.reason||''),comment:String(o.comment||''),quotes:(o.quotes||[]).slice(0,2).map(String)};};
  return{e1:fix('e1'),e2:fix('e2'),e3:fix('e3'),note:String(j.note||''),at:new Date().toISOString()};
}
async function gradeOne(id,reopen){
  const st=stOf(subOf(id));if(!st)return;
  const b=$('aiOneBtn');if(b){b.disabled=true;b.textContent='AI가 읽는 중...';}
  try{
    const others=sdOtherComments(id);
    let ai=await aiGrade(st,others);
    // 다른 학생 코멘트와 거의 같은 문장이면 한 번 더 받기
    if(['e1','e2','e3'].some(k=>others.some(o=>sdSim(o,ai[k].comment)>0.55)))ai=await aiGrade(st,others.concat(['e1','e2','e3'].map(k=>ai[k].comment)));
    const prev=gradeOf(id)||{};
    const g=Object.assign({special:'none'},prev,{ai});
    if(!prev.final){g.e1=ai.e1.level;g.e2=ai.e2.level;g.e3=ai.e3.level;}
    await writeGrade(id,g);
    if(reopen)openStu(id);
    return true;
  }catch(e){if(b){b.disabled=false;b.textContent='AI 제안 받기';}if(reopen)alert('AI 채점 제안을 받지 못했어요: '+e.message);return false;}
}
async function bulkGrade(){
  const targets=T.roster.filter(r=>{const s=subOf(r.id);return s&&s.submitted&&!(gradeOf(r.id)||{}).ai;});
  if(!targets.length)return;
  if(!confirm(`제출한 학생 ${targets.length}명의 기록을 AI가 읽고 평가요소별 수준을 제안해요. 한 명에 10~20초쯤 걸려요. 시작할까요?`))return;
  T.bulk=true;drawStaff();let ok=0;
  for(let i=0;i<targets.length;i++){const m=$('bulkMsg');if(m)m.textContent=`${i+1}/${targets.length} · ${targets[i].name}`;if(await gradeOne(targets[i].id,false))ok++;}
  T.bulk=false;drawStaff();const m=$('bulkMsg');if(m)m.textContent=`${ok}명 제안 완료. 학생을 눌러 확인하고 점수를 확정해 주세요.`;
}
function exportCsv(){
  const rows=[['반','번호','이름','주제','처음 입장','상태','입장·근거·반론(9)','재토론 반영(8)','성찰(3)','특수 처리','합계','확정 여부','코멘트①','코멘트②','코멘트③','붙여넣기·의심 입력','화면 이탈']];
  T.roster.forEach(r=>{const sub=subOf(r.id),st=stOf(sub),t=st&&topicOf(st),g=gradeOf(r.id)||{};
    const sp=SPECIAL.find(x=>x[0]===g.special);
    rows.push([r.class_name,r.number,r.name,t?t.title:'',t?sideLabel(t,st.side):'',stageLabel(st,sub)[0],g.e1??'',g.e2??'',g.e3??'',sp&&sp[0]!=='none'?sp[1]:'',totalOf(g)??'',g.final?'확정':g.ai?'AI 제안만':'',...['e1','e2','e3'].map(k=>(g.comments&&g.comments[k])||(g.ai&&g.ai[k]&&g.ai[k].comment)||''),st?(st.flags||[]).length:'',st?(st.leaves||[]).length:'']);});
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='윤리토론_수행평가_점수.csv';document.body.appendChild(a);a.click();a.remove();
}
