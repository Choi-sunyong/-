<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다른 사람으로 살아보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#14161b;--card:#1f222a;--card2:#272b35;--ink:#f3f4f6;--sub:#a3a8b4;--line:#343946;--acc:#ffcf4a;--red:#ff5c6c;--blue:#5aa7ff;--green:#4ad08a;--r:18px}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
  button,textarea,input,select{font-family:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 110px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
  .top .who{font-size:13px;color:var(--sub)}
  .top .sp{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
  .steps{display:flex;gap:4px;margin:0 0 18px}
  .steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
  .steps i.on{background:var(--acc)}
  h1{font-size:28px;line-height:1.25;letter-spacing:-.03em;margin:8px 0 10px}
  h2{font-size:21px;letter-spacing:-.02em;margin:0 0 8px}
  p.lead{color:var(--sub);font-size:15.5px;line-height:1.65;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--ink)}
  .btn.pri{background:var(--acc);color:#1b1b1b}
  .btn.full{width:100%}
  .btn:disabled{opacity:.45;cursor:default}
  .cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
  .cta .in{max-width:640px;margin:0 auto}
  /* 카드 뽑기 */
  .deck{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}
  .back{aspect-ratio:3/4;border-radius:14px;background:repeating-linear-gradient(45deg,#2b2f3a 0 10px,#252933 10px 20px);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;color:#59607a;cursor:pointer;transition:transform .15s}
  .back:active{transform:scale(.96)}
  .idc{border-radius:20px;padding:22px;background:linear-gradient(160deg,#2a2f3c,#1d2029);border:1px solid #3d4354;position:relative;overflow:hidden;animation:flip .5s ease}
  @keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
  .idc .em{font-size:52px;line-height:1}
  .idc .nm{font-size:26px;font-weight:800;margin:10px 0 2px;letter-spacing:-.02em}
  .idc .tg{color:var(--acc);font-weight:700;font-size:14.5px}
  .idc .bio{color:#d5d8df;font-size:15px;line-height:1.7;margin:14px 0 0}
  /* 장면 */
  .gauge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .gauge .l{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:7px}
  .gauge .l b{color:var(--ink)}
  .bar{height:10px;border-radius:10px;background:#2b2f3a;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#ffb84a,var(--red));transition:width .6s}
  .scene .no{font-size:13px;color:var(--acc);font-weight:700}
  .scene .tt{font-size:20px;font-weight:800;margin:4px 0 10px;letter-spacing:-.02em}
  .scene .tx{font-size:16px;line-height:1.75;color:#e4e6ea}
  .scene .tx q{display:block;quotes:none;margin:10px 0;padding:10px 14px;border-left:3px solid var(--acc);background:#262a33;border-radius:0 10px 10px 0;font-weight:600;color:#fff}
  .ch{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:15px 16px;font-size:15.5px;font-weight:600;margin-top:10px;cursor:pointer;line-height:1.5}
  .ch.on{border-color:var(--acc);background:#332f22}
  .ch:disabled{cursor:default}
  .res{margin-top:12px;padding:13px 15px;border-radius:12px;background:#2a1f24;color:#ffd5da;font-size:15px;line-height:1.65;animation:fade .4s}
  .res.calm{background:#1d2a24;color:#cdf3dd}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  label.fl{display:block;font-size:15px;font-weight:700;margin:16px 0 8px;line-height:1.5}
  label.fl small{display:block;font-weight:500;color:var(--sub);font-size:13px;margin-top:2px}
  textarea.ta{width:100%;min-height:96px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:#171a20;color:var(--ink);padding:12px 13px;font-size:15.5px;line-height:1.6}
  textarea.ta:focus,input.ti:focus{outline:2px solid var(--blue);outline-offset:0}
  textarea.ta[readonly]{opacity:.7}
  .cnt{font-size:12.5px;color:var(--sub);text-align:right;margin-top:4px}
  .cnt.ok{color:var(--green)}
  /* 영상·댓글 */
  .vids{display:grid;gap:10px}
  .vid{display:flex;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink)}
  .vid .n{width:34px;height:34px;border-radius:10px;background:#ff3b3b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .vid .t{font-size:14.5px;font-weight:700;line-height:1.4}
  .vid .t small{display:block;color:var(--sub);font-weight:500;font-size:12.5px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:var(--card2);color:var(--sub);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--ink);color:#111;border-color:var(--ink)}
  .feed{display:grid;gap:10px;margin-top:12px}
  .cm{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .cm .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:5px;flex-wrap:wrap}
  .cm .h b{color:var(--ink);font-size:13.5px}
  .cm .tx{font-size:15px;line-height:1.6;white-space:pre-wrap}
  .cm .del{margin-left:auto;background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;font-size:13px}
  .vt{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#3a2020;color:#ffb3b3}
  /* 판정 */
  .jd{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
  .jd .tx{font-size:15.5px;line-height:1.6;font-weight:600}
  .jd .ops{display:flex;gap:6px;margin-top:10px}
  .jd .ops button{flex:1;border:1px solid var(--line);background:#1b1e25;color:var(--sub);border-radius:10px;padding:10px 4px;font-size:14px;font-weight:700;cursor:pointer}
  .jd .ops button:disabled{cursor:default}
  .jd .ops button.on{color:#111;border-color:transparent}
  .jd .ops button.on.k1{background:var(--blue)}
  .jd .ops button.on.k2{background:var(--red)}
  .jd .ops button.on.k3{background:var(--acc)}
  .jd .fb{margin-top:9px;font-size:13.5px;color:var(--sub);line-height:1.55}
  .jd .fb b{color:var(--ink)}
  select.sel{width:100%;border-radius:12px;border:1px solid var(--line);background:#171a20;color:var(--ink);padding:12px 13px;font-size:15px;-webkit-appearance:none;appearance:none}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center}
  .done{text-align:center;padding:40px 10px}
  .done .em{font-size:60px}
  table.st{width:100%;border-collapse:collapse;font-size:14px}
  table.st td,table.st th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
  table.st th{color:var(--sub);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="done"><div class="em">🎴</div><p class="lead">불러오는 중…</p></div></div>
<div class="cta" id="cta" hidden><div class="in" id="ctaIn"></div></div>

const P=[

 {tt:'입대 통지서',tx:'휴학계를 내고 입대를 앞둔 날, 친척 어른이 어깨를 두드린다.<q>"남자면 다 가는 거야. 좀 참아."</q>',c:[

  {t:'반대편 이야기도 찾아본다',g:0,r:'경력 단절을 다룬 영상을 하나 봤다. 다 동의하진 않았지만 생각이 조금 복잡해졌다.',calm:1}]}

 {tt:'밤 11시 귀갓길',tx:'야근을 마치고 골목에 들어서자 뒤에서 발소리가 따라온다. 집에 들어와 문을 두 번 잠그고, 배달은 남자 목소리 녹음으로 받는다.',c:[

let ID=null,MODE='pending',SUBMITTED=false,STEP=0,FEEDCLS='';
let S={persona:'',drawn:false,sc:0,ch:[null,null,null,null],u:['','','',''],end:null,r1:'',r2:'',r3:'',cv:0,cmine:[],j:{},rw1i:'',rw1:'',rw2i:'',rw2:'',common:''};

const STEPS=['card','life','end','look','comment','clean','common'];
function per(){return P.find(p=>p.k===S.persona);}
function gauge(){const p=per();if(!p)return 0;let g=0;S.ch.forEach((c,i)=>{if(c!=null)g+=p.s[i].c[c].g;});return Math.min(100,Math.round(g/80*100));}

window.addEventListener('message',ev=>{const d=ev.data;if(!d)return;
  if(d.type==='sittdartha_identity'&&MODE==='pending')boot(d);
  if(d.type==='sittdartha_ws_submit_result'){if(d.ok){SUBMITTED=true;render();}else toast('제출하지 못했어요. 다시 눌러 주세요.');}
});
setTimeout(()=>{if(MODE==='pending')boot({preview:true,student:{name:'미리보기'}});},4000);

function pick(d){
  const n=parseInt(String((d.student&&d.student.number)||'').replace(/\D/g,''),10);
  if(!isNaN(n))return P[(n-1+P.length*10)%P.length].k;
  return P[Math.floor(Math.random()*P.length)].k;
}
function boot(d){
  ID=d;MODE=d.staff?'staff':(d.preview||!d.teacherId)?'preview':'student';
  if(MODE==='staff'){FEEDCLS=(d.classes||[])[0]||'';render();loadFeed();feedT=setInterval(()=>loadFeed(1),25000);return;}
  try{const f=(d.prevAnswers&&d.prevAnswers.fields)||{};if(f._state)S=Object.assign(S,JSON.parse(f._state));}catch(e){}
  if(!S.persona)S.persona=pick(d);
  SUBMITTED=!!d.readonly;
  STEP=SUBMITTED?STEPS.length:Math.max(0,STEPS.indexOf(S.step||'card'));
  FEEDCLS=String((d.student&&d.student.class)||'');
  render();
}

/* ---------- 저장 ---------- */
let saveT=null;
function fields(){
  const p=per()||{nm:'',tg:''};const f={persona:`${p.nm}(${p.age}, ${p.tg})`};
  (p.s||[]).forEach((sc,i)=>{f['ch'+(i+1)]=S.ch[i]!=null?`${sc.tt}: ${sc.c[S.ch[i]].t}`:'';f['u'+(i+1)]=S.u[i]||'';});
  f.gauge=gauge()+'%';
  f.end=S.end==null?'':(S.end===0?`"${p.bj} 문제야!"`:'제대로 말하기');
  f.r1=S.r1;f.r2=S.r2;f.r3=S.r3;
  f.comments=S.cmine.map(c=>`[영상 ${c.v}] ${c.t}`).join('\n');
  f.judge=JUDGE.map((x,i)=>`${i+1}. ${S.j[i]?LABEL[S.j[i]]:'-'}`).join(' / ');
  f.rewrite1=S.rw1i!==''?`원래: ${JUDGE[S.rw1i]?JUDGE[S.rw1i].t:''}\n고쳐 쓴 말: ${S.rw1}`:'';
  f.rewrite2=S.rw2i!==''?`원래: ${S.rw2i}\n고쳐 쓴 말: ${S.rw2}`:'';
  f.common=S.common;
  f._state=JSON.stringify(Object.assign({},S,{step:STEPS[Math.min(STEP,STEPS.length-1)]}));
  return f;
}
function save(now){if(MODE!=='student'||SUBMITTED)return;clearTimeout(saveT);const go=()=>{try{parent.postMessage({type:'sittdartha_ws_save',answers:{fields:fields(),draft:true},quiet:true},'*');}catch(e){}};if(now)go();else saveT=setTimeout(go,2500);}

/* ---------- 화면 ---------- */
function stepsBar(){return `<div class="steps">${STEPS.map((s,i)=>`<i class="${i<=STEP?'on':''}"></i>`).join('')}</div>`;}
function topBar(){const p=per();return `<div class="top">${p&&S.drawn?`<span class="chip">${p.em} ${esc(p.nm)} · ${p.age}세</span>`:''}<span class="sp"></span><span class="who">${esc(ID&&ID.student&&ID.student.name||'')}</span></div>`;}
function cta(html){const c=$('cta');if(!html){c.hidden=true;return;}$('ctaIn').innerHTML=html;c.hidden=false;}
function go(n){STEP=n;save(true);render();window.scrollTo(0,0);}
function ta(id,val,ph,min,ro){return `<textarea class="ta" id="${id}" placeholder="${esc(ph||'')}" ${ro?'readonly':''} oninput="onTa('${id}',this.value,${min||0})">${esc(val)}</textarea>${min?`<div class="cnt ${len(val)>=min?'ok':''}" id="${id}_c">${len(val)}자${len(val)<min?` / ${min}자 이상`:''}</div>`:''}`;}
function onTa(id,v,min){
  const m=id.match(/^u(\d)$/);if(m)S.u[+m[1]]=v;else S[id]=v;
  const c=$(id+'_c');if(c){c.textContent=len(v)+'자'+(len(v)<min?` / ${min}자 이상`:'');c.className='cnt'+(len(v)>=min?' ok':'');}
  save();refreshCta();
}
let refreshCta=()=>{};

function render(){
  const app=$('app');
  if(MODE==='staff'){app.innerHTML=staffView();cta(null);return;}
  if(SUBMITTED||STEP>=STEPS.length){const p=per();app.innerHTML=`<div class="done"><div class="em">${p?p.em:'✅'}</div><h1>제출했어요</h1><p class="lead">${p?esc(p.nm)+'의 인생을 살아 본 기록이 선생님께 전달됐어요.':''}</p></div>`+feedBlock(false);cta(null);loadFeed();return;}
  const s=STEPS[STEP];
  app.innerHTML=topBar()+stepsBar()+VIEW[s]();
  refreshCta=CTA[s]||(()=>cta(null));refreshCta();
  if(s==='comment'||s==='clean'){loadFeed();clearInterval(feedT);feedT=setInterval(()=>loadFeed(1),25000);}else{clearInterval(feedT);}
}

   ${sc.c.map((o,j)=>`<button class="ch ${c===j?'on':''}" ${c!=null?'disabled':''} onclick="choose(${k},${j})">${esc(o.t)}</button>`).join('')}
   ${c!=null?`<div class="res ${sc.c[c].calm?'calm':''}">${esc(sc.c[c].r)}</div>
   <label class="fl">이 순간, ${esc(p.nm)}은(는) 무엇이 부당하다고 느꼈을까요?<small>${esc(p.nm)}의 마음으로 써 보세요.</small></label>${ta('u'+k,S.u[k],'',10)}`:''}</div>`;
 },
 end(){
  const p=per();const g=gauge();
  return `<div class="gauge"><div class="l"><span>쌓인 억울함</span><b>${g}%</b></div><div class="bar"><i style="width:${g}%"></i></div></div>
   <div class="card scene"><div class="no">마지막 장면</div><div class="tt">이 분노를 어디로 보낼까?</div>
   <div class="tx">아무도 들어 주지 않았고, 억울함은 쌓여만 갔다. 어느 날 밤, 휴대폰 화면 속 누군가가 속 시원하게 외친다.<q>"이게 다 ${esc(p.blame)} 때문이야!"</q></div>
   <button class="ch ${S.end===0?'on':''}" ${S.end!=null?'disabled':''} onclick="ending(0)">"맞아, ${esc(p.bj)} 문제야!"</button>
   <button class="ch ${S.end===1?'on':''}" ${S.end!=null?'disabled':''} onclick="ending(1)">화를 누르고, 내가 겪은 일을 제대로 말해 본다</button>
   ${S.end===0?`<div class="res">속은 시원했다. 하지만 아무것도 바뀌지 않았다. 그리고 그 말을 들은 누군가도, 똑같은 이유로 ${esc(p.nm)}을(를) 미워하기 시작했다.</div>`:''}
   ${S.end===1?`<div class="res calm">쉽지 않았다. 목소리가 떨렸다. 하지만 처음으로 "그랬구나, 많이 힘들었겠다"라는 대답을 들었다.</div>`:''}</div>`;
 },
 look(){
  const p=per();
  return `<h2>${esc(p.nm)}의 인생을 돌아보며</h2><p class="lead">이제 다시 나로 돌아와요. 방금 살아 본 인생을 떠올리며 답해 보세요.</p>
   <div class="card"><label class="fl" style="margin-top:0">${esc(p.nm)}(으)로 살아가면서 무엇이 가장 부당하다고 느꼈나요?</label>${ta('r1',S.r1,'',30)}
   <label class="fl">${esc(p.nm)}이(가) 가장 듣고 싶었던 말은 무엇이었을까요?</label>${ta('r2',S.r2,'',5)}
   <label class="fl">${esc(p.nm)}(으)로 살아 보기 전과 비교해, ${esc(p.tg)}에 대한 나의 생각은 어떻게 달라졌나요?</label>${ta('r3',S.r3,'',30)}</div>`;
 },
 comment(){
  const p=per();
  return `<h2>${esc(p.nm)}(이)라면 이 영상에 어떤 댓글을 달까?</h2><p class="lead">영상을 본 뒤, ${esc(p.nm)}의 입장에서 댓글을 남겨 보세요. 반 친구들의 댓글창에는 이름 없이 카드 이름으로만 보여요.</p>
   <div class="vids">${VIDS.map(v=>`<a class="vid" href="${v.u}" target="_blank" rel="noopener"><span class="n">${v.n}</span><span class="t">${esc(v.t)}<small>${esc(v.c)}</small></span></a>`).join('')}</div>
   <div class="card" style="margin-top:14px"><div class="seg">${VIDS.map(v=>`<button class="${S.cv===v.n?'on':''}" onclick="S.cv=${v.n};render()">영상 ${v.n}</button>`).join('')}</div>
   <textarea class="ta" id="cmIn" style="margin-top:10px" maxlength="150" placeholder="${esc(p.nm)}의 댓글"></textarea>
   <button class="btn pri full" style="margin-top:10px" onclick="postCm()">댓글 달기</button>
   ${S.cmine.length?`<div class="cnt ok" style="text-align:left;margin-top:8px">내가 단 댓글 ${S.cmine.length}개</div>`:''}</div>`+feedBlock(false);
 },
 clean(){
  const mine=JUDGE.map((x,i)=>i).filter(i=>S.j[i]===2);
  return `<h2>댓글창 정화</h2><p class="lead">영상 아래 달린 댓글들이에요. 불만을 말하는 <b style="color:var(--blue)">문제 제기</b>인지, 사람을 깎아내리는 <b style="color:var(--red)">혐오</b>인지 판정해 보세요.</p>
   ${JUDGE.map((x,i)=>`<div class="jd"><div class="tx">${esc(x.t)}</div><div class="ops">${[1,2,3].map(k=>`<button class="k${k} ${S.j[i]===k?'on':''}" onclick="judge(${i},${k})" ${S.j[i]?'disabled':''}>${LABEL[k]}</button>`).join('')}</div>
     ${S.j[i]?`<div class="fb">선생님 판정 <b>${LABEL[x.k]}</b> · ${esc(x.why)}</div>`:''}</div>`).join('')}
   <div class="card" style="margin-top:16px"><label class="fl" style="margin-top:0">혐오 댓글 하나를 골라, 같은 불만은 살리고 혐오만 뺀 말로 고쳐 써 보세요.</label>
   <select class="sel" onchange="S.rw1i=this.value;save();refreshCta()"><option value="">고르세요</option>${JUDGE.map((x,i)=>`<option value="${i}" ${String(S.rw1i)===String(i)?'selected':''}>${esc(x.t)}</option>`).join('')}</select>
   <div style="margin-top:8px">${ta('rw1',S.rw1,'고쳐 쓴 댓글',10)}</div>
   <label class="fl">반 친구들의 댓글 중 하나를 골라, 더 잘 전해지는 말로 고쳐 써 보세요.</label>
   <select class="sel" id="rw2sel" onchange="S.rw2i=this.value;save();refreshCta()"><option value="">고르세요</option>${FEED.filter(c=>!isMine(c)).map(c=>`<option value="${esc(c.text)}" ${S.rw2i===c.text?'selected':''}>[${esc(c.persona)}] ${esc(c.text.slice(0,40))}</option>`).join('')}</select>
   <div style="margin-top:8px">${ta('rw2',S.rw2,'고쳐 쓴 댓글',10)}</div></div>`+feedBlock(false);
 },
 common(){
  const p=per();
  return `<h2>모두가 동의할 수 있는 한 문장</h2><p class="lead">모둠 친구들과 서로 뽑은 카드를 소개하고, 각자 겪은 부당함을 이야기해 보세요. 그리고 지훈, 수연, 영철, 순자, 하은, 민준이 <b style="color:var(--ink)">모두 고개를 끄덕일 수 있는 한 문장</b>을 만들어 보세요.</p>
   <div class="card">${ta('common',S.common,'우리 모두가 동의할 수 있는 한 문장',10)}</div>
   <div class="card"><table class="st"><tr><th>나의 카드</th><td>${p.em} ${esc(p.nm)} · ${esc(p.tg)}</td></tr><tr><th>쌓인 억울함</th><td>${gauge()}%</td></tr><tr><th>마지막 선택</th><td>${S.end===0?`"${esc(p.bj)} 문제야!"`:'제대로 말하기'}</td></tr><tr><th>남긴 댓글</th><td>${S.cmine.length}개</td></tr></table></div>`;
 }
};
const CTA={
 card(){cta(S.drawn?`<button class="btn pri full" onclick="go(1)">${esc(per().nm)}의 인생 시작하기</button>`:null);},
 life(){const k=Math.min(3,S.sc||0);const ok=S.ch[k]!=null&&len(S.u[k])>=10;
  cta(`<button class="btn pri full" ${ok?'':'disabled'} onclick="nextScene(${k})">${k<3?'다음 장면':'마지막 장면으로'}</button>`);},
 end(){cta(S.end!=null?`<button class="btn pri full" onclick="go(3)">나로 돌아오기</button>`:null);},
 look(){const ok=len(S.r1)>=30&&len(S.r2)>=5&&len(S.r3)>=30;cta(`<button class="btn pri full" ${ok?'':'disabled'} onclick="go(4)">영상 보러 가기</button>`);},
 comment(){cta(`<button class="btn pri full" ${S.cmine.length?'':'disabled'} onclick="go(5)">댓글창 정화하기</button>`);},
 clean(){const ok=JUDGE.every((x,i)=>S.j[i])&&S.rw1i!==''&&len(S.rw1)>=10&&S.rw2i!==''&&len(S.rw2)>=10;cta(`<button class="btn pri full" ${ok?'':'disabled'} onclick="go(6)">마지막 단계로</button>`);},
 common(){cta(`<button class="btn pri full" ${len(S.common)>=10?'':'disabled'} onclick="submitAll()">제출하기</button>`);}
};
function draw(){S.drawn=true;save(true);render();}
function choose(k,j){if(S.ch[k]!=null)return;S.ch[k]=j;save(true);render();setTimeout(()=>{const t=$('u'+k);t&&t.scrollIntoView({behavior:'smooth',block:'center'});},300);}
function nextScene(k){if(k>=3)go(2);else{S.sc=k+1;save(true);render();window.scrollTo(0,0);}}
function ending(v){if(S.end!=null)return;S.end=v;save(true);render();}
function judge(i,k){if(S.j[i])return;S.j[i]=k;save();const y=window.scrollY;render();window.scrollTo(0,y);}
function submitAll(){if(!confirm('제출할까요? 제출하면 고칠 수 없어요.'))return;clearTimeout(saveT);try{parent.postMessage({type:'sittdartha_ws_submit',answers:{fields:fields()}},'*');}catch(e){}}

/* ---------- 반 댓글창 ---------- */
function isMine(c){return ID&&ID.student&&ID.student.id!=null&&c.student_id===ID.student.id;}
let feedAt=0;
async function loadFeed(force){
  if(!ID||!ID.worksheetId||!sb())return;
  if(!force&&Date.now()-feedAt<10000)return;feedAt=Date.now();
  try{let q=sb().from('hate_comments').select('id,class_name,student_id,name,persona,video,text,created_at').eq('worksheet_id',ID.worksheetId).order('created_at',{ascending:false}).limit(150);
    if(FEEDCLS)q=q.eq('class_name',FEEDCLS);
    const{data,error}=await q;if(error)throw error;
    const sig=JSON.stringify((data||[]).map(c=>c.id));const old=JSON.stringify(FEED.map(c=>c.id));FEED=data||[];
    if(sig!==old){const el=$('feed');if(el)el.outerHTML=feedBlock(MODE==='staff');}
  }catch(e){}
}
function feedBlock(staff){
  return `<div id="feed"><h2 style="margin-top:22px">${staff?'댓글창':'우리 반 댓글창'} <span class="chip" style="font-size:12px">${FEED.length}</span></h2>
   <div class="feed">${FEED.length?FEED.map(c=>`<div class="cm"><div class="h"><b>${esc(c.persona)}</b><span class="vt">영상 ${c.video}</span>${staff?`<span>${esc(c.name)}</span>`:''}${staff||isMine(c)?`<button class="del" onclick="delCm(${c.id})">삭제</button>`:''}</div><div class="tx">${esc(c.text)}</div></div>`).join(''):'<div class="cm"><div class="tx" style="color:var(--sub)">아직 댓글이 없어요.</div></div>'}</div></div>`;
}
async function postCm(){
  const t=String(($('cmIn')||{}).value||'').trim();const p=per();
  if(!S.cv){toast('어느 영상에 다는 댓글인지 골라 주세요');return;}
  if(len(t)<5){toast('댓글을 조금 더 써 주세요');return;}
  if(MODE!=='student'){S.cmine.push({v:S.cv,t});render();return;}
  try{const{error}=await sb().from('hate_comments').insert({worksheet_id:ID.worksheetId,class_name:FEEDCLS,student_id:ID.student.id,name:`${ID.student.class||''} ${ID.student.number||''} ${ID.student.name||''}`.trim(),persona:`${p.em} ${p.nm}(${p.age})`,video:S.cv,text:t.slice(0,150)});
    if(error)throw error;S.cmine.push({v:S.cv,t:t.slice(0,150)});save(true);render();toast('댓글을 달았어요');}
  catch(e){toast('댓글을 올리지 못했어요. 다시 눌러 주세요.');}
}
async function delCm(id){if(!confirm('이 댓글을 삭제할까요?'))return;try{await sb().from('hate_comments').delete().eq('id',id);}catch(e){}FEED=FEED.filter(c=>c.id!==id);const el=$('feed');if(el)el.outerHTML=feedBlock(MODE==='staff');}

/* ---------- 선생님 ---------- */
function staffView(){
  const cls=(ID.classes||[]);
  return `<div class="top"><span class="chip">선생님</span><span class="sp"></span></div><h1>다른 사람으로 살아보기</h1>
   <div class="card"><table class="st">${P.map(p=>`<tr><td>${p.em} ${esc(p.nm)}</td><td>${p.age}세 · ${esc(p.tg)}</td><td style="color:var(--sub)">"${esc(p.bj)} 문제야"</td></tr>`).join('')}</table></div>
   <div class="seg">${cls.map(c=>`<button class="${FEEDCLS===c?'on':''}" onclick="FEEDCLS='${esc(c)}';FEED=[];render();loadFeed(1)">${esc(c)}</button>`).join('')}<button class="${!FEEDCLS?'on':''}" onclick="FEEDCLS='';FEED=[];render();loadFeed(1)">전체</button></div>`+feedBlock(true);
}
</script>
</body>
</html>
