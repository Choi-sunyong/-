<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다른 사람으로 살아보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#f4f2ee;--paper:#fbfaf7;--ink:#1d2329;--sub:#5d6670;--faint:#8b939b;--line:#dcd8d0;--acc:#8C1D3C;--g:#2f6f4f;--y:#a0782a;--t:#2a6a72;--hint:#e6efec;--r:6px;
    --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
  button,textarea{font-family:inherit;color:inherit}
  .intro{max-width:620px;margin:0 auto;padding:46px 20px 60px}
  .intro .kick{font-size:13px;color:var(--sub);letter-spacing:.02em}
  .intro h1{font-family:var(--serif);font-size:40px;margin:10px 0 14px;letter-spacing:-.02em}
  .intro h1 em{font-style:normal;color:var(--acc)}
  .intro p{font-size:16px;line-height:1.75;color:#38414a}
  .cta{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer}
  .cta:disabled{opacity:.4;cursor:default}
  .ghost{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;font-size:14px;cursor:pointer}
  .cert{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:22px 0;animation:up .5s ease}
  .cert .band{background:var(--acc);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.06em}
  .cert .bd{padding:20px 20px 22px}
  .cert .lbl{font-size:12px;color:var(--faint)}
  .cert h2{font-family:var(--serif);font-size:30px;margin:4px 0 12px}
  .cert .story{font-size:15.5px;line-height:1.75;color:#38414a;margin:0 0 14px}
  .cert dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
  .cert dt{color:var(--faint)}
  .cert dd{margin:0;font-weight:600}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,242,238,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .topbar .in{max-width:1240px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-weight:800;font-size:17px;white-space:nowrap}
  .brand em{font-style:normal;color:var(--acc)}
  .agebox{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .age{font-family:var(--serif);font-weight:800;font-size:32px;line-height:1}
  .age small{font-size:15px;margin-left:2px}
  .yr{min-width:0;flex:1;max-width:240px}
  .yr .t{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .prog{height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--acc);width:0}
  .speed{display:flex;gap:5px;flex-wrap:wrap}
  .speed button{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:13px;cursor:pointer}
  .speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .life{max-width:1240px;margin:0 auto;padding:16px 14px 80px;display:grid;grid-template-columns:280px 1fr 320px;gap:16px;align-items:start}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
  .panel h3{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
  .panel h3 .lbl{font-size:12px;color:var(--faint);font-weight:500}
  .idc .nm{font-family:var(--serif);font-size:22px;font-weight:800}
  .idc .sub{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.6}
  .idc .mrz{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:12px;letter-spacing:.06em;overflow:hidden;white-space:nowrap}
  .stat{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:8px;font-size:14px;margin:7px 0}
  .stat .b{height:8px;background:#e7e4de;border-radius:2px;overflow:hidden}
  .stat .b i{display:block;height:100%;transition:width .5s}
  .stat .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
  .feed{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
  .feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:9px 0;border-top:1px solid #ebe8e2;font-size:15px;line-height:1.55}
  .feed li:first-child{border-top:0}
  .feed li .a{color:var(--faint);font-size:13px;padding-top:2px}
  .feed li.u .x{color:var(--acc);font-weight:600}
  .feed li .x small{display:block;color:var(--sub);font-weight:400;font-size:13px}
  .comps{list-style:none;margin:0;padding:0}
  .comps li{padding:10px 0;border-top:1px solid #ebe8e2}
  .comps li:first-child{border-top:0}
  .comps .h{display:flex;justify-content:space-between;font-size:14px}
  .comps .h b{font-weight:700}
  .comps .h span{color:var(--faint);font-size:12.5px}
  .comps .m{font-size:12.5px;color:var(--faint)}
  .news{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto}
  .news li{padding:10px 0;border-top:1px solid #ebe8e2;animation:fadein .4s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .news li:first-child{border-top:0}
  .news .w{font-size:12.5px;color:var(--faint)}
  .news .x{font-size:14.5px;font-weight:600;margin:2px 0 6px}
  .rx{display:flex;gap:5px;flex-wrap:wrap}
  .rx button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--sub)}
  .rx button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rx button.on.k{background:#c98a1b;border-color:#c98a1b}
  .grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .grid10 i{aspect-ratio:1;background:#e7e4de;border-radius:2px;border:1px solid transparent}
  .grid10 i.l1{background:#cfdcd4}.grid10 i.l2{background:#8fb5a0}.grid10 i.l3{background:#2f6f4f}
  .grid10 i.l0{background:#d9cfc0}
  .grid10 i.u{border-color:var(--acc)}
  .grid10 i.now{outline:2px solid var(--acc);outline-offset:1px}
  .grid10 i.off{opacity:.25}
  .gk{font-size:12px;color:var(--faint);margin-top:8px}
  .scrim{position:fixed;inset:0;background:rgba(30,33,37,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
  .modal{background:var(--paper);border-radius:6px;max-width:560px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .3s;max-height:calc(100vh - 32px);overflow:auto}
  .modal .mh{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--t)}
  .modal .mb{padding:18px 20px 20px}
  .modal h2{font-family:var(--serif);font-size:26px;margin:0 0 6px}
  .modal .stx{font-size:15px;color:#38414a;line-height:1.7;margin:0 0 12px}
  .modal .src{font-size:12.5px;color:var(--faint);margin:-4px 0 12px}
  .modal .peer{background:var(--hint);border-left:3px solid var(--g);padding:9px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#3b4a45;margin-bottom:14px}
  .modal .scene{font-size:16px;line-height:1.8}
  .modal .scene q{display:block;quotes:none;margin:10px 0;padding:10px 14px;background:#f1eee8;border-radius:4px;font-weight:700}
  .modal .was{background:#fff4dd;border:1px solid #ecd398;border-radius:5px;padding:10px 12px;font-size:14px;margin:12px 0 0;color:#6b4d0f;line-height:1.6}
  .modal .was b{color:#8a5a00}
  .modal .q{font-family:var(--serif);font-size:19px;font-weight:800;margin:18px 0 10px;line-height:1.45}
  .modal textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:4px;background:#f6f4ef;padding:10px 12px;font-size:15px;line-height:1.6;resize:vertical}
  .rate{display:flex;gap:6px}
  .rate button{flex:1;border:1px solid var(--line);background:#fff;border-radius:4px;padding:10px 0;font-size:15px;font-weight:700;cursor:pointer}
  .rate button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .rl{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:4px}
  .opt{display:grid;grid-template-columns:24px 1fr;gap:10px;width:100%;text-align:left;background:#eef0ee;border:1px solid #dfe3e0;border-radius:4px;padding:13px 14px;margin-top:8px;cursor:pointer;font-size:15px;line-height:1.5}
  .opt .n{font-family:var(--mono);color:var(--faint);font-size:13px;padding-top:2px}
  .opt b{font-weight:700}
  .opt small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
  .opt:disabled{opacity:.45;cursor:default}
  .opt.on{background:#f3e3e8;border-color:#d7a9b6;opacity:1}
  .res{margin-top:10px;padding:11px 13px;border-radius:4px;background:#f3e3e8;color:#5e1328;font-size:15px;line-height:1.65}
  .pick{display:grid;gap:8px}
  .pick button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:5px;padding:12px 14px;cursor:pointer;font-size:15px}
  .pick button small{color:var(--faint);font-size:12.5px}
  .pick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pick button.on small{color:#cfd3d8}
  .wrapc{max-width:760px;margin:0 auto;padding:30px 18px 90px}
  .wrapc h1{font-family:var(--serif);font-size:30px;margin:6px 0 10px}
  .wrapc p.lead{font-size:16px;line-height:1.75;color:#38414a}
  table.cmp{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--paper);border:1px solid var(--line)}
  table.cmp th,table.cmp td{border-bottom:1px solid #ebe8e2;padding:10px;text-align:left;vertical-align:top}
  table.cmp th{font-size:12.5px;color:var(--faint);font-weight:600;background:#f1eee8}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eee;color:var(--sub)}
  .tag.k{background:#fbe7c3;color:#7a4f00}
  .tag.s{background:#e3ece7;color:#2f6f4f}
  .big{font-family:var(--serif);font-size:44px;font-weight:800;color:var(--acc);line-height:1}
  .statg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
  .statg .panel{margin:0}
  .statg .panel p{margin:8px 0 0;font-size:14px;color:var(--sub);line-height:1.6}
  .fl{display:block;font-weight:700;font-size:15.5px;margin:22px 0 8px;line-height:1.5}
  textarea.ta{width:100%;min-height:96px;border:1px solid var(--line);border-radius:5px;background:var(--paper);padding:11px 12px;font-size:15.5px;line-height:1.6;resize:vertical}
  .cnt{font-size:12.5px;color:var(--faint);text-align:right}
  .cnt.ok{color:var(--g)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:6px;font-size:14px;z-index:90}
  @media (max-width:1000px){.life{grid-template-columns:1fr 1fr}.c3{grid-column:1/-1}}
  @media (max-width:680px){
    .life{grid-template-columns:1fr;padding:12px 10px 70px;gap:0}
    .topbar .in{gap:8px;padding:7px 10px}
    .brand{display:none}
    .age{font-size:28px}
    .speed button{padding:6px 8px;font-size:12.5px}
    .speed .x8{display:none}
    .feed{max-height:340px}
    .modal h2{font-size:23px}
    .c2{order:3}.c3{order:2}.c1{order:1}
  }
</style>
</head>
<body>
<div id="app"><div class="intro"><p class="kick">불러오는 중…</p></div></div>
<div id="modal" class="scrim" hidden></div>
<script>
/* 다른 사람으로 살아보기 (윤리문제 탐구 · 혐오 단원, 2026-11-15)
   80억 분의 1 형식의 인생 시뮬레이션. 씨앗 하나로 한 사람의 일생(태어남~죽음)을 생성. 나 + 같은 반 친구 5명(세대·성별이 섞이게).
   1번째 인생: 내 카드로 살며 부당한 사건마다 부당함을 매김. 옆에는 같은 반 친구들(다른 카드)의 소식이 '한 줄'로만 지나가고
     거기에 '개꿀이네 / 그 정도야 뭐 / 힘들었겠다' 반응을 남김. 중간·끝에 '가장 억울한 인생', '가장 개꿀인 인생'을 고름.
   2번째 인생: 내가 '가장 개꿀'이라고 한 사람으로 다시 삶. 1번째에 반응했던 순간에는 그 반응이 다시 뜸.
   마무리: 반응 vs 직접 살아 본 부당함 비교 → 다시 고르기 → 성찰 → 제출. 반 전체 결과는 hate_results 표(학생당 1줄). */
const SB_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co';
const SB_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
function sdtFetch(u,o){o=o||{};try{var h=null;try{h=window.parent&&window.parent!==window&&window.parent.__sdtHdr;}catch(e){}h=h||window.__sdtHdr;if(h&&h.tok){var H=new Headers(o.headers||{});H.set('x-sdt-tok',String(h.tok));o=Object.assign({},o,{headers:H});}}catch(e){}return fetch(u,o);}
let sbc=null;function sb(){if(!sbc&&window.supabase)sbc=window.supabase.createClient(SB_URL,SB_KEY,{global:{fetch:sdtFetch}});return sbc;}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const len=s=>String(s||'').trim().length;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}

/* ---------- 인생 생성기 ----------
   씨앗(seed) 하나로 한 사람의 일생을 만든다. 같은 씨앗이면 언제나 같은 인생.
   태어난 해 1945~2020 · 성별 · 정치 성향 · 집안 형편 · 지역을 뽑고, 성별·출생연도별 기대수명 근처에서 생을 마친다.
   사건은 그 사람이 지나가는 해(연도)와 나이에 맞는 것만 일어난다. 2026년 이후는 '다가올 세상'(전망). */
const NOW=2026;
function hs(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rng(seed){let a=hs(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pickR=(R,a)=>a[Math.floor(R()*a.length)];
function gauss(R){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const SUR='김이박최정강조윤장임한오서신권황안송류홍'.split('');
const NAMES={
 남:[[1955,['영수','철수','영호','상철','병철','광수','종수']],[1970,['영철','성호','정훈','재훈','상훈','동수','기현']],[1985,['동현','성민','상우','준호','지훈','현우','민수']],[2000,['지훈','현준','민재','도현','승민','준영','성훈']],[2012,['민준','서준','도윤','예준','주원','시우','건우']],[9999,['하준','서준','도윤','이안','시우','유준','은우']]],
 여:[[1955,['순자','영자','정숙','영숙','옥순','춘자','말순']],[1970,['미숙','경희','미경','은숙','정희','현숙','선영']],[1985,['은주','미영','지영','현정','수진','혜진','은정']],[2000,['지혜','민지','수연','지은','유진','지원','혜원']],[2012,['서연','지민','하은','서윤','민서','수빈','예은']],[9999,['서아','하윤','지안','이서','아윤','지우','하린']]]};
function nameOf(R,g,by){const t=NAMES[g].find(x=>by<x[0]);return pickR(R,SUR)+pickR(R,t[1]);}
const REG=['서울','부산','대구','인천','광주','대전','경기도','강원도','충청도','전라도','경상도','제주도'];
function armyMonths(y){return y<1953?'전쟁 중 기약 없이':y<1968?'36개월':y<1977?'36개월':y<1984?'33개월':y<1993?'30개월':y<2003?'26개월':y<2011?'24개월':y<2018?'21개월':'18개월';}
function genKey(p){const d=p.by<1960?'40·50년대생':p.by<1980?'60·70년대생':p.by<2000?'80·90년대생':'2000년대생 이후';return `${p.g}·${d}`;}
function genLife(seed,opt){
  opt=opt||{};const R=rng(seed);
  const by=opt.by||(1945+Math.floor(R()*76));
  const g=opt.g||(R()<.5?'남':'여');
  const pol=pickR(R,['진보 쪽','보수 쪽','중도','관심 없음']);
  const cls=R()<.3?'어려움':R()<.75?'보통':'넉넉함';
  const reg=pickR(R,REG);
  const nm=nameOf(R,g,by);
  // 기대수명(출생 코호트 대략값) 근처에서 사망
  const le=g==='남'?Math.min(86,74+(by-1945)*.15):Math.min(91,80+(by-1945)*.14);
  let end=Math.round(le+gauss(R)*7+(cls==='어려움'?-3:cls==='넉넉함'?2:0));
  if(R()<.03)end=30+Math.floor(R()*25);
  end=Math.max(22,Math.min(101,end));
  const P={k:String(seed),nm,by,g,pol,cls,reg,end,le:Math.round(le),start:0,ev:[],base:{h:58+Math.floor(R()*8),r:58+Math.floor(R()*8),m:cls==='어려움'?30:cls==='넉넉함'?72:50}};
  const ev=[];const yA=a=>by+a;
  const add=(a,o)=>{if(a<0||a>end)return;ev.push(Object.assign({a},o));};
  const fut=a=>yA(a)>NOW;
  const ch=(R2)=>R()<R2;
  let married=false,mAge=0,kids=0,kAge=0,worker=false,univ=false;

const LIFE={};
function per(k){if(!k)return null;if(!LIFE[k]){const m=String(k).match(/@(\d{4})([mf])$/);LIFE[k]=genLife(k,m?{by:+m[1],g:m[2]==='m'?'남':'여'}:null);}return LIFE[k];}

/* 같은 반 친구 5명: 세대가 골고루 섞이도록 */
function makeClass(seed){
  const R=rng(seed+'c');const bands=[[1945,1959],[1960,1974],[1975,1989],[1990,2004],[2005,2020]];
  const out=[];const mine=per(seed);
  const order=bands.filter(b=>!(mine.by>=b[0]&&mine.by<=b[1])).concat([pickR(R,bands)]);
  const gs=[0,1,2,3,4].map(()=>R()<.5?'m':'f');if(gs.every(x=>x===gs[0]))gs[2]=gs[0]==='m'?'f':'m';
  order.slice(0,5).forEach((b,i)=>{const by=b[0]+Math.floor(R()*(b[1]-b[0]+1));out.push(`${seed}-${i}@${by}${gs[i]}`);});
  return out;
}

/* ---------- 인생 진행 ---------- */
function cur(){return per(S.life===1?S.k1:S.k2);}
function Lst(){const p=cur();if(!S.L[p.k])S.L[p.k]={t:0,ev:0,st:Object.assign({},p.base),u:0,map:[],feed:[]};return S.L[p.k];}
function ageOf(){const p=cur(),L=Lst();return Math.min(p.end,p.start+Math.floor(L.t));}
function frac(){const p=cur(),L=Lst();return Math.min(1,L.t/(p.end-p.start+1));}
function comps(){return S.life===1?S.c.slice(1).map(per):[];}
function compNews(){const f=frac(),out=[];comps().forEach(q=>q.ev.forEach(e=>{const qf=(e.a-q.start+.5)/(q.end-q.start+1);if(qf<=f)out.push({q,e,qf});}));return out.sort((a,b)=>b.qf-a.qf);}
function lastNews(q){return compNews().find(x=>x.q.k===q.k);}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}

function startLoop(){running=true;lastTs=performance.now();if(!loop)loop=setInterval(tick,100);paintTop();}
function stopLoop(){running=false;paintTop();}
function tick(){
  if(!running||MODAL||S.phase!=='life')return;
  const now=performance.now(),dt=Math.min(400,now-lastTs);lastTs=now;
  const p=cur(),L=Lst();const before=ageOf();
  const span=p.end-p.start+1;
  L.t=Math.min(span-0.001,L.t+dt*speed/YEAR);
  const a=ageOf();
  for(let y=before;y<=a;y++){if(!L.map.some(m=>m.a===y))L.map.push({a:y,h:L.st.h,u:0});}
  while(L.ev<p.ev.length&&p.ev[L.ev].a<=a){
    const e=p.ev[L.ev];
    if(e.f){applyD(e);L.feed.unshift({a:e.a,x:e.last?`${e.cause} ${e.a}세로 세상을 떠났다`:e.hd});L.ev++;paintFeed();save();continue;}
    openEvent(e);break;
  }
  if(S.life===1&&!MODAL&&!S.cp.some(c=>c.life===1&&c.at==='half')&&frac()>=.5)openCheck('half');
  if(!MODAL&&L.ev>=p.ev.length&&L.t>=span-0.01){finishLife();return;}
  paintLive();
}
function applyD(e){const L=Lst();const d=e.d||{};['h','r','m'].forEach(k=>{if(d[k])L.st[k]=clamp(L.st[k]+d[k]);});
  let m=L.map.find(x=>x.a===e.a);if(!m){m={a:e.a,h:L.st.h,u:0};L.map.push(m);}if(e.u){L.u+=e.u;m.u=1;}m.h=L.st.h;}
function nextEvent(){const p=cur(),L=Lst();const nx=p.ev.slice(L.ev).find(e=>!e.f);if(!nx){L.t=p.end-p.start+0.99;}else{L.t=Math.max(L.t,nx.a-p.start);}if(!running)startLoop();}

}
function introView(){
  return `<div class="intro"><p class="kick">윤리문제 탐구 · 다른 사람으로 살아보기</p><h1>여섯 개의 인생, <em>하나</em>의 교실</h1>
   <p>지금부터 카드 한 장에 적힌 사람으로 태어나 한 번의 인생을 살아요. 성별도, 태어난 해도, 정치 성향도 고를 수 없어요.</p>
   <p>살아가는 동안 부당한 일이 생기면 시간이 멈춰요. 그 순간이 얼마나 부당했는지 매겨 주세요. 옆에는 다른 카드를 뽑은 같은 반 친구들의 소식이 지나가요. 친구들 소식에도 반응을 남길 수 있어요.</p>
   <button class="cta" onclick="S.phase='card';save(true);render()">태어나기</button></div>`;
}
function certView(k,life){
  const p=per(k);
  return `<div class="intro"><div class="cert"><div class="band"><b>${life===1?'출생 신고':'두 번째 출생 신고'}</b><span>No. ${p.by}-${String((ID&&ID.student&&ID.student.number)||'0').padStart(2,'0')}</span></div><div class="bd">
   <div class="lbl">이름</div><h2>${esc(p.nm)}</h2><p class="story">${esc(p.story)}</p>
   <dl><dt>태어난 해</dt><dd>${p.by}년</dd><dt>성별</dt><dd>${p.g}</dd><dt>정치 성향</dt><dd>${esc(p.pol)}</dd><dt>집안 형편</dt><dd>${esc(p.cls)}</dd><dt>기대 수명</dt><dd>약 ${p.le}세</dd></dl>
   ${life===2?`<p class="story" style="margin-top:14px">1번째 인생에서 너는 <b>${esc(p.nm)}</b>의 인생을 <b>가장 개꿀</b>이라고 했다. 이번에는 ${esc(p.nm)}(으)로 살아 본다.</p>`:''}
   </div></div><button class="cta" onclick="beginLife(${life})">삶을 시작하기</button></div>`;
}
function beginLife(life){S.life=life;S.phase='life';Lst();save(true);render();startLoop();window.scrollTo(0,0);}
function lifeView(){
  const p=cur();
  return `<header class="topbar"><div class="in"><div class="brand">다른 사람으로 <em>살아보기</em></div>
   <div class="agebox"><div class="age" id="ageNum">0<small>세</small></div><div class="yr"><span class="t" id="ageYear"></span><div class="prog"><i id="prog"></i></div></div></div>
   <div class="speed" id="speed"></div></div></header>
   <div class="life">
    <div class="c1">
     <div class="panel idc"><div class="nm">${esc(p.nm)}</div><div class="sub">${p.by}년생 · ${p.g} · 정치 성향 ${esc(p.pol)}<br>${S.life===2?'두 번째 인생':'첫 번째 인생'}</div>
      <div class="mrz">KOR&lt;&lt;${p.k.toUpperCase()}${p.by}${p.g==='남'?'M':'F'}&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</div></div>
     <div class="panel"><h3>상태 <span class="lbl">0–100</span></h3><div id="stats"></div></div>
    </div>
    <div class="c2"><div class="panel"><h3>인생 기록 <span class="lbl">최근 순</span></h3><ul class="feed" id="feed"></ul></div></div>
    <div class="c3">
     ${S.life===1?`<div class="panel"><h3>같은 반 친구들 <span class="lbl">지금 이 나이에</span></h3><ul class="comps" id="comps"></ul></div>
     <div class="panel"><h3>친구들 소식 <span class="lbl">한 줄 소식</span></h3><ul class="news" id="news"></ul></div>`
     :`<div class="panel"><h3>1번째 인생에서 남긴 반응</h3><ul class="news" id="was"></ul></div>`}
     <div class="panel"><h3>인생 지도 <span class="lbl">한 칸 = 1년</span></h3><div class="grid10" id="grid"></div><div class="gk">칸 색 = 행복 · 빨간 테두리 = 부당한 일이 있던 해</div></div>
    </div>
   </div>`;
}
function paintTop(){
  const sp=$('speed');if(!sp)return;
  sp.innerHTML=`<button class="${running?'':'on'}" onclick="running?stopLoop():startLoop()">${running?'❚❚ 멈춤':'▶ 계속'}</button>`+[1,2,4,8].map(v=>`<button class="${speed===v&&running?'on':''} ${v===8?'x8':''}" onclick="speed=${v};startLoop()">${v}×</button>`).join('')+`<button onclick="nextEvent()">다음 사건까지 »</button>`;
}
function paintLive(){
  const p=cur();const a=ageOf();const an=$('ageNum');if(!an)return;
  an.innerHTML=`${a}<small>세</small>`;$('ageYear').textContent=`${p.by+a}년${p.by+a>NOW?' (다가올 세상)':''} · ${p.nm} · 기대 수명 약 ${p.le}세`;$('prog').style.width=Math.min(100,a/Math.max(p.le,a+1)*100)+'%';
  paintStats();paintGrid();paintComps();paintNews();
}
function paintAll(){paintTop();paintLive();paintFeed();paintWas();}
function paintStats(){const L=Lst();const el=$('stats');if(!el)return;
  const rows=[['행복',L.st.h,'var(--y)'],['관계',L.st.r,'var(--acc)'],['형편',L.st.m,'var(--t)'],['억울함',clamp(L.u),'#b4232f']];
  el.innerHTML=rows.map(r=>`<div class="stat"><span>${r[0]}</span><span class="b"><i style="width:${r[1]}%;background:${r[2]}"></i></span><span class="v">${r[1]}</span></div>`).join('');}
function paintGrid(){const p=cur(),L=Lst();const el=$('grid');if(!el)return;const a=ageOf();const n=Math.ceil((p.end+1)/10)*10;let h='';
  for(let y=0;y<n;y++){const m=L.map.find(x=>x.a===y);let c='';if(m){c=m.h>=70?'l3':m.h>=55?'l2':m.h>=40?'l1':'l0';if(m.u)c+=' u';}if(y===a)c+=' now';if(y<p.start||y>p.end)c+=' off';h+=`<i class="${c}"></i>`;}
  el.innerHTML=h;}
function paintFeed(){const L=Lst();const el=$('feed');if(!el)return;
  el.innerHTML=L.feed.length?L.feed.map(f=>`<li class="${f.u?'u':''}"><span class="a">${f.a}세</span><span class="x">${esc(f.x)}${f.u?` · 부당함 ${f.v}/5`:''}${f.n?`<small>“${esc(f.n)}”</small>`:''}</span></li>`).join(''):`<li><span class="a">${cur().start}세</span><span class="x">${esc(cur().story)}</span></li>`;}
let compSig='';
function paintComps(){const el=$('comps');if(!el)return;
  const h=comps().map(q=>{const n=lastNews(q);const qa=Math.min(q.end,q.start+Math.floor(frac()*(q.end-q.start+1)));const dead=n&&n.e.last;return `<li><div class="h"><b>${esc(q.nm)}</b><span>${dead?'세상을 떠남':qa+'세'}</span></div><div class="m">${q.by}년생 · ${q.g} · ${esc(q.pol)} · ${n?esc(n.e.hd):'어린 시절'}</div></li>`;}).join('');
  if(h!==compSig||!el.innerHTML){el.innerHTML=h;compSig=h;}}
let newsKeys=new Set();
function newsItem(x){const v=(S.rx[x.q.k]||{})[x.e.i];return `<li data-k="${x.q.k}-${x.e.i}"><div class="w">${esc(lab(x.q))} · ${x.e.a}세</div><div class="x">${esc(x.e.hd)}</div><div class="rx">${RX.map(([k,t])=>`<button data-r="${k}" class="${v===k?'on'+(k==='k'?' k':''):''}" onclick="react('${x.q.k}',${x.e.i},'${k}')">${t}</button>`).join('')}</div></li>`;}
function paintNews(force){const el=$('news');if(!el)return;
  if(force||!el.dataset.ok){el.dataset.ok=1;newsKeys=new Set();el.innerHTML='';}
  const ns=compNews().slice().reverse();let added=0;
  ns.forEach(x=>{const key=x.q.k+'-'+x.e.i;if(newsKeys.has(key))return;newsKeys.add(key);el.insertAdjacentHTML('afterbegin',newsItem(x));added++;});
  if(!newsKeys.size&&!el.innerHTML)el.innerHTML='<li class="empty"><div class="w">아직 소식이 없어요.</div></li>';
  if(added){const e0=el.querySelector('.empty');if(e0)e0.remove();}
}
function paintReact(pk,i){const li=document.querySelector(`#news li[data-k="${pk}-${i}"]`);if(!li)return;const v=(S.rx[pk]||{})[i];li.querySelectorAll('button').forEach(b=>{const k=b.dataset.r;b.className=v===k?'on'+(k==='k'?' k':''):'';});}
function paintWas(){const el=$('was');if(!el)return;const p=cur();const o=S.rx[p.k]||{};const es=p.ev.filter(e=>o[e.i]);
  el.innerHTML=es.length?es.map(e=>`<li><div class="w">${esc(p.nm)} · ${e.a}세</div><div class="x">${esc(e.hd)}</div><span class="tag ${o[e.i]==='k'?'k':o[e.i]==='s'?'s':''}">${RXN[o[e.i]]}</span></li>`).join(''):'<li><div class="w">남긴 반응이 없어요.</div></li>';}

/* ---------- 1번째 인생 끝 ---------- */
function end1View(){
  const p=per(S.k1),L=S.L[p.k];const others=S.c.slice(1).map(per);const ks=kkulCount();const last=p.ev.find(e=>e.last);
  return `<div class="wrapc"><span class="tag">첫 번째 인생 끝</span><h1>${esc(p.nm)}의 인생은 여기까지</h1>
   <p class="lead">${p.by+p.end}년, ${esc(p.nm)}은(는) ${esc(last?last.cause:'')} ${p.end}세로 세상을 떠났다. 억울함 ${clamp(L.u)}, 행복 ${L.st.h}. 같은 반 친구들의 인생도 함께 흘러갔어요.</p>
   <label class="fl">나와 친구들의 여섯 인생 중, 가장 억울한 인생은?</label>
   <div class="pick">${S.c.map(per).map(q=>`<button class="${S.pick.u1===q.k?'on':''}" onclick="S.pick.u1='${q.k}';save();render()"><span>${esc(lab(q))}${q.k===p.k?' · 나':''}</span><small>${q.k===p.k?`억울함 ${clamp(L.u)}`:`${q.end}세까지 · 소식 ${q.ev.length}개`}</small></button>`).join('')}</div>
   <label class="fl">여섯 인생 중, 가장 개꿀인 인생은?</label>
   <div class="pick">${others.map(q=>`<button class="${S.pick.k1===q.k?'on':''}" onclick="S.pick.k1='${q.k}';save();render()"><span>${esc(lab(q))}</span><small>내가 누른 ‘개꿀이네’ ${ks[q.k]||0}번</small></button>`).join('')}</div>
   <p style="margin-top:22px"><button class="cta" ${S.pick.u1&&S.pick.k1?'':'disabled'} onclick="toLife2()">다음으로</button></p></div>`;
}
function toLife2(){S.k2=S.pick.k1;S.phase='card2';S.cp.push({life:1,at:'end',most:S.pick.u1});save(true);saveResult();render();window.scrollTo(0,0);}

/* ---------- 2번째 인생 끝 ---------- */
function end2View(){
  const p=per(S.k2);const o=S.rx[p.k]||{};const rate=S.rate[p.k]||{};
  const rows=p.ev.filter(e=>!e.f||o[e.i]);
  return `<div class="wrapc"><span class="tag">두 번째 인생 끝</span><h1>밖에서 본 ${esc(p.nm)}, 안에서 산 ${esc(p.nm)}</h1>
   <p class="lead">1번째 인생에서 너는 ${esc(p.nm)}의 인생을 한 줄 소식으로만 봤다. 그리고 방금 그 인생을 직접 살았다.</p>
   <table class="cmp"><tr><th>나이</th><th>소식</th><th>밖에서 본 나의 반응</th><th>살아 보고 매긴 부당함</th></tr>
   ${rows.map(e=>`<tr><td>${e.a}세</td><td>${esc(e.hd)}</td><td>${o[e.i]?`<span class="tag ${o[e.i]==='k'?'k':o[e.i]==='s'?'s':''}">${RXN[o[e.i]]}</span>`:'<span style="color:var(--faint)">반응 없음</span>'}</td><td>${e.f?'-':`${(rate[e.i]||{}).v||'-'} / 5`}</td></tr>`).join('')}</table>
   <label class="fl">이제 다시 고른다면, 가장 억울한 인생은?</label>
   <div class="pick">${S.c.map(per).map(q=>`<button class="${S.pick.u2===q.k?'on':''}" onclick="S.pick.u2='${q.k}';save();render()"><span>${esc(lab(q))}${q.k===S.k1?' · 1번째 나':q.k===S.k2?' · 2번째 나':''}</span></button>`).join('')}</div>
   <label class="fl">이제 다시 고른다면, 가장 개꿀인 인생은?</label>
   <div class="pick">${S.c.map(per).map(q=>`<button class="${S.pick.k2===q.k?'on':''}" onclick="S.pick.k2='${q.k}';save();render()"><span>${esc(lab(q))}</span></button>`).join('')}<button class="${S.pick.k2==='none'?'on':''}" onclick="S.pick.k2='none';save();render()"><span>개꿀인 인생은 없다</span></button></div>
   <label class="fl">1번째 인생에서 ‘개꿀’이라고 봤던 순간을 직접 살아 보니 어땠나요?</label>
   <textarea class="ta" oninput="S.r1=this.value;save();cnt(this,30)">${esc(S.r1)}</textarea><div class="cnt">${len(S.r1)}자 / 30자 이상</div>
   <label class="fl">다른 사람의 부당함을 내 것보다 작게 본 이유는 무엇이었을까요?</label>
   <textarea class="ta" oninput="S.r2=this.value;save();cnt(this,30)">${esc(S.r2)}</textarea><div class="cnt">${len(S.r2)}자 / 30자 이상</div>
   <label class="fl">여섯 인생의 주인공이 모두 고개를 끄덕일 수 있는 한 문장</label>
   <textarea class="ta" oninput="S.r3=this.value;save();cnt(this,10)">${esc(S.r3)}</textarea><div class="cnt">${len(S.r3)}자 / 10자 이상</div>
   <p style="margin-top:22px"><button class="cta" onclick="submitAll()">제출하기</button></p></div>`;
}
function cnt(t,min){const c=t.nextElementSibling;if(c){c.textContent=`${len(t.value)}자 / ${min}자 이상`;c.className='cnt'+(len(t.value)>=min?' ok':'');}}
function submitAll(){
  if(!S.pick.u2||!S.pick.k2){toast('다시 고르기 두 개를 골라 주세요');return;}
  if(len(S.r1)<30||len(S.r2)<30||len(S.r3)<10){toast('성찰 칸을 채워 주세요');return;}
  if(!confirm('제출할까요? 제출하면 고칠 수 없어요.'))return;
  saveResult();clearTimeout(saveT);
  if(MODE!=='student'){S.phase='done';render();return;}
  try{parent.postMessage({type:'sittdartha_ws_submit',answers:{fields:fields()}},'*');}catch(e){}
}

/* ---------- 반 결과 ---------- */
let STATS=[];
const GROUPS=['남·40·50년대생','여·40·50년대생','남·60·70년대생','여·60·70년대생','남·80·90년대생','여·80·90년대생','남·2000년대생 이후','여·2000년대생 이후'];
async function loadStats(){
  if(!ID||!ID.worksheetId||!sb())return;
  try{let q=sb().from('hate_results').select('student_id,name,class_name,card1,card2,self_most1,most_unfair1,most_kkul1,most_unfair2,most_kkul2,kkul').eq('worksheet_id',ID.worksheetId).limit(500);
    if(S.cls)q=q.eq('class_name',S.cls);const{data,error}=await q;if(error)throw error;STATS=data||[];const el=$('stats2');if(el)el.innerHTML=statsBlock(MODE==='staff');}catch(e){}
}
function statsBlock(staff){
  const R=STATS;const n=R.length;if(!n)return '<div class="panel"><p style="margin:0;color:var(--faint)">아직 결과가 없어요.</p></div>';
  const done1=R.filter(r=>r.most_unfair1);const self=done1.filter(r=>r.self_most1).length;
  const ch=R.filter(r=>r.most_kkul2);const changed=ch.filter(r=>r.most_kkul2!==r.most_kkul1).length;
  const kk={};R.forEach(r=>Object.entries(r.kkul||{}).forEach(([k,v])=>kk[k]=(kk[k]||0)+v));const mx=Math.max(1,...Object.values(kk));
  const g=k=>per(k)?per(k).g:'';
  const mf=R.filter(r=>g(r.card1)==='남'&&r.most_kkul1),fm=R.filter(r=>g(r.card1)==='여'&&r.most_kkul1);
  const mfp=mf.length?Math.round(mf.filter(r=>g(r.most_kkul1)==='여').length/mf.length*100):null;
  const fmp=fm.length?Math.round(fm.filter(r=>g(r.most_kkul1)==='남').length/fm.length*100):null;
  let h=`<div class="statg">
   <div class="panel"><div class="big">${done1.length?Math.round(self/done1.length*100):0}%</div><p>첫 인생이 끝났을 때 <b>내 인생이 가장 억울하다</b>고 고른 사람 (${self}/${done1.length}명)</p></div>
   <div class="panel"><div class="big">${ch.length?Math.round(changed/ch.length*100):0}%</div><p>두 번째 인생을 살고 나서 <b>가장 개꿀인 인생</b>을 바꾼 사람 (${changed}/${ch.length}명)</p></div>
   <div class="panel"><div class="big">${mfp==null?'-':mfp+'%'}</div><p>남성 카드로 산 사람 중 <b>여성의 인생</b>을 가장 개꿀이라고 고른 비율</p></div>
   <div class="panel"><div class="big">${fmp==null?'-':fmp+'%'}</div><p>여성 카드로 산 사람 중 <b>남성의 인생</b>을 가장 개꿀이라고 고른 비율</p></div></div>
   <div class="panel"><h3>우리 반이 누른 ‘개꿀이네’ <span class="lbl">${n}명 · 누구의 소식에</span></h3>${GROUPS.map(gk=>`<div class="stat" style="grid-template-columns:150px 1fr 34px"><span>${esc(gk)}</span><span class="b"><i style="width:${(kk[gk]||0)/mx*100}%;background:#c98a1b"></i></span><span class="v">${kk[gk]||0}</span></div>`).join('')}</div>`;
  if(staff)h+=`<table class="cmp"><tr><th>학생</th><th>1번째 카드</th><th>가장 억울(1)</th><th>가장 개꿀(1)</th><th>2번째 카드</th><th>가장 억울(2)</th><th>가장 개꿀(2)</th></tr>${R.map(r=>{const nm=k=>k==='none'?'없음':k&&per(k)?per(k).nm:'-';return `<tr><td>${esc(r.name)}</td><td>${nm(r.card1)}</td><td>${nm(r.most_unfair1)}</td><td>${nm(r.most_kkul1)}</td><td>${nm(r.card2)}</td><td>${nm(r.most_unfair2)}</td><td>${nm(r.most_kkul2)}</td></tr>`;}).join('')}</table>`;
  return h;
}
function doneView(){
  const p1=per(S.k1),p2=S.k2?per(S.k2):null;
  return `<div class="wrapc"><span class="tag s">제출 완료</span><h1>두 번의 인생을 살았어요</h1>
   <p class="lead">${p1?esc(lab(p1)):''}${p2?` → ${esc(lab(p2))}`:''}</p><h2 style="font-family:var(--serif)">우리 반 결과</h2><div id="stats2">${statsBlock(false)}</div>
   <p><button class="ghost" onclick="loadStats()">새로고침</button></p></div>`;
}
function staffView(){
  const cls=(ID.classes||[]);
  return `<div class="wrapc"><span class="tag">선생님</span><h1>다른 사람으로 살아보기</h1>
   <div class="rx" style="margin:10px 0 14px">${cls.map(c=>`<button class="${S.cls===c?'on':''}" onclick="S.cls='${esc(c)}';render();loadStats()">${esc(c)}</button>`).join('')}<button class="${!S.cls?'on':''}" onclick="S.cls='';render();loadStats()">전체</button><button onclick="loadStats()">새로고침</button></div>
   <div id="stats2">${statsBlock(true)}</div>
</div>`;
}
</script>
