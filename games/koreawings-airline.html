<!DOCTYPE html>
<html lang="ko" data-ws-form="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이런 항공사 어때? 나만의 이색 항공사 브랜딩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f4f1ea; --paper:#fffdf9; --ink:#22201c; --sub:#6f685d; --faint:#9a9285;
    --band:#ddd0bf; --bandInk:#3b342a; --line:#22201c; --field:#f7f3ec; --focus:#8a6d45;
    --red:#b3261e; --green:#2f6b3a;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --serif:"Playfair Display",Georgia,serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg)}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;padding:0 16px}
  .ws{max-width:820px;margin:0 auto;padding:48px 0 8px}
  .hero{text-align:center;margin:0 0 36px}
  .hero .en{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.08em;color:var(--sub);margin:0}
  .hero h1{font-size:40px;line-height:1.25;font-weight:800;letter-spacing:-.03em;margin:10px 0 12px}
  .hero .topic{font-size:18px;font-weight:600;color:var(--sub);margin:0}
  .hero .rule{width:56px;height:2px;background:var(--ink);margin:24px auto 0}
  .me{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--line);background:var(--paper);margin:0 0 28px}
  .me .cell{padding:14px 18px;text-align:center}
  .me .cell+.cell{border-left:1.5px solid var(--line)}
  .me .k{display:block;font-size:13px;font-weight:600;color:var(--faint);margin-bottom:4px}
  .me input{width:100%;border:0;background:transparent;font:inherit;font-size:18px;font-weight:700;color:var(--ink);padding:0;text-align:center}
  .me input:focus{outline:none}
  .q{border:2px solid var(--line);background:var(--paper);margin:0 0 24px}
  .q-head{background:var(--band);border-bottom:2px solid var(--line);padding:18px 24px;display:flex;gap:14px;align-items:baseline}
  .q-no{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;color:var(--bandInk);line-height:1}
  .q-title{font-size:19px;line-height:1.5;font-weight:700;color:var(--bandInk);margin:0;letter-spacing:-.02em}
  .q-guide{font-size:14px;color:var(--bandInk);opacity:.8;margin:6px 0 0;line-height:1.55}
  .q-body{padding:20px 24px 22px}
  .f{display:block;margin:0 0 18px}
  .f:last-child{margin-bottom:0}
  .fl{display:block;font-size:15px;font-weight:600;margin:0 0 8px}
  .fl .sub{font-weight:800;font-variant-numeric:tabular-nums;margin-right:8px}
  .ws textarea{width:100%;display:block;border:1.5px solid #d9d1c3;border-radius:6px;background:var(--field);
    font:inherit;font-size:16px;line-height:1.75;color:var(--ink);padding:12px 14px;resize:none;overflow:hidden;transition:border-color .15s,background .15s}
  .ws textarea:hover{border-color:#c6bba9}
  .ws textarea:focus{outline:none;background:#fff;border-color:var(--focus)}
  .ws textarea[readonly]{border-color:#e4ddd0;cursor:default}
  .ws .miss{border-color:var(--red)!important;background:#fff6f5!important}
  .tiles{display:flex;flex-direction:column;gap:10px;margin:0 0 18px;padding:2px;border:1.5px solid transparent;border-radius:6px}
  .tiles.miss{border-color:var(--red)}
  .tile{display:block;width:100%;padding:14px 18px;border:2px solid var(--line);background:var(--paper);font:inherit;color:var(--ink);cursor:pointer;text-align:left}
  .tile b{display:block;font-size:16px;font-weight:800}
  .tile span{display:block;font-size:14px;color:var(--sub);margin-top:4px}
  .tile:hover{background:var(--band)}
  .tile.on{background:var(--ink);color:#fff}
  .tile.on span{color:#e4ddd0}
  .tile:disabled{cursor:default}
  .draw-tools{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
  .draw-tools button{height:40px;min-width:40px;padding:0 14px;border:2px solid var(--line);background:var(--paper);font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
  .draw-tools button.on{background:var(--ink);color:#fff}
  .draw-tools .sw{width:40px;padding:0}
  .draw-tools .sw i{display:block;width:18px;height:18px;border-radius:50%;margin:auto}
  .draw-tools .gap{flex:1}
  .draw-box{border:1.5px solid #d9d1c3;border-radius:6px;background:#fff;overflow:hidden;touch-action:none}
  .draw-box canvas{display:block;width:100%;height:auto;cursor:crosshair}
  .ro .draw-tools{display:none}
  .ro .draw-box canvas{cursor:default}
  .prog{display:flex;align-items:center;gap:14px;margin:0 0 18px}
  .prog-track{flex:1;height:6px;background:#e3dccf}
  .prog-fill{height:100%;background:var(--ink);transition:width .25s}
  .prog-num{font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;min-width:52px;text-align:right}
  .pg{display:none}
  .pg.on{display:block}
  .teacher .pg,.printing .pg{display:block}
  .teacher .prog{display:none}
  .ws-bar{max-width:820px;margin:0 auto;padding:8px 0 44px}
  .nav{display:flex;gap:12px}
  .nav button{flex:1;font:inherit;font-size:17px;font-weight:700;height:56px;border:2px solid var(--line);border-radius:0;cursor:pointer;transition:background .15s,color .15s}
  #wsPrev{background:var(--paper);color:var(--ink)}
  #wsPrev:hover{background:var(--band)}
  #wsNext{background:var(--ink);color:#fff}
  #wsNext:hover{background:#3a362f}
  .nav button:disabled{opacity:.35;cursor:default}
  #wsMsg{display:block;text-align:center;font-size:14px;color:var(--sub);margin-top:14px;min-height:20px}
  #wsMsg.err{color:var(--red);font-weight:600}
  #wsMsg.ok{color:var(--green);font-weight:600}
  @media (max-width:640px){
    .ws{padding-top:28px}
    .hero h1{font-size:30px}
    .q-head,.q-body{padding-left:18px;padding-right:18px}
  }
  @media print{
    html,body{background:#fff}
    body{padding:0}
    .pg{display:block!important}
    .hero h1{font-size:32px}
    .q{break-inside:avoid-page}
    .ws-bar,.prog,.draw-tools{display:none!important}
    .ws textarea{background:#fff;border-color:#bbb}
  }
</style>
</head>
<body>
<div class="ws">
  <header class="hero">
    <p class="en">KOREA WINGS</p>
    <h1>이런 항공사 어때? 나만의 이색 항공사 브랜딩</h1>
    
    <div class="rule"></div>
  </header>

  <div class="me">
    <div class="cell"><span class="k">동아리</span><input id="cls" data-f aria-label="동아리"></div>
    <div class="cell"><span class="k">학번</span><input id="sid" data-f aria-label="학번"></div>
    <div class="cell"><span class="k">이름</span><input id="sname" data-f aria-label="이름"></div>
  </div>

  <div class="prog"><div class="prog-track"><div class="prog-fill" id="progFill"></div></div><span class="prog-num" id="progNum">1 / 2</span></div>

  <section class="pg on">
    <div class="q">
      <div class="q-head"><span class="q-no">01</span><div><h2 class="q-title">컨셉 브레인스토밍</h2></div></div>
      <div class="q-body">
      <label class="f"><span class="fl"><span class="sub">1-1</span>우리 항공사의 핵심 타깃층</span><textarea id="target" data-f data-req data-rows="2" aria-label="핵심 타깃층"></textarea></label>
      <label class="f"><span class="fl"><span class="sub">1-2</span>항공사 이름</span><textarea id="name" data-f data-req data-rows="1" aria-label="항공사 이름"></textarea></label>
      <label class="f"><span class="fl"><span class="sub">1-3</span>한 줄 슬로건</span><textarea id="slogan" data-f data-req data-rows="1" aria-label="한 줄 슬로건"></textarea></label>
      </div>
    </div>
    <div class="q">
      <div class="q-head"><span class="q-no">02</span><div><h2 class="q-title">브랜드 디테일 기획하기</h2></div></div>
      <div class="q-body">
      <label class="f"><span class="fl"><span class="sub">2-1</span>시그니처 기내식</span><textarea id="meal" data-f data-req data-rows="3" aria-label="시그니처 기내식"></textarea></label>
      <label class="f"><span class="fl"><span class="sub">2-2</span>우리 항공사만의 특별 기내 서비스</span><textarea id="service" data-f data-req data-rows="3" aria-label="특별 기내 서비스"></textarea></label>
      <label class="f"><span class="fl"><span class="sub">2-3</span>유니폼과 기내 인테리어</span><textarea id="uniform" data-f data-req data-rows="3" aria-label="유니폼과 기내 인테리어"></textarea></label>
      </div>
    </div>
  </section>
  <section class="pg">
    <div class="q">
      <div class="q-head"><span class="q-no">03</span><div><h2 class="q-title">아이디어 제시하기</h2><p class="q-guide">우리 항공사를 세상에 알릴 시간! 청중의 마음을 사로잡을 핵심 멘트를 작성하세요.</p></div></div>
      <div class="q-body">
      <label class="f"><span class="fl">우리 항공사가 기존 항공사와 &#x27;이것&#x27;만큼은 확실히 다릅니다!</span><textarea id="pitch" data-f data-req data-rows="5" aria-label="핵심 멘트"></textarea></label>
      </div>
    </div>
    <div class="q">
      <div class="q-head"><span class="q-no">04</span><div><h2 class="q-title">로고 또는 항공사를 소개하는 그림</h2></div></div>
      <div class="q-body">
      <div class="f draw" data-for="logo_draw_state"><span class="fl">자유롭게 그려 주세요</span><div class="draw-tools"><button type="button" class="sw on" data-c="#22201c" aria-label="색"><i style="background:#22201c"></i></button><button type="button" class="sw" data-c="#d62828" aria-label="색"><i style="background:#d62828"></i></button><button type="button" class="sw" data-c="#1d4ed8" aria-label="색"><i style="background:#1d4ed8"></i></button><button type="button" class="sw" data-c="#2f8f3a" aria-label="색"><i style="background:#2f8f3a"></i></button><button type="button" class="sw" data-c="#f2a900" aria-label="색"><i style="background:#f2a900"></i></button><button type="button" data-a="erase">지우개</button><span class="gap"></span><button type="button" data-a="clear">모두 지우기</button></div><div class="draw-box"><canvas width="1000" height="560"></canvas></div><input type="hidden" id="logo_draw_state" data-f></div>
      </div>
    </div>
  </section>

</div>

<div class="ws-bar" id="wsBar">
  <div class="nav"><button type="button" id="wsPrev">이전</button><button type="button" id="wsNext">다음</button></div>
  <span id="wsMsg">작성 내용은 자동으로 임시 저장돼요.</span>
</div>

<script>
var SHEET="koreawings-airline";

(function(){
  var P=window.parent!==window?window.parent:null;
  var ID=['cls','sid','sname'];
  var els=function(){return Array.prototype.slice.call(document.querySelectorAll('.ws [data-f]'))};
  var pages=Array.prototype.slice.call(document.querySelectorAll('.ws .pg'));
  var msg=document.getElementById('wsMsg'), prev=document.getElementById('wsPrev'), next=document.getElementById('wsNext'), bar=document.getElementById('wsBar');
  var fill=document.getElementById('progFill'), num=document.getElementById('progNum'), prog=document.querySelector('.prog');
  var state={preview:true, readonly:false, teacher:false}, cur=0, sending=false, tm;
  function say(t,c){msg.textContent=t;msg.className=c||''}
  function fit(t){var n=+t.dataset.rows||2;t.style.height='0';var lh=parseFloat(getComputedStyle(t).lineHeight)||28;var min=n*lh+28;t.style.height=Math.max(min,t.scrollHeight+3)+'px'}
  function fitAll(){document.querySelectorAll('.ws .pg.on textarea, .teacher .pg textarea').forEach(fit);sendHeight()}
  function getFields(){var d={};els().forEach(function(e){if(ID.indexOf(e.id)>-1)return;d[e.id]=e.value});return d}
  function setFields(d){els().forEach(function(e){if(ID.indexOf(e.id)>-1)return;if(d&&d[e.id]!=null)e.value=d[e.id]});tilesSync();draws.forEach(function(x){x.load()});fitAll()}
  function lock(on){els().forEach(function(e){if(ID.indexOf(e.id)>-1)return;e.readOnly=on});document.body.classList.toggle('ro',on);document.querySelectorAll('.tile').forEach(function(t){t.disabled=on})}
  function sendHeight(){if(P)try{P.postMessage({type:'sittdartha_ws_height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*')}catch(e){}}
  function payload(){return {fields:getFields(),sheet:SHEET,page:cur}}
  function missingIn(root){var m=[];root.querySelectorAll('[data-req]').forEach(function(e){var bad=!String(e.value).trim();var t=e.dataset.miss?document.getElementById(e.dataset.miss):e;if(t)t.classList.toggle('miss',bad);if(bad)m.push(e)});return m}
  function last(){return cur===pages.length-1}
  function show(i){
    cur=Math.max(0,Math.min(pages.length-1,i));
    pages.forEach(function(p,k){p.classList.toggle('on',k===cur)});
    fill.style.width=((cur+1)/pages.length*100)+'%';
    num.textContent=(cur+1)+' / '+pages.length;
    prog.hidden=pages.length<2;
    prev.hidden=pages.length<2;
    prev.disabled=cur===0;
    next.hidden=state.readonly&&last();
    next.textContent=last()?'제출하기':'다음';
    fitAll();
    try{window.scrollTo(0,0)}catch(e){}
  }
  function save(){if(state.readonly||state.preview||!P)return;P.postMessage({type:'sittdartha_ws_save',answers:payload()},'*');say('임시 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}))}
  function saveSoon(ms){clearTimeout(tm);tm=setTimeout(save,ms||1500)}

  /* 하나 고르기(타일) */
  function tilesSync(){document.querySelectorAll('.tiles').forEach(function(box){var v=document.getElementById(box.dataset.for).value;box.querySelectorAll('.tile').forEach(function(t){t.classList.toggle('on',t.dataset.v===v)})})}
  document.querySelectorAll('.tiles').forEach(function(box){box.querySelectorAll('.tile').forEach(function(t){t.addEventListener('click',function(){if(state.readonly)return;document.getElementById(box.dataset.for).value=t.dataset.v;box.classList.remove('miss');tilesSync();saveSoon(600)})})});

  /* 그림 그리기 칸: 그림은 JPEG 글자로 바꿔 숨은 칸(…_state)에 저장 */
  var draws=[];
  document.querySelectorAll('.draw').forEach(function(w){
    var cv=w.querySelector('canvas'),cx=cv.getContext('2d'),inp=document.getElementById(w.dataset.for);
    var color='#22201c',size=4,erase=false,down=false,lx=0,ly=0;
    function blank(){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height)}
    blank();
    function pos(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
    function store(){inp.value=cv.toDataURL('image/jpeg',0.7);saveSoon(800)}
    cv.addEventListener('pointerdown',function(e){if(state.readonly)return;down=true;cv.setPointerCapture(e.pointerId);var p=pos(e);lx=p[0];ly=p[1];cx.beginPath();cx.arc(lx,ly,(erase?size*5:size)/2,0,7);cx.fillStyle=erase?'#fff':color;cx.fill()});
    cv.addEventListener('pointermove',function(e){if(!down)return;var p=pos(e);cx.strokeStyle=erase?'#fff':color;cx.lineWidth=erase?size*5:size;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(p[0],p[1]);cx.stroke();lx=p[0];ly=p[1]});
    function up(){if(!down)return;down=false;store()}
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    w.querySelectorAll('[data-c]').forEach(function(b){b.addEventListener('click',function(){color=b.dataset.c;erase=false;w.querySelectorAll('.draw-tools button').forEach(function(x){x.classList.toggle('on',x===b)})})});
    w.querySelector('[data-a="erase"]').addEventListener('click',function(e){erase=true;w.querySelectorAll('.draw-tools button').forEach(function(x){x.classList.toggle('on',x===e.currentTarget)})});
    w.querySelector('[data-a="clear"]').addEventListener('click',function(){if(state.readonly)return;blank();inp.value='';saveSoon(600)});
    draws.push({load:function(){blank();if(inp.value&&/^data:image\//.test(inp.value)){var im=new Image();im.onload=function(){cx.drawImage(im,0,0,cv.width,cv.height)};im.src=inp.value}}});
  });

  document.querySelectorAll('.ws textarea').forEach(function(t){t.addEventListener('input',function(){fit(t);sendHeight();if(t.value.trim())t.classList.remove('miss')})});
  ID.forEach(function(id){var e=document.getElementById(id);if(e){e.readOnly=true;e.tabIndex=-1}});
  document.addEventListener('paste',function(e){if(state.teacher)return;var t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT')){e.preventDefault();say('붙여넣기는 할 수 없어요. 직접 써 주세요.','err')}});
  document.addEventListener('input',function(){saveSoon()});
  prev.addEventListener('click',function(){say('');show(cur-1)});
  var armed=false;
  next.addEventListener('click',function(){
    if(!state.readonly&&!state.preview){var m=missingIn(pages[cur]);if(m.length){say('비어 있는 칸을 채워 주세요(빨간 칸).','err');try{m[0].focus()}catch(e){}return}}
    if(!last()){clearTimeout(tm);save();say('');show(cur+1);return}
    if(state.readonly||sending)return;
    if(state.preview){say('미리보기 화면이에요. 학생용 링크로 들어왔을 때만 제출돼요.','err');return}
    if(!armed){armed=true;next.textContent='한 번 더 누르면 제출';say('제출하면 더 이상 고칠 수 없어요.','err');setTimeout(function(){if(armed){armed=false;next.textContent='제출하기'}},5000);return}
    armed=false;sending=true;next.disabled=true;next.textContent='제출 중…';clearTimeout(tm);
    P.postMessage({type:'sittdartha_ws_submit',answers:payload()},'*');
  });
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.type==='sittdartha_identity'){
      var s=d.student||{};
      document.getElementById('cls').value=String(s.class||'');
      document.getElementById('sid').value=s.number!=null?String(s.number):'';
      document.getElementById('sname').value=s.name&&s.id!=null?s.name:'';
      state.preview=!!d.preview;state.teacher=!!d.teacherView;state.readonly=!!d.readonly||state.teacher;
      if(d.prevAnswers&&d.prevAnswers.fields)setFields(d.prevAnswers.fields);
      lock(state.readonly);
      if(state.teacher){document.body.classList.add('teacher');bar.hidden=true;fitAll();return}
      if(state.readonly)say('제출 완료. 이전과 다음으로 내용을 볼 수 있어요.','ok');
      else if(state.preview)say('미리보기 화면이에요. 여기서는 저장 및 제출되지 않아요.');
      var pg=d.prevAnswers&&+d.prevAnswers.page;
      show(!state.readonly&&pg>0?pg:0);
    }
    if(d.type==='sittdartha_ws_submit_result'){
      sending=false;next.disabled=false;
      if(d.ok){state.readonly=true;lock(true);show(cur);say('제출 완료. 선생님께 전달됐어요.','ok')}
      else{next.textContent='제출하기';say('제출하지 못했어요. 다시 눌러 보세요.'+(d.error?' ('+d.error+')':''),'err')}
    }
  });
  window.addEventListener('beforeprint',function(){document.body.classList.add('printing');document.querySelectorAll('.ws textarea').forEach(fit)});
  window.addEventListener('afterprint',function(){document.body.classList.remove('printing');fitAll()});
  window.addEventListener('resize',fitAll);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
  show(0);
})();
</script>
</body>
</html>
