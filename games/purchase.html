/* 물품 신청 학습지 (games/purchase.html) — 싯다르타 입력칸형 학습지 규약

   학습지 → sittdartha_ws_save(임시 저장) / sittdartha_ws_submit(제출·취소)
   answers = {fields:{items}, rows, total, cancelled, sheet:'purchase'}

.schip.own{border-style:dashed;color:#0071E3;border-color:#9CC3F0}.schip.on{background:#0071E3;border-color:#0071E3;color:#fff}.schip:disabled{color:#C7C7CC;background:#F2F2F7;text-decoration:line-through}.schip em{font-style:normal;opacity:.7;margin-left:4px}

.bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:rgba(242,242,247,.94);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(60,60,67,.12)}

.sheet{width:100%;max-width:560px;max-height:92%;background:#F2F2F7;border-radius:14px 14px 0 0;padding:8px 0 calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

.sheet .btns .go:disabled{background:#C7C7CC}
.sheet .btns .no{background:#fff;color:#0071E3;font-weight:600}
.empty{padding:40px 20px;text-align:center;color:#8E8E93;font-size:15px}

/* 손그림 느낌 테마 (학생 입장 화면과 같은 톤) */
html,body{background:#FFF8EE radial-gradient(#F3E6D3 1.2px,transparent 1.2px) 0 0/22px 22px;color:#3A2E2A}
html,body,button,input{font-family:'NanumSquareRound',"Pretendard Variable",Pretendard,sans-serif}.f label{font-weight:800}.grp{border-radius:26px}.chip,.schip{border-radius:999px}.addbig{border-radius:999px}.foot{border-radius:22px}.pv-r{border-radius:999px}

.hd h1{font-size:36px;display:inline-block;position:relative;z-index:0}.hd h1::after{content:'';position:absolute;left:-4px;right:-4px;bottom:3px;height:11px;background:#F7B7BE;opacity:.7;border-radius:6px;z-index:-1}

.grp{background:#fff;border:2.5px solid #3A2E2A;border-radius:20px;box-shadow:0 4px 0 #EADCC8}

.chip,.schip{border:2px solid #EDE3D6;border-radius:12px}.f input.chip.in{border:2px dashed #D9C7B0;background:#fff;height:34px;width:70px}.f input.chip.in.on{background:#FFD45C;border:2px solid #3A2E2A;color:#3A2E2A}.f input.chip.in.on::placeholder{color:#3A2E2A}.chip.on,.schip.on{background:#FFD45C;border-color:#3A2E2A;color:#3A2E2A}.schip.on .xa{color:#3A2E2A}

.sheet{background:#FFF8EE;border-radius:24px 24px 0 0;border:2.5px solid #3A2E2A;border-bottom:0}.sheet .grab{background:#D9C7B0}.sheet .big .k{color:#8A7564}.sheet .big .n{color:#3A2E2A}

.opt .xw,.step{background:#FFF3D9}

.dfx{position:fixed;inset:0;z-index:99;background:rgba(58,46,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:dfxIn .25s ease-out both}
.dfx.out{animation:dfxOut .3s ease-in both}

.dfx-c img{display:block;width:100%;border-radius:22px;border:3px solid #3A2E2A;box-shadow:0 8px 0 rgba(58,46,42,.35);animation:dfxStamp .45s .55s ease-out both}
.dfx-sp{position:absolute;left:50%;top:50%;width:0;height:0}

@keyframes dfxIn{from{opacity:0}}@keyframes dfxOut{to{opacity:0}}
@keyframes dfxPop{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0)}}

/* 누를 때 쏙 들어가는 효과 */

<body>
<div id="sdtState" hidden></div>
<div class="pv" id="vList"></div>

<div class="bar" id="bar" hidden><div class="in"><div><div class="k">합계</div><div class="n" id="barTot">0원</div></div><button type="button" class="pill" id="barGo">제출</button></div></div>
<div class="dim" id="dim" hidden></div>


<script>
(function(){
var P=window.parent!==window?window.parent:null;
var SB='https://uxycuvpzsyfvsbwnrexv.supabase.co',KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
var $=function(id){return document.getElementById(id);};
var st={preview:true,teacher:false,submitted:false,locked:false,cancelled:false,editing:false,wsId:null,stuId:null,title:'',sending:false};
var items=[],cur=null,savedAt='',lastSent='';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(x){return Number(String(x==null?'':x).replace(/[^0-9]/g,''))||0;}
function won(x){return Number(x||0).toLocaleString('ko-KR');}
function hangul(n){n=Math.floor(Number(n)||0);if(!n)return '';var d=['','일','이','삼','사','오','육','칠','팔','구'],u=['','십','백','천'],b=['','만','억','조'],out='',k=0;
  while(n>0){var c=n%10000;if(c){var t='',s=String(c).padStart(4,'0');for(var i=0;i<4;i++){var v=+s[i];if(v)t+=d[v]+u[3-i];}out=t+b[k]+out;}n=Math.floor(n/10000);k++;}return out;}
function krTxt(v){return v?'(금'+hangul(v)+'원정)':'';}
var UNITS=['개','세트','장','권','팩','봉','병','롤','박스'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cleanUrl(s){s=String(s||'').trim();var m=s.match(/https?:\/\/[^\s"'<>]+/);if(m)return m[0];m=s.match(/(?:[\w-]+\.)*(?:11st\.co\.kr|gmarket\.co\.kr|gmkt\.kr)[^\s"'<>]*/i);return m?'https://'+m[0]:s;}
// 쇼핑몰 표시: 사이트 아이콘(파비콘) + 쇼핑몰 색
var SHOP_ST={'11번가':{c:'st',d:'11st.co.kr'},'G마켓':{c:'gm',d:'gmarket.co.kr'}};
function shopIco(sh){var x=SHOP_ST[sh];return x?'<img class="sico" src="https://www.google.com/s2/favicons?domain='+x.d+'&sz=64" alt="" onerror="this.style.visibility=\'hidden\'">':'';}
function shopOf(u){if(/11st/i.test(u))return '11번가';if(/gmarket|gmkt/i.test(u))return 'G마켓';return '';}
function shortUrl(u){return String(u||'').replace(/^https?:\/\/(www\.|m\.)?/,'');}
function stamp(d){d=d||new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
var CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
var PLUS_W='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
var PLUS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B5652B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>';
var MINUS_I='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>';
var PLUS_I='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

/* ---------- 계산 ---------- */
function newItem(){return {id:uid(),nm:'',l:'',p:0,u:'개',q:1,s:0,opts:[]};}
function itemQty(it){return it.opts.length?it.opts.reduce(function(a,o){return a+(o.q||0);},0):(it.q||0);}
function itemAmt(it){var a=it.opts.length?it.opts.reduce(function(s,o){return s+(o.q||0)*((it.p||0)+(o.x||0));},0):(it.q||0)*(it.p||0);return a+(it.s||0);}
function total(){return items.reduce(function(s,it){return s+itemAmt(it);},0);}
function rowsOf(){var r=[];items.forEach(function(it){var link=cleanUrl(it.l),shop=shopOf(link);
  if(it.opts.length)it.opts.forEach(function(o){r.push({name:it.nm+' ('+o.n+')',qty:o.q,unit:it.u||'개',price:(it.p||0)+(o.x||0),link:link,shop:shop});});
  else r.push({name:it.nm,qty:it.q,unit:it.u||'개',price:it.p||0,link:link,shop:shop});
  if(it.s)r.push({name:'배송비 ('+it.nm+')',qty:1,unit:'식',price:it.s,link:link,shop:shop,ship:true});});return r;}
function itemProblems(it){var p={};if(!String(it.nm).trim())p.nm=1;if(!it.l)p.l=1;else if(!shopOf(it.l))p.l=2;if(!it.p)p.p=1;
  it.opts.forEach(function(o,i){if(!String(o.n).trim()||!o.q)p['o'+i]=1;});if(!it.opts.length&&!it.q)p.q=1;return p;}
function editable(){return !st.locked&&!st.teacher&&(!st.submitted||st.editing||st.cancelled);}

/* ---------- 저장 (1초마다 바뀐 게 있으면) ---------- */
function bakKey(){return 'sdtPurchase:'+(st.wsId||'x')+':'+(st.stuId||'x');}
function payload(){return {fields:{items:items},rows:rowsOf(),total:total(),sheet:'purchase',topic:st.topic||''};}
// 임시 저장에는 지금 쓰고 있는 품목(완료 누르기 전)도 포함 — 중간에 나가도 다른 기기에서 이어 씀
function draftItems(){if(!cur)return items;var a=items.slice(),it=cur.it;
  if(cur.isNew){if(it.l||String(it.nm).trim()||it.p)a.push(it);}else a[cur.i]=it;return a;}
function tick(){
  if(st.preview||st.teacher||!editable())return;
  var di=draftItems(),j=JSON.stringify(di)+'|'+(st.topic||'');if(j===lastSent)return;lastSent=j;
  try{localStorage.setItem(bakKey(),JSON.stringify({items:di,editing:st.editing,at:Date.now()}));}catch(e){}
  if(P&&!st.submitted){var sv=items;items=di;var pl=payload();items=sv;P.postMessage({type:'sittdartha_ws_save',answers:Object.assign(pl,{draft:true}),quiet:true},'*');}
  savedAt=stamp();var s=$('stSaved');if(s)s.textContent='저장됨 '+savedAt;
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(document.hidden)tick();});

/* ---------- 목록 화면 ---------- */
// 신청 상태 (접수됨 / 수정 요청 중 / 품의 완료 / 취소됨 / 고치는 중)
function stateBadge(){
  if(st.locked)return '<div class="sb gray"><b>품의 완료</b><span>더 고칠 수 없습니다</span></div>';
  if(st.editing)return '<div class="sb edit"><b>수정 중</b></div>';
  if(st.cancelled&&st.submitted)return '<div class="sb red"><b>취소됨</b></div>';
  if(st.pend)return '<div class="sb wait"><b><i class="sp"></i>수정 요청 중<em class="dots"><i>.</i><i>.</i><i>.</i></em></b><span>선생님 확인 뒤 반영됩니다'+(st.pendAt?' · '+esc(st.pendAt):'')+'</span></div>';
  if(st.submitted)return '<div class="sb ok"><b>접수 완료</b>'+(st.subAt?'<span>'+esc(st.subAt)+'</span>':'')+'</div>';
  return '';
}
function renderList(){
  var ed=editable(),done=st.submitted&&!st.cancelled&&!st.editing;
  var h='<div class="top">';
  if(ed&&!st.preview)h+='<span class="st" id="stSaved">'+(savedAt?'저장됨 '+savedAt:'')+'</span>';
  h+='</div><div class="hd"><h1>물품 신청</h1>'+(st.title?'<div class="sub">'+esc(st.title)+'</div>':'')+'</div>';
  var show=st.pend&&!st.editing&&st.pend.fields&&Array.isArray(st.pend.fields.items)?st.pend.fields.items:items; // 수정 요청 중이면 요청한 내용으로 보여 줌
  var tpShow=st.pend&&!st.editing?String(st.pend.topic||st.topic||''):st.topic;
  if(!show.length&&!ed&&!tpShow){h+=stateBadge()+'<div class="empty">'+(st.locked?'신청 없음':'')+'</div>';}
  else{
    h+='<div class="grp tpg">'+stateBadge();
    var sum=0;show.forEach(function(it){sum+=itemAmt(it);});
    if(ed){ // 고칠 때: 주제 입력 줄 + 여닫는 품목 줄
      h+='<div class="f"><label for="fTp">조 이름 또는 주제</label><input id="fTp" maxlength="60" autocomplete="off" value="'+esc(st.topic)+'" placeholder="입력"></div>';
      if(show.length)h+='<div class="sep"></div><button type="button" class="fd-hd'+(fold?'':' on')+'" data-a="fold"><span>품목 '+show.length+'개</span><span class="fd-t">'+won(sum)+'원</span>'+CHEV+'</button>';
    }else{ // 접수 뒤: 한 줄 (주제 · 품목 n개 · 합계)
      h+='<button type="button" class="fd-hd one'+(fold?'':' on')+'" data-a="fold"><span class="fd-tp">'+esc(tpShow||'조 이름 없음')+'</span><span class="fd-n">품목 '+show.length+'개</span><span class="fd-t">'+won(sum)+'원</span>'+CHEV+'</button>';
    }
    if(show.length){
      h+='<div class="fd-box"'+(fold?' hidden':'')+'>';
      var items0=items;items=show;
      items.forEach(function(it,i){
      var sh=shopOf(it.l),sx=SHOP_ST[sh],sub=[it.opts.length?'옵션 '+it.opts.length+'개':'',itemQty(it)+(it.u||'개')].filter(Boolean).join(', ');
      sub=(sh?'<b class="sn '+(sx?sx.c:'')+'">'+esc(sh)+'</b> ':'')+esc(sub);
      h+=(i?'<div class="sep"></div>':'')+'<'+(ed?'button type="button" data-a="open" data-i="'+i+'"':'div')+' class="row tall'+(sx?' s-'+sx.c:'')+'"><span class="stile">'+(sx?shopIco(sh):'')+'</span><div class="m"><div class="t">'+esc(it.nm||'품명 없음')+'</div><div class="s">'+sub+'</div></div><div class="v">'+won(itemAmt(it))+'원</div>'+(ed?CHEV:'')+'</'+(ed?'button':'div')+'>';
    });
      items=items0;h+='</div>';
    }
    if(done&&!st.locked&&!st.teacher&&!st.preview){ // 주제 카드 안 맨 아래: 신청 수정 | 신청 취소
      h+='<div class="sep"></div><div class="act2">'+(st.pend?'<button type="button" data-a="unreq">수정 요청 취소</button>':'<button type="button" data-a="edit">신청 수정</button><i></i><button type="button" class="dg" data-a="cancel">신청 취소</button>')+'</div>';
    }
    if(st.editing)h+='<div class="sep"></div><div class="act2"><button type="button" data-a="undoEdit">수정 그만두기</button></div>';
    h+='</div>';
    if(ed)h+='<button type="button" class="addbig" data-a="add">'+PLUS_W+(items.length?'품목 더 추가':'품목 추가')+'</button>';
  }
  h+='<div class="err" id="listErr"></div>';
  $('vList').innerHTML=h;
  $('bar').hidden=!ed;
  $('barTot').textContent=won(total())+'원';
  $('barGo').textContent=st.editing&&!st.cancelled?'수정 요청':'제출';
  $('barGo').disabled=!items.length||st.sending;
}

/* ---------- 품목 쓰기 화면 ---------- */
function stepper(attr){return '<div class="step"><button type="button" aria-label="빼기" data-a="dec" '+attr+'>'+MINUS_I+'</button><i></i><button type="button" aria-label="더하기" data-a="inc" '+attr+'>'+PLUS_I+'</button></div>';}
function renderItem(bad){
  var it=cur.it;bad=bad||{};
  var shop=it.l?shopOf(it.l):'';
  var h='<div class="top"><button type="button" class="lk" data-a="back" style="margin-right:auto">취소</button><div class="ttl">품목</div><span style="margin-left:auto;display:flex;align-items:center;gap:14px">'+(cur.isNew?'':'<button type="button" class="lk dl" data-a="delItem" aria-label="품목 삭제"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>삭제</button>')+'<button type="button" class="lk b" data-a="ok">완료</button></span></div>';
  // 이미 쓴 다른 품목은 위에 접힌 칸으로 (누르면 그 품목으로 이동)
  var others=items.map(function(x,k){return k;}).filter(function(k){return k!==cur.i;});
  if(others.length)h+='<div class="prev">'+others.map(function(k){var x=items[k],sh=shopOf(x.l),sx=SHOP_ST[sh];return '<button type="button" class="pv-r'+(sx?' s-'+sx.c:'')+'" data-a="switch" data-i="'+k+'"><span class="pv-n">'+esc(shortName(x.nm)||'품명 없음')+'</span><span class="pv-q">'+itemQty(x)+esc(x.u||'개')+'</span><span class="pv-a">'+won(itemAmt(x))+'원</span>'+CHEV+'</button>';}).join('')+'</div>';
  h+='<div class="grp first"><div class="f link'+(bad.l?' bad':'')+'"><input id="fL" inputmode="url" autocomplete="off" placeholder="상품 링크" value="'+esc(it.l?shortUrl(it.l):'')+'">'+(it.l?'<span class="shop'+(shop?' '+SHOP_ST[shop].c:' no')+'">'+(shop?shopIco(shop)+shop:'')+(shop?'':'11번가, G마켓 아님')+'</span>':'')+'</div></div>';
  h+='<div class="grp"><div class="f'+(bad.nm?' bad':'')+'"><label for="fN">품명</label><input id="fN" autocomplete="off" value="'+esc(it.nm)+'" placeholder="입력"></div><div class="sep"></div>';
  h+='<div class="f money'+(bad.p?' bad':'')+'"><label for="fP">가격</label><div class="mv"><div class="mi"><input id="fP" inputmode="numeric" autocomplete="off" value="'+(it.p?won(it.p):'')+'" placeholder="0"><span class="w">원</span></div><span class="kr" id="krP">'+krTxt(it.p)+'</span></div></div><div class="sep"></div>';
  var uOther=it.u&&UNITS.indexOf(it.u)<0;
  h+='<div class="f unit"><label>단위</label><div class="chips">'+UNITS.map(function(u){return '<button type="button" class="chip'+((it.u||'개')===u?' on':'')+'" data-a="unit" data-u="'+u+'">'+u+'</button>';}).join('')+'<input id="fU" class="chip in'+(uOther?' on':'')+'" autocomplete="off" placeholder="기타" value="'+(uOther?esc(it.u):'')+'"></div></div>';
  if(!it.opts.length)h+='<div class="sep"></div><div class="f'+(bad.q?' bad':'')+'"><label>개수</label><span style="flex:1"></span><span class="qty" id="fQ">'+(it.q||0)+'</span>'+stepper('data-o="-1"')+'</div>';
  h+='</div>';
  // 옵션: 한 카드 안에 [옵션 제목] → 쇼핑몰 옵션 버튼(+직접 입력) → 고른 옵션 줄
  var hasSo=!!(it.so&&it.so.length);
  h+='<div class="grp" id="optGrp"><div class="f ohd"><label>옵션</label><span style="flex:1"></span>'+(hasSo?'':'<button type="button" class="lnk" data-a="addOpt">＋ 추가</button>')+'</div>';
  if(hasSo){var picked={};it.opts.forEach(function(o){picked[o.n]=1;});
    h+='<div class="sopts">'+it.so.map(function(o,k){return '<button type="button" class="schip'+(picked[o.n]?' on':'')+'" data-a="pickOpt" data-k="'+k+'"'+(o.out&&!picked[o.n]?' disabled':'')+'>'+esc(o.n)+(o.x?'<em class="xa">'+(o.x>0?'+':'−')+won(Math.abs(o.x))+'원</em>':'')+(o.out?'<em>품절</em>':'')+'</button>';}).join('')+'<button type="button" class="schip own" data-a="addOpt">＋ 직접 입력</button></div>';}
  it.opts.forEach(function(o,i){
    h+='<div class="sep"></div>'+'<div class="opt'+(bad['o'+i]?' bad':'')+'"><input class="on" data-o="'+i+'" autocomplete="off" placeholder="옵션 이름" value="'+esc(o.n)+'"><label class="xw"><input class="ox" data-o="'+i+'" inputmode="numeric" autocomplete="off" placeholder="'+won(it.p||0)+'" value="'+won((it.p||0)+(o.x||0))+'">원</label><span class="qty">'+(o.q||0)+'</span>'+stepper('data-o="'+i+'"')+'<button type="button" class="x" aria-label="옵션 빼기" data-a="delOpt" data-o="'+i+'">×</button></div>';
  });
  h+='</div>';
  h+='<div class="grp"><div class="f money"><label for="fS">배송비</label><div class="mv"><div class="mi"><input id="fS" inputmode="numeric" autocomplete="off" value="'+(it.s?won(it.s):'')+'" placeholder="0"><span class="w">원</span></div><span class="kr" id="krS">'+krTxt(it.s)+'</span></div></div></div>';
  h+='<div class="foot"><span class="fk">소계 <span id="fCnt">'+itemQty(it)+(esc(it.u)||'개')+'</span></span><b id="fAmt">'+won(itemAmt(it))+'원</b></div>';
  h+='<div class="grp"><button type="button" class="row add" data-a="okNext">＋ 품목 추가</button></div>';

  h+='<div class="err" id="itemErr"></div>';
  $('vItem').innerHTML=h;
}
// 쇼핑몰 배송비 자동: 상품 금액이 무료 기준 이상이면 0원 (학생이 배송비 칸을 직접 고치면 그 값 유지)
function shipAuto(it){if(!it.sf||it.sMan)return;var g=itemAmt(it)-(it.s||0),v=it.sf.free&&g>=it.sf.free?0:(it.sf.fee||0);if(v===(it.s||0))return;it.s=v;var e=$('fS');if(e&&e!==document.activeElement)e.value=v?won(v):'';var k=$('krS');if(k)k.textContent=krTxt(v);}
function itemFoot(){var it=cur.it;shipAuto(it);var c=$('fCnt'),a=$('fAmt');if(c)c.textContent=itemQty(it)+(it.u||'개');if(a)a.textContent=won(itemAmt(it))+'원';}
function openItem(i){
  if(!editable())return;
  var src=i==null?newItem():items[i];
  cur={i:i,isNew:i==null,it:JSON.parse(JSON.stringify(src))};
