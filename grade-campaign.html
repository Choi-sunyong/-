<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3차 수행평가 채점</title>
<link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:#F5F5F7;color:#1D1D1F;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:15px;word-break:keep-all}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:800;margin:0 8px 0 0;white-space:nowrap}
  .tabs{display:flex;gap:2px;padding:3px;background:#E3E3E8;border-radius:12px}
  .tab{height:34px;padding:0 16px;font:inherit;font-size:14.5px;font-weight:600;border-radius:9px;border:0;background:transparent;color:#6E6E73;cursor:pointer}
  .tab.on{background:#fff;color:#1D1D1F;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sp{flex:1}
  .btn{height:38px;padding:0 16px;font:inherit;font-size:14.5px;font-weight:600;border-radius:999px;border:0;background:#E8E8ED;color:#1D1D1F;cursor:pointer;white-space:nowrap}
  .btn.pri{background:#0071E3;color:#fff}
  .btn.sm{height:32px;padding:0 13px;font-size:13.5px}
  .btn:disabled{opacity:.5;cursor:default}
  #saveMsg,#bulkMsg{font-size:13px;color:#86868B;white-space:nowrap}
  main{max-width:1320px;margin:0 auto;padding:20px 24px 80px}
  .sum{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .chip{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);border-radius:12px;height:42px;padding:0 15px;display:flex;align-items:center;gap:8px;font-size:14px;color:#6E6E73;font-weight:700}
  .chip b{font-size:17px;color:#1D1D1F}
  .rub{background:#fff;border-radius:18px;margin-bottom:14px}
  .rub summary{padding:12px 18px;font-weight:800;cursor:pointer}
  .rub table{border-collapse:collapse;width:100%;font-size:13.5px}
  .rub td,.rub th{border-top:1px solid #EEF1F5;padding:7px 14px;text-align:left;vertical-align:middle}
  .rub th{background:#FAFBFC;white-space:nowrap;text-align:center}
  .g{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 20px rgba(0,0,0,.04);border-radius:22px;margin-bottom:18px;overflow:hidden}
  .gh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #EEF1F5;flex-wrap:wrap}
  .gh h2{font-size:18px;font-weight:800;margin:0;white-space:nowrap}
  .gh .src{font-size:13.5px;color:#86868B;font-weight:700}
  .plan{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #EEF1F5}
  .plan>div{padding:16px 20px;min-width:0}
  .plan>div+div{border-left:1px solid #EEF1F5}
  .kv{margin:0 0 11px}
  .kv dt{font-size:12.5px;font-weight:800;color:#86868B;margin-bottom:2px}
  .kv dd{margin:0;white-space:pre-wrap;line-height:1.6;font-size:14.5px}
  .kv dd.empty{color:#C5CBD6}
  .grade2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #EEF1F5}
  .grade2>div{padding:14px 20px;min-width:0}
  .grade2>div+div{border-left:1px solid #EEF1F5}
  .el h3{font-size:15px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .el h3 small{font-weight:600;color:#86868B;font-size:12.5px}
  .lv{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.45;border:1px solid transparent}
  .lv:hover{background:#F5F5F7}
  .lv input{margin:3px 0 0;flex:none}
  .lv .pt{font-weight:800;min-width:30px}
  .lv.ai{background:#E8F2FD;border-color:#B9D8F8}
  .aibox{background:#F5F8FD;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px;line-height:1.55}
  .aibox b{color:#0B5CAD}
  .aibox q{display:block;margin-top:4px;color:#555;font-size:13px}
  .aibox.warn{background:#FDF0E1}
  .aibox.warn b{color:#9A4A00}
  .cmt{width:100%;margin-top:4px;border:1px solid #E3E3E8;border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px;line-height:1.5;resize:vertical;min-height:58px;background:#fff}
  .cmt:focus{outline:none;border-color:#0071E3}
  .fl{display:block;font-size:12.5px;font-weight:700;color:#6E6E73;margin-top:6px}
  .fl small{font-weight:500;color:#9A9AA0;margin-left:5px}
  mark{border-radius:3px;padding:0 1px;cursor:help}
  mark.hl-good{background:#D7F5DD}
  mark.hl-bad{background:#FDDCDC}
  .hl-leg{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#6E6E73;margin-bottom:10px}
  .hl-leg span{padding:2px 8px;border-radius:999px;font-weight:700}
  .hl-leg .g1{background:#D7F5DD;color:#1d6b35}.hl-leg .b1{background:#FDDCDC;color:#a61b1b}
  table.m{border-collapse:collapse;width:100%}
  table.m th{font-size:12.5px;color:#6E6E73;font-weight:800;text-align:center;padding:9px 8px;background:#FAFBFC;border-bottom:1px solid #EEF1F5;white-space:nowrap}
  table.m td{padding:11px 8px;border-bottom:1px solid #F1F3F7;vertical-align:top;font-size:14px;text-align:center}
  table.m tr:last-child>td{border-bottom:0}
  .nm{white-space:nowrap;font-weight:800;text-align:left!important}
  .nm small{display:block;font-weight:600;color:#86868B;font-size:12.5px;margin-top:2px}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:5px;vertical-align:1px}
  .tag.y{background:#FEF3C7;color:#92400E}.tag.r{background:#FEE2E2;color:#B91C1C}.tag.g2{background:#DCFCE7;color:#166534}.tag.b{background:#E8F2FD;color:#0B5CAD}
  td.left{text-align:left!important}
  details.more summary{cursor:pointer;font-size:13px;font-weight:700;color:#0071E3;list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  .box{background:#FAFBFC;border-radius:10px;padding:10px 12px;margin-top:6px;white-space:pre-wrap;line-height:1.55;font-size:13.5px;text-align:left}
  select{font:inherit;font-size:14px;font-weight:600;height:36px;padding:0 8px;border:0;border-radius:10px;background:#F2F2F5;color:#1D1D1F;min-width:84px}
  select.need{background:#FFF4E5;color:#BF5B04}
  select.aisel{box-shadow:inset 0 0 0 2px #B9D8F8}
  .tot{font-size:18px;font-weight:800;white-space:nowrap}
  .tot.part{color:#C5CBD6}
  .muted{color:#86868B;font-size:13px}
  .center{padding:80px 20px;text-align:center;color:#86868B;font-size:16px}
  @media (max-width:980px){.plan,.grade2{grid-template-columns:1fr}.plan>div+div,.grade2>div+div{border-left:0;border-top:1px solid #EEF1F5}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">3차 수행평가 채점</h1>
  <div class="tabs" id="tabs"></div>
  <span class="sp"></span>
  <span id="bulkMsg"></span>
  <button class="btn pri" id="bulkBtn" onclick="gcBulk()" disabled>AI 채점 제안 받기</button>
  <span id="saveMsg"></span>
  <button class="btn" onclick="gcReload()">새로고침</button>
  <button class="btn" onclick="gcCsv()">점수 내보내기</button>
</header>
<main id="main"><div class="center">불러오는 중…</div></main>

<script>
/* 3차 수행평가(윤리문제 알림 캠페인) 채점 도구 — grade-campaign.html?ws=학습지ID
   2차 토론장 AI 채점과 같은 방식: AI가 평가요소별 수준을 제안(파란 칸)하고 근거·인용·학생용 코멘트 초안·형광펜을 붙임 → 선생님이 골라 확정.
   - 문제·해결책(10), 캠페인(8)은 모둠 점수(조장 기록 기준), 기여도(7)는 학생별, 동료평가(5)는 모둠원 평가로 자동 계산
   - 채점 결과는 app_kv 'grade_ws_<id>'에 저장: {groups:{'반|모둠':{a1,a2,ai,comments}}, students:{학생id:{a3,a4,sp,grp,ai,comments}}}
   - AI: 싯다르타 PC 프로그램 안에서 열면 선생님 구독(Claude Code)으로, 아니면 /api/chat(선생님 API 키)으로 */
const GC_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co';
const GC_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const gcSb=supabase.createClient(GC_URL,GC_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});
const GC_WS=+(new URLSearchParams(location.search).get('ws')||0);
const GC_RUB={
  a1:{name:'윤리문제 인식 및 해결책 제시',max:10,lv:[[10,'신뢰할 수 있는 자료(뉴스, 통계, 정책 자료 등)를 근거로 제시하여 윤리문제를 밝히고, 그 원인을 분석한 뒤 실행 주체, 방법, 기대효과가 명시된 구체적 해결책을 제안함'],[8,'윤리문제를 제시하는 근거의 구체성이 부족하거나 해결책의 실행 주체, 방법, 기대효과 중 일부가 명확하게 제시되지 않음'],[6,"윤리문제의 제시가 단순한 주장에 그치거나, 해결책이 '노력이 필요하다' 등 추상적인 수준에 머묾"],[4,'윤리문제에 대한 인식과 해결책이 구체적으로 드러나지 않으며, 전반적인 내용이 단순한 주장이나 형식적인 내용에 그침']]},
  a2:{name:'캠페인의 전달력 및 완성도',max:8,lv:[[8,'선택한 형식(포스터, 영상 등)을 효과적으로 활용하여 메시지를 설득력 있고 창의적으로 전달하며, 완성도가 높음'],[6,'메시지는 전달되나 무엇을 하라는 건지 구체적인 행동 제안 없이 심각성을 알리는 형식적인 수준에 그침'],[4,'시각적 요소와 문구가 서로 연관성이 없거나 메시지의 의미를 파악하기 어려움'],[2,'문구와 메시지가 어떤 의미를 담고 있는지 파악하기 어려움']]},
  a3:{name:'개인 기여도 및 역할수행',max:7,lv:[[7,'사전에 정한 역할(자료조사 및 제작, 발표 등)의 결과물을 제출하고 모둠 논의 과정에서 자신의 의견이나 아이디어를 낸 흔적(메모, 메시지 기록, 발언 등)이 확인됨'],[5,'역할 결과물은 제출했으나, 모둠 논의에 소극적으로만 참여하는 모습이 확인됨'],[3,'역할 결과물의 분량이나 내용이 크게 미달하거나, 모둠 활동과 무관한 행동을 하는 모습이 확인됨']]},
  a4:{name:'동료평가',max:5,lv:[[5,'동료평가지에서 모둠원 다수로부터 성실히 참여했다는 평가를 받음'],[4,'동료평가지에서 참여도에 대한 평가가 엇갈리거나 보통 수준으로 참여했다는 평가를 받음'],[3,'동료평가지에서 모둠원 다수로부터 참여도가 낮았다는 평가를 받음']]}
};
const GC_SP={nosub:[12,'미제출·미작성 (기본 12)'],absent:[11,'장기 미인정 결석 (11)']};
const GC_PLAN=['issue','situation','why','valA','valB','s1type','s1src','s1sum','s2type','s2src','s2sum','s3type','s3src','s3sum','cause','a1who','a1how','a1eff','a2who','a2how','a2eff','format','formatEtc','slogan','audience','message','action','sb1','sb2','sb3','sb4'];
let gcUser=null,gcW=null,gcStu=[],gcSubs={},gcState={groups:{},students:{}},gcCls='',gcSaveT=null,gcBusy=false;
const gcCurMarks={};   // 화면에 칠할 형광펜: key(그룹키 또는 's'+학생id) → marks

function gcEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gcF(sid){const s=gcSubs[sid];return (s&&s.answers&&s.answers.fields)||{};}
function gcNorm(t){t=String(t||'').trim();if(!t)return '';const m=t.match(/(\d+)\s*모둠/)||t.match(/^(\d+)/);return m?m[1]+'모둠':t.slice(0,20);}
function gcGrpOf(st){const o=gcState.students[st.id];return (o&&o.grp)||gcNorm(gcF(st.id).team);}
function gcLen(f,keys){return keys.reduce((n,k)=>n+String(f[k]||'').trim().length,0);}
function gcHas(v){return String(v||'').trim().length>0;}

/* ---------- 불러오기 · 저장 ---------- */
async function gcInit(){
  const main=document.getElementById('main');
  if(!GC_WS){main.innerHTML='<div class="center">주소에 학습지 번호(?ws=)가 없어요. 싯다르타 제출 현황의 [채점] 버튼으로 열어 주세요.</div>';return;}
  const{data:{session}}=await gcSb.auth.getSession();
  if(!session){main.innerHTML='<div class="center">싯다르타에 로그인한 상태에서 열어 주세요.</div>';return;}
  gcUser=session.user;await gcReload(true);
}
async function gcReload(first){
  const main=document.getElementById('main');
  try{
    const r1=await gcSb.from('worksheets').select('id,title,class_name,class_category').eq('id',GC_WS).single();
    if(r1.error||!r1.data)throw new Error('학습지를 찾을 수 없어요.');
    gcW=r1.data;document.getElementById('ttl').textContent=gcW.title;document.title=gcW.title+' · 채점';
    let q=gcSb.from('students').select('id,class_name,name,number,class_category').eq('user_id',gcUser.id);
    if(gcW.class_name)q=q.eq('class_name',gcW.class_name);else if(gcW.class_category)q=q.eq('class_category',gcW.class_category);
    const r2=await q;if(r2.error)throw r2.error;
    gcStu=(r2.data||[]).filter(s=>s.name&&String(s.name).trim());
    const r3=await gcSb.from('worksheet_submissions').select('student_id,answers,submitted,submitted_at,updated_at').eq('worksheet_id',GC_WS);
    if(r3.error)throw r3.error;gcSubs={};(r3.data||[]).forEach(s=>gcSubs[s.student_id]=s);
    if(first){const r4=await gcSb.from('app_kv').select('value').eq('user_id',gcUser.id).eq('key','grade_ws_'+GC_WS).maybeSingle();
      if(r4.data&&r4.data.value)gcState=Object.assign({groups:{},students:{}},r4.data.value);}
  }catch(e){main.innerHTML='<div class="center">불러오지 못했어요: '+gcEsc(e.message||e)+'</div>';return;}
  const cls=[...new Set(gcStu.map(s=>s.class_name))].sort();
  if(!cls.includes(gcCls))gcCls=cls.find(c=>gcStu.some(s=>s.class_name===c&&gcSubs[s.id]))||cls[0]||'';
  document.getElementById('tabs').innerHTML=cls.map(c=>`<button class="tab${c===gcCls?' on':''}" onclick="gcTab('${gcEsc(c)}')">${gcEsc(c)}</button>`).join('');
  gcRender();
}
function gcTab(c){gcCls=c;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.textContent===c));gcRender();}
function gcSave(){
  const m=document.getElementById('saveMsg');m.textContent='저장 중…';clearTimeout(gcSaveT);
  gcSaveT=setTimeout(async()=>{
    const{error}=await gcSb.from('app_kv').upsert({user_id:gcUser.id,key:'grade_ws_'+GC_WS,value:gcState,updated_at:new Date().toISOString()},{onConflict:'user_id,key'});
    m.textContent=error?('저장 실패: '+error.message):('저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  },700);
}

/* ---------- 모둠·동료평가·리더십 ---------- */
function gcGroups(){
  const list=gcStu.filter(s=>s.class_name===gcCls).sort((a,b)=>(+a.number||0)-(+b.number||0));
  const groups={},none=[];
  list.forEach(s=>{const g=gcGrpOf(s);if(g)(groups[g]=groups[g]||[]).push(s);else none.push(s);});
  const names=Object.keys(groups).sort((a,b)=>(parseInt(a)||99)-(parseInt(b)||99)||a.localeCompare(b));
  return{list,groups,names,none};
}
function gcLeader(mem){return mem.find(s=>gcF(s.id).myPos==='조장');}
// 조장 기록을 기준으로 하되, 조장이 거의 비워 뒀으면(50자 미만) 가장 많이 쓴 모둠원 기록으로
function gcSrc(mem){const L=gcLeader(mem);if(L&&gcLen(gcF(L.id),GC_PLAN)>=50)return L;return mem.slice().sort((a,b)=>gcLen(gcF(b.id),GC_PLAN)-gcLen(gcF(a.id),GC_PLAN))[0];}
function gcMatch(st,text){const t=String(text||'').replace(/\s/g,'');if(!t)return false;const nm=String(st.name||'').replace(/\s/g,''),num=String(st.number||'');return (nm&&t.includes(nm))||(num.length>=3&&t.includes(num));}
// 동료평가 점수(2026-11-13 강제배분): 받은 평가마다 역할 수행(해냄3·일부2·못함1) + 함께 참여(성실3·보통2·부족1) = 2~6점
// 평균 5점 이상 → 5점, 3점 미만 → 3점, 그 사이 → 4점 (모둠원 수가 달라도 평균이라 공정)
const GC_PT={'성실':3,'보통':2,'부족':1,'해냄':3,'일부':2,'못함':1};
function gcPeer(st,mem){
  const cnt={'성실':0,'보통':0,'부족':0},cntR={'해냄':0,'일부':0,'못함':0},why=[];let sum=0,m=0;
  mem.forEach(o=>{if(o.id===st.id)return;const f=gcF(o.id);
    for(let i=1;i<=4;i++){if(!gcMatch(st,f['p'+i+'n']))continue;const v=f['p'+i+'lv'],r=f['p'+i+'rl'];
      if(v in cnt)cnt[v]++;if(r in cntR)cntR[r]++;
      if((v in cnt)||(r in cntR)){sum+=(GC_PT[v]||0)+(GC_PT[r]||0);m+=(v in cnt?1:0)+(r in cntR?1:0);if(gcHas(f['p'+i+'why']))why.push(o.name+(r?' ['+r+'/'+(v||'-')+']':'')+': '+f['p'+i+'why']);}
      break;}});
  const n=cnt['성실']+cnt['보통']+cnt['부족'],avg=m?sum/m*2:null;   // avg: 평가 1건당 2~6점

function gcHlNorm(q){return String(q||'').replace(/^[\s"'“”‘’]+|[\s"'“”‘’.…]+$/g,'').replace(/(\.\.\.|…)/g,'').trim();}
function gcHl(raw,marks){
  raw=String(raw||'');if(!raw)return '';if(!marks||!marks.length)return gcEsc(raw);
  const R=[];
  marks.forEach(m=>{const q=gcHlNorm(m.q);if(q.length<4)return;let i=raw.indexOf(q),len=q.length;
    if(i<0&&q.length>=14){i=raw.indexOf(q.slice(0,14));len=Math.min(q.length,raw.length-i);}
    if(i<0)return;const e=i+len;if(R.some(r=>i<r.e&&e>r.s))return;R.push({s:i,e,m});});
  if(!R.length)return gcEsc(raw);
  R.sort((a,b)=>a.s-b.s);let out='',p=0;
  R.forEach(r=>{out+=gcEsc(raw.slice(p,r.s))+`<mark class="hl-${r.m.c==='bad'?'bad':'good'}" title="${gcEsc((GC_RUB[r.m.k]?GC_RUB[r.m.k].name+' · ':'')+(r.m.why||''))}">${gcEsc(raw.slice(r.s,r.e))}</mark>`;p=r.e;});
  return out+gcEsc(raw.slice(p));
}

async function gcAsk(system,user,maxTokens){

    if(t)return t;
  }

  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('AI 응답 오류 '+r.status));
  return String(j.text||'');
}

충돌하는 가치: ${v('valA')} vs ${v('valB')}

${[1,2,3].map(i=>`자료${i}: 유형 ${v('s'+i+'type')} / 출처·조사 방법 ${v('s'+i+'src')} / 핵심 내용 ${v('s'+i+'sum')}`).join('\n')}
원인 분석: ${v('cause')}
해결방안1: 실행 주체 ${v('a1who')} / 방법 ${v('a1how')} / 기대효과 ${v('a1eff')}
해결방안2: 실행 주체 ${v('a2who')} / 방법 ${v('a2how')} / 기대효과 ${v('a2eff')}
[a2 근거]
형식: ${f.format==='기타'?'기타 '+v('formatEtc'):v('format')}
제목·슬로건: ${v('slogan')} / 대상: ${v('audience')}
핵심 메시지: ${v('message')}
행동 제안: ${v('action')}
장면 구성: ${[1,2,3,4].map(i=>'['+i+'] '+v('sb'+i)).join(' ')}${others.length?`\n[참고] 같은 모둠의 다른 학생이 적은 윤리문제가 다름:\n${others.join('\n')}`:''}`;
}
async function gcGroupAI(gk,quiet){
  const b=document.getElementById('gai_'+gk);if(b){b.disabled=true;b.textContent='AI가 읽는 중…';}
  try{
    const avoid=gcAvoid();
    const sys=`너는 고등학교 2학년 '윤리문제 탐구' 3차 수행평가(우리 지역·학교의 실제 윤리문제를 탐구하고 해결방안을 담은 캠페인 만들기)의 채점 보조자다. 아래 채점 기준표에 따라 모둠 기록을 평가요소별로 판단해 수준을 제안한다. 최종 점수는 교사가 정한다.
채점 기준표:
${gcRubTxt(['a1','a2'])}

판단 원칙:
- 글 길이는 고려하지 않고 내용의 질만 본다. 기준표에 없는 조건을 끌어오지 않는다.
- a1은 [a1 근거]로 판단한다. 기준 문구를 나눠서 본다: 신뢰할 수 있는 자료(지역 뉴스·통계·정책 자료, 또는 언제·어디서·누구를 대상으로 했는지 밝힌 직접 조사)를 근거로 윤리문제를 밝혔는가, 원인을 분석했는가, 해결책에 실행 주체·방법·기대효과가 모두 구체적으로 있는가. 과제는 우리 지역이나 학교에서 실제로 일어나는 문제여야 하므로, 일반론에 그치면 그 점을 짚는다.
- a2는 [a2 근거]로 판단한다. 학습지에는 캠페인 결과물 자체가 없고 기획 내용만 있으므로, 메시지가 분명한가, 구체적인 행동 제안이 있는가, 형식과 장면 구성이 메시지와 연결되는가를 기획 수준에서 판단한다. reason 끝에 '결과물 확인 필요'를 붙인다.
- quotes에는 판단 근거가 된 학생 글을 원문 그대로 짧게(각 60자 이내) 1~2개 옮긴다.
- reason은 교사가 바로 이해할 수 있게 한두 문장으로 쓴다.
- ${GC_CMT_RULE}
- marks는 교사가 형광펜으로 볼 구절이다. 학생 글에서 글자 하나 바꾸지 않고 그대로 복사한 연속된 구절(8~60자)을 q로, c는 good(점수 받을 만한 점) 또는 bad(감점 요소: 근거 없는 주장, 추상적 해결책, 실행 주체 누락 등), k는 a1 또는 a2, why는 12자 안팎(~음/~함). 모두 합쳐 3~8개, 정말 눈에 띄는 것만.
- note에는 교사가 확인할 점(예: 모둠원끼리 적은 문제가 서로 다름, 자료 출처가 불분명함)이 있을 때만 한 문장. 없으면 빈 문자열.
반드시 아래 JSON만 출력한다.
{"note":"...","a1":{"level":10|8|6|4,"reason":"...","comment":"...","quotes":["..."]},"a2":{"level":8|6|4|2,"reason":"...","comment":"...","quotes":["..."]},"marks":[{"k":"a1","c":"good","q":"...","why":"..."}]}${avoid.length?`\n\n다른 모둠·학생에게 이미 쓴 코멘트(같은 문장이나 같은 짜임으로 쓰지 말 것):\n${avoid.map(x=>'- '+x).join('\n')}`:''}`;
    const j=gcJson(await gcAsk(sys,gcGroupInput(gk),2000));
    const ai={a1:gcFix(j.a1,'a1'),a2:gcFix(j.a2,'a2'),note:String(j.note||''),marks:gcMarks(j.marks,['a1','a2']),at:new Date().toISOString()};
    const g=(gcState.groups[gk]=gcState.groups[gk]||{});g.ai=ai;
    if(g.a1==null)g.a1=ai.a1.level;if(g.a2==null)g.a2=ai.a2.level;
    gcSave();if(!quiet)gcRender();return true;
  }catch(e){if(b){b.disabled=false;b.textContent='AI 제안 받기';}if(!quiet)alert('AI 제안을 받지 못했어요: '+(e.message||e));return false;}
}
function gcStuInput(sid){
  const s=gcStu.find(x=>x.id===sid),f=gcF(sid),{groups}=gcGroups(),gn=gcGrpOf(s),mem=groups[gn]||[];
  const v=k=>String(f[k]||'').trim()||'(비어 있음)';
  const roster=[1,2,3,4,5].map(i=>[f['m'+i+'n'],f['m'+i+'r']]).filter(x=>gcHas(x[0])).map(x=>`${x[0]}: ${x[1]||'-'}`).join(', ');
  const p=gcPeer(s,mem),ln=f.myPos==='조장'?gcLeaderNotes(s,mem):[];
  return `[학생 ${s.name}, ${gn||'모둠 미입력'}, ${f.myPos||'위치 미선택'}]
역할 분담표(이 학생이 적은 것): ${roster||'(비어 있음)'}
1차시 맡은 역할: ${v('d1role')} / 한 일: ${v('d1did')}
2차시 맡은 역할: ${v('d2role')} / 한 일: ${v('d2did')}
3차시 맡은 역할: ${v('d3role')} / 한 일: ${v('d3did')}
모둠 논의에서 낸 의견·아이디어: ${v('myIdea')}
확인할 수 있는 흔적: ${v('myEvidence')}
AI 사용: ${f.aiUse||'(미선택)'}${f.aiUse==='사용함'?` (${[f.aiName,f.aiPart,f.aiPrompt].filter(gcHas).join(' / ')})`:''}
[참고: 모둠원들의 동료평가] ${p.avg!=null?`역할 수행 해냄 ${p.cntR['해냄']}, 일부 ${p.cntR['일부']}, 못함 ${p.cntR['못함']} / 함께 참여 성실 ${p.cnt['성실']}, 보통 ${p.cnt['보통']}, 부족 ${p.cnt['부족']} (평균 ${p.avg.toFixed(1)}/6)`:'없음'}${p.why.length?'\n'+p.why.map(x=>'- '+x).join('\n'):''}${ln.length?`\n[참고: 조원들이 쓴 조장의 역할·리더십]\n${ln.map(x=>`- ${x.who}: ${x.did} / ${x.ship}`).join('\n')}`:''}`;
}
async function gcStuAI(sid,quiet){
  const b=document.getElementById('sai_'+sid);if(b){b.disabled=true;b.textContent='읽는 중…';}
  try{
    const avoid=gcAvoid();
    const sys=`너는 고등학교 2학년 '윤리문제 탐구' 3차 수행평가(모둠 캠페인 활동)의 채점 보조자다. 아래 채점 기준표의 a3(개인 기여도 및 역할수행)만 판단해 수준을 제안한다. 최종 점수는 교사가 정한다.
채점 기준표:
${gcRubTxt(['a3'])}

판단 원칙:
- 학생이 스스로 적은 차시별 역할·한 일, 낸 의견·아이디어, 확인할 수 있는 흔적으로 판단한다. 동료평가와 조원들의 리더십 기록은 참고만 하고, 동료평가 점수 자체는 따로 매기므로 a3 수준을 그것만으로 정하지 않는다.
- 7점은 '역할 결과물 제출'과 '의견·아이디어를 낸 흔적' 둘 다 구체적으로 확인될 때, 5점은 결과물은 있으나 논의 참여가 소극적일 때, 3점은 결과물이 크게 미달하거나 활동과 무관할 때다.
- 글 길이가 아니라 구체성(무엇을 만들었고 어떤 의견을 냈는지)을 본다. 기준표에 없는 조건을 끌어오지 않는다.
- quotes에는 판단 근거가 된 학생 글을 원문 그대로 짧게(각 60자 이내) 1~2개.
- reason은 한두 문장.
- ${GC_CMT_RULE}
- marks는 학생이 쓴 '한 일'·'의견' 글에서 글자 그대로 복사한 구절(8~60자), c는 good/bad, k는 a3, why는 12자 안팎. 0~5개.
- note에는 교사가 확인할 점(예: 본인 기록은 충실한데 모둠원 다수가 참여도 부족으로 평가함, 기록이 거의 비어 있음)이 있을 때만 한 문장. 없으면 빈 문자열.
반드시 아래 JSON만 출력한다.
{"note":"...","a3":{"level":7|5|3,"reason":"...","comment":"...","quotes":["..."]},"marks":[{"k":"a3","c":"good","q":"...","why":"..."}]}${avoid.length?`\n\n다른 학생에게 이미 쓴 코멘트(같은 문장이나 같은 짜임으로 쓰지 말 것):\n${avoid.map(x=>'- '+x).join('\n')}`:''}`;
    const j=gcJson(await gcAsk(sys,gcStuInput(sid),1400));
    const ai={a3:gcFix(j.a3,'a3'),note:String(j.note||''),marks:gcMarks(j.marks,['a3']),at:new Date().toISOString()};
    const o=(gcState.students[sid]=gcState.students[sid]||{});o.ai=ai;if(o.a3==null)o.a3=ai.a3.level;
    gcSave();if(!quiet)gcRender();return true;
  }catch(e){if(b){b.disabled=false;b.textContent='AI 제안';}if(!quiet)alert('AI 제안을 받지 못했어요: '+(e.message||e));return false;}
}
function gcPending(){
  const{groups,names,list}=gcGroups();
  const g=names.filter(gn=>!(gcState.groups[gcCls+'|'+gn]||{}).ai&&groups[gn].some(s=>gcSubs[s.id]&&gcSubs[s.id].submitted)).map(gn=>gcCls+'|'+gn);
  const s=list.filter(x=>gcSubs[x.id]&&gcSubs[x.id].submitted&&!(gcState.students[x.id]||{}).ai).map(x=>x.id);
  return{g,s,total:g.length+s.length};
}
async function gcBulk(){
  const p=gcPending();if(!p.total||gcBusy)return;
  if(!confirm(`${gcCls}에서 제출한 모둠 ${p.g.length}개, 학생 ${p.s.length}명의 기록을 AI가 읽고 수준을 제안해요. 하나에 10~20초쯤 걸려요. 시작할까요?`))return;
  gcBusy=true;gcRender();const msg=document.getElementById('bulkMsg');let ok=0,i=0;const n=p.total;
  const jobs=[...p.g.map(k=>()=>gcGroupAI(k,true)),...p.s.map(id=>()=>gcStuAI(id,true))];
  for(const job of jobs){i++;msg.textContent=`${i}/${n} 읽는 중…`;if(await job())ok++;}
  gcBusy=false;msg.textContent=`${ok}/${n}개 제안 완료. 내용을 확인하고 점수를 확정해 주세요.`;gcRender();
}

/* ---------- 내보내기 ---------- */
function gcCsv(){
  const rows=[['반','번호','이름','모둠','조장/조원','문제·해결책(10)','캠페인(8)','기여도(7)','동료평가(5)','특수','합계','제출','코멘트-문제·해결책','코멘트-캠페인','코멘트-기여도','조원들이 본 리더십']];
  const cls=[...new Set(gcStu.map(s=>s.class_name))].sort();const keep=gcCls;
  cls.forEach(c=>{gcCls=c;const{list,groups}=gcGroups();
    list.forEach(s=>{const gn=gcGrpOf(s),gk=c+'|'+gn,g=gcState.groups[gk]||{},o=gcState.students[s.id]||{},f=gcF(s.id),mem=gn?groups[gn]:[];
      const sc=gcScore(s,mem,gk),cm=(x,k,ai)=>(x.comments&&x.comments[k]!=null?x.comments[k]:(ai&&ai[k]&&ai[k].comment)||'');
      const ln=f.myPos==='조장'?gcLeaderNotes(s,mem).map(x=>`${x.who}: ${x.did} / ${x.ship}`).join(' | '):'';
      rows.push([c,s.number||'',s.name,gn,f.myPos||'',sc.sp?'':(g.a1??''),sc.sp?'':(g.a2??''),sc.sp?'':(o.a3??''),sc.sp?'':(sc.a4??''),o.sp?GC_SP[o.sp][1]:'',sc.full?sc.total:'',gcSubs[s.id]&&gcSubs[s.id].submitted?'O':'',cm(g,'a1',g.ai),cm(g,'a2',g.ai),cm(o,'a3',o.ai),ln]);});});
  gcCls=keep;
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(gcW?gcW.title:'채점')+'_점수.csv';a.click();
}
gcInit();
