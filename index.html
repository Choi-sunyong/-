// 반 하나에 대한 조 편성 결과를 계산함.
// - 희망 조원(anchorGroups)이 있으면 그 인원을 각자 하나의 조로 고정해두고, 그 조와 성향이 가장 반대인
//   학생들로 나머지 자리를 채움(첨예하게 대립하도록 - 평균 점수의 반대쪽 극단부터 채움)
// - 희망 조원에 안 속한 학생들은 기존처럼 스네이크 드래프트로 나머지 조에 고르게 배정함
// - 아직 성향 테스트에 응답 안 한 학생(sortScore가 없음)은 점수 기반 로직(대립 배치·스네이크)에선 빠지지만,
//   실제 모둠 활동에는 참여해야 하니 마지막에 만들어진 조들에 고르게 나눠 배정함
// 조 카드 안의 학생 목록을 그림. 여러 짝(2명씩 묶음)을 합쳐서 만든 조라면, 원래 어느 짝이었는지에 따라
// 파란 구분선을 넣어서 "이 2명은 원래 짝1, 이 2명은 원래 짝2"가 한눈에 보이게 함. 나중에 추가로 채워진
// 학생(짝에 안 속함)은 구분선 아래 마지막 칸에 표시됨.
function gaRenderGroupMembers(g,className,groupIdx){
  const classNameEsc=className.replace(/'/g,"\\'");
  const rowHtml=m=>`<div draggable="true" ondragstart="gaDragStart('${classNameEsc}',${groupIdx},${m.id})" style="font-size:11.5px;color:#444;padding:3px 5px;border-radius:5px;cursor:grab;" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background='transparent'">⠿ ${escHtml(String(m.number||''))} ${escHtml(m.name)} <span style="color:#aaa;">${m.score===undefined?'(미응답)':`${m.score>0?'+':''}${m.score}`}</span></div>`;
  const byNumber=arr=>[...arr].sort((a,b)=>(a.number||0)-(b.number||0));
  if(!g.hasSubGroups)return byNumber(g.members).map(rowHtml).join('');
  const segments={};
  g.members.forEach(m=>{ const seg=m._segment??99; (segments[seg]=segments[seg]||[]).push(m); });
  const segKeys=Object.keys(segments).sort((a,b)=>a-b);
  return segKeys.map((seg,idx)=>{
    const divider=idx>0?'<div style="border-top:2px solid #93c5fd;margin:5px 0;"></div>':'';
    return divider+byNumber(segments[seg]).map(rowHtml).join('');
  }).join('');
}
function gaBuildClassGroups(classRoster,wishGroupsForClass,groupCount){
  const scoredRoster=classRoster.filter(s=>s.sortScore!==undefined);
  let unscored=classRoster.filter(s=>s.sortScore===undefined);
  let unassigned=[...scoredRoster].sort((a,b)=>b.sortScore-a.sortScore);
  const anchorGroups=wishGroupsForClass.map(wg=>{
    const members=classRoster.filter(r=>(wg.student_ids||[]).includes(r.id));
    // 여러 짝을 합쳐서 만든 조라면(subGroups 있음), 각 학생에게 원래 어느 짝 소속이었는지 표시해둠 -
    // 화면에서 짝 사이에 구분선을 그릴 때 씀. 나중에 추가로 채워 넣는 학생은 이 표시가 없어서 구분선 밖(추가분)으로 표시됨.
    if(wg.subGroups){
      members.forEach(m=>{ m._segment=wg.subGroups.findIndex(ids=>ids.includes(m.id)); });
    }
    unassigned=unassigned.filter(r=>!members.some(m=>m.id===r.id));
    unscored=unscored.filter(r=>!members.some(m=>m.id===r.id));
    return {members:[...members],isAnchor:true,wishId:wg.id,hasSubGroups:!!wg.subGroups};
  }).filter(g=>g.members.length>0);
  // 희망 조(고정 조) 개수가 원래 정한 "조 개수"보다 많으면, 어차피 최소 그 개수만큼은 조가 생길 수밖에 없음 -
  // 이 경우 목표 인원은 실제로 생기는 조 개수를 기준으로 다시 계산해야 함(그래야 나눗셈이 맞음)
  const effectiveGroupCount=Math.max(groupCount,anchorGroups.length,1);
  const targetSize=Math.max(1,Math.ceil(classRoster.length/effectiveGroupCount));
  // 고정 조들을 채울 때 한 조씩 순서대로 목표 인원까지 다 채우고 다음 조로 넘어가면, 사람이 부족할 경우
  // 앞쪽 조는 꽉 차고 뒤쪽 조는 하나도 못 받는 불공평한 상황이 생김 - 그래서 모든 고정 조를 한 명씩
  // 돌아가며 채우는 라운드로빈 방식으로 바꿔서, 사람이 모자라도 부족분이 여러 조에 고르게 나뉘도록 함
  let stillFilling=true;
  while(stillFilling){
    stillFilling=false;
    for(const g of anchorGroups){
      if(g.members.length>=targetSize)continue;
      let picked=null;
      if(unassigned.length>0){
        const scoredMembers=g.members.filter(m=>m.sortScore!==undefined);
        const avg=scoredMembers.length?scoredMembers.reduce((s,m)=>s+m.sortScore,0)/scoredMembers.length:0;
        // 평균이 양수 쪽이면 가장 낮은(반대쪽) 점수부터, 음수 쪽이면 가장 높은 점수부터 데려와서
        // 일부러 성향이 정반대인 사람을 그 조에 넣음
        const pickIdx=avg>=0?unassigned.length-1:0;
        picked=unassigned.splice(pickIdx,1)[0];
      }else if(unscored.length>0){
        picked=unscored.shift();
      }
      if(picked){ g.members.push(picked); stillFilling=true; }
    }
  }
  const remainingGroupCount=Math.max(0,groupCount-anchorGroups.length);
  const regularGroups=Array.from({length:remainingGroupCount},()=>({members:[],isAnchor:false}));
  let gi=0,dir=1;
  unassigned.forEach(st=>{
    if(!regularGroups.length)return;
    regularGroups[gi].members.push(st);
    if(regularGroups.length>1){
      gi+=dir;
      if(gi>=regularGroups.length){gi=regularGroups.length-1;dir=-1;}
      else if(gi<0){gi=0;dir=1;}
    }
  });
  // 조가 하나도 안 남았는데 배정 못한 학생이 남아있으면(희망조가 조 개수보다 많은 경우) anchor 조들에 라운드로빈으로 마저 나눠줌
  if(!regularGroups.length&&unassigned.length&&anchorGroups.length){
    let ai=0;
    unassigned.forEach(st=>{ anchorGroups[ai%anchorGroups.length].members.push(st); ai++; });
    unassigned=[];
  }
  const allGroups=[...anchorGroups,...regularGroups].filter(g=>g.members.length>0);
  if(!allGroups.length&&unscored.length){
    // 응답자가 아예 없어서(희망조도 없이) 조가 하나도 안 만들어진 극단적 경우 - 조 개수만큼 새로 만들어서 고르게 나눔
    const freshGroups=Array.from({length:Math.max(1,groupCount)},()=>({members:[],isAnchor:false}));
    let ui=0;
    unscored.forEach(st=>{ freshGroups[ui%freshGroups.length].members.push(st); ui++; });
    return freshGroups.filter(g=>g.members.length>0);
  }
  // 여기까지 오고도 남은 미응답 학생(고정 조를 채우고도 남았거나, 애초에 목표 인원을 넘어서는 인원)은
  // 전체 조에 고르게 나눠서 최종적으로 아무도 빠지지 않게 함
  let ui=0;
  unscored.forEach(st=>{ allGroups[ui%allGroups.length].members.push(st); ui++; });
  return allGroups;
}
// 지금 선택된 기준(domain)으로 모든 응답자의 성향 점수를 계산 - renderGaBody와 gaAutoAssign 둘 다 씀
function gaComputeScoredByStudent(){
  const{w,subs,domain}=gaState;
  const scoredByStudent={};
  (subs||[]).forEach(sub=>{
    const scores=computeDomainScores(w,sub.answers||{});
    const keys=Object.keys(scores);
    if(!keys.length)return;
    const sortScore=domain==='__total__'?(keys.reduce((a,k)=>a+scores[k],0)/keys.length):(scores[domain]??0);
    scoredByStudent[sub.student_id]={sortScore,score:Math.round(sortScore)};
  });
  return scoredByStudent;
}
function renderGaBody(){
  const el=document.getElementById('gaBody');if(!el)return;
  const{w,subs,domain,domains,groupCount,groupSize,sizeMode,poles:axisPoles,wishGroups,activeClass,buildMode,building,aiTopic,aiReason}=gaState;
  const targetClasses=worksheetTargetClasses(w);
  if(!activeClass&&targetClasses[0])gaState.activeClass=targetClasses[0].name;
  const scoredByStudent=gaComputeScoredByStudent();
  const poles=(axisPoles&&Object.keys(axisPoles).length)?Object.fromEntries(Object.entries(axisPoles).map(([k,v])=>[k,v.labels])):{'정치':['보수','진보'],'젠더':['이퀄리즘','페미니즘']};
  const tabsHtml=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${targetClasses.map(c=>`<button onclick="gaSwitchClass('${c.name.replace(/'/g,"\\'")}')" style="padding:6px 15px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid ${gaState.activeClass===c.name?'#3B82F6':'#e5e7f5'};background:${gaState.activeClass===c.name?'#3B82F6':'#fff'};color:${gaState.activeClass===c.name?'#fff':'#666'};cursor:pointer;">${escHtml(c.name)}</button>`).join('')}</div>`;

  const c=targetClasses.find(cc=>cc.name===gaState.activeClass)||targetClasses[0];
  let classBodyHtml='<div style="color:#999;font-size:12px;padding:20px;text-align:center;">대상 반이 없어요.</div>';
  if(c){
    const roster=c.students.map(s=>({...s,...scoredByStudent[s.id]})).filter(s=>s.sortScore!==undefined);
    const fullRoster=c.students.map(s=>({...s,...scoredByStudent[s.id]})); // 응답 안 한 학생도 조는 배정받아야 하니 조 묶기/편성엔 전체 명단을 씀
    const wishForClass=(wishGroups||[]).filter(wg=>wg.class_name===c.name);
    const wishedIds=new Set(wishForClass.flatMap(wg=>wg.student_ids||[]));
    const selectedWishIds=gaState.selectedWishIds||[];
    const wishListHtml=wishForClass.map(wg=>{
      const names=(wg.student_ids||[]).map(id=>c.students.find(s=>s.id===id)?.name).filter(Boolean).join(', ');
      const sel=selectedWishIds.includes(wg.id);
      return `<span onclick="gaToggleWishSelect(${wg.id})" style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:${sel?'#fde68a':'#fff7e6'};border:1px solid ${sel?'#f0b429':'#ffe1a8'};color:#8a5a00;border-radius:14px;padding:3px 10px 3px 12px;font-size:11px;margin:0 6px 6px 0;">${sel?'☑':'⭐'} ${escHtml(names)}<span onclick="event.stopPropagation();gaDeleteWishGroup(${wg.id})" style="cursor:pointer;color:#c47a00;font-weight:700;">✕</span></span>`;
    }).join('');
    const mergeBtnHtml=selectedWishIds.length>=2?`<button onclick="gaMergeSelectedWishes()" style="padding:4px 12px;font-size:11px;border-radius:14px;border:none;background:#f0b429;color:#fff;cursor:pointer;margin-bottom:6px;">🔗 선택한 ${selectedWishIds.length}개 조 합치기</button>`:'';

    let buildAreaHtml='';
    if(buildMode){
      buildAreaHtml=`<div style="border:1.5px dashed #93c5fd;background:#eff6ff;border-radius:10px;padding:12px;margin-bottom:12px;">
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <input autocomplete="off" id="gaSearchInp" placeholder="🔍 이름(또는 학번)을 쓰고 엔터" onkeydown="if(event.key==='Enter'){event.preventDefault();gaSearchSelectStudent(this);}" style="flex:1;padding:8px 10px;border:1px solid #93c5fd;border-radius:8px;font-family:inherit;box-sizing:border-box;"/>
          <button id="gaConfirmBtn" onclick="gaConfirmGroup()" ${((building||[]).length<2)?'disabled':''} style="padding:0 16px;font-size:12px;border-radius:8px;border:none;background:${(building||[]).length<2?'#cbd5e1':'#3B82F6'};color:#fff;cursor:${(building||[]).length<2?'default':'pointer'};white-space:nowrap;">묶기${(building||[]).length?` (${(building||[]).length})`:''}</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${fullRoster.map(s=>{
            const picked=(building||[]).includes(s.id);
            const alreadyWished=wishedIds.has(s.id)&&!picked;
            const noResponse=s.sortScore===undefined;
            if(alreadyWished){
              return `<span title="이미 다른 희망 조에 속해 있어요" style="cursor:not-allowed;font-size:11.5px;border-radius:14px;padding:5px 12px;border:1px solid #eee;background:#f5f5f5;color:#bbb;">${escHtml(String(s.number||''))} ${escHtml(s.name)} ⭐</span>`;
            }
            return `<span onclick="gaToggleBuildingStudent(${s.id})" style="cursor:pointer;font-size:11.5px;border-radius:14px;padding:5px 12px;border:1px solid ${picked?'#3B82F6':'#e0e0ee'};background:${picked?'#3B82F6':'#fff'};color:${picked?'#fff':'#444'};">${escHtml(String(s.number||''))} ${escHtml(s.name)}${noResponse?'<span style="opacity:.6;"> (미응답)</span>':''}</span>`;
          }).join('')}
        </div>
      </div>`;
    }

    // 이 반의 조 편성은 한 번 계산해두면 그대로 캐시해서 씀 - 드래그로 직접 옮긴 결과가 다시 렌더링할 때마다
    // 자동배정으로 덮어써지지 않게 하기 위함. 기준/조개수/희망조원이 바뀌면 캐시를 지워서 새로 계산되게 함.
    if(!gaState.classGroups[c.name]){
      const gc=sizeMode==='size'?Math.max(1,Math.ceil(fullRoster.length/Math.max(1,groupSize||4))):groupCount;
      gaState.classGroups[c.name]=gaBuildClassGroups(fullRoster,wishForClass,gc);
    }
    gaFinalizeClassGroups(c.name);
    const groups=gaState.classGroups[c.name];
    classBodyHtml=`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div style="font-size:13px;font-weight:700;color:#333;">${escHtml(c.name)} <span style="color:#aaa;font-weight:400;font-size:11px;">(응답 완료 ${roster.length}명)</span></div>
        <div style="display:flex;gap:6px;">
          <button onclick="gaToggleBuildMode()" style="padding:5px 12px;font-size:11.5px;border-radius:14px;border:1px solid ${buildMode?'#3B82F6':'#e0e0ee'};background:${buildMode?'#3B82F6':'#fff'};color:${buildMode?'#fff':'#555'};cursor:pointer;">${buildMode?'✕ 조 묶기 끝내기':'🔗 조 묶기 시작'}</button>
        </div>
      </div>
      ${wishListHtml?`<div style="margin-bottom:8px;">${mergeBtnHtml?`<div>${mergeBtnHtml}</div>`:''}${wishListHtml}</div>`:''}
      ${buildAreaHtml}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;">
        ${groups.map((g,i)=>`<div ondragover="event.preventDefault()" ondrop="gaDropOnGroup(event,'${c.name.replace(/'/g,"\\'")}',${i})" style="border:1px solid ${g.isAnchor?'#ffd591':'#e0e0ee'};border-radius:10px;padding:10px;background:${g.isAnchor?'#fffbf0':'#fafbff'};min-height:60px;">
          <div style="font-size:12px;font-weight:700;color:#333;margin-bottom:6px;">${g.isAnchor?'⭐ ':''}조 ${i+1} <span style="color:#aaa;font-weight:400;">(${g.members.length}명)</span></div>
          ${gaRenderGroupMembers(g,c.name,i)}
          ${gaGroupReason(g)?`<div style="margin-top:7px;padding-top:7px;border-top:1px solid ${g.isAnchor?'#f5e3bd':'#eee'};font-size:10.5px;color:#8a7f5c;line-height:1.5;">💡 ${escHtml(gaGroupReason(g))}</div>`:''}
        </div>`).join('')}
      </div>
    `;
  }

  el.innerHTML=`
    <div style="border:1px solid #ede9fe;background:#faf5ff;border-radius:10px;padding:10px 12px;margin-bottom:12px;">
      <label style="font-size:11px;color:#7C3AED;font-weight:600;display:block;margin-bottom:5px;">✨ 토론 주제를 입력하고 자동 배정을 누르면 그 주제로 가장 첨예하게 갈릴 기준을 골라 조를 짜요</label>
      <div style="display:flex;gap:6px;">
        <input autocomplete="off" id="gaTopicInp" placeholder="예: 전장연 지하철 시위, 여성 할당제..." value="${escHtml(aiTopic||'')}" onkeydown="if(event.key==='Enter')gaAutoAssign();" style="flex:1;padding:7px 10px;border:1px solid #e0e0ee;border-radius:8px;font-family:inherit;box-sizing:border-box;"/>
        <button id="gaAutoBtn" onclick="gaAutoAssign()" style="padding:7px 14px;font-size:12px;border-radius:8px;border:none;background:#7C3AED;color:#fff;cursor:pointer;white-space:nowrap;">자동 배정</button>
      </div>
      ${aiReason?`<div style="font-size:11px;color:#7C3AED;margin-top:7px;">💬 ${escHtml(aiReason)}</div>`:''}
      <div style="font-size:11px;color:#888;margin-top:7px;">현재 기준: <b style="color:#333;">${escHtml(domain)}</b>${poles[domain]?` (${poles[domain][0]} ↔ ${poles[domain][1]})`:''}</div>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px;">
      <div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">조 나누는 기준</label>
        <div style="display:flex;gap:10px;align-items:center;height:34px;">
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;"><input type="radio" name="gaSizeMode" ${sizeMode==='count'?'checked':''} onchange="gaSetSizeMode('count')"/>조 개수</label>
          <input autocomplete="off" type="number" min="2" value="${groupCount}" ${sizeMode!=='count'?'disabled':''} oninput="gaSetGroupCount(this.value)" style="width:56px;padding:7px 8px;border:1px solid #e0e0ee;border-radius:8px;font-family:inherit;box-sizing:border-box;"/>
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;"><input type="radio" name="gaSizeMode" ${sizeMode==='size'?'checked':''} onchange="gaSetSizeMode('size')"/>조당 인원</label>
          <input autocomplete="off" type="number" min="2" value="${groupSize}" ${sizeMode!=='size'?'disabled':''} oninput="gaSetGroupSize(this.value)" style="width:56px;padding:7px 8px;border:1px solid #e0e0ee;border-radius:8px;font-family:inherit;box-sizing:border-box;"/>
        </div>
      </div>
    </div>
    ${tabsHtml}
    ${classBodyHtml}
  `;
}
function gaSwitchClass(name){gaState.activeClass=name;gaState.buildMode=false;gaState.building=[];gaState.selectedWishIds=[];renderGaBody();}
function gaToggleBuildMode(){gaState.buildMode=!gaState.buildMode;gaState.building=[];renderGaBody();}
// 사람이 하나도 안 남은 조는 목록에서 아예 빼고, 5명짜리 조(목표 인원보다 하나 많은 애매한 조)는 뒤로 보냄
function gaFinalizeClassGroups(className){
  let groups=gaState.classGroups[className];
  if(!groups)return;
  groups=groups.filter(g=>g.members.length>0);
  groups.sort((a,b)=>(a.members.length===5?1:0)-(b.members.length===5?1:0));
  gaState.classGroups[className]=groups;
}
// ===== 드래그로 조원 직접 옮기기 =====
let gaDrag=null;
function gaDragStart(className,groupIdx,studentId){gaDrag={className,groupIdx,studentId};}
function gaDropOnGroup(e,className,targetGroupIdx){
  e.preventDefault();
  if(!gaDrag||gaDrag.className!==className)return;
  const groups=gaState.classGroups[className];
  if(!groups)return;
  const fromGroup=groups[gaDrag.groupIdx];
  const idx=fromGroup?.members.findIndex(m=>m.id===gaDrag.studentId);
  if(idx==null||idx<0){gaDrag=null;return;}
  const[moved]=fromGroup.members.splice(idx,1);
  groups[targetGroupIdx].members.push(moved);
  gaDrag=null;
  gaFinalizeClassGroups(className); // 다 빼서 빈 조가 됐으면 목록에서 제거하고, 5명짜리는 뒤로 보냄
  renderGaBody();
}
// ===== 자동 배정: (주제가 있으면) AI로 기준 축 선택 → 희망 조가 목표 조 개수보다 많으면 가장 대립되는 것끼리 자동으로 합침
//      → 이 반 조 편성을 새로 계산 → 조마다 왜 그렇게 짰는지 짧은 이유를 붙임
function gaAvgScore(wg,scoredByStudent){
  const scores=(wg.student_ids||[]).map(id=>scoredByStudent[id]?.sortScore).filter(v=>v!==undefined);
  return scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
}
// 희망 조가 desiredCount보다 많으면, 평균 성향이 가장 반대인 두 조부터 순서대로 합쳐서 desiredCount까지 줄임(로컬 시뮬레이션만 함)
// 이전엔 "가장 반대인 한 쌍"을 매번 다시 찾아 합쳤는데, 그러면 한 번 커진 조가 계속 가장 극단적인 채로 남아
// 또 합쳐지길 반복해서 눈덩이처럼 커지고 나머지 조는 하나도 안 합쳐지는 문제가 있었음(6명·8명 vs 1명 x4 같은 상황).
// 그래서 라운드마다 전체를 성향순으로 정렬해서 양 끝(가장 반대되는 쪽)부터 여러 쌍을 동시에 균등하게 합치는 방식으로 바꿈.
function gaSimulateMergeDown(wishForClass,desiredCount,scoredByStudent){
  let list=wishForClass.map(wg=>({student_ids:[...(wg.student_ids||[])],_orig:[wg]}));
  while(list.length>desiredCount){
    const withAvg=list.map(item=>({...item,avg:gaAvgScore(item,scoredByStudent)}));
    withAvg.sort((a,b)=>a.avg-b.avg);
    const mergeCount=Math.min(Math.floor(withAvg.length/2),list.length-desiredCount);
    if(mergeCount<=0)break;
    const next=[];
    const used=new Array(withAvg.length).fill(false);
    let lo=0,hi=withAvg.length-1,merges=0;
    while(merges<mergeCount&&lo<hi){
      const a=withAvg[lo],b=withAvg[hi];
      next.push({student_ids:[...new Set([...a.student_ids,...b.student_ids])],_orig:[...a._orig,...b._orig]});
      used[lo]=true;used[hi]=true;
      lo++;hi--;merges++;
    }
    for(let i=0;i<withAvg.length;i++){ if(!used[i])next.push(withAvg[i]); }
    list=next;
  }
  return list;
}
// 조마다 "왜 이렇게 짰는지"를 짧게 설명하는 문장을 만듦 - 성향 점수가 가장 크게 갈리는 두 학생을 뽑아서 언급함
function gaGroupReason(g){
  const scored=g.members.filter(m=>m.sortScore!==undefined);
  if(scored.length<2)return g.isAnchor?'희망한 학생들끼리 묶은 조예요.':'';
  const sorted=[...scored].sort((a,b)=>b.sortScore-a.sortScore);
  const top=sorted[0],bottom=sorted[sorted.length-1];
  const diff=top.sortScore-bottom.sortScore;
  if(top.id===bottom.id||diff<0.5)return '성향이 비슷한 학생들로 묶였어요.';
  if(diff>=3)return `${top.name}와 ${bottom.name}가 서로 크게 대립되는 성향이라 함께 묶었어요.`;
  return `${top.name}와 ${bottom.name}가 서로 다른 쪽에 가까워서 균형 있게 묶었어요.`;
}
async function gaAutoAssign(){
  const inp=document.getElementById('gaTopicInp');
  const topic=inp?.value.trim();
  const btn=document.getElementById('gaAutoBtn');
  if(btn){btn.disabled=true;btn.textContent='배정 중...';}
  try{
    if(topic){
      const{domains,poles:axisPoles}=gaState;
      const poles=(axisPoles&&Object.keys(axisPoles).length)?Object.fromEntries(Object.entries(axisPoles).map(([k,v])=>[k,v.labels])):{};
      const domainDescs=domains.map(d=>`- ${d}: ${poles[d]?`${poles[d][0]} ↔ ${poles[d][1]}`:'(양극단 정보 없음)'}`).join('\n');
      const system=`너는 고등학교 윤리 수업에서 토론 조를 짤 때, 주어진 토론 주제에 대해 학생들의 의견이 가장 첨예하게 갈릴 만한 성향 축을 아래 목록 중 하나 고르는 도우미야.\n사용 가능한 축과 그 양 극단:\n${domainDescs}\n반드시 위 목록에 있는 축 이름 중 하나만 domain 값으로 골라. 그 축을 고른 이유를 한 문장으로 reason에 적어.`;
      const schema={type:'OBJECT',properties:{domain:{type:'STRING',enum:domains},reason:{type:'STRING'}},required:['domain','reason']};
      const resultText=await attGemini(system,[{text:`토론 주제: ${topic}`}],schema);
      const parsed=JSON.parse(resultText);
      if(domains.includes(parsed.domain)){
        gaState.domain=parsed.domain;
        gaState.aiTopic=topic;
        gaState.aiReason=parsed.reason||'';
      }
    }
    const scoredByStudent=gaComputeScoredByStudent();
    const targetClasses=worksheetTargetClasses(gaState.w);
    const c=targetClasses.find(cc=>cc.name===gaState.activeClass);
    if(!c)throw new Error('반을 찾을 수 없어요.');
    const fullRoster=c.students.map(s=>({...s,...scoredByStudent[s.id]}));
    const wishForClass=(gaState.wishGroups||[]).filter(wg=>wg.class_name===c.name);
    const desiredCount=gaState.sizeMode==='size'?Math.max(1,Math.ceil(fullRoster.length/Math.max(1,gaState.groupSize||4))):gaState.groupCount;
    // 희망 조가 목표 조 개수보다 많으면 가장 성향이 반대인 것끼리 조 편성 계산에서만 임시로 합쳐서 씀.
    // ⚠️ 여기서는 절대 group_wishes(원래 저장된 희망 조/짝)를 수정·삭제하지 않음 - 원래 짝은 그대로 유지되고,
    // 4명 조로 묶는 건 "이번 화면에 보여줄 조 편성 결과"를 계산할 때만 일어나는 일시적인 합산임.
    // (예전엔 이걸 DB에 영구 저장해버려서, 자동 배정을 다시 누를 때마다 이미 합쳐진 큰 덩어리를 또 합치며
    // 계속 커지는 문제가 있었음)
    const effectiveWishForClass=wishForClass.length>desiredCount
      ?gaSimulateMergeDown(wishForClass,desiredCount,scoredByStudent).map(item=>({id:item._orig[0].id,student_ids:item.student_ids,subGroups:item._orig.length>1?item._orig.map(o=>o.student_ids):null}))
      :wishForClass;
    const groups=gaBuildClassGroups(fullRoster,effectiveWishForClass,desiredCount);
    gaState.classGroups[c.name]=groups;
    gaFinalizeClassGroups(c.name);
    gaState.selectedWishIds=[];
  }catch(e){
    alert('자동 배정을 하지 못했어요: '+e.message);
  }
  if(btn){btn.disabled=false;btn.textContent='자동 배정';}
  renderGaBody();
}

function gaSearchSelectStudent(inputEl){
  const q=(inputEl.value||'').trim();
  if(!q)return;
  const targetClasses=worksheetTargetClasses(gaState.w);

  const{w,subs,targetClasses}=wsSubState;
  const steps=w.steps||[];
  const subByStudent={};subs.forEach(s=>{subByStudent[s.student_id]=s;});
  let submittedCount=0,totalCount=0;
  targetClasses.forEach(c=>c.students.forEach(()=>totalCount++));
  subs.forEach(s=>{if(s.submitted)submittedCount++;});
  const q=(wsSubState.query||'').trim();
  let studentsFlat=[];
  if(q){
    const ql=q.toLowerCase();
    targetClasses.forEach(c=>c.students.forEach(s=>{
      if(String(s.number||'').includes(q)||s.name.toLowerCase().includes(ql)||getChoseong(s.name).includes(q)){
        studentsFlat.push({...s,_cls:c.name});
      }
    }));
  }else{
    const c=targetClasses.find(c=>c.name===wsSubState.activeClass)||targetClasses[0];
    studentsFlat=(c?.students||[]).map(s=>({...s,_cls:c?.name}));
  }
  if(wsSubState.statusFilter!=='all'){
    studentsFlat=studentsFlat.filter(s=>wsSubStatusOf(subByStudent[s.id])===wsSubState.statusFilter);
  }
  const tabsHtml=q?'':`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${targetClasses.map(c=>`<button onclick="wsSubSwitchClass('${c.name.replace(/'/g,"\\'")}')" style="padding:6px 15px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid ${wsSubState.activeClass===c.name?'#3B82F6':'#e5e7f5'};background:${wsSubState.activeClass===c.name?'#3B82F6':'#fff'};color:${wsSubState.activeClass===c.name?'#fff':'#666'};cursor:pointer;">${escHtml(c.name)}</button>`).join('')}</div>`;
  const filterDefs=[['all','전체'],['notstarted','미시작'],['inprogress','작성 중'],['submitted','제출완료']];
  const filterColors={all:'#111827',notstarted:'#b3261e',inprogress:'#633806',submitted:'#27500A'};
  const curFilterLabel=(filterDefs.find(([k])=>k===wsSubState.statusFilter)||filterDefs[0])[1];
  const curFilterColor=filterColors[wsSubState.statusFilter]||filterColors.all;
  const filterHtml=`<style>@keyframes wsFilterPop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}</style>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <div style="position:relative;display:inline-block;">
        <button onclick="wsSubToggleFilterMenu()" style="padding:6px 14px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid ${curFilterColor};background:${curFilterColor};color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:5px;">${curFilterLabel}<span style="font-size:9px;transform:${wsSubState.filterMenuOpen?'rotate(180deg)':'none'};display:inline-block;">▾</span></button>
        ${wsSubState.filterMenuOpen?`<div style="position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid #e0e0ee;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;z-index:30;min-width:110px;animation:wsFilterPop .14s ease-out;">
          ${filterDefs.map(([k,label])=>`<div onclick="wsSubSetFilter('${k}')" style="padding:7px 12px;font-size:12px;border-radius:7px;cursor:pointer;color:${wsSubState.statusFilter===k?filterColors[k]:'#555'};font-weight:${wsSubState.statusFilter===k?'700':'400'};background:${wsSubState.statusFilter===k?'#f4f4fa':'transparent'};">${label}</div>`).join('')}
        </div>`:''}
      </div>
    </div>`;
  const rowsHtml=studentsFlat.map(s=>{
    const sub=subByStudent[s.id];
    const rowId=`wsSubRow_${s.id}`;
    const st=wsSubStatusOf(sub);
    const isPqQuizForBadge=steps[0]?.type==='philosopher_quiz';
    // pq(사상가찾기) 학습지는 steps가 통째로 1개짜리라 steps.length로 진행률을 보여주면 항상 "N/1"처럼 나와서
    // 의미가 없음 - 대신 pqSaveProgress가 저장해둔 answeredCount/totalCount(실제 문항 수)를 씀
    const wipLabel=isPqQuizForBadge
      ?`작성 중 (${sub?.answers?.answeredCount??0}/${sub?.answers?.totalCount??'?'})`
      :`작성 중 (${(sub?.current_step||0)+1}/${steps.length})`;
    // 색은 앱 전체에서 이미 쓰던 상태 배지 팔레트(.s-wip 갈색 / .s-done 초록)를 그대로 따르고, 미시작만 새로 빨간색 추가
    const statusBadge=st==='submitted'?'<span class="status-badge s-done">제출완료</span>':st==='inprogress'?`<span class="status-badge s-wip">${wipLabel}</span>`:'<span class="status-badge" style="background:#fdecea;color:#b3261e;">미시작</span>';
    const answers=sub?.answers||{};
    const isPqQuiz=steps[0]?.type==='philosopher_quiz';
    let detailRows;
    if(isPqQuiz){
      if(answers.inProgress){
        detailRows=`<div style="margin-top:6px;font-size:11px;color:#a16207;">📝 ${answers.answeredCount??0}/${answers.totalCount??'?'}문항 응답 중</div>`;
      }else if(!answers.winner){
        detailRows='';
      }else{
        const ph=(steps[0].philosophers||{})[answers.winner];
        // 정치/젠더/계급/개방성 고정 순서로, 부호(+/-) 대신 실제로 어느 쪽 극으로 기울었는지(라벨명)와
        // 그 절댓값을 보여줌 - "정치 -0.5"가 아니라 "보수 (0.5)"처럼 학습지 자체의 axisMeta 라벨을 그대로 씀
        const AXIS_ORDER=['정치','젠더','계급','개방성'];
        const axisMeta=steps[0]?.axisMeta||{};
        const axisScores=answers.axisScores||{};
        const axisLine=AXIS_ORDER.filter(d=>d in axisScores).map(d=>{
          const v=axisScores[d];
          const labs=axisMeta[d]?.labels||[d,d];
          const poleLabel=v>=0?labs[0]:labs[1];
          return `${escHtml(poleLabel)} (${Math.abs(v)})`;
        }).join(' · ');
        detailRows=`<div style="margin-top:6px;">
          <div style="font-size:11px;color:#888;">매칭된 사상가</div>
          <div style="font-size:12px;color:#333;background:#f8f8fa;border-radius:6px;padding:6px 8px;margin-top:2px;">${escHtml(ph?.cn||answers.winnerName||answers.winner)} · 코드 <b>${escHtml(answers.axisCode||'')}</b></div>
          ${axisLine?`<div style="font-size:11px;color:#888;margin-top:6px;">${axisLine}</div>`:''}
        </div>`;
      }
    }else{
      detailRows=steps.map(stp=>{
        const disp=wsFormatAnswerForDisplay(stp,answers);
        if(disp===null)return '';
        return `<div style="margin-top:6px;">
          <div style="font-size:11px;color:#888;">${escHtml(stp.title||stp.label||stp.id)}</div>
          <div style="font-size:12px;color:#333;white-space:pre-wrap;background:#f8f8fa;border-radius:6px;padding:6px 8px;margin-top:2px;">${escHtml(disp)}</div>
        </div>`;
      }).join('');
    }
    return `<div style="border:1px solid #eef0fb;border-radius:10px;background:#fafbff;">
      <div onclick="wsSubToggleRow(${s.id})" style="cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px;">
        <span><b>${escHtml(String(s.number||''))}</b> <span onclick="event.stopPropagation();wsShowStudentAnswers(${s.id})" style="text-decoration:underline;text-underline-offset:2px;cursor:pointer;">${escHtml(s.name)}</span>${s._cls&&q?` <span style="color:#aaa;font-weight:400;">· ${escHtml(s._cls)}</span>`:''}${sub?.group_code?` <span style="color:#aaa;">· ${escHtml(sub.group_code)}</span>`:''}</span>${statusBadge}
      </div>
      <div id="${rowId}" style="display:${wsSubState.expandedIds?.has(s.id)?'block':'none'};padding:0 12px 10px;">${detailRows||'<div style="font-size:11px;color:#bbb;">표시할 내용이 없어요.</div>'}</div>
    </div>`;
  }).join('');
  body.innerHTML=`<div style="font-size:12px;color:#666;margin-bottom:10px;">${escHtml(w.internal_name||w.title)} · 제출 ${submittedCount}/${totalCount}명</div>`+
    tabsHtml+filterHtml+
    `<div style="display:flex;flex-direction:column;gap:6px;">${rowsHtml||'<div style="padding:20px;text-align:center;color:#bbb;font-size:12px;">해당하는 학생이 없어요.</div>'}</div>`;
}
// 행을 펼치고/접은 상태를 wsSubState에 남겨둠 - 5초 폴링으로 body 전체가 다시 그려져도 펼쳐둔 행이 도로 닫히지 않게 하기 위함
function wsSubToggleRow(studentId){
  if(!wsSubState.expandedIds)wsSubState.expandedIds=new Set();
  if(wsSubState.expandedIds.has(studentId))wsSubState.expandedIds.delete(studentId);
  else wsSubState.expandedIds.add(studentId);
  renderWsSubBody();
}
// 학생 이름을 클릭하면 그 학생이 실제로 각 문항에서 무엇을 선택했는지 전부 보여주는 별도 창을 띄움.
// 별도 모달로 열기 때문에 제출 현황 쪽 5초 자동 새로고침과 전혀 부딪히지 않음(서로 다른 DOM이라 안 닫힘).
function wsShowStudentAnswers(studentId){
  const{w,subs,targetClasses}=wsSubState;
  const student=targetClasses.flatMap(c=>c.students.map(s=>({...s,_cls:c.name}))).find(s=>s.id===studentId);
  const sub=subs.find(s=>s.student_id===studentId);
  const answers=sub?.answers||{};
  const steps=w.steps||[];
  const isPqQuiz=steps[0]?.type==='philosopher_quiz';
  const d=document.createElement('div');d.className='modal-bg';d.id='mc2';d.onclick=e=>{if(e.target===d)d.remove();};
  let bodyHtml;
  if(!sub){
    bodyHtml='<div style="color:#999;font-size:12px;padding:10px 0;">아직 시작하지 않았어요.</div>';
  }else if(isPqQuiz){
    const rawAnswers=answers.rawAnswers||[];
    if(!rawAnswers.length){
      bodyHtml='<div style="color:#999;font-size:12px;padding:10px 0;">아직 답한 문항이 없어요.</div>';
    }else{
      const caseItems=steps[0].caseItems||[];
      bodyHtml=rawAnswers.map((ra,i)=>{
        const item=caseItems.find(it=>it.q===ra.q);
        const chosenOpt=item?.opts?.find(o=>o[2]===ra.dir);
        return `<div style="padding:10px 0;border-bottom:1px solid #f0f0f5;">
          <div style="font-size:11px;color:#999;margin-bottom:3px;">${i+1}번 · ${escHtml(ra.domain||'')}</div>
          <div style="font-size:12.5px;color:#333;margin-bottom:6px;">${escHtml(ra.q)}</div>
          <div style="font-size:12.5px;color:#1D4ED8;background:#eef2ff;border-radius:6px;padding:6px 9px;">→ ${escHtml(chosenOpt?chosenOpt[0]:'(선택지 확인 불가)')}</div>
        </div>`;
      }).join('');
    }
  }else{
    bodyHtml=steps.map(stp=>{
      const disp=wsFormatAnswerForDisplay(stp,answers);
      if(disp===null)return '';
      return `<div style="padding:10px 0;border-bottom:1px solid #f0f0f5;">
        <div style="font-size:11px;color:#999;margin-bottom:4px;">${escHtml(stp.title||stp.label||stp.id)}</div>
        <div style="font-size:12.5px;color:#333;white-space:pre-wrap;">${escHtml(disp)}</div>
      </div>`;
    }).join('');
  }
  d.innerHTML=`<div class="modal wide"><h3>${escHtml(`${student?.number||''} ${student?.name||''}`.trim())}의 답안</h3>
    <div style="max-height:64vh;overflow-y:auto;">${bodyHtml}</div>
    <div class="modal-btns"><span style="flex:1;"></span><button onclick="document.getElementById('mc2')?.remove()">닫기</button></div>
  </div>`;
  document.getElementById('app')?.appendChild(d);
}
// ===== 학생 고유번호(4자리 PIN) 관리 =====
// 학생이 학습지 첫 접속 때 스스로 정하는 4자리 번호. 학생 쪽에는 안전한 확인 함수(check_student_pin RPC)만
// 열어뒀고, 실제 값은 teacher 소유의 students 테이블에만 있어서 여기서 교사만 보고/바꾸고/초기화할 수 있음.
let pinAdminState={activeClass:null,query:''};
async function openStudentPinAdmin(){
  closeModal();
  const catClasses=classes.filter(c=>(c.category||'교과')===sbActiveCategory);
  pinAdminState={activeClass:catClasses[0]?.name||classes[0]?.name||null,query:''};
  const d=document.createElement('div');d.className='modal-bg';d.id='mc';d.onclick=e=>{if(e.target===d)closeModal();};
  d.innerHTML=`<div class="modal wide"><h3>학생 고유번호 관리 <span style="font-size:12px;font-weight:400;color:#aaa;">· ${escHtml(sbActiveCategory||'')}</span></h3>
    <input autocomplete="off" id="pinSearchInp" placeholder="🔍 검색" oninput="pinSearchInput(this.value)" style="width:100%;padding:10px 12px;border:1px solid #e0e0ee;border-radius:10px;font-family:inherit;font-size:13px;margin-bottom:10px;box-sizing:border-box;"/>
    <div id="wsPinAdminList" style="max-height:58vh;overflow-y:auto;"><div style="padding:20px;text-align:center;color:#999;font-size:13px;">불러오는 중...</div></div>
    <div class="modal-btns"><button onclick="closeModal()">닫기</button></div>
  </div>`;
  document.getElementById('app')?.appendChild(d);
  // 학생이 student.html(별도 세션)에서 방금 고유번호를 새로 만들었을 수 있어서, 열 때마다 최신 pin 값을 다시 받아와
  // 화면에 이미 떠 있던(로그인 시점에 한 번만 불러온) 오래된 값을 덮어씀 - 안 그러면 실제로는 설정됐는데 "미설정"으로 보임
  try{
    const{data:freshPins}=await sb.from('students').select('id,pin').eq('user_id',user.id);
    if(freshPins){
      const pinById={};freshPins.forEach(r=>{pinById[r.id]=r.pin;});
      classes.forEach(c=>c.students.forEach(s=>{if(s.id in pinById)s.pin=pinById[s.id];}));
    }
  }catch(e){}
  renderStudentPinAdminList();
}
function pinSwitchClass(name){
  pinAdminState.activeClass=name;
  renderStudentPinAdminList();
}
function pinSearchInput(v){
  pinAdminState.query=v;
  renderStudentPinAdminList();
}
let pinRevealed={};
function renderStudentPinAdminList(){
  const el=document.getElementById('wsPinAdminList');
  if(!el)return;
  const q=(pinAdminState.query||'').trim();
  // 검색어가 없을 때 보여줄 반 목록은 현재 사이드바에서 보고 있는 분류(담임/교과/동아리)로 한정함
  const catClasses=classes.filter(c=>(c.category||'교과')===sbActiveCategory);
  let studentsToShow,tabsHtml='';
  if(q){
    const ql=q.toLowerCase();
    studentsToShow=[];
    classes.forEach(c=>c.students.forEach(s=>{
      if(String(s.number||'').includes(q)||s.name.toLowerCase().includes(ql)||getChoseong(s.name).includes(q)){
        studentsToShow.push({...s,_cls:c.name});
      }
    }));
  }else{
    tabsHtml=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${catClasses.map(c=>`<button onclick="pinSwitchClass('${c.name.replace(/'/g,"\\'")}')" style="padding:6px 15px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid ${pinAdminState.activeClass===c.name?'#3B82F6':'#e5e7f5'};background:${pinAdminState.activeClass===c.name?'#3B82F6':'#fff'};color:${pinAdminState.activeClass===c.name?'#fff':'#666'};cursor:pointer;">${escHtml(c.name)}</button>`).join('')}</div>`;
    const c=catClasses.find(c=>c.name===pinAdminState.activeClass)||catClasses[0];
    studentsToShow=(c?.students||[]).map(s=>({...s,_cls:null}));
  }
  el.innerHTML=tabsHtml+`<div style="display:flex;flex-direction:column;gap:7px;">${studentsToShow.map(s=>pinRowHtml(s)).join('')||'<div style="padding:20px;text-align:center;color:#bbb;font-size:12px;">일치하는 학생이 없어요.</div>'}</div>`;
}
function pinRowHtml(s){
  const revealed=!!pinRevealed[s.id];
  const hasPin=!!s.pin;
  const dispText=hasPin?(revealed?s.pin:'● ● ● ●'):'미설정';
  const dispStyle=!hasPin?'font-family:inherit;font-size:12px;color:#c7c7d1;'
    :revealed?'font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:3px;font-weight:700;font-size:14px;color:#333;'
    :'font-family:inherit;font-size:9px;letter-spacing:2px;color:#bbb;';
  return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#fafbff;border:1px solid #eef0fb;">
    <div style="flex:1;min-width:0;font-size:13px;color:#333;"><b>${escHtml(String(s.number||''))}</b> ${escHtml(s.name)}${s._cls?` <span style="font-size:11px;color:#aaa;">· ${escHtml(s._cls)}</span>`:''}</div>
    <span id="pinDisp_${s.id}" style="${dispStyle}min-width:60px;text-align:center;display:inline-block;">${escHtml(dispText)}</span>
    <span id="pinEyeBtn_${s.id}" onclick="pinToggleReveal(${s.id})" style="cursor:pointer;font-size:11px;color:#3B82F6;font-weight:700;min-width:30px;text-align:center;">${revealed?'가리기':'보기'}</span>
    <button onclick="pinStartEdit(${s.id})" style="padding:5px 13px;font-size:11px;font-weight:600;border-radius:999px;border:none;background:#EEF2FF;color:#4338CA;cursor:pointer;">수정</button>
    <button onclick="pinReset(${s.id})" style="padding:5px 13px;font-size:11px;font-weight:600;border-radius:999px;border:none;background:#FEF2F2;color:#DC2626;cursor:pointer;">초기화</button>
  </div>`;
}
function findStudentById(sid){
  for(const c of classes){const s=c.students.find(x=>x.id===sid);if(s)return s;}
  return null;
}
// 다시 누를 때까지 계속 보여줌(자동으로 안 가려짐) - 눈 아이콘 대신 "보기/가리기" 글자 버튼으로 토글
function pinToggleReveal(sid){
  pinRevealed[sid]=!pinRevealed[sid];
  const s=findStudentById(sid);
  const dispEl=document.getElementById('pinDisp_'+sid),btnEl=document.getElementById('pinEyeBtn_'+sid);
  if(!s||!dispEl||!btnEl)return;
  const revealed=pinRevealed[sid];
  dispEl.textContent=s.pin?(revealed?s.pin:'● ● ● ●'):'미설정';
  dispEl.style.cssText=(!s.pin?'font-family:inherit;font-size:12px;color:#c7c7d1;'
    :revealed?'font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:3px;font-weight:700;font-size:14px;color:#333;'
    :'font-family:inherit;font-size:9px;letter-spacing:2px;color:#bbb;')+'min-width:60px;text-align:center;display:inline-block;';
  btnEl.textContent=revealed?'가리기':'보기';
}
function pinStartEdit(sid){
  const el=document.getElementById('pinDisp_'+sid);
  if(!el)return;
  el.innerHTML=`<input autocomplete="off" id="pinEditInp_${sid}" maxlength="4" inputmode="numeric" style="width:56px;font-size:13px;padding:3px 4px;border:1px solid #3B82F6;border-radius:6px;font-family:monospace;letter-spacing:3px;text-align:center;" onkeydown="if(event.key==='Enter')pinCommitEdit(${sid});if(event.key==='Escape')renderStudentPinAdminList();"/>`;
  document.getElementById(`pinEditInp_${sid}`)?.focus();
}
async function pinCommitEdit(sid){
  const inp=document.getElementById('pinEditInp_'+sid);
  if(!inp)return;
  const v=inp.value.trim();
  if(!/^\d{4}$/.test(v)){alert('숫자 4자리로 입력해주세요.');return;}
  const s=findStudentById(sid);
  if(!s)return;
  s.pin=v;
  pinRevealed[sid]=true;
  await sb.from('students').update({pin:v}).eq('id',sid);
  renderStudentPinAdminList();
}
function pinReset(sid){
  const s=findStudentById(sid);
  if(!s)return;
  openTypedResetConfirm(`"${s.name}" 학생의 고유번호`,async()=>{
    s.pin=null;
    delete pinRevealed[sid];
    await sb.from('students').update({pin:null}).eq('id',sid);
    renderStudentPinAdminList();
  });
}

</script>
<script type="text/plain" id="attGasSrc">
/** 싯다르타 ↔ 학급출결현황 연결 (웹 앱)
 *  - 이 코드를 출결 스프레드시트의 Apps Script(확장 프로그램 → Apps Script)에 "새 파일"로 붙여넣고
 *    배포 → 새 배포 → 유형: 웹 앱 / 실행: 나 / 액세스: 모든 사용자 → 배포 → 나온 URL을 싯다르타에 붙여넣기
 *  - 기존 코드(기호 → 비고·결석일수·증빙서류 자동기록)는 그대로 두세요. 싯다르타에서 입력하면
 *    기존 onEdit와 "똑같은 함수(processCell)"를 불러서 처리해요. 팝업 대신 싯다르타에 적은 사유·교시를 넘겨줘요.
 */
var SIDDHARTA_KEY = '__KEY__';

function doGet(e) { return sdHandle_(e && e.parameter || {}); }
function doPost(e) { var p = {}; try { p = JSON.parse(e.postData.contents); } catch (x) {} return sdHandle_(p); }
function sdOut_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function sdHandle_(p) {
  try {
    if (p.key !== SIDDHARTA_KEY) return sdOut_({ error: '연결 비밀키가 맞지 않아요' });
    var ss = p.sid ? SpreadsheetApp.openById(p.sid) : SpreadsheetApp.getActiveSpreadsheet();
    if (p.action === 'tabs') return sdOut_({ title: ss.getName(), tabs: ss.getSheets().map(function (s) { return s.getName(); }) });
    var sh = ss.getSheetByName(p.tab);
    if (!sh) return sdOut_({ error: '탭을 찾지 못했어요: ' + p.tab });
    if (p.action === 'excuse') return sdOut_(sdExcuse_(sh, p));
    if (p.action === 'excuseSave') return sdOut_(sdExcuseSave_(p));
    if (p.action === 'set') {
      var lock = LockService.getScriptLock(); lock.waitLock(20000);
      try { sdSet_(sh, p); SpreadsheetApp.flush(); } finally { lock.releaseLock(); }
    }
    return sdOut_(sdRead_(sh, ss));
  } catch (err) { return sdOut_({ error: String(err && err.message || err) }); }
}

// 표 구조 찾기: '번호'·'성명' 머리행, 그 다음 줄의 날짜 숫자, 비고·결석일수·증빙서류·기호표시 칸
function sdLayout_(v) {
  var L = null;
  for (var r = 0; r < Math.min(v.length, 30) && !L; r++) {
    var row = v[r].map(function (x) { return String(x).replace(/\s/g, ''); });
    var iNo = row.indexOf('번호'), iNm = row.indexOf('성명');
    if (iNm < 0) iNm = row.indexOf('이름');
    if (iNo >= 0 && iNm >= 0) L = { head: r, no: iNo, name: iNm };
  }
  if (!L) throw new Error('"번호"·"성명" 머리칸을 찾지 못했어요');
  var h = v[L.head], d = v[L.head + 1] || [];
  var find = function (re) { for (var c = 0; c < h.length; c++) { if (re.test(String(h[c]).replace(/\s/g, '')) || re.test(String(d[c]).replace(/\s/g, ''))) return c; } return -1; };
  L.note = find(/^비고/); L.count = find(/결석일수/); L.doc = find(/증빙/); L.legend = find(/기호/);
  var end = L.note > 0 ? L.note : h.length;
  L.days = [];
  for (var c = L.name + 1; c < end; c++) {
    var n = String(d[c]).trim();
    if (/^\d{1,2}$/.test(n)) L.days.push({ d: +n, col: c, dow: String(h[c]).trim() });
  }
  L.first = L.head + 2;
  return L;
}
function sdLines_(s) { s = String(s || ''); return s ? s.split(/\n/) : []; }

function sdRead_(sh, ss) {
  var v = sh.getDataRange().getDisplayValues(), L = sdLayout_(v);
  var month = 0, title = '';
  for (var r = 0; r < L.head && !month; r++) for (var c = 0; c < v[r].length; c++) {
    var m = String(v[r][c]).match(/\((\d{1,2})월\)|(\d{1,2})월/); if (m) { month = +(m[1] || m[2]); title = String(v[r][c]); break; }
  }
  if (!month) { var m2 = (sh.getName() + ' ' + ss.getName()).match(/(\d{1,2})월/); if (m2) month = +m2[1]; }
  var legend = [];
  if (L.legend >= 0) for (var r2 = L.head + 1; r2 < v.length; r2++) {
    var sym = String(v[r2][L.legend]).trim(); if (!sym) continue;
    var lb = v[r2].slice(L.legend + 1, L.legend + 5).join('').replace(/\s/g, '');
    if (lb) legend.push([sym, lb]);
  }
  var students = [];
  for (var r3 = L.first; r3 < v.length; r3++) {
    var no = String(v[r3][L.no]).trim(); if (!/^\d+$/.test(no)) continue;
    var marks = {};
    L.days.forEach(function (x) { var s = String(v[r3][x.col]).trim(); if (s) marks[x.d] = s; });
    var ev = {};
    try {
      var raw = PropertiesService.getDocumentProperties().getProperty('records_' + sh.getName() + '_' + (r3 + 1));
      (raw ? JSON.parse(raw) : []).forEach(function (rc) { var dn = typeof rc.dateNum === 'number' ? rc.dateNum : parseInt(rc.remarkLine, 10); if (dn) ev[dn] = rc.evidenceLine == null ? null : String(rc.evidenceLine).trim(); });
    } catch (x) {}
    students.push({ ev: ev, no: +no, name: String(v[r3][L.name]).replace(/\n/g, ' ').trim(), marks: marks,
      notes: L.note >= 0 ? sdLines_(v[r3][L.note]) : [], counts: L.count >= 0 ? sdLines_(v[r3][L.count]) : [], docs: L.doc >= 0 ? sdLines_(v[r3][L.doc]) : [] });
  }
  return { url: ss.getUrl(), gid: sh.getSheetId(), tab: sh.getName(), title: title, month: month, days: L.days.map(function (x) { return { d: x.d, dow: x.dow }; }), legend: legend, students: students };
}

// 한 학생·한 날짜 기록.
// 기존 자동기록 코드(processCell)가 있으면 그걸 그대로 부름 → 비고·결석일수·증빙서류·기록 보관(records)이 손으로 입력한 것과 똑같이 처리됨
function sdSet_(sh, p) {
  var v = sh.getDataRange().getDisplayValues(), L = sdLayout_(v);
  var day = +p.day, dc = null;
  L.days.forEach(function (x) { if (x.d === day) dc = x; });
  if (!dc) throw new Error(day + '일 칸을 찾지 못했어요');
  var row = -1;
  for (var r = L.first; r < v.length; r++) if (String(v[r][L.no]).trim() === String(p.no)) { row = r; break; }
  if (row < 0) throw new Error(p.no + '번 학생을 찾지 못했어요');
  var R = row + 1, C = dc.col + 1, sym = p.sym || '';
  var useOld = typeof processCell === 'function' && typeof getHeaderInfoCached === 'function' && typeof buildRemarkSuffix === 'function'
    && (typeof ATTENDANCE_SHEETS === 'undefined' || ATTENDANCE_SHEETS.indexOf(sh.getName()) !== -1);
  if (!useOld) { sdSetSimple_(sh, v, L, R - 1, dc, day, p); return; }
  var hi = getHeaderInfoCached(sh);
  var cellNow = String(v[row][dc.col]).trim();
  if (p.docOnly && cellNow === sym && sym) { sdSetEvidence_(sh, hi, R, C, day, p.doc); return; }
  sh.getRange(R, C).setValue(sym);
  if (!sym) { processCell(sh, R, C, '', hi); sdCleanupDay_(sh, hi, R, C, day); return; }
  // 팝업(ui.prompt) 대신 싯다르타에서 보낸 사유·교시로 비고 문구를 만듦 (기존 형식 그대로)
  var reason = String(p.reason || '').trim(), per = String(p.periods || '').trim();
  var unauth = /미인정/.test(p.label || ''), absence = /결석/.test(p.label || '');
  var suffix = unauth ? (absence ? '태만' : ('태만' + (per ? ' ' + per : ''))) : (reason + (per && !absence ? ' ' + per : '')).trim();
  var orig = buildRemarkSuffix;
  buildRemarkSuffix = function () { return { suffix: suffix, reason: unauth ? '' : reason }; };
  try { processCell(sh, R, C, sym, hi); } finally { buildRemarkSuffix = orig; }
  if (p.doc !== undefined && p.doc !== null && String(p.doc).trim() !== '') sdSetEvidence_(sh, hi, R, C, day, p.doc);
}

// 기호를 지운 뒤에도 그 날짜 줄이 남아 있으면(기록 메모가 없던 줄 등) 비고·결석일수·증빙서류에서 그 날짜 줄을 마저 지움
function sdCleanupDay_(sh, hi, R, C, day) {
  var props = PropertiesService.getDocumentProperties(), key = 'records_' + sh.getName() + '_' + R;
  try { var recs = JSON.parse(props.getProperty(key) || '[]'); var left = recs.filter(function (x) { return (typeof x.dateNum === 'number' ? x.dateNum : parseInt(x.remarkLine, 10)) !== day; });
    if (left.length !== recs.length) { if (left.length) props.setProperty(key, JSON.stringify(left)); else props.deleteProperty(key); } } catch (x) {}
  var rc = sh.getRange(R, hi.remarkCol), notes = String(rc.getValue() || '').split('\n').filter(function (l) { return l.length; });
  var idx = -1; for (var i = 0; i < notes.length; i++) { var m = /^\s*(\d+)\s*\./.exec(notes[i]); if (m && +m[1] === day) { idx = i; break; } }
  if (idx < 0) return;
  var n0 = notes.length; notes.splice(idx, 1); rc.setValue(notes.join('\n'));
  [hi.countCol, hi.evidenceCol].forEach(function (col) {
    if (!col) return; var c = sh.getRange(R, col), ls = String(c.getValue() || '').split('\n').filter(function (l) { return l.length; });
    if (ls.length === n0) { ls.splice(idx, 1); c.setValue(ls.join('\n')); }
  });
}

// 증빙서류 한 줄만 바꾸기 (기존 records에서 그 날짜 기록의 자리를 찾아 그 줄만 교체/추가)
function sdSetEvidence_(sh, hi, R, C, day, doc) {
  if (!hi.evidenceCol) return;
  doc = String(doc || '').trim();
  var props = PropertiesService.getDocumentProperties(), key = 'records_' + sh.getName() + '_' + R;
  var recs = []; try { recs = JSON.parse(props.getProperty(key) || '[]'); } catch (x) {}
  var rec = null; recs.forEach(function (x) { var dn = typeof x.dateNum === 'number' ? x.dateNum : parseInt(x.remarkLine, 10); if (dn === day) rec = x; });
  if (!rec) return;
  var cell = sh.getRange(R, hi.evidenceCol), cur = String(cell.getValue() || ''), lines = cur ? cur.split('\n') : [];
  var has = function (x) { return x.evidenceLine !== null && x.evidenceLine !== undefined; };
  var aligned = recs.filter(has).length === lines.filter(function (l) { return l.length; }).length;
  cell.setNumberFormat('@');
  if (has(rec)) {
    var pos = findRecordSortedPosition_(recs, rec, has);
    if (aligned && pos >= 0 && pos < lines.length) { if (doc) lines[pos] = doc; else lines.splice(pos, 1); }
    else if (doc) lines.push(doc);
  } else if (doc) {
    rec.evidenceLine = doc;
    var pos2 = findRecordSortedPosition_(recs, rec, has);
    if (aligned && pos2 >= 0) lines.splice(pos2, 0, doc); else lines.push(doc);
  }
  rec.evidenceLine = doc ? doc : null;
  cell.setValue(lines.join('\n'));
  props.setProperty(key, JSON.stringify(recs));
}

// (기존 자동기록 코드가 없는 탭용) 싯다르타가 직접 비고·결석일수·증빙서류에 줄을 넣음
function sdSetSimple_(sh, v, L, row, dc, day, p) {
  sh.getRange(row + 1, dc.col + 1).setValue(p.sym || '');
  if (L.note < 0) return;
  var notes = sdLines_(v[row][L.note]), counts = L.count >= 0 ? sdLines_(v[row][L.count]) : [], docs = L.doc >= 0 ? sdLines_(v[row][L.doc]) : [];
  var alignC = counts.length === notes.length, alignD = docs.length === notes.length;
  var dayOf = function (s) { var m = String(s).match(/^\s*(\d{1,2})\s*\./); return m ? +m[1] : 99; };
  var idx = -1; for (var i = 0; i < notes.length; i++) if (dayOf(notes[i]) === day) { idx = i; break; }
  if (!p.sym) {
    if (idx >= 0) { notes.splice(idx, 1); if (alignC) counts.splice(idx, 1); if (alignD) docs.splice(idx, 1); }
  } else {
    var note = day + '. ' + String(p.reason || '').trim() + (p.periods ? ' ' + p.periods : '');
    var cnt = String(p.label || '') + (/결석/.test(p.label || '') ? ' 1일' : ' 1회');
    var doc = String(p.doc || '').trim();
    if (idx >= 0) {
      notes[idx] = note;
      if (alignC) counts[idx] = cnt; else counts.push(cnt);
      if (alignD) docs[idx] = doc; else if (doc) docs.push(doc);
    } else {
      var k = notes.length; for (var j = 0; j < notes.length; j++) if (dayOf(notes[j]) > day) { k = j; break; }
      notes.splice(k, 0, note);
      if (alignC) counts.splice(k, 0, cnt); else counts.push(cnt);
      if (alignD) docs.splice(k, 0, doc); else if (doc) docs.push(doc);
    }
  }
  sh.getRange(row + 1, L.note + 1).setValue(notes.join('\n'));
  if (L.count >= 0) sh.getRange(row + 1, L.count + 1).setValue(counts.join('\n'));
  if (L.doc >= 0) sh.getRange(row + 1, L.doc + 1).setValue(docs.join('\n').replace(/\n+$/, ''));
}

// ── 생리공결 보호자 확인서: 기존 코드의 양식 PDF·한글 폰트(드라이브 "생리공결확인서" 폴더)를 싯다르타로 보내줌.
//    PDF는 싯다르타에서 기존 코드와 같은 좌표로 채워서 바로 인쇄하고, 다 만든 파일은 같은 폴더에 저장해 둠
function sdExcuse_(sh, p) {
  if (typeof getOrCreateExcuseFormFolder_ !== 'function') throw new Error('생결 확인서 기능(기존 코드)이 이 시트에 없어요');
  var folder = getOrCreateExcuseFormFolder_();
  var b64 = function (u8) { var a = new Array(u8.length); for (var i = 0; i < u8.length; i++) a[i] = u8[i] > 127 ? u8[i] - 256 : u8[i]; return Utilities.base64Encode(a); };
  var ym = getSheetMonthYear(sh);
  var out = { id: buildStudentId_(p.no, sh.getName()), year: ym.year, month: ym.month,
    pdf: b64(getFileBytesByName_(folder, EXCUSE_TEMPLATE_PDF_NAME)) };
  if (p.withFont) out.font = b64(getFileBytesByName_(folder, KOREAN_FONT_FILENAME));
  return out;
}
function sdExcuseSave_(p) {
  var folder = getOrCreateExcuseFormFolder_();
  var f = folder.createFile(Utilities.newBlob(Utilities.base64Decode(p.b64), 'application/pdf', p.fileName || '생리공결보호자확인서.pdf'));
  return { url: f.getUrl() };
}
</script>
