// 학생 탭(행동특성/세특 등) 안에서 그동안 기록된 누가 기록을 보여줄 때 씀 - 이미 학생·탭·과목이 고정된 컨텍스트라
// 클래스 모드처럼 반 전체를 스캔할 필요 없이, 그 필드의 keywords 배열만 보고 ts 있는 것만 골라 최신순으로 표시.
// 위에 중요도별 건수 요약 + 텍스트/날짜 필터바를 같이 붙여서 기록이 쌓여도 찾기 쉽게 함.
function qnHistoryHtmlFromKeywords(kws,studentId,tabType,subject,containerId,student){
  const history=(kws||[]).filter(k=>k.ts).map(k=>({...k,studentId})).sort((a,b)=>b.ts-a.ts);
  const target={tabType,subject};
  if(!history.length){
    const hint=student?qnOtherLocationsHtml(student,tabType,subject):'';
    return `<div style="font-size:11px;color:#bbb;padding:8px 0;">아직 이 항목엔 누가 기록이 없어요.</div>${hint}`;
  }
  const counts={높음:0,보통:0,낮음:0};
  history.forEach(k=>{const imp=k.importance||'보통';counts[imp]=(counts[imp]||0)+1;});
  const summary=`<div style="font-size:11px;color:#888;margin-bottom:8px;">높음 ${counts.높음}건 · 보통 ${counts.보통}건 · 낮음 ${counts.낮음}건 (총 ${history.length}건)</div>`;
  return `<div style="margin-top:10px;">
    ${summary}
    ${qnHistoryFilterBarHtml(containerId)}
    <div id="${containerId}">${qnGroupByDate(history).map(items=>qnHistoryCardHtml(items,false,target)).join('')}</div>
  </div>`;
}
// 지금 보고 있는 탭(+과목)엔 기록이 없는데 다른 탭/과목에는 있는 경우 안내 - 세특은 과목별로 완전히 분리 저장되기 때문에
// "분명히 기록했는데 왜 없지?" 하는 혼란이 생기기 쉬워서(예: 반 단위 기록 대상이 사회인데 국어 탭을 보고 있는 경우), 어디에 있는지 짚어줌.
function qnOtherLocationsHtml(s,excludeTabType,excludeSubject){
  if(!s)return'';
  const locations=[];
  const hCount=(s.keywords||[]).filter(k=>k.ts).length;
  if(hCount&&excludeTabType!=='haengdong')locations.push(`행동특성(${hCount}건)`);
  let setechData={};try{setechData=JSON.parse(s.setech||'{}');}catch(e){}
  const validSubjects=getEffectiveSetechSubjects();
  Object.keys(setechData).filter(sub=>validSubjects.includes(sub)).forEach(sub=>{
    const cnt=((setechData[sub]||{}).keywords||[]).filter(k=>k.ts).length;
    if(cnt&&!(excludeTabType==='setech'&&sub===excludeSubject))locations.push(`${sub} 세특(${cnt}건)`);
  });
  let changyeData={};try{changyeData=JSON.parse(s.changye||'{}');}catch(e){}
  Object.keys(changyeData).forEach(t=>{
    const cnt=((changyeData[t]||{}).keywords||[]).filter(k=>k.ts).length;
    if(cnt&&excludeTabType!==t)locations.push(`${escHtml(REVIEW_TAB_LABELS[t]||t)}(${cnt}건)`);
  });
  if(!locations.length)return'';
  return `<div style="font-size:11px;color:#7C3AED;padding:6px 0;">📍 다른 곳에 기록이 있어요: ${locations.join(', ')}</div>`;
}
// 누가기록 카드 리스트(qn-hist-card 클래스가 붙은 카드들) 위에 얹는 검색어+날짜범위 필터바.
// 실제 필터링은 서버/데이터 재조회 없이 이미 렌더된 카드를 JS로 보이기/숨기기만 함 - 카드 수가 학생 한 명 분량이라 충분히 가벼움.
function qnHistoryFilterBarHtml(containerId){
  return `<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
    <input autocomplete="off" type="text" placeholder="🔍 내용 검색" oninput="qnFilterHistoryList('${containerId}')" id="${containerId}_q" style="flex:1;min-width:100px;font-size:12px;padding:5px 8px;border:1px solid #e0e0ee;border-radius:8px;box-sizing:border-box;">
    <input autocomplete="off" type="date" id="${containerId}_from" onchange="qnFilterHistoryList('${containerId}')" style="font-size:12px;padding:5px 6px;border:1px solid #e0e0ee;border-radius:8px;">
    <span style="align-self:center;font-size:11px;color:#aaa;">~</span>
    <input autocomplete="off" type="date" id="${containerId}_to" onchange="qnFilterHistoryList('${containerId}')" style="font-size:12px;padding:5px 6px;border:1px solid #e0e0ee;border-radius:8px;">
  </div>`;
}
function qnFilterHistoryList(containerId){
  const box=document.getElementById(containerId);if(!box)return;
  const q=(document.getElementById(`${containerId}_q`)?.value||'').toLowerCase().trim();
  const fromV=document.getElementById(`${containerId}_from`)?.value;
  const toV=document.getElementById(`${containerId}_to`)?.value;
  const fromTs=fromV?new Date(`${fromV}T00:00:00`).getTime():null;
  const toTs=toV?new Date(`${toV}T23:59:59`).getTime():null;
  box.querySelectorAll('.qn-hist-card').forEach(el=>{
    const ts=parseInt(el.dataset.ts||'0',10);
    const text=el.dataset.search||'';
    let show=true;
    if(q&&!text.includes(q))show=false;
    if(fromTs&&ts<fromTs)show=false;
    if(toTs&&ts>toTs)show=false;
    el.style.display=show?'':'none';
  });
}
function getTabData(tabType){
  const s=getStu();if(!s)return{memo:'',keywords:[],result:'',example:'',command:''};
  if(tabType==='setech'){
    const setech=JSON.parse(s.setech||'{}');
    return setech[selSubject||getDefaultSubject()]||{memo:'',keywords:[],result:'',example:'',command:''};
  } else {
    const changye=JSON.parse(s.changye||'{}');
    return changye[tabType]||{memo:'',keywords:[],result:'',example:'',command:''};
  }
}

async function saveTabData(tabType,label,updates){
  const s=getStu();if(!s)return;
  if(tabType==='setech'){
    const setech=JSON.parse(s.setech||'{}');
    const sub=selSubject||getDefaultSubject();
    setech[sub]={...(setech[sub]||{}), ...updates};
    s.setech=JSON.stringify(setech);
    await sb.from('students').update({setech:s.setech}).eq('id',s.id);
  } else {
    const changye=JSON.parse(s.changye||'{}');
    changye[tabType]={...(changye[tabType]||{}), ...updates};
    s.changye=JSON.stringify(changye);
    await sb.from('students').update({changye:s.changye}).eq('id',s.id);
  }
}

// ===== 누가 기록 (살핌 벤치마킹): 반 폴더를 연 상태에서 맨 위 "📝 누가 기록"을 누르면
// 그 반에 미리 정해둔 저장 대상(세특 과목 또는 자율/동아리/진로/독서/행동특성)으로 바로 기록됨.
// 이미 반을 열고 들어온 상태라 반을 또 고를 필요가 없고, 과목명도 매번 안 적어도 됨. =====
let quickNoteModeCls=null; // 지금 "누가 기록" 화면을 보고 있는 반 이름 (null이면 평소 화면)
let bulkRecordModeCls=null; // 지금 "일괄 기록" 화면을 보고 있는 반 이름 (null이면 평소 화면) - 누가기록과 서로 독립된 별도 모드
function openQuickNoteForClass(clsName){
  quickNoteModeCls=clsName;bulkRecordModeCls=null;
  selCls=clsName;selStu=null;
  renderSb();renderMain();
}
function openBulkRecordForClass(clsName){
  bulkRecordModeCls=clsName;quickNoteModeCls=null;
  selCls=clsName;selStu=null;
  renderSb();renderMain();
}
// 반의 분류(담임/교과/동아리)에 따라 그 반에서 실제로 쓸 수 있는 탭만 좁혀줌.
// 담임 반: 세특 빼고 나머지 5개. 교과 반: 세특만. 동아리 반: 동아리 활동만.
function getAllowedTabIds(category){
  if(category==='교과')return['setech'];
  if(category==='동아리')return['dongari'];
  return['jayul','dongari','jinro','dokseo','haengdong']; // 담임(기본값)
}
function getClassRecordTarget(clsName){
  let map={};try{map=JSON.parse(localStorage.getItem('qnClassTargets')||'{}');}catch(e){}
  if(map[clsName])return map[clsName];
  // 교과/동아리 반은 저장 위치가 사실상 하나로 정해져 있으니, 굳이 고르게 하지 않고 자동으로 정해줌
  // (담임 반은 여전히 5개 중에 골라야 해서 그대로 픽커를 씀)
  const c=classes.find(c=>c.name===clsName);
  const allowed=getAllowedTabIds(c?.category||'교과');
  if(allowed.length===1){
    const tabType=allowed[0];
    if(tabType==='setech'){
      const subs=getEffectiveSetechSubjects();
      if(subs.length===1){
        setClassRecordTarget(clsName,'setech',subs[0]);
        return{tabType:'setech',subject:subs[0]};
      }
      return null; // 과목이 여러 개면 그 중 하나는 골라야 하니 픽커(과목 선택만) 노출
    }
    setClassRecordTarget(clsName,tabType,null);
    return{tabType,subject:null};
  }
  return null;
}
function setClassRecordTarget(clsName,tabType,subject){
  let map={};try{map=JSON.parse(localStorage.getItem('qnClassTargets')||'{}');}catch(e){}
  map[clsName]={tabType,subject:subject||null};
  localStorage.setItem('qnClassTargets',JSON.stringify(map));
}
function confirmClassTarget(clsName,tabType,subject){
  setClassRecordTarget(clsName,tabType,subject);
  if(bulkRecordModeCls===clsName)renderBulkRecordClassBody(clsName);else renderQuickNoteClassBody(clsName);
}
function clearClassTarget(clsName){
  let map={};try{map=JSON.parse(localStorage.getItem('qnClassTargets')||'{}');}catch(e){}
  delete map[clsName];
  localStorage.setItem('qnClassTargets',JSON.stringify(map));
  if(bulkRecordModeCls===clsName)renderBulkRecordClassBody(clsName);else renderQuickNoteClassBody(clsName);
}

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">

        <textarea class="bulk-ta" id="bulkResTa_${s.id}" oninput="autoGrowTa(this);bulkSaveResult('${clsName}',${s.id},this.value);bulkUpdByte(${s.id})" placeholder="생성 버튼을 눌러 주세요..." style="width:100%;border:none;outline:none;resize:none;overflow:hidden;background:transparent;display:block;font-size:12px;line-height:1.5;padding:6px 8px;border-radius:8px;font-family:inherit;">${escHtml(result)}</textarea>

        </div>
        <div style="display:flex;align-items:stretch;margin-top:6px;border:1px solid #e0e0ee;border-radius:7px;background:#f8f8ff;overflow:hidden;">
          <textarea class="bulk-ta" id="bulkFb_${s.id}" oninput="autoGrowTa(this)" placeholder="피드백 입력 후 재생성" rows="1" style="flex:1;min-width:0;box-sizing:border-box;font-size:11px;line-height:1.4;padding:5px 8px;border:none;background:transparent;color:#1a1a2e;font-family:inherit;resize:none;overflow:hidden;"></textarea>

  return `<div>

        <button id="bulkGenStartBtn" onclick="runBulkGenerate('${clsName.replace(/'/g,"\\'")}','${target.tabType}',${target.subject?`'${target.subject.replace(/'/g,"\\'")}'`:'null'},'${(target.tabType==='setech'?target.subject:REVIEW_TAB_LABELS[target.tabType]).replace(/'/g,"\\'")}')" style="padding:11px 22px;font-size:14px;border-radius:10px;border:none;background:#3B82F6;color:#fff;cursor:pointer;"><span id="bulkGenCount">전체 일괄 생성</span></button>

// "생성 결과" 옆에 "현재바이트 / 목표바이트"로 표시(개별 학생 탭의 byte-info와 같은 형식). 목표 바이트를 넘으면 빨간색.
function bulkUpdByte(studentId){
  const ta=document.getElementById(`bulkResTa_${studentId}`);
  const el=document.getElementById(`bulkByte_${studentId}`);
  const btInp=document.getElementById(`bulkBt_${studentId}`);
  if(!ta||!el)return;
  const b=bytes(ta.value);
  const bt=parseInt(btInp?.value||localStorage.getItem('byteTarget')||'1000');
  el.textContent=`${b} / ${bt}`;
  el.style.color=b>bt?'#DC2626':'#1D4ED8';
}
// 학생별 목표 바이트(setech/changye의 byteTarget 필드, command와 같은 자리) - 없으면 전역 설정값(localStorage byteTarget)을 씀
function getByteTargetFor(s,tabType,subject){
  let store={};try{store=JSON.parse(tabType==='setech'?(s.setech||'{}'):(s.changye||'{}'));}catch(e){}
  return(store[tabType==='setech'?subject:tabType]||{}).byteTarget||null;
}
let bulkBtSaveTimer={};
function bulkSaveByteTarget(clsName,studentId,v){
  const c=classes.find(c=>c.name===clsName);const s=c?.students.find(st=>st.id===studentId);if(!s)return;
  const target=getClassRecordTarget(clsName);if(!target)return;
  bulkUpdByte(studentId);
  clearTimeout(bulkBtSaveTimer[studentId]);
  bulkBtSaveTimer[studentId]=setTimeout(()=>saveTabDataFor(s,target.tabType,target.subject,{byteTarget:parseInt(v)||1000}),400);
}
// "전체 공통 바이트" 입력 후 "전체 적용" 누르면 반 전체 학생에게 그 목표 바이트를 한 번에 적용(도움반 등 개별
// 학생은 이후 자기 칸에서 따로 다시 조정하면 됨 - 전체적용은 그저 일괄 초기값을 깔아주는 것일 뿐, 덮어써도 무방)
async function bulkSetAllByteTarget(clsName){
  const v=parseInt(document.getElementById('bulkCommonBt')?.value||'');
  if(!v){alert('적용할 바이트 수를 입력해 주세요.');return;}
  const c=classes.find(c=>c.name===clsName);
  const target=getClassRecordTarget(clsName);
  if(!c||!target)return;
  for(const s of c.students){
    await saveTabDataFor(s,target.tabType,target.subject,{byteTarget:v});
  }
  if(bulkRecordModeCls===clsName)renderBulkRecordClassBody(clsName);
}
// 표의 학생 한 명만, 입력한 피드백을 반영해서 재생성(피드백이 비어있으면 그냥 새로 생성). 기존 개별 생성처럼
// generateTab/generate를 그 학생 컨텍스트로 잠깐 바꿔서 그대로 재사용.
async function bulkGenerateWithFeedback(clsName,studentId){
  const c=classes.find(c=>c.name===clsName);const s=c?.students.find(st=>st.id===studentId);if(!s)return;
  const target=getClassRecordTarget(clsName);if(!target)return;
  const fb=document.getElementById(`bulkFb_${studentId}`)?.value.trim()||'';
  const prevCls=selCls,prevStu=selStu,prevTab=selTab,prevSubject=selSubject;
  selCls=clsName;selStu=studentId;selTab=target.tabType;if(target.tabType==='setech')selSubject=target.subject;
  renderMain();
  await new Promise(r=>setTimeout(r,30));
  try{
    if(target.tabType==='haengdong')await generate(fb);
    else await generateTab(target.tabType,target.tabType==='setech'?target.subject:REVIEW_TAB_LABELS[target.tabType],fb);
  }catch(e){alert('생성 실패: '+e.message);}
  selCls=prevCls;selStu=prevStu;selTab=prevTab;selSubject=prevSubject;
  if(bulkRecordModeCls===clsName)renderBulkRecordClassBody(clsName);
}
// 학생 객체로 그 학생의 "중점 지시사항"(명령어)을 읽음 - 메모/결과와 같은 자리(setech/changye JSON blob)에 있음
function getCommandFor(s,tabType,subject){
  let store={};try{store=JSON.parse(tabType==='setech'?(s.setech||'{}'):(s.changye||'{}'));}catch(e){}
  return(store[tabType==='setech'?subject:tabType]||{}).command||'';
}
let bulkCommandSaveTimer={};
function bulkSaveCommand(clsName,studentId,v){
  const c=classes.find(c=>c.name===clsName);const s=c?.students.find(st=>st.id===studentId);if(!s)return;
  const target=getClassRecordTarget(clsName);if(!target)return;
  clearTimeout(bulkCommandSaveTimer[studentId]);
  bulkCommandSaveTimer[studentId]=setTimeout(()=>saveTabDataFor(s,target.tabType,target.subject,{command:v}),500);
}
// 학생 이름 아래 "📝 N건" 칩을 누르면 그 학생의 누가기록 이력(qnHistoryCardHtml 재사용 - 수정/삭제 다 됨)이
// 바로 아래 행으로 펼쳐짐/접힘. 별도 데이터가 아니라 누가기록 모드와 완전히 같은 데이터라 그쪽에서 고쳐도 여기 반영됨.
function bulkToggleNotes(studentId){
  const el=document.getElementById(`bulkNotes_${studentId}`);
  if(!el)return;
  el.style.display=el.style.display==='none'?'table-row':'none';
}
// 희망진로 입력(일괄 기록 표, 학생명 아래) - saveCareerField와 똑같은 changye._career 필드를 씀(getStu() 의존
// 없는 임의 학생 버전). 이 필드는 이미 세특 등 생성 프롬프트에서 참고자료로 쓰이고 있었는데(careerPromptLine)
// 정작 입력할 UI가 어디에도 연결이 안 돼 있던 죽은 코드였음 - 이번에 일괄 기록 표를 그 입력 지점으로 씀.
// goal이 채워지면 clarity도 같이 true로 켜서 별도 조작 없이 바로 프롬프트에 반영되게 함.
let bulkCareerSaveTimer={};
function bulkSaveCareerGoal(clsName,studentId,v){
  const c=classes.find(c=>c.name===clsName);const s=c?.students.find(st=>st.id===studentId);if(!s)return;
  clearTimeout(bulkCareerSaveTimer[studentId]);
  bulkCareerSaveTimer[studentId]=setTimeout(async()=>{
    let changye={};try{changye=JSON.parse(s.changye||'{}');}catch(e){}
    changye._career={...(changye._career||{}),goal:v,clarity:!!v.trim()};
    s.changye=JSON.stringify(changye);
    await sb.from('students').update({changye:s.changye}).eq('id',s.id);
  },500);
}
// ===== 진로 계열 통계: 한 반의 희망진로(changye._career.goal)를 AI로 계열별 분류해서 원 그래프로 표시 =====
// 분류 결과(카테고리명)는 학생 레코드(changye._career.category)에 그대로 저장되므로, 다시 분석 버튼을 누르지
// 않아도 그 반의 일괄 기록 화면을 열 때마다(renderBulkRecordClassBody) 항상 그 자리에서 계속 보임(탭을 닫아도 유지).
// 반별로 따로따로 저장/표시되며, 여러 반을 한 화면에서 비교하는 기능은 없음(반 하나 = 통계 하나).
// 이 기능만 쓰는 분석 엔진은 전체 생성 엔진 토글(genEngine)과 별개로 관리하고, 기본값은 Gemini.
function ensureChartJs(){
  return new Promise(resolve=>{
    if(window.Chart){resolve();return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js';
    s.onload=()=>resolve();
    document.head.appendChild(s);
  });
}
function clsSafeId(clsName){return (clsName||'').replace(/[^a-zA-Z0-9가-힣]/g,'_');}
// 진로 계열 분석은 항상 Gemini만 사용(토글 없음) - 다른 생성 기능(전체 일괄 생성 등)의 엔진 토글과는 무관.
async function careerCallStructured(system,extraTexts,schema){
  if(!geminiApiKey){throw new Error('⚙️ 설정에서 Gemini API 키를 먼저 입력해 주세요.');}
  const parts=extraTexts.map(t=>({text:t}));
  const raw=await attGemini(system,parts,schema);
  return attParseJSON(raw);
}
// 버튼을 누르면 이 반 학생들의 희망진로를 AI로 계열 분류하고, 결과를 각 학생 레코드에 저장한 뒤 패널을 다시 그림.
async function runCareerAnalysis(clsName){
  const btn=document.getElementById(`careerAnalyzeBtn_${clsSafeId(clsName)}`);
  const c=classes.find(c=>c.name===clsName);
  if(!c)return;
  const roster=c.students.map(s=>{
    const goal=(getCareerInfo(s).goal||'').trim();
    return goal?{id:s.id,number:s.number,name:s.name,goal}:null;
  }).filter(Boolean);
  if(!roster.length){alert('희망진로가 입력된 학생이 없어요.');return;}
  if(btn){btn.disabled=true;btn.textContent='분석 중...';}
  try{
    const system=`당신은 한국 고등학교 진로 상담 전문가입니다. 학생들의 희망 진로를 의미가 비슷한 것끼리 묶어서 적절한 개수의 계열로 분류하세요.
- 계열 개수는 정해진 값이 없으니 실제 입력된 진로들을 보고 자유롭게 정하되(보통 5~12개 정도가 자연스럽습니다), 억지로 하나로 뭉치거나 지나치게 잘게 쪼개지 마세요.
- 계열 이름은 간결한 명사만 쓰세요(예: "보건", "교육", "공학"). "OO계열"처럼 "계열"이라는 글자는 절대 붙이지 마세요.
- 희망 진로가 "미정", "없음", "모름", "고민 중" 등 아직 정하지 못했다는 뜻인 학생들은 모두 "탐색 중"이라는 이름의 카테고리 하나로 묶으세요(이 이름에도 "계열"을 붙이지 마세요).
- "마케팅", "마케터" 등 마케팅 관련 진로는 "경영"과 분야가 다르므로 절대 같은 카테고리로 묶지 말고 "마케팅"이라는 별도 카테고리로 분류하세요.
- "연예인", "가수", "배우", "아이돌" 등 연예계 관련 진로는 "엔터 산업"이라는 이름의 카테고리로 분류하세요.
- "미용사", "헤어디자이너", "메이크업 아티스트", "네일리스트" 등 미용/뷰티 관련 진로는 "패션"과 분야가 다르므로 절대 같은 카테고리로 묶지 말고 "뷰티"라는 별도 카테고리로 분류하세요.
- "국어교사", "영어교사", "수학교사", "체육교사", "윤리교사", "초등교사"처럼 일반 교과를 가르치는 교원 직종은 "교육"으로 분류하세요.
- 단, "미용교사"는 미용(뷰티) 실기를 가르치는 특성화고 계열 교원이므로 예외적으로 "교육"이 아니라 "뷰티"로 분류하세요.
- 아래는 다른 반에서 실제로 나온 아주 잘 된 분류 예시입니다. 이 정도의 세분화 수준과 이름 짓는 방식을 기준으로 삼으세요: 마케팅, 공공/안전, 교육, 미디어/콘텐츠, 경영, 사회복지, 식품/조리, 디자인, 인문, 관광/서비스, 법률, 뷰티, 패션, 엔터 산업, 탐색 중. 성격이 다른 분야는 절대 하나로 뭉치지 말고(예: 마케팅≠경영, 뷰티≠패션, 사회복지≠공공/안전, 디자인≠미디어/콘텐츠), 서로 가깝지만 뚜렷이 구분되는 직업군을 묶을 때는 "공공/안전", "미디어/콘텐츠", "관광/서비스"처럼 "A/B" 형태의 이름을 쓰세요.
- 모든 학생을 정확히 하나의 카테고리에만 배정하세요.
설명 없이 반드시 JSON만 출력하세요:
{"categories":[{"name":"보건","studentIds":[1,2]}]}`;
    const schema={type:'OBJECT',properties:{categories:{type:'ARRAY',items:{type:'OBJECT',properties:{name:{type:'STRING'},studentIds:{type:'ARRAY',items:{type:'INTEGER'}}},required:['name','studentIds']}}},required:['categories']};
    const userText=`학생 목록(id: 희망진로):\n`+roster.map(r=>`${r.id}: ${r.goal}`).join('\n');
    const result=await careerCallStructured(system,[userText],schema);
    const catByStudent={};
    (result.categories||[]).forEach(cat=>{(cat.studentIds||[]).forEach(sid=>{catByStudent[sid]=cat.name;});});
    for(const r of roster){
      const s=c.students.find(st=>st.id===r.id);
      if(!s)continue;
      let changye={};try{changye=JSON.parse(s.changye||'{}');}catch(e){}
      // 예전에 명단에서 드래그로 직접 옮겨준 학생(manual 표시)은 재분석을 돌려도 AI가 덮어쓰지 않고 그대로 유지
      if((changye._career||{}).manual)continue;
      const cat=catByStudent[r.id];
      if(!cat)continue;
      changye._career={...(changye._career||{}),category:cat};
      s.changye=JSON.stringify(changye);
      await sb.from('students').update({changye:s.changye}).eq('id',s.id);
    }
    await ensureChartJs();
    renderCareerStatsPanel(clsName);
  }catch(e){
    alert('분석 실패: '+e.message);
  }
  if(btn){btn.disabled=false;btn.textContent='🧭 진로 분석';}
}
// 드래그 중인 학생 id를 잠깐 들고 있는 값(일부 브라우저는 dragstart 시점에 setData한 값을 dragover 중에
// 못 읽으므로 dataTransfer와 이 변수 둘 다로 안전하게 받음)
let csDragSid=null;
function csDragStart(e,sid){
  csDragSid=sid;
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',String(sid));}catch(err){}
}
function csAllowDrop(e,groupEl){
  e.preventDefault();
  if(groupEl)groupEl.style.background='#F5F3FF';
}
function csUnhighlight(groupEl){
  if(groupEl)groupEl.style.background='';
}
// 카테고리 그룹 위에 학생 칩을 놓으면: 그 학생의 카테고리를 즉시 바꾸고(로컬 데이터 갱신), 패널을 다시 그려서
// 원 그래프와 명단이 바로 반영되게 한 뒤(실시간 반영), 서버 저장은 백그라운드로 진행함.
async function csDropStudent(e,clsName,toCat,groupEl){
  e.preventDefault();
  csUnhighlight(groupEl);
  let sid=parseInt(e.dataTransfer?.getData('text/plain')||'');
  if(!sid)sid=csDragSid;
  csDragSid=null;
  if(!sid)return;
  const c=classes.find(c=>c.name===clsName);
  const s=c?.students.find(st=>st.id===sid);
  if(!s)return;
  let changye={};try{changye=JSON.parse(s.changye||'{}');}catch(err){}
  if((changye._career||{}).category===toCat)return;
  // manual:true 표시 - 이걸 달아두면 나중에 "진로 분석"을 다시 눌러도 이 학생은 AI가 건드리지 않고 그대로 유지됨
  changye._career={...(changye._career||{}),category:toCat,manual:true};
  s.changye=JSON.stringify(changye);
  renderCareerStatsPanel(clsName);
  await sb.from('students').update({changye:s.changye}).eq('id',s.id);
}
// 계열 추가/삭제/이름변경 - 계열은 학생 배정으로만 존재가 정해지므로(별도 테이블 없음), "학생이 아직 없는
// 새 계열"을 만들었을 때 사라지지 않도록 반별로 그 이름만 로컬(localStorage)에 잠깐 기억해둠. 학생이 그
// 계열로 옮겨지는 순간부터는 학생 데이터 자체가 그 계열의 존재 근거가 되므로 이 목록은 더 이상 필요 없어짐.
function csExtraCatsKey(clsName){return 'csExtraCats_'+clsSafeId(clsName);}
function csGetExtraCats(clsName){
  try{return JSON.parse(localStorage.getItem(csExtraCatsKey(clsName))||'[]');}catch(e){return[];}
}
function csSetExtraCats(clsName,arr){
  localStorage.setItem(csExtraCatsKey(clsName),JSON.stringify(arr));
}
function csExistingCatNames(clsName){
  const c=classes.find(c=>c.name===clsName);
  const names=new Set((c?.students||[]).map(s=>getCareerInfo(s).category).filter(Boolean));
  csGetExtraCats(clsName).forEach(n=>names.add(n));
  return names;
}
// "+ 계열 추가" 버튼을 누르면 그 자리가 인풋으로 바뀜(다른 곳의 이름 수정 기능과 동일한 방식) - 브라우저
// 기본 prompt() 창 대신 화면 안에서 바로 입력하도록
function csStartAddCat(clsName){
  const safeCls=clsSafeId(clsName);
  const btn=document.getElementById('csAddCatBtn_'+safeCls);
  if(!btn)return;
  const clsEsc=clsName.replace(/'/g,"\\'");
  btn.outerHTML=`<input autocomplete="off" id="csAddCatInp_${safeCls}" placeholder="새 계열 이름" style="font-size:11px;padding:4px 10px;border:1px solid #378ADD;border-radius:14px;font-family:inherit;width:120px;" onkeydown="if(event.key==='Enter')csCommitAddCat('${clsEsc}');if(event.key==='Escape')renderCareerStatsPanel('${clsEsc}');" onblur="csCommitAddCat('${clsEsc}')"/>`;
  const inp=document.getElementById('csAddCatInp_'+safeCls);
  if(inp)inp.focus();
}
async function csCommitAddCat(clsName){
  const inp=document.getElementById('csAddCatInp_'+clsSafeId(clsName));
  const name=(inp?.value||'').trim();
  if(!name){renderCareerStatsPanel(clsName);return;}
  if(csExistingCatNames(clsName).has(name)){alert('이미 있는 계열 이름이에요.');renderCareerStatsPanel(clsName);return;}
  const extra=csGetExtraCats(clsName);
  extra.push(name);
  csSetExtraCats(clsName,extra);
  renderCareerStatsPanel(clsName);

// 계열명 옆 ✏️를 누르면 그 이름 자리가 바로 인풋으로 바뀜 - 역시 prompt() 대신 화면 안에서 바로 수정
function csStartRenameCat(clsName,oldName,spanId){
  const el=document.getElementById(spanId);
  if(!el)return;
  const clsEsc=clsName.replace(/'/g,"\\'"),oldEsc=oldName.replace(/'/g,"\\'");
  el.innerHTML=`<input autocomplete="off" id="${spanId}_inp" value="${escHtml(oldName)}" style="font-size:12px;font-weight:700;color:#333;border:1px solid #378ADD;border-radius:4px;padding:1px 5px;width:110px;font-family:inherit;" onkeydown="if(event.key==='Enter')csCommitRenameCat('${clsEsc}','${oldEsc}','${spanId}');if(event.key==='Escape')renderCareerStatsPanel('${clsEsc}');" onblur="csCommitRenameCat('${clsEsc}','${oldEsc}','${spanId}')"/>`;
  const inp=document.getElementById(spanId+'_inp');
  if(inp){inp.focus();inp.select();}
}
async function csCommitRenameCat(clsName,oldName,spanId){
  const inp=document.getElementById(spanId+'_inp');
  if(!inp)return; // 이미 다른 이벤트로 처리돼서 인풋이 사라진 경우(Enter->blur 중복 호출 방지)
  const name=inp.value.trim();
  if(!name||name===oldName){renderCareerStatsPanel(clsName);return;}
  if(csExistingCatNames(clsName).has(name)){alert('이미 있는 계열 이름이에요.');renderCareerStatsPanel(clsName);return;}
  const c=classes.find(c=>c.name===clsName);
  for(const s of (c?.students||[])){
    const info=getCareerInfo(s);
    if(info.category!==oldName)continue;
    let changye={};try{changye=JSON.parse(s.changye||'{}');}catch(e){}
    changye._career={...(changye._career||{}),category:name};
    s.changye=JSON.stringify(changye);
    await sb.from('students').update({changye:s.changye}).eq('id',s.id);
  }
  csSetExtraCats(clsName,csGetExtraCats(clsName).map(n=>n===oldName?name:n));
  renderCareerStatsPanel(clsName);
}
async function csDeleteCategory(clsName,catName){
  const c=classes.find(c=>c.name===clsName);
  const members=(c?.students||[]).filter(s=>getCareerInfo(s).category===catName);
  const msg=members.length?`"${catName}"에 있는 학생 ${members.length}명은 "탐색 중"으로 옮겨져요. 이 계열을 삭제할까요?`:`"${catName}" 계열을 삭제할까요?`;
  if(!confirm(msg))return;
  for(const s of members){
    let changye={};try{changye=JSON.parse(s.changye||'{}');}catch(e){}
    changye._career={...(changye._career||{}),category:'탐색 중'};
    s.changye=JSON.stringify(changye);
    await sb.from('students').update({changye:s.changye}).eq('id',s.id);
  }
  csSetExtraCats(clsName,csGetExtraCats(clsName).filter(n=>n!==catName));
  renderCareerStatsPanel(clsName);
}
// 이미 저장된 분류 결과(changye._career.category)만으로 그리는 패널 - AI를 다시 부르지 않으므로
// 반 화면을 열 때마다(또는 분석/드래그 직후) 그냥 조용히 다시 그려서 항상 그 자리에 보이게 함.

  if(!panel)return;
  const c=classes.find(c=>c.name===clsName);

  const withCategory=students.map(s=>({s,info:getCareerInfo(s)})).filter(x=>x.info.category);

  // 다른 화면으로 이동한 사이에 로드가 끝났을 수 있으니 패널이 아직도 그 자리에 있는지 재확인
  const panel2=document.getElementById(`careerStatsPanel_${clsSafeId(clsName)}`);

  const catCounts={};

    (catCounts[info.category]=catCounts[info.category]||[]).push({id:s.id,clsName,number:s.number,name:s.name,goal:info.goal||'',manual:!!info.manual});
  });
  // 학생이 아직 없어서 catCounts에 안 잡히는, 방금 새로 만든 빈 계열도 드롭 대상으로 보이게 합쳐줌
  csGetExtraCats(clsName).forEach(n=>{if(!catCounts[n])catCounts[n]=[];});
  // 비중이 큰 계열부터(내림차순) 정렬하되 "탐색 중"은 비중과 무관하게 항상 맨 마지막(원 그래프·우측 명단 공통)
  const catNames=Object.keys(catCounts).sort((a,b)=>{
    const aLast=a==='탐색 중'?1:0,bLast=b==='탐색 중'?1:0;
    if(aLast!==bLast)return aLast-bLast;
    return catCounts[b].length-catCounts[a].length;
  });
  const total=withCategory.length;
  const palette=STUDENT_COLORS.map(x=>x[0]);
  let paletteIdx=0;
  // "탐색 중"은 항상 검은색 고정, 나머지는 팔레트를 순서대로 사용(검은색이 팔레트 순번을 밀지 않게 별도 카운터로 관리)
  const colors=catNames.map(n=>n==='탐색 중'?'#000000':palette[(paletteIdx++)%palette.length]);
  const canvasId=`csChart_${clsSafeId(clsName)}`;
  const safeCls=clsSafeId(clsName);
  const clsEsc=clsName.replace(/'/g,"\\'");
  panel2.innerHTML=`<div style="background:#fff;border:1px solid #e0e0ee;border-radius:12px;padding:12px 14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
      <div style="font-size:13px;font-weight:600;color:#333;">🧭 진로 계열 통계</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="font-size:11px;color:#aaa;">희망진로를 적은 ${total}명 기준 · 명단에서 학생을 다른 계열로 끌어다 놓을 수 있어요</div>
        <button id="csAddCatBtn_${safeCls}" onclick="csStartAddCat('${clsEsc}')" style="padding:4px 10px;font-size:11px;border-radius:14px;border:1px dashed #3B82F6;background:#fff;color:#1D4ED8;cursor:pointer;">+ 계열 추가</button>
      </div>
    </div>
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
      <div style="width:480px;height:440px;flex-shrink:0;"><canvas id="${canvasId}"></canvas></div>
      <div style="flex:1;min-width:280px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-content:start;">
        ${catNames.map((n,i)=>{
          const groupId=`csGroup_${safeCls}_${i}`;
          const nameId=`csCatName_${safeCls}_${i}`;
          const pct=total?Math.round(catCounts[n].length/total*100):0;
          const nEsc=n.replace(/'/g,"\\'");
          const isSpecial=n==='탐색 중';
          return `<div id="${groupId}" ondragover="csAllowDrop(event,this)" ondragleave="csUnhighlight(this)" ondrop="csDropStudent(event,'${clsEsc}','${nEsc}',this)" style="border:1px solid #e0e0ee;border-radius:10px;padding:8px 10px;transition:background .12s;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
              <span style="width:9px;height:9px;border-radius:2px;background:${colors[i]};flex-shrink:0;"></span>
              <b id="${nameId}" style="font-size:12px;color:#333;">${escHtml(n)}</b><span style="font-size:11px;color:#aaa;">(${catCounts[n].length}명 · ${pct}%)</span>
              ${isSpecial?'':`<span style="flex:1;"></span><span onclick="csStartRenameCat('${clsEsc}','${nEsc}','${nameId}')" title="이름 바꾸기" style="cursor:pointer;color:#aaa;font-size:11px;">✏️</span><span onclick="csDeleteCategory('${clsEsc}','${nEsc}')" title="계열 삭제" style="cursor:pointer;color:#aaa;font-size:11px;">🗑</span>`}
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
              ${catCounts[n].length?catCounts[n].map(s=>`<div draggable="true" ondragstart="csDragStart(event,${s.id})" style="cursor:grab;font-size:12px;padding:5px 8px;border-radius:6px;background:#f8f8fa;display:flex;align-items:center;gap:8px;">
                <span style="color:#bbb;flex-shrink:0;">⠿</span>
                <span onclick="selCls='${(s.clsName||'').replace(/'/g,"\\'")}';selStudent(${s.id})" style="cursor:pointer;color:#378ADD;text-decoration:underline;text-underline-offset:2px;flex-shrink:0;">${escHtml(`${s.number||''}${s.name}`)}</span>
                <span style="color:#888;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(s.goal||'')}</span>
                ${s.manual?`<span title="직접 옮긴 학생 - 다시 분석해도 유지돼요" style="color:#f59e0b;flex-shrink:0;">📌</span>`:''}
              </div>`).join(''):'<div style="font-size:11px;color:#ccc;padding:4px 2px;">여기로 학생을 끌어다 놓으세요</div>'}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
  const ctxEl=document.getElementById(canvasId);
  if(!ctxEl)return;
  const data=catNames.map(n=>catCounts[n].length);
  new Chart(ctxEl,{
    type:'pie',
    data:{labels:catNames,datasets:[{data,backgroundColor:colors,borderColor:'#fff',borderWidth:2}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      // 바깥으로 빠지는 라벨은 이제 아주 작은 조각(3% 안팎) 한두 개뿐이라 짧은 텍스트만 나가므로,
      // 여백을 필요한 만큼만 얇게 줘서 원 바깥에 불필요한 흰 여백이 남지 않게 함
      layout:{padding:{top:26,bottom:26,left:78,right:78}},
      animation:{animateRotate:true,animateScale:true,duration:700,easing:'easeOutCubic'},
      plugins:{legend:{display:false},tooltip:{enabled:false}}
    },
    plugins:[careerLabelsPlugin]
  });
}
// 큰 조각은 조각 한가운데 계열명+비율, 글자가 안 들어가는(작은) 조각은 자동으로 바깥 인출선으로 옮김(서로 겹치면
// 최소 간격 벌림). 캔버스를 가로로 넓게 잡아(640x460) 좌우 여백을 충분히 확보했고, 그래도 혹시 캔버스 경계를
// 넘어가려는 라벨은 좌우/위아래 모두 clamp해서 절대 잘리지 않게 함.
const careerLabelsPlugin={
  id:'careerLabels',
  afterDatasetsDraw(chart){
    const ctx=chart.ctx;
    const meta=chart.getDatasetMeta(0);
    const data=chart.data.datasets[0].data;
    const total=data.reduce((a,b)=>a+b,0);
    if(!total)return;
    ctx.save();
    const outside=[];
    meta.data.forEach((arc,i)=>{
      if(!data[i])return;
      const pct=Math.round(data[i]/total*100);
      const angle=(arc.startAngle+arc.endAngle)/2;
      const span=arc.endAngle-arc.startAngle;
      // (버그 수정) innerRadius=0인 파이차트에서 (inner+outer)/2는 바깥 반지름의 절반밖에 안 돼서 실제보다
      // 훨씬 좁게 계산되고 있었음 - 라벨은 바깥쪽에 가깝게 그릴 것이므로 그 위치 기준으로 폭을 계산해야 함
      const outerR=arc.outerRadius;
      const r=outerR*0.66;
      const availWidth=2*outerR*Math.sin(span/2)*0.82;
      const label=chart.data.labels[i];
      // 12px에서 살짝만 넘치는 라벨("관광/서비스"처럼 비슷한 비중의 다른 라벨은 들어가는데 한두 글자
      // 더 길다는 이유로 바깥으로 밀려나는 경우)은 글자를 살짝 줄여서라도 안쪽에 들어가게 함
      let fitFont=0;
      for(const fs of [12,11,10]){
        ctx.font=fs+'px sans-serif';
        const w=Math.max(ctx.measureText(label).width,ctx.measureText(pct+'%').width);
        if(w<=availWidth&&span>0.3){fitFont=fs;break;}
      }
      if(fitFont){
        ctx.font=fitFont+'px sans-serif';
        const x=arc.x+Math.cos(angle)*r,y=arc.y+Math.sin(angle)*r;
        ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(label,x,y-7);ctx.fillText(pct+'%',x,y+7);
      }else{
        ctx.font='12px sans-serif';
        // 바깥 인출선 방향은 항상 조각의 실제 위치(자연스러운 좌/우)를 따름 - 인위적으로 반대쪽으로 뒤집으면
        // 선이 원을 가로질러 반대편까지 꺾여 나가는 훨씬 보기 나쁜 모양이 되므로, 방향은 건드리지 않고
        // 같은 쪽에 여러 개가 몰릴 때는 아래 스택 정렬(세로 간격 확보)만으로 겹치지 않게 함
        const dir=Math.cos(angle)>=0?1:-1;
        outside.push({dir,x1:arc.x+Math.cos(angle)*outerR,y1:arc.y+Math.sin(angle)*outerR,yBase:arc.y+Math.sin(angle)*(outerR+12),text:label+' '+pct+'%',cx:arc.x});
      }
    });
    ctx.font='12px sans-serif';
    const minY=14,maxY=chart.height-14;
    [1,-1].forEach(side=>{
      const group=outside.filter(o=>o.dir===side).sort((a,b)=>a.yBase-b.yBase);
      for(let k=1;k<group.length;k++){if(group[k].yBase-group[k-1].yBase<16)group[k].yBase=group[k-1].yBase+16;}
      // 스택이 캔버스 아래로 넘치면 전체 그룹을 위로 밀어서 맨 위/아래 모두 잘리지 않게 함
      if(group.length){
        const overflowBottom=group[group.length-1].yBase-maxY;
        if(overflowBottom>0)group.forEach(o=>o.yBase-=overflowBottom);
        const overflowTop=minY-group[0].yBase;
        if(overflowTop>0)group.forEach(o=>o.yBase+=overflowTop);
      }
    });
    outside.forEach(o=>{
      const x2=o.cx+o.dir*(Math.abs(o.x1-o.cx)+10);
      let x3=x2+o.dir*12;
      const textW=ctx.measureText(o.text).width;
      // 좌우로도 캔버스 경계를 넘지 않도록 clamp(라벨이 오른쪽으로 뻗으면 dir>0, 왼쪽으로 뻗으면 dir<0)
      if(o.dir>0){const maxX3=chart.width-6-textW;if(x3>maxX3)x3=maxX3;}
      else{const minX3=6+textW;if(x3<minX3)x3=minX3;}
      ctx.strokeStyle='#898781';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(x2,o.yBase);ctx.lineTo(x3,o.yBase);ctx.stroke();
      ctx.fillStyle='#52514e';ctx.textAlign=o.dir>0?'left':'right';ctx.textBaseline='middle';
      ctx.fillText(o.text,x3+o.dir*3,o.yBase);
    });
    ctx.restore();
  }
};
// 테두리 없는 메모/결과 textarea가 내용 길이에 맞춰 자동으로 늘어나게 함(스크롤 있는 박스처럼 안 보이게)
function autoGrowTa(el){
  el.style.height='auto';

  el.style.height=el.scrollHeight+'px';
}
// 학생 객체를 직접 받아서 그 학생의 메모/생성결과를 읽고 쓰는 범용 버전(getStu()에 의존하는 기존
// getTabData/saveTabData/updMemo와 달리 임의의 학생에 대해 동작 - 일괄 기록 표에서 여러 학생을 동시에 다루기 위함).
// 필드 구조(행동특성=최상위 memo/result 컬럼, 세특/자율 등=setech·changye 안의 JSON blob)는 기존과 완전히 동일하므로
// 학생 탭 화면에서 읽는 것과 100% 같은 데이터를 읽고 씀.
function getMemoFor(s,tabType,subject){
  if(tabType==='haengdong')return s.memo||'';
  let store={};try{store=JSON.parse(tabType==='setech'?(s.setech||'{}'):(s.changye||'{}'));}catch(e){}
  return(store[tabType==='setech'?subject:tabType]||{}).memo||'';
}
function getResultFor(s,tabType,subject){
  if(tabType==='haengdong')return s.result||'';
  let store={};try{store=JSON.parse(tabType==='setech'?(s.setech||'{}'):(s.changye||'{}'));}catch(e){}
  return(store[tabType==='setech'?subject:tabType]||{}).result||'';
}
async function saveTabDataFor(s,tabType,subject,updates){
  if(tabType==='setech'){
    let d={};try{d=JSON.parse(s.setech||'{}');}catch(e){}
    d[subject]={...(d[subject]||{}),...updates};
    s.setech=JSON.stringify(d);
    await sb.from('students').update({setech:s.setech}).eq('id',s.id);
  }else{
    let d={};try{d=JSON.parse(s.changye||'{}');}catch(e){}
    d[tabType]={...(d[tabType]||{}),...updates};
    s.changye=JSON.stringify(d);
    await sb.from('students').update({changye:s.changye}).eq('id',s.id);
  }
}
let bulkSaveTimer={};
function bulkSaveMemo(clsName,studentId,v){
  const c=classes.find(c=>c.name===clsName);const s=c?.students.find(st=>st.id===studentId);if(!s)return;
  const target=getClassRecordTarget(clsName);if(!target)return;
  clearTimeout(bulkSaveTimer[`m_${studentId}`]);
  bulkSaveTimer[`m_${studentId}`]=setTimeout(async()=>{
    if(target.tabType==='haengdong'){s.memo=v;await sb.from('students').update({memo:v}).eq('id',s.id);}
    else await saveTabDataFor(s,target.tabType,target.subject,{memo:v});
    renderSb();
  },500);
}
function bulkSaveResult(clsName,studentId,v){
  const c=classes.find(c=>c.name===clsName);const s=c?.students.find(st=>st.id===studentId);if(!s)return;
  const target=getClassRecordTarget(clsName);if(!target)return;
  clearTimeout(bulkSaveTimer[`r_${studentId}`]);
  bulkSaveTimer[`r_${studentId}`]=setTimeout(async()=>{
    if(target.tabType==='haengdong'){s.result=v;await sb.from('students').update({result:v}).eq('id',s.id);}
    else await saveTabDataFor(s,target.tabType,target.subject,{result:v});
  },500);
}
// 반 안에서 "최근 2주 이상(또는 아예 한 번도) 기록이 없는 학생"을 찾아 통계 카드로 보여줌.
// 이름을 항상 늘어놓지 않고, 박스를 눌러야 명단이 펼쳐지는 방식(기록없음 명단 클릭→그 학생으로 바로 작성,
// 기록있음 명단 클릭→날짜만 펼침→날짜 클릭→그 날 쓴 내용 펼침)으로 단계적으로 드릴다운.
function qnStaleStudentsHtml(clsName,target,c){
  if(!target||!c||!c.students.length)return'';
  const STALE_MS=14*24*60*60*1000;
  const now=Date.now();
  const getHist=(s)=>{
    let arr;
    if(target.tabType==='haengdong')arr=s.keywords||[];
    else if(target.tabType==='setech'){let d={};try{d=JSON.parse(s.setech||'{}');}catch(e){}arr=(d[target.subject]||{}).keywords||[];}
    else{let d={};try{d=JSON.parse(s.changye||'{}');}catch(e){}arr=(d[target.tabType]||{}).keywords||[];}
    return(arr||[]).filter(k=>k.ts).sort((a,b)=>b.ts-a.ts);
  };
  const recorded=[],stale=[];
  c.students.forEach(s=>{
    const hist=getHist(s);
    if(!hist.length){stale.push(s);return;}
    if((now-hist[0].ts)>STALE_MS)stale.push(s);else recorded.push({s,hist});
  });
  if(!recorded.length&&!stale.length)return'';
  const total=c.students.length;
  const pct=total?Math.round(recorded.length/total*100):0;
  const safeId=clsName.replace(/[^a-zA-Z0-9가-힣]/g,'_');
  const clsNameEsc=clsName.replace(/'/g,"\\'");
  const recordedListHtml=recorded.map(({s,hist})=>{
    const dateGroups={};
    hist.forEach(k=>{
      const d=new Date(k.ts);
      const key=`${d.getMonth()+1}_${d.getDate()}`;
      (dateGroups[key]=dateGroups[key]||[]).push(k);
    });
    return `
    <div style="margin:0 6px 8px 0;display:inline-block;vertical-align:top;">
      <span onclick="qnToggleDates('${safeId}',${s.id})" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;background:#fff;border:1.5px solid #86D19A;color:#268A46;font-size:12px;font-weight:600;">${escHtml(`${s.number||''} ${s.name}`)}<span style="background:#DFF3E4;color:#268A46;border-radius:10px;padding:0 6px;font-size:11px;">${hist.length}</span><span id="qnChev_${safeId}_${s.id}" style="display:inline-block;transition:transform .2s;font-size:9px;">▾</span></span>
      <div id="qnDates_${safeId}_${s.id}" style="max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease;">
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 4px;max-width:260px;">
          ${Object.entries(dateGroups).map(([key,items])=>{const[mo,da]=key.split('_');return`<span onclick="qnToggleNote('${safeId}',${s.id},'${key}')" style="cursor:pointer;display:inline-block;padding:4px 11px;border-radius:16px;background:#EAF3FE;border:1px solid #B9D9FA;color:#1D6FC7;font-size:11px;font-weight:600;">${mo}월 ${da}일${items.length>1?` (${items.length})`:''}</span>`;}).join('')}
        </div>
        ${Object.entries(dateGroups).map(([key,items])=>`<div id="qnNote_${safeId}_${s.id}_${key}" style="max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease;">${items.map((k,ki)=>`<div style="font-size:11px;color:#555;line-height:1.6;margin:8px 0 0 4px;padding:8px 10px;background:#f8f8fa;border-left:3px solid #B9D9FA;border-radius:6px;">${items.length>1?`<b style="color:#1D6FC7;">${ki+1}번</b> `:''}${escHtml(k.text)}</div>`).join('')}</div>`).join('')}
      </div>
    </div>`;}).join('');
  const staleListHtml=stale.map(s=>`<span onclick="qnJumpToWrite('${clsNameEsc}',${s.id})" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin:0 6px 8px 0;padding:5px 13px;border-radius:20px;background:#fff;border:1.5px solid #F3AEB4;color:#cf1322;font-size:12px;font-weight:600;">✎ ${escHtml(`${s.number||''} ${s.name}`)}</span>`).join('');
  return `<div class="card" style="margin-bottom:14px;">
    <div class="card-hd">📊 ${escHtml(clsName)} 최근 2주 기록 현황</div>
    <div style="display:flex;gap:10px;margin:10px 0 12px;">
      <div onclick="qnTogglePanel('${safeId}','recorded')" style="flex:1;text-align:center;padding:10px;background:#EAF3DE;border-radius:8px;cursor:pointer;">
        <div style="font-size:22px;font-weight:700;color:#389e0d;">${recorded.length}</div>
        <div style="font-size:11px;color:#389e0d;">기록 있음 <span id="qnChevPanel_${safeId}_recorded" style="display:inline-block;transition:transform .2s;">▾</span></div>
      </div>
      <div onclick="qnTogglePanel('${safeId}','stale')" style="flex:1;text-align:center;padding:10px;background:#FDEDED;border-radius:8px;cursor:pointer;">
        <div style="font-size:22px;font-weight:700;color:#cf1322;">${stale.length}</div>
        <div style="font-size:11px;color:#cf1322;">기록 없음 <span id="qnChevPanel_${safeId}_stale" style="display:inline-block;transition:transform .2s;">▾</span></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="flex:1;height:8px;background:#e0e0ee;border-radius:4px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:#52c41a;border-radius:4px;transition:width 0.3s;"></div>
      </div>
      <span style="font-size:12px;color:#555;font-weight:600;">${pct}%</span>
    </div>
    <div id="qnPanel_${safeId}_recorded" style="max-height:0;overflow:hidden;opacity:0;transition:max-height .3s ease,opacity .25s ease;">
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid #eee;">${recordedListHtml||'<div style="font-size:12px;color:#bbb;">없음</div>'}</div>
    </div>
    <div id="qnPanel_${safeId}_stale" style="max-height:0;overflow:hidden;opacity:0;transition:max-height .3s ease,opacity .25s ease;">
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid #eee;">${staleListHtml||'<div style="font-size:12px;color:#bbb;">없음</div>'}</div>
    </div>
  </div>`;
}
// 기록있음/기록없음 통계박스를 누르면 그 명단 패널만 펼침(반대쪽은 자동으로 접음) - max-height 트랜지션으로 펼쳐지는 느낌 연출,
// 화살표(▾)도 열림 상태에 맞춰 180도 회전
function qnTogglePanel(safeId,which){
  const other=which==='recorded'?'stale':'recorded';
  const p=document.getElementById(`qnPanel_${safeId}_${which}`);
  const o=document.getElementById(`qnPanel_${safeId}_${other}`);
  const pChev=document.getElementById(`qnChevPanel_${safeId}_${which}`);
  const oChev=document.getElementById(`qnChevPanel_${safeId}_${other}`);
  if(o){o.style.maxHeight='0px';o.style.opacity='0';}
  if(oChev)oChev.style.transform='rotate(0deg)';
  if(!p)return;
  const isOpen=p.style.maxHeight&&p.style.maxHeight!=='0px';
  if(isOpen){p.style.maxHeight='0px';p.style.opacity='0';if(pChev)pChev.style.transform='rotate(0deg)';}
  else{p.style.maxHeight='3000px';p.style.opacity='1';if(pChev)pChev.style.transform='rotate(180deg)';}
}
function qnToggleDates(safeId,studentId){
  const el=document.getElementById(`qnDates_${safeId}_${studentId}`);
  const chev=document.getElementById(`qnChev_${safeId}_${studentId}`);
  if(!el)return;
  const isOpen=el.style.maxHeight&&el.style.maxHeight!=='0px';
  if(isOpen){el.style.maxHeight='0px';el.style.opacity='0';if(chev)chev.style.transform='rotate(0deg)';}
  else{el.style.maxHeight='800px';el.style.opacity='1';if(chev)chev.style.transform='rotate(180deg)';}
}
function qnToggleNote(safeId,studentId,kwId){
  const el=document.getElementById(`qnNote_${safeId}_${studentId}_${kwId}`);
  if(!el)return;
  const isOpen=el.style.maxHeight&&el.style.maxHeight!=='0px';
  if(isOpen){el.style.maxHeight='0px';el.style.opacity='0';}
  else{el.style.maxHeight='400px';el.style.opacity='1';}
}
// "기록 없음" 명단에서 학생 이름을 누르면 바로 그 학생을 멘션해서 입력창에 넣어줌(이어쓰기 기능과 동일한 방식)
function qnJumpToWrite(clsName,studentId){
  const c=classes.find(c=>c.name===clsName);
  const s=c?.students.find(st=>st.id===studentId);
  const ta=document.getElementById('qnInput_cls');
  if(!s||!ta)return;
  ta.value=`/${s.number||''} ${s.name} `;
  ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length);
  qnUpdateHighlight(clsName);
  qnUpdateStudentPreview(clsName);
  ta.scrollIntoView({behavior:'smooth',block:'center'});
}
// 입력창에 /멘션이 실제 학생으로 인식될 때마다(하이라이트가 켜질 때마다) 그 학생의 지금까지의 누가기록을
// 실시간으로 바로 아래에 보여줌. 사이드바 클릭 방식은 폐기됐고, 이 반응형 방식만 유지함.
function qnUpdateStudentPreview(clsName){
  const wrap=document.getElementById('qnHistoryPreview_cls');
  const ta=document.getElementById('qnInput_cls');
  if(!wrap||!ta){return;}
  const target=getClassRecordTarget(clsName);
  const c=classes.find(c=>c.name===clsName);
  if(!target||!c){wrap.innerHTML='';return;}
  const seen=new Set();
  const resolved=[];
  [...ta.value.matchAll(QN_MENTION_RE)].forEach(m=>{
    const num=m[1],name=m[2];
    const s=num?c.students.find(st=>String(st.number)===num):c.students.find(st=>st.name===name);
    if(s&&!seen.has(s.id)){seen.add(s.id);resolved.push(s);}
  });
  if(!resolved.length){wrap.innerHTML='';return;}
  const history=getQuickNoteHistory(clsName,target);
  wrap.innerHTML=resolved.map(s=>{
    const h=history.filter(k=>k.studentId===s.id);
    return `<div style="margin-top:22px;">
      <div style="font-size:12px;font-weight:600;color:#888;margin-bottom:8px;">✨ ${escHtml(s.name)} 누가 기록 내역 (${h.length}건)</div>
      ${h.length?qnGroupByDate(h).map(items=>qnHistoryCardHtml(items,false,target)).join(''):'<div style="font-size:12px;color:#bbb;padding:8px 0;">아직 기록된 내용이 없어요.</div>'}
    </div>`;
  }).join('');
}
// /이름 또는 /학번 이름(자동완성으로 선택 시 이 형태로 삽입됨) 뒤에 이어지는 태그를 찾아, 실제 학생과 일치하면
// 입력창 뒤에 깔린 하이라이트 레이어에 노랗게 칠해줌(textarea 자체는 부분 서식을 지원 안 해서 겹쳐서 흉내냄).
const QN_MENTION_RE=/\/(?:(\d{4,6})\s+)?([^\s\/]+)/g;
function qnUpdateHighlight(clsName){
  const ta=document.getElementById('qnInput_cls');
  const hl=document.getElementById('qnHighlight_cls');
  if(!ta||!hl)return;
  const c=classes.find(c=>c.name===clsName);
  const students=c?c.students:[];
  hl.innerHTML=escHtml(ta.value).replace(QN_MENTION_RE,(m,num,name)=>{
    const resolved=num?students.find(s=>String(s.number)===num):students.find(s=>s.name===name);
    return resolved?`<mark style="background:#FDE68A;color:transparent;border-radius:3px;padding:0;margin:0;">${m}</mark>`:m;
  });
}
function showQnSubjectPicker(clsName){
  const w=document.getElementById('qnSubjectPickerWrap');
  if(w)w.style.display='block';
}
// 그 반의 그 저장 대상(target)에 실제로 쌓여있는 누가기록을 학생 keywords에서 직접 긁어옴(세션 한정이 아니라 진짜 데이터).
// ts 필드가 있는 것만 누가기록 항목으로 취급(예전에 손으로 직접 넣은 키워드는 ts가 없어서 자연히 안 섞임).
function getQuickNoteHistory(clsName,target){
  const c=classes.find(c=>c.name===clsName);
  if(!c)return[];
  const out=[];
  c.students.forEach(s=>{
    let arr=[];
    if(target.tabType==='haengdong')arr=s.keywords||[];
    else if(target.tabType==='setech'){let d={};try{d=JSON.parse(s.setech||'{}');}catch(e){}arr=(d[target.subject]||{}).keywords||[];}
    else{let d={};try{d=JSON.parse(s.changye||'{}');}catch(e){}arr=(d[target.tabType]||{}).keywords||[];}
    arr.filter(k=>k.ts).forEach(k=>out.push({...k,studentId:s.id,studentName:s.name,studentNumber:s.number}));
  });
  out.sort((a,b)=>b.ts-a.ts);
  return out;
}
// 누가기록 한 건을 카드 형태로 렌더링(N월N일 · 학번이름 · 중요도, 전문, 바이트 수, 이동/수정/삭제 버튼)
// 같은 날짜에 기록이 여러 건이면 카드 하나로 묶어서(날짜 헤더 공유), 각 건은 1번/2번으로 번호 매겨 보여줌.
// items는 반드시 같은 날짜의 항목들만 담은 배열이어야 함(하위호환으로 단일 객체를 넘기면 배열로 감싸줌).
function qnHistoryCardHtml(items,showStudent,target){
  if(!Array.isArray(items))items=[items];
  const first=items[0];
  const d=new Date(first.ts);
  const dateStr=`${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
  const impColors={낮음:'#94a3b8',보통:'#3b82f6',높음:'#dc2626'};
  const subjArg=target.subject?`'${target.subject.replace(/'/g,"\\'")}'`:'null';
  const multi=items.length>1;
  const searchBlob=items.map(k=>(k.text||'').toLowerCase()).join(' ');
  const cardId=`qc_${first.ts}_${first.studentId||0}_${Math.floor(Math.random()*100000)}`;
  const entriesHtml=items.map((k,ki)=>{
    const impColor=impColors[k.importance]||'#3b82f6';
    return `<div style="${ki>0?'margin-top:8px;padding-top:8px;border-top:1px dashed #eee;':''}">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px;">
        ${multi?`<span style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#eef1f5;color:#8a94a3;font-size:10px;">${ki+1}</span>`:''}
        <span style="margin-left:auto;padding:2px 8px;border-radius:10px;background:${impColor}22;color:${impColor};font-weight:600;">${k.importance||'보통'}</span>
      </div>
      <div id="qnCardText_${k.id}" style="font-size:12px;color:#444;line-height:1.55;">${escHtml(k.text)}</div>
      <div id="qnCardEdit_${k.id}" style="display:none;">
        <textarea id="qnEditTa_${k.id}" style="width:100%;box-sizing:border-box;min-height:60px;font-size:12px;line-height:1.6;padding:8px;border:1px solid #DDD6FE;border-radius:8px;font-family:inherit;resize:vertical;">${escHtml(k.text)}</textarea>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <button onclick="qnSaveEditHistoryEntry(${k.studentId},'${target.tabType}',${subjArg},${k.id})" style="padding:4px 12px;font-size:11px;border-radius:8px;border:none;background:#7C3AED;color:#fff;cursor:pointer;">저장</button>
          <button onclick="qnCancelEditHistoryEntry(${k.id})" style="padding:4px 12px;font-size:11px;border-radius:8px;border:1px solid #e0e0ee;background:#fff;color:#666;cursor:pointer;">취소</button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
        <span style="font-size:10px;color:#bbb;">${bytes(k.text)}B</span>
        <div style="display:flex;gap:5px;">
          <span onclick="qnStartEditHistoryEntry(${k.id})" style="cursor:pointer;padding:2px 9px;border-radius:14px;background:#fff;border:1px solid #DDD6FE;color:#7C3AED;font-size:10px;font-weight:600;">✏️ 수정</span>
          <span onclick="qnDeleteHistoryEntry(${k.studentId},'${target.tabType}',${subjArg},${k.id})" style="cursor:pointer;padding:2px 9px;border-radius:14px;background:#fff;border:1px solid #F3AEB4;color:#dc2626;font-size:10px;font-weight:600;">🗑️ 삭제</span>
        </div>
      </div>
    </div>`;
  }).join('');
  return `<div class="qn-hist-card" data-ts="${first.ts}" data-search="${escHtml(searchBlob)}" style="background:#fff;border:1px solid #f0f0f0;border-radius:10px;padding:9px 12px;margin-bottom:6px;">
    <div onclick="qnToggleCard('${cardId}')" style="cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;color:#999;flex-wrap:wrap;">
      <span id="${cardId}_chev" style="display:inline-block;font-size:9px;transition:transform .2s;color:#bbb;">▸</span>
      <span style="font-size:12px;font-weight:700;color:#555;">${dateStr}</span>

function qnGroupByDate(list){
  const groups={};
  const order=[];
  (list||[]).forEach(k=>{
    const d=new Date(k.ts);
    const key=`${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
    if(!groups[key]){groups[key]=[];order.push(key);}
    groups[key].push(k);
  });
  return order.map(key=>groups[key]);
}

// 한글 완성형 글자에서 초성만 뽑아냄 (예: "강민구" → "ㄱㅁㄱ") - 초성 검색 지원용
const CHOSEONG=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChoseong(str){
  let out='';
  for(const ch of str||''){
    const code=ch.charCodeAt(0)-0xAC00;
    out+=(code>=0&&code<=11171)?CHOSEONG[Math.floor(code/588)]:ch;
  }
  return out;
}
// /이름(또는 /학번) 뒤에 이어지는 글자로 이 반 안에서만 검색 (반이 이미 정해진 상태라 학번+이름만 보여주면 동명이인 걱정 없음)
let qnAcMatches=[],qnAcActiveIdx=-1,qnAcNavigated=false;
function qnClassAutocompleteCheck(clsName){
  const ta=document.getElementById('qnInput_cls');
  const dd=document.getElementById('qnAutocomplete_cls');
  if(!ta||!dd)return;
  const pos=ta.selectionStart;
  const before=ta.value.slice(0,pos);
  const m=before.match(/\/(\S*)$/);
  if(!m){dd.style.display='none';qnAcMatches=[];qnAcActiveIdx=-1;qnAcNavigated=false;return;}
  const frag=m[1];
  const c=classes.find(c=>c.name===clsName);
  if(!c){dd.style.display='none';return;}
  const matches=c.students.filter(s=>s.name.includes(frag)||String(s.number||'').includes(frag)||getChoseong(s.name).includes(frag)).slice(0,50);
  qnAcMatches=matches;qnAcActiveIdx=matches.length?0:-1;qnAcNavigated=false;
  if(!matches.length){dd.style.display='none';return;}
  dd.innerHTML=matches.map((s,i)=>`<div id="qnAcItem${i}" onmousedown="qnClassPickStudent(${i},'${clsName}')" style="padding:8px 12px;font-size:13px;cursor:pointer;background:${i===0?'#f4f0ff':'#fff'};" onmouseover="qnAcActiveIdx=${i};qnAcNavigated=true;qnRenderAcHighlight();"><b>${escHtml(String(s.number||''))}</b> ${escHtml(s.name)}</div>`).join('');
  dd.style.display='block';
}
function qnRenderAcHighlight(){
  qnAcMatches.forEach((s,i)=>{
    const el=document.getElementById('qnAcItem'+i);
    if(!el)return;
    el.style.background=i===qnAcActiveIdx?'#f4f0ff':'#fff';
    if(i===qnAcActiveIdx)el.scrollIntoView({block:'nearest'});
  });
}
// @자동완성 드롭다운이 떠 있을 땐 위/아래 화살표로 후보를 훑을 수 있고(스크롤도 같이 따라감),
// 드롭다운이 열려서 후보가 하이라이트돼 있는 동안은 Enter가 항상 그 후보를 선택함(화살표로 안 훑었어도 0번이 기본 선택돼 있으므로).
// 드롭다운이 닫혀있을 때만 Enter가 기록 제출로 동작함.
function qnHandleClsKeydown(e,clsName){
  const dd=document.getElementById('qnAutocomplete_cls');
  const open=dd&&dd.style.display==='block'&&qnAcMatches.length;
  if(open&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    qnAcNavigated=true;
    qnAcActiveIdx=e.key==='ArrowDown'?Math.min(qnAcActiveIdx+1,qnAcMatches.length-1):Math.max(qnAcActiveIdx-1,0);
    qnRenderAcHighlight();
    return;
  }
  if(open&&e.key==='Enter'&&qnAcActiveIdx>=0){
    e.preventDefault();
    qnClassPickStudent(qnAcActiveIdx,clsName);
    return;
  }
  if(open&&e.key==='Escape'){dd.style.display='none';return;}
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQuickNoteForClass(clsName);}
}
// 자동완성에서 학생을 고르면 "/학번 이름 " 형태로 삽입(사이드바 표기와 통일 + 동명이인 걱정 없이 정확히 특정됨),
// 그 직후 하이라이트 레이어도 같이 갱신해서 방금 넣은 태그가 바로 노랗게 표시되도록 함.
function qnClassPickStudent(idx,clsName){
  const s=qnAcMatches[idx];
  const ta=document.getElementById('qnInput_cls');
  if(!ta||!s)return;
  const pos=ta.selectionStart;
  const val=ta.value;
  const before=val.slice(0,pos).replace(/\/(\S*)$/,`/${s.number||''} ${s.name} `);
  ta.value=before+val.slice(pos);
  ta.focus();ta.setSelectionRange(before.length,before.length);
  const dd=document.getElementById('qnAutocomplete_cls');
  if(dd)dd.style.display='none';
  qnAcMatches=[];qnAcActiveIdx=-1;qnAcNavigated=false;
  qnUpdateHighlight(clsName);
  qnUpdateStudentPreview(clsName);
}

async function submitQuickNoteForClass(clsName){
  const inp=document.getElementById('qnInput_cls');
  const raw=inp?.value.trim();
  if(!raw)return;
  document.getElementById('qnAutocomplete_cls')&&(document.getElementById('qnAutocomplete_cls').style.display='none');
  const c=classes.find(c=>c.name===clsName);
  const mentions=[...raw.matchAll(QN_MENTION_RE)].map(m=>({number:m[1]||null,name:m[2]}));
  if(!mentions.length){alert('학생을 지정해주세요 (예: /이름)');return;}
  const content=raw.replace(QN_MENTION_RE,'').replace(/\s+/g,' ').trim();
  if(!content){alert('내용을 입력해주세요.');return;}
  const seen=new Set();
  const students=[];
  mentions.forEach(({number,name})=>{
    const s=number?c?.students.find(st=>String(st.number)===number):c?.students.find(st=>st.name===name);
    if(s&&!seen.has(s.id)){seen.add(s.id);students.push({...s,clsName});}
  });
  if(!students.length){alert('일치하는 학생을 못 찾았어요. 이름을 확인해주세요.');return;}
  const target=getClassRecordTarget(clsName);
  if(!target){alert('먼저 이 반의 기록 대상을 설정해주세요.');return;}
  const btn=document.getElementById('qnSubmitBtn_cls');
  if(btn){btn.disabled=true;btn.textContent='다듬는 중...';}
  try{
    const sys=`너는 교사가 수업 중 학생을 관찰하고 남긴 짧고 편한 말투의 메모를 나이스 생기부용 격식체 문장으로 다듬는 도우미야.
사실 관계나 내용은 절대 바꾸지 말고 말투만 격식 있게 다듬어. 반말·이모티콘·은어·오타를 정리하고, ${style.command||'문장은 ~임/~음/~함으로 끝내는 격식체로 써줘.'}
결과는 완성된 문장(하나 또는 여러 문장)만 출력하고, 다른 설명이나 따옴표는 붙이지 마.`;
    const polished=await qnPolish(sys,content);
    if(inp)inp.value='';
    qnUpdateHighlight(clsName);
    qnUpdateStudentPreview(clsName);
    openQuickNoteReview(raw,polished,{tabType:target.tabType,subject:target.subject,students});
  }catch(e){
    alert('다듬는 중 오류: '+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='기록 (Enter)';}
  }
}

async function saveQuickNoteToTargets(text,{tabType,subject,students},importance){
  for(const stu of students){
    const c=classes.find(c=>c.name===stu.clsName);
    const s=c?.students.find(st=>st.id===stu.id);
    if(!s)continue;
    const kw={text,type:'pos',id:Date.now()+Math.floor(Math.random()*1000),ts:Date.now(),importance:importance||'보통'};
    if(tabType==='haengdong'){
      s.keywords=[...(s.keywords||[]),kw];
      await sb.from('students').update({keywords:JSON.stringify(s.keywords)}).eq('id',s.id);
    }else if(tabType==='setech'){
      let setechData={};try{setechData=JSON.parse(s.setech||'{}');}catch(e){}
      const cur=setechData[subject]||{memo:'',keywords:[],result:'',example:'',command:''};
      cur.keywords=[...(cur.keywords||[]),kw];
      setechData[subject]=cur;
      s.setech=JSON.stringify(setechData);
      await sb.from('students').update({setech:s.setech}).eq('id',s.id);
    }else{
      let changyeData={};try{changyeData=JSON.parse(s.changye||'{}');}catch(e){}
      const cur=changyeData[tabType]||{memo:'',keywords:[],result:'',example:'',command:''};
      cur.keywords=[...(cur.keywords||[]),kw];
      changyeData[tabType]=cur;
      s.changye=JSON.stringify(changyeData);
      await sb.from('students').update({changye:s.changye}).eq('id',s.id);
    }
  }
  const label=tabType==='setech'?subject:(REVIEW_TAB_LABELS[tabType]||tabType);
  renderSb();
  if(selStu&&students.some(st=>st.id===selStu))renderMain();
  if(quickNoteModeCls&&students.some(st=>st.clsName===quickNoteModeCls)){
    renderQuickNoteClassBody(quickNoteModeCls);
    const ta=document.getElementById('qnInput_cls');
    const sameClsStudents=students.filter(st=>st.clsName===quickNoteModeCls);
    if(ta&&sameClsStudents.length){
      ta.value=sameClsStudents.map(st=>`/${st.number||''} ${st.name} `).join('');
      ta.focus();
      ta.setSelectionRange(ta.value.length,ta.value.length);
      qnUpdateHighlight(quickNoteModeCls);
      qnUpdateStudentPreview(quickNoteModeCls);
    }
  }
  showToast(`${students.map(s=>s.name).join(', ')} 학생의 ${label} 키워드에 추가됐어요.`);
}

const KOREAN_ORDINALS=['첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두','열세','열네','열다섯','열여섯','열일곱','열여덟','열아홉','스무'];
function koreanOrdinal(n){ return (KOREAN_ORDINALS[n-1]||n)+' 번째'; }

function pushTabVersion(tabType,label,text,verLabel){
  if(!text)return;
  const data=getTabData(tabType);
  const versions=data.versions||[];
  const now=new Date();
  const dateStr=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  const isAuto=(verLabel||'').trim()==='자동생성';
  const name=isAuto?koreanOrdinal(versions.length+1)+' 생성':verLabel;
  versions.unshift({name,dateStr,text,ts:Date.now()});
  if(versions.length>15)versions.pop();
  saveTabData(tabType,label,{versions});
}

function openTabVersionModal(tabType,label){
  const data=getTabData(tabType);
  const vers=data.versions||[];
  const d=document.createElement('div');d.className='modal-bg';d.id='mc';d.onclick=e=>{if(e.target===d)closeModal();};
  d.innerHTML=`<div class="modal wide"><h3>📋 생성 기록</h3>
    <div class="ver-list">${vers.length?vers.map((v,i)=>`<div class="ver-item">
      <input autocomplete="off" class="verNameInp" value="${(v.name||v.label||'').replace(/"/g,'&quot;')}" onchange="renameTabVer('${tabType}','${label}',${i},this.value)" style="flex:1;font-size:12px;color:#666;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:5px;font-family:inherit;" onfocus="this.style.border='1px solid #e0e0ee';this.style.background='#fff';" onblur="this.style.border='1px solid transparent';this.style.background='transparent';"/>
      <span style="font-size:10px;color:#aaa;white-space:nowrap;">${v.dateStr||''}</span>
      <span class="ver-link" onclick="loadTabVer('${tabType}','${label}',${i})">불러오기</span>
      <span class="ver-del" onclick="delTabVer('${tabType}','${label}',${i})">삭제</span>
    </div>`).join(''):'<p style="font-size:13px;color:#bbb;">저장된 생성 기록이 없습니다</p>'}</div>
    <div class="modal-btns" style="margin-top:16px;"><button onclick="closeModal()">닫기</button></div>
  </div>`;
  document.getElementById('app').appendChild(d);

function renameTabVer(tabType,label,i,newName){
  const data=getTabData(tabType);
  const versions=data.versions||[];
  if(!versions[i])return;
  versions[i].name=newName.trim()||versions[i].name;
  saveTabData(tabType,label,{versions});
}
function loadTabVer(tabType,label,i){
  const data=getTabData(tabType);
  const vers=data.versions||[];
  if(!vers[i])return;
  const text=vers[i].text;
  const ra=document.getElementById('tabResArea');if(ra)ra.value=text;
  saveTabData(tabType,label,{result:text});
  updTabBC();renderTabChecklist(tabType,label);closeModal();
}
function delTabVer(tabType,label,i){
  const data=getTabData(tabType);
  const versions=data.versions||[];
  versions.splice(i,1);
  saveTabData(tabType,label,{versions});
  openTabVersionModal(tabType,label);
}

function showToast(msg){
  let t=document.getElementById('toastEl');
  if(!t){t=document.createElement('div');t.id='toastEl';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

// 결과가 목표 바이트±50을 벗어나면 한 번 더 요청해서 분량을 맞춤.
function postProcess(text){
  // 중간점(·) 강제 제거 → 쉼표로 치환
  return text.replace(/·/g,',').replace(/,,/g,',');
}



// PPTX는 base64 문서가 아니라 이미 추출된 일반 텍스트(extractedText)로 저장돼 있음.
// 이건 슬라이드에 실제로 적힌 텍스트 그대로라 손글씨 OCR과 달리 100% 정확하므로,
// "지어내지 말 것" 경고 없이 그대로 신뢰하고 쓰도록 프롬프트에 넣어줌.
function extractedTextBlock(files){
  const parts=[];
  if(files.old?.extractedText)parts.push(`[기존 생기부(${files.old.type==='pdf'?'PDF':'PPTX'}) 추출 텍스트]:\n${files.old.extractedText}`);
  (files.refs||[]).forEach((r,i)=>{
    if(!r)return;
    if(r.type==='text'&&r.extractedText)parts.push(`[참고자료${i+1} — 학생이 직접 작성한 수업 소감 설문 응답입니다]\n이 자료는 학생이 직접 쓴 소감이므로 설문에 없는 활동·탐구·분석·내면화를 추가하지 말고, 학생이 직접 언급한 내용만 재구성할 것.\n---\n${r.extractedText}`);
    else if(r.type==='txt'&&r.extractedText)parts.push(`[참고자료${i+1} — 학생 발표 음성 인식 텍스트(예: 클로바노트) 원문입니다]\n이 자료는 발표를 그대로 옮겨 적은 텍스트이므로 실제로 언급된 내용만 활용하고, 여기 없는 내용을 지어내지 말 것. 음성 인식 특성상 오탈자·띄어쓰기 오류가 있을 수 있으니 문맥상 자연스럽게 이해할 것.\n---\n${r.extractedText}`);
    else if(r.type==='pdf'&&r.extractedText)parts.push(`[참고자료${i+1}(PDF) 추출 텍스트]:\n${r.extractedText}`);
    else if(r.extractedText)parts.push(`[참고자료${i+1}(PPTX) 추출 텍스트]:\n${r.extractedText}`);
  });
  return parts.join('\n\n');
}

// 누가 기록에 저장해둔 중요도(낮음/보통/높음)를 실제 생기부 생성 프롬프트에 반영하기 위한 포맷터.
// 기본값(보통)인 키워드는 표시를 안 해서 프롬프트가 지저분해지지 않게 하고, 낮음/높음만 눈에 띄게 표시함.
function formatKwList(list){
  if(!list.length)return'없음';
  return list.map(k=>{
    const text=typeof k==='string'?k:k.text;
    const imp=typeof k==='object'&&k.importance&&k.importance!=='보통'?k.importance:null;
    return imp?`${text}(중요도:${imp})`:text;
  }).join(', ');
}

    else if(msg.includes('401')||msg.includes('403')){hint='\n\nAPI 키가 잘못됐거나 만료됐어요.';}
    else if(msg.includes('429')){hint='\n\n요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';}
    else if(/50[024]/.test(msg)){hint='\n\n서버 오류예요. 잠시 후 다시 시도해 주세요.';}
    if(ra)ra.value=`오류: ${msg}${hint}`;
  }
  if(btn){btn.disabled=false;btn.innerHTML=`✨ ${label} 생성`;}
}

// 다른 탭에 갔다가 돌아와도(restoreStoredFiles) 옛 데이터로 덮어써지지 않음.

async function processFile(file,type,idx=0){
  const dropId=type==='old'?'dropOld':type==='example'?'dropExample':`dropRef${idx}`;
  const resultId=type==='old'?'fileOldResult':type==='example'?'fileExampleResult':`fileRefResult${idx}`;
  const dropEl=document.getElementById(dropId);
  const resultEl=document.getElementById(resultId);
  if(dropEl)dropEl.classList.add('loading');
  const isPptx=/\.pptx$/i.test(file.name);
  const isTxt=/\.txt$/i.test(file.name);
  const isLegacyPpt=/\.ppt$/i.test(file.name)&&!isPptx;
  if(isLegacyPpt){
    if(resultEl)resultEl.innerHTML='<div style="font-size:11px;color:#cf1322;margin-top:6px;">❌ 구버전 .ppt는 지원하지 않아요. .pptx로 다시 저장한 후 올려주세요.</div>';
    if(dropEl)dropEl.classList.remove('loading');
    return;
  }
  if(resultEl)resultEl.innerHTML=`<div style="font-size:11px;color:#aaa;margin-top:6px;">📖 ${isPptx?'슬라이드 텍스트 추출 중...':isTxt?'텍스트 읽는 중...':'파일 읽는 중...'}</div>`;
  try{
    const files=getAnalyzedFiles();
    let fileData;
    if(isPptx){
      const extractedText=await extractPptxText(file);
      fileData={name:file.name,type:'pptx',extractedText};
    }else if(isTxt){
      const extractedText=await file.text();
      fileData={name:file.name,type:'txt',extractedText};
    }else{
      const base64=await fileToBase64(file);
      fileData={name:file.name,base64,type:file.type||'application/pdf'};
    }

    if(type==='old')files.old=fileData;
    else if(type==='example')files.example=fileData;
    else files.refs[idx]=fileData;

    // localStorage에 저장 (새로고침 후에도 유지)
    persistFiles();

    if(type==='refs'||type==='ref'){renderRefSlots();}
    else{renderFileStatus();}
  }catch(e){
    if(resultEl)resultEl.innerHTML=`<div style="font-size:11px;color:#cf1322;margin-top:6px;">❌ 파일 읽기 실패: ${e.message||''}</div>`;
  }
  if(dropEl)dropEl.classList.remove('loading');
}

function clearFile(type,idx=0){
  const files=getAnalyzedFiles();
  if(type==='old')files.old=null;
  else if(type==='example')files.example=null;
  else{
    // 폼 응답(type==='text') 파일을 지우면 초록색 표시도 같이 제거
    if(files.refs[idx]?.type==='text'){
      const s=getStu();
      if(s){formResponseIds.delete(String(s.id));localStorage.setItem(FORM_RESP_KEY,JSON.stringify([...formResponseIds]));}
    }
    files.refs[idx]=null;
  }
  const resultId=type==='old'?'fileOldResult':type==='example'?'fileExampleResult':`fileRefResult${idx}`;
  const el=document.getElementById(resultId);if(el)el.innerHTML='';
  persistFiles();
  renderSb(); // 사이드바 번호 색상 즉시 갱신
}

      <div style="display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f8f8ff;border:1px solid #e0e0ee;border-radius:8px;margin-bottom:5px;">
        <span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.type==='txt'?'📝':f.type==='pptx'?'📊':f.type==='text'?'📋':'📄'} ${f.name}</span>
        <span onclick="openFilePreview('ref',${i})" style="font-size:11px;padding:2px 7px;border:1px solid #378ADD;border-radius:4px;cursor:pointer;background:#f0f7ff;color:#378ADD;white-space:nowrap;">열기</span>

function removeRefItem(idx){
  const files=getAnalyzedFiles();
  files.refs[idx]=null;
  // null만 제거하되 빈 슬롯 하나는 유지
  files.refs=files.refs.filter(f=>f);
  if(!files.refs.length)files.refs=[null];
  persistFiles();
  renderRefSlots();
  renderFileStatus();
}

function onMultiRefDrop(e){
  e.preventDefault();
  document.getElementById('multiRefDrop')?.classList.remove('drag-over');
  onMultiRefPick(e.dataTransfer.files);
}

async function onMultiRefPick(fileList){
  const files=getAnalyzedFiles();
  const arr=Array.from(fileList);
  for(const file of arr){
    const filled=files.refs.filter(f=>f).length;
    if(filled>=5){showToast('참고자료는 최대 5개까지 추가할 수 있어요.');break;}
    const isPptx=/\.pptx$/i.test(file.name);
    const isTxt=/\.txt$/i.test(file.name);
    const isLegacyPpt=/\.ppt$/i.test(file.name)&&!isPptx;
    if(isLegacyPpt){showToast('구버전 .ppt는 지원하지 않아요.');continue;}
    let fileData;
    if(isPptx){const extractedText=await extractPptxText(file);fileData={name:file.name,type:'pptx',extractedText};}
    else if(isTxt){const extractedText=await file.text();fileData={name:file.name,type:'txt',extractedText};}
    else{const base64=await fileToBase64(file);fileData={name:file.name,base64,type:file.type||'application/pdf'};}
    // 빈 슬롯에 채우기
    let idx=files.refs.findIndex(r=>!r);
    if(idx===-1){files.refs.push(null);idx=files.refs.length-1;}
    files.refs[idx]=fileData;
  }
  persistFiles();
  renderRefSlots();
  renderFileStatus();
}

// Claude API 직접 호출 (Vercel 프록시 대신 — 용량 제한 없음)
async function callGeminiAPI({prompt,fileOld,fileRefs,fileExample}){
  if(!geminiApiKey)throw new Error('Gemini API 키가 설정되어 있지 않아요. 설정에서 먼저 입력해주세요.');
  const parts=[];
  if(fileOld?.base64)parts.push({inlineData:{mimeType:fileOld.mediaType||'application/pdf',data:fileOld.base64}});
  if(Array.isArray(fileRefs)){
    for(const ref of fileRefs){
      if(ref?.base64)parts.push({inlineData:{mimeType:ref.mediaType||'application/pdf',data:ref.base64}});
    }
  }
  if(fileExample?.base64)parts.push({inlineData:{mimeType:fileExample.mediaType||'application/pdf',data:fileExample.base64}});
  parts.push({text:prompt});
  const model='gemini-3.5-flash';
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':geminiApiKey},
    body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{maxOutputTokens:8192}})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(translateApiError(e?.error?.message)||`Gemini API ${r.status}`);}
  const data=await r.json();
  if(data?.candidates?.[0]?.finishReason==='MAX_TOKENS')throw new Error('Gemini 응답이 너무 길어서 중간에 잘렸어요(출력 토큰 한도 초과). 목표 바이트를 줄이거나 Claude 엔진으로 다시 시도해보세요.');
  const result=(data?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  if(!result)throw new Error('Gemini 응답이 비어있어요 (안전 필터에 걸렸거나 빈 응답).');
  const usage=data.usageMetadata||{};
  console.log('[생기부 Gemini 사용량]',{prompt_tokens:usage.promptTokenCount,output_tokens:usage.candidatesTokenCount,total:usage.totalTokenCount});
  return{result,usage,cost:0}; // 무료/저가라 기존 totalCost(Claude 단가 기준) 집계에는 안 섞음
}
// 세특/행동특성 등 실제 생기부 생성용 엔진 선택 - 기본값은 Claude로 두고(기존에 오래 다듬어온 프롬프트 위주로 튜닝돼 있어서),
// 필요할 때만 명시적으로 Gemini로 바꿔 실험해볼 수 있게 함. 검토(전체 검토)나 누가 기록과는 별개의 독립적인 엔진 설정.

async function callClaudeAPI({apiKey,prompt,fileOld,fileRefs,fileExample}){
  const userContent=[];
  if(fileOld?.base64)userContent.push({type:'document',source:{type:'base64',media_type:fileOld.mediaType||'application/pdf',data:fileOld.base64}});
  if(Array.isArray(fileRefs)){
    for(const ref of fileRefs){
      if(ref?.base64)userContent.push({type:'document',source:{type:'base64',media_type:ref.mediaType||'application/pdf',data:ref.base64}});
    }
  }
  if(fileExample?.base64)userContent.push({type:'document',source:{type:'base64',media_type:fileExample.mediaType||'application/pdf',data:fileExample.base64}});
  userContent.push({type:'text',text:prompt});
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,messages:[{role:'user',content:userContent}]})
  });
  const data=await r.json();
  if(data.error)throw new Error(data.error.message);
  const result=data.content?.map(i=>i.text||'').join('')||'';
  const usage=data.usage||{};
  const inputCost=(usage.input_tokens||0)*3/1000000;
  const outputCost=(usage.output_tokens||0)*15/1000000;
  console.log('[세특 API 비용]',{input_tokens:usage.input_tokens,output_tokens:usage.output_tokens,cost_usd:(inputCost+outputCost).toFixed(4)});
  return{result,usage,cost:inputCost+outputCost};
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function extractPdfText(file){
  try{
    if(typeof pdfjsLib==='undefined')return null;
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let text='';
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const tc=await page.getTextContent();
      // PDF 내부에 저장된 텍스트 항목 순서는 실제 표의 시각적 행/열 순서와 다를 수 있음(특히 여러 칸으로
      // 나뉜 표는 열 단위로 저장되기도 함). 그대로 이어붙이면 번호 칸과 이름 칸이 뒤섞여서, AI에게 "100%
      // 정확한 텍스트"라고 줘도 정작 어느 번호와 어느 이름이 같은 행인지는 여전히 틀릴 수 있었음.
      // 그래서 각 글자의 실제 좌표(x,y)를 이용해 같은 높이(같은 줄)끼리 묶고, 그 줄 안에서는 왼쪽→오른쪽
      // 순서로 재정렬해서, 화면에 보이는 표 모양 그대로 텍스트를 재구성함.
      const items=tc.items.map(i=>({str:i.str,x:i.transform[4],y:i.transform[5]})).filter(i=>i.str.trim());
      if(!items.length)continue;
      const rowTol=3; // 같은 줄로 취급할 y좌표 오차범위(pt)
      const rows=[];
      items.forEach(it=>{
        let row=rows.find(r=>Math.abs(r.y-it.y)<=rowTol);
        if(!row){row={y:it.y,items:[]};rows.push(row);}
        row.items.push(it);
      });
      rows.sort((a,b)=>b.y-a.y);
      rows.forEach(r=>{
        r.items.sort((a,b)=>a.x-b.x);
        text+=r.items.map(i=>i.str).join(' | ')+'\n';
      });
    }
    return text.trim()||null;
  }catch(e){return null;}
}

// ===== 구글시트 직접 연동 (출결 대조용) =====
// PDF/이미지를 AI가 "읽게" 하는 대신, 구글시트 API로 셀 값을 그대로 가져옴 - 오독 자체가 원천적으로 불가능해짐.
function getGSheetConfig(){
  try{return{apiKey:localStorage.getItem('gsheetApiKey')||'',url:localStorage.getItem('gsheetUrl')||'',tab:localStorage.getItem('gsheetTab')||''};}
  catch(e){return{apiKey:'',url:'',tab:''};}
}
function parseGSheetId(url){
  const m=(url||'').match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m?m[1]:null;
}
// 스프레드시트 안의 탭(시트) 목록만 가져옴 - 탭 선택 UI용
async function fetchGSheetTabs(apiKey,sheetId){
  const metaR=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?key=${apiKey}&fields=sheets.properties.title`);
  if(!metaR.ok){
    const e=await metaR.json().catch(()=>({}));
    throw new Error(e?.error?.message||'시트 정보를 가져오지 못했어요 (API 키 또는 공유 설정을 확인하세요)');
  }
  const meta=await metaR.json();
  const titles=(meta.sheets||[]).map(s=>s.properties?.title).filter(Boolean);
  if(!titles.length)throw new Error('탭을 찾을 수 없어요.');
  return titles;
}
// tab을 지정하면 그 탭만, 안 주면 첫 번째 탭 값을 가져옴
async function fetchGSheetValues(apiKey,sheetId,tab){
  let title=tab;
  if(!title){
    const titles=await fetchGSheetTabs(apiKey,sheetId);
    title=titles[0];
  }
  const range=encodeURIComponent(`'${title}'!A1:ZZ2000`);
  const valR=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${apiKey}`);
  if(!valR.ok){
    const e=await valR.json().catch(()=>({}));
    throw new Error(e?.error?.message||'시트 값을 가져오지 못했어요.');
  }
  const val=await valR.json();
  return val.values||[];
}

// PDF/이미지는 base64를 blob으로 바꿔서 새 탭으로 열고, PPTX는 추출된 텍스트를 모달로 보여줌
// (브라우저가 PPTX 자체를 못 열기 때문).
function openFilePreview(type,idx){
  const files=getAnalyzedFiles();
  const f=type==='old'?files.old:type==='example'?files.example:files.refs[idx];
  if(!f){alert('파일을 찾을 수 없어요.');return;}
  if(f.type==='pptx'||f.extractedText){

  try{

    const byteNums=new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++)byteNums[i]=byteChars.charCodeAt(i);

}

// PPTX는 Claude API가 PDF처럼 직접 읽을 수 없어서(공식 미지원, 변환 필요),
// ZIP 안의 슬라이드 XML(ppt/slides/slideN.xml)에서 텍스트를 직접 추출해 일반 텍스트로 넘김.
// 이미지가 아니라 실제 슬라이드 텍스트 그대로라서 손글씨 OCR보다 훨씬 정확함.
async function extractPptxText(file){
  const zip=await JSZip.loadAsync(file);
  const slideFiles=Object.keys(zip.files)
    .filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=>{
      const na=parseInt(a.match(/slide(\d+)\.xml/)[1]);
      const nb=parseInt(b.match(/slide(\d+)\.xml/)[1]);
      return na-nb;
    });
  if(!slideFiles.length)throw new Error('슬라이드를 찾을 수 없어요 (.ppt 구버전 형식은 지원하지 않아요. .pptx로 저장 후 다시 시도해 주세요)');
  const parser=new DOMParser();
  const slideTexts=[];
  for(let i=0;i<slideFiles.length;i++){
    const xml=await zip.files[slideFiles[i]].async('string');
    const doc=parser.parseFromString(xml,'application/xml');
    const tNodes=doc.getElementsByTagName('a:t');
    const text=Array.from(tNodes).map(n=>n.textContent).join(' ').trim();
    if(text)slideTexts.push(`[슬라이드 ${i+1}]\n${text}`);
  }
  return slideTexts.join('\n\n')||'(텍스트를 찾을 수 없는 슬라이드입니다)';
}

// 글자 종류만 비교하면 흔한 조사/어미 때문에 거의 항상 높게 나옴.
// 대신 4글자 단위로 이어붙인 조각(n-gram, 표절 검사에 흔히 쓰는 shingling 방식)의 집합을 비교해서,
// 실제로 같은 문구가 반복됐는지를 잡아냄.
function ngramSet(text,n=4){
  const clean=(text||'').replace(/\s+/g,'');
  const set=new Set();
  for(let i=0;i<=clean.length-n;i++)set.add(clean.slice(i,i+n));
  return set;
}
// 2026 학교생활기록부 기재요령(교육부/시도교육청 공통, '01. 학교생활기록부 작성 시 유의사항' 가~파 항목) 기준으로 구성.
// 학교마다 추가하고 싶은 단어는 기본 설정의 "금지어 추가" 칸에서 따로 넣을 수 있음.

const FORBIDDEN_PATTERNS=[
  {label:'사교육기관명 의심(나이스 기재요령 타항)',regex:/[가-힣A-Za-z0-9]{1,8}(학원|어학원|교습소)/g},

];
function getCustomForbidden(){
  return (style.customForbidden||'').split('\n').map(w=>w.trim()).filter(Boolean);
}
// 문장이 "~함/음/됨/임"으로 끝나는 나이스 문체인데 마침표(.)가 빠진 경우를 찾음.
// 뒤에 바로 다른 한글이 이어지면(예: "됨으로써") 어미가 아니라 단어 일부이므로 제외.
// "죽음", "마음"처럼 그 자체가 명사인 단어는 문장 종결 어미가 아니므로(문장이 계속 이어질 수 있음) 오탐 방지용으로 제외.
const MISSING_PERIOD_NOUN_EXCEPTIONS=['죽음','믿음','마음','걸음','다음','처음','싸움','울음','웃음','졸음','젊음','아름다움','미지근함','책임','담임','후임','신임','주임','전임','겸임','자임','위임','선임','책임감','사물함','보관함','우편함'];
function checkMissingPeriod(text){
  if(!text)return[];
  const found=[];
  const re=/(음|함|됨|임)(?![가-힣])/g;
  let m;
  while((m=re.exec(text))){
    const endIdx=re.lastIndex;
    const nextCh=text[endIdx];
    if(nextCh==='.')continue; // 이미 마침표 있음
    const isNoun=MISSING_PERIOD_NOUN_EXCEPTIONS.some(w=>text.slice(endIdx-w.length,endIdx)===w);
    if(isNoun)continue; // 어미가 아니라 그 자체로 명사인 단어(죽음, 마음 등) - 문장이 계속 이어지는 정상적인 경우
    if(nextCh===undefined||/\s/.test(nextCh)){
      const start=Math.max(0,m.index-9);
      found.push(text.slice(start,endIdx));
    }
  }
  return[...new Set(found)];
}
// 마침표·쉼표·물음표 등 같은 문장부호가 실수로 두 번 이상 연달아 찍힌 경우(".." ",," "((" 등)를 찾음.
function checkDoubledPunctuation(text){
  if(!text)return[];
  const found=[];
  const re=/([.,()!?;:～·])\1+/g;
  let m;
  while((m=re.exec(text))){
    const start=Math.max(0,m.index-8);
    const end=Math.min(text.length,re.lastIndex+8);
    found.push(text.slice(start,end));
  }
  return[...new Set(found)];
}
function checkForbidden(text){
  if(!text)return[];
  const found=[];
  [...FORBIDDEN_WORDS_DEFAULT,...getCustomForbidden()].forEach(w=>{
    if(w&&text.includes(w))found.push(w);
  });
  FORBIDDEN_PATTERNS.forEach(p=>{
    const m=text.match(p.regex);
    if(m)found.push(...new Set(m.map(x=>`${p.label}("${x.trim()}")`)));
  });
  // 4. 학교를 알 수 있는 내용(학교명 등) 기재 불가 — 설정에 입력해둔 학교 이름과 대조
  if(profile.school&&text.includes(profile.school))found.push(`학교명 노출 의심("${profile.school}")`);
  return[...new Set(found)];
}

function similarity(a,b){
  if(!a||!b)return 0;
  const setA=ngramSet(a),setB=ngramSet(b);
  if(!setA.size||!setB.size)return 0;
  let inter=0;setA.forEach(g=>{if(setB.has(g))inter++;});
  return inter/(setA.size+setB.size-inter)||0;
}

      }

  }catch(e){
    const msg=e.message||String(e);
    let hint='';
    if(msg.includes('fetch')||msg.toLowerCase().includes('failed')||msg.includes('network')){hint='\n\n가능한 원인: ① 인터넷 연결 확인 ② API 키 설정 확인 ③ 잠시 후 다시 시도';}
    else if(msg.includes('401')||msg.includes('403')){hint='\n\nAPI 키가 잘못됐거나 만료됐어요.';}
    else if(msg.includes('429')){hint='\n\n요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';}
