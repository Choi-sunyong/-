function ttpDirColumns(){
  const byName={};TTP_DEPTS.forEach(([d,l])=>byName[d]=l);
  const adm=byName['관리자·행정실']||[];
  const sec=(name,list)=>list&&list.length?[name,list]:null;
  const known=['관리자·행정실','1학년','2학년','3학년'];
  const others=TTP_DEPTS.filter(([d])=>!known.includes(d));
  const head=sec('관리자',adm.filter(m=>/교장|교감|행정실장/.test(m[1]))),office=sec('행정실',adm.filter(m=>!/교장|교감|행정실장/.test(m[1])));
  // 표처럼: 1열 관리자+앞쪽 부서, 2~3열 나머지 부서, 행정실은 3열 끝 / 학년부는 각자 한 열
  const a=Math.floor(others.length/3),b=others.length-2*a; // 10개면 3·4·3 (표와 같은 배치)
  const c1=[head,...others.slice(0,a)].filter(Boolean);
  const c2=others.slice(a,a+b);
  const c3=[...others.slice(a+b),office].filter(Boolean);
  const grades=['1학년','2학년','3학년'].filter(g=>byName[g]).map(g=>[[g,byName[g]]]);
  return[c1,c2,c3,...grades];
}

window.addEventListener('resize',()=>{clearTimeout(window._ttpFcT);window._ttpFcT=setTimeout(()=>{if(document.querySelector('.pd-table')&&window._ttpFcN!==ttpFreeCols())ttpDrawFree();},200);});
function ttpFreeLookHtml(){
  window._ttpFcN=ttpFreeCols();
  const[d,p]=ttpFreeSlot.split('-').map(Number);
  const today=new Date().getDay(),info=getCurrentPeriodInfo();
  const nowKey=info?`${info.dow}-${info.onBreak?info.beforePerio:info.perio}`:null;
  const dayBtns=TT_DOWS.map(x=>`<button class="${x===d?'on':''}${x===today?' tday':''}" onclick="ttpFreePickSlot('${x}-${p}')">${TT_DOW_LABEL[x]}</button>`).join('');
  const perBtns=[1,2,3,4,5,6,7].map(x=>`<button class="${x===p?'on':''}${`${d}-${x}`===nowKey?' tday':''}" onclick="ttpFreePickSlot('${d}-${x}')">${x}교시</button>`).join('');
  // '지금' = 수업 중·쉬는 시간이면 그 교시, 수업 전이면 오늘 1교시, 방과 후·주말이면 다음 등교일 1교시
  let goKey=nowKey;
  if(!goKey){const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    let w=n.getDay();if(w>=1&&w<=5&&hm<TT_PERIOD_TIMES[1].s)goKey=`${w}-1`;else{w=w>=5||w===0?1:w+1;goKey=`${w}-1`;}}
  const hasTT=new Set(ttpFreeData.teachers);
  let nFree=0,nAll=0;
  // 카드 디자인은 그대로(이름·내선·다음 수업), 배치만 내선번호표 순서. 시간표 없는 분(관리자·행정실)은 뺌
  const row=([n,tag,ext,head],dir)=>{
    // 관리자·행정실은 시간표가 없으니 전화번호부처럼 이름·내선·직함만
    if(dir)return`<div class="fc none"><div class="fc-top"><span class="fc-nm">${n}</span>${ext?`<span class="fc-ext">☎ ${ext}</span>`:''}</div><span class="fc-sub">${tag||''}</span></div>`;
    if(!hasTT.has(n))return'';
    nAll++;
    const q=n.replace(/'/g,"\\'"),op=ttpFreeOpens.includes(n)?' open':'';
    const busyRow=ttpFreeData.at[`${n}|${ttpFreeSlot}`];
    const hb=head?'<i class="fc-hd" title="부장"><svg viewBox="0 0 64 40" width="30" height="19"><defs><linearGradient id="cwG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD86B"/><stop offset=".55" stop-color="#F5A93A"/><stop offset="1" stop-color="#E0892A"/></linearGradient><linearGradient id="cwB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6A640"/><stop offset="1" stop-color="#D97F22"/></linearGradient></defs><path d="M6 14 L17 24 L24 11 L32 22 L40 11 L47 24 L58 14 L54 31 H10 Z" fill="url(#cwG)" stroke="#C8741C" stroke-width="1.2" stroke-linejoin="round"/><rect x="9" y="29" width="46" height="9" rx="2.5" fill="url(#cwB)" stroke="#C8741C" stroke-width="1.2"/><circle cx="6" cy="13" r="3" fill="#FFD86B" stroke="#C8741C" stroke-width="1"/><circle cx="24" cy="10" r="3" fill="#FFD86B" stroke="#C8741C" stroke-width="1"/><circle cx="32" cy="5" r="3.4" fill="#FFE08A" stroke="#C8741C" stroke-width="1"/><path d="M32 8.5 V20" stroke="#C8741C" stroke-width="0"/><circle cx="40" cy="10" r="3" fill="#FFD86B" stroke="#C8741C" stroke-width="1"/><circle cx="58" cy="13" r="3" fill="#FFD86B" stroke="#C8741C" stroke-width="1"/><path d="M32 8 L36 16 L32 21 L28 16 Z" fill="#FFE9A8" opacity=".7"/><circle cx="32" cy="33.5" r="3.6" fill="#3E7BEA" stroke="#1F4FB0" stroke-width=".8"/><circle cx="31" cy="32.4" r="1.1" fill="#fff" opacity=".75"/><circle cx="21" cy="33.5" r="2.6" fill="#F0405E" stroke="#B32040" stroke-width=".8"/><circle cx="43" cy="33.5" r="2.6" fill="#F0405E" stroke="#B32040" stroke-width=".8"/><circle cx="13" cy="33.5" r="1.8" fill="#5AA0F0"/><circle cx="51" cy="33.5" r="1.8" fill="#5AA0F0"/><path d="M12 29.5 H52" stroke="#FFE39A" stroke-width="1" opacity=".8"/></svg></i>':'';
    if(busyRow)return`<div class="fc busy${head?' hd':''}${op}" data-n="${n}" onclick="ttpFreeToggle('${q}')"><div class="fc-top"><span class="fc-nm">${n}${hb}</span>${ext?`<span class="fc-ext">☎ ${ext}</span>`:''}</div><span class="fc-sub">수업 · ${busyRow.room||busyRow.subject||''}</span></div>`;
    nFree++;
    const nx=ttpNextClass(n,d,p);
    return`<div class="fc free${head?' hd':''}${n===profile.name?' me':''}${op}" data-n="${n}" onclick="ttpFreeToggle('${q}')"><div class="fc-top"><span class="fc-nm">${n}${hb}</span>${ext?`<span class="fc-ext">☎ ${ext}</span>`:''}</div><span class="fc-sub">${nx?`다음 ${nx.p}교시 · ${nx.r.room||''}`:'이후 수업 없음'}</span></div>`;
  };
  // 부서 박스: 내선번호 순으로 위→아래
  const ex=m=>parseInt(m[2])||1e4;
  const sec=([dept,list])=>{const sorted=[...list].sort((x,y)=>((y[3]?1:0)-(x[3]?1:0))||ex(x)-ex(y));const b0=nAll,rows=sorted.map(m=>row(m)).join(''),k=nAll-b0;
    return rows?{k,html:(c,r)=>`<div class="sl-sec"><div class="sl-dept">${dept}</div><div class="sl-cards" style="--c:${c};--r:${r||Math.ceil(k/c)}">${rows}</div></div>`}:null;};
  const all=ttpDirColumns().flat(),isG=([d])=>/^[1-3]학년$/.test(d);
  // 화면 전체를 '같은 폭의 카드 칸 U개'로 나눈 하나의 격자 → 위(부서)·아래(학년) 카드의 오와 열이 모두 맞음
  // 부서 제목 한 줄 = 카드 한 줄 높이라서 가로줄도 맞음. 빈 칸 + 높이 차이가 가장 적은 U와 배치를 찾음
  // 1·2·3학년이 화면을 똑같이 3등분하고, 위 부서들도 그 세 칸 폭에 맞춰 세로로 쌓음.
  // 칸마다 '한 줄 카드 수'(2 또는 3)를 고르고, 2명 이하 부서는 반 폭 박스로 나란히 둘 수 있음.
  // 빈 자리 + 세 칸 높이 차이가 가장 적은 배치를 찾음 (높이 단위: 부서 제목 1 + 카드 줄 수)
  const boxes=all.filter(x=>!isG(x)).map(sec).filter(Boolean),gbox=all.filter(isG).map(sec).filter(Boolean);
  boxes.forEach((b,ix)=>b.ix=ix);
  const colPlan=list=>{let best=null;
    for(const c of [2,3]){
      const small=list.filter(b=>c===2&&b.k<=2),n=small.length;
      for(let mask=0;mask<(1<<n);mask++){
        const half=small.filter((_,t)=>mask>>t&1),full=list.filter(b=>!half.includes(b));
        let h=0,e=0;full.forEach(b=>{const r=Math.ceil(b.k/c);h+=1+r;e+=r*c-b.k;});
        const st=[{h:0,l:[]},{h:0,l:[]}];[...half].sort((a,b)=>b.k-a.k).forEach(b=>{const x=st[0].h<=st[1].h?st[0]:st[1];x.l.push(b);x.h+=1+b.k;});
        if(half.length){const m=Math.max(st[0].h,st[1].h);h+=m;e+=Math.abs(st[0].h-st[1].h);}
        const cand={c,h,e,full,st};cand.score=e+h*0.01+(c===3?0.001:0);if(!best||cand.score<best.score)best=cand;}}
    return best;};
  let pick=null;const n=boxes.length,asg=Array(n).fill(0);
  const rec=i=>{if(i===n){const cols=[0,1,2].map(c=>boxes.filter((_,t)=>asg[t]===c));if(cols.some(x=>!x.length))return;
      const pl=cols.map(colPlan),m=Math.max(...pl.map(x=>x.h));
      const order=pl.map((x,c)=>Math.min(...cols[c].map(b=>b.ix)));
      const cost=pl.reduce((t,x)=>t+x.e+(m-x.h)*2.5,0)+(order[0]<order[1]&&order[1]<order[2]?0:0.1);
      if(!pick||cost<pick.cost)pick={cost,pl,order,m};return;}
    for(let c=0;c<3;c++){asg[i]=c;rec(i+1);}};
  if(n>=3&&n<=11)rec(0);
  const boxHtml=(b,c)=>b.html(c);
  let cols='';
  if(pick){
    const idx=[0,1,2].sort((a,b)=>pick.order[a]-pick.order[b]);
    cols=`<div class="p3">`+idx.map(ci=>{const x=pick.pl[ci];const byIx=(a,b)=>a.ix-b.ix;
      const full=[...x.full].sort(byIx).map(b=>boxHtml(b,x.c)).join('');
      const halves=x.st[0].l.length||x.st[1].l.length?`<div class="p3-half">${x.st.map(st=>`<div class="pg-col">${[...st.l].sort(byIx).map(b=>boxHtml(b,1)).join('')}</div>`).join('')}</div>`:'';
      return`<div class="pg-col">${full}${halves}</div>`;}).join('')+`</div>`;
  }else cols=`<div class="p3">`+boxes.map(b=>`<div class="pg-col">${b.html(2)}</div>`).join('')+`</div>`;
  const gr=Math.max(0,...gbox.map(b=>Math.ceil(b.k/2)));
  const grades=gbox.length?`<div class="p3 pg-bot">`+gbox.map(b=>`<div class="pg-col">${b.html(2,gr)}</div>`).join('')+`</div>`:'';
  const t=TT_PERIOD_TIMES[p];
  return`<div class="pd-bar">
      <div class="ttp-seg lg">${dayBtns}</div><div class="ttp-seg lg">${perBtns}</div>
      <button class="ttp-btn pd-now${goKey===ttpFreeSlot?' on':''}" onclick="ttpFreePickSlot('${goKey}')">지금</button>
      <div class="pd-search">${ttpSearchBoxHtml('선생님 검색','freefind','','Find')}</div>
    </div>
    <div class="pd-head"><b>${TT_DOW_LABEL[d]}요일 ${p}교시</b><span>${t.s} ~ ${t.e}</span><span class="pd-count">공강 <b>${nFree}</b> / ${nAll}명</span></div>
    <div class="pd-table">${cols}${grades}</div>
    <div class="fc-panel${ttpFreeOpens.length?' open':''}" id="fcPanel"><div class="fc-panel-in" id="fcPanelIn">${ttpFreeOpens.length?ttpFreePanelsHtml():''}</div></div>`;
}

// 카드를 누르면 아래로 그 선생님 주간 시간표가 부드럽게 펼쳐짐 (같은 카드 다시 누르면 접힘)
// 카드를 누르면 아래에 그 선생님 주간 시간표가 펼쳐짐. 다른 선생님을 더 누르면 오른쪽 옆에 나란히 붙어서 비교 (최대 3명)
let ttpFreeOpens=[];
function ttpFreePanelHtml(n,enter){
  const pp=ttpPerson(n),today=new Date().getDay(),multi=ttpFreeOpens.length>1,q=n.replace(/'/g,"\\'");
  let g='<div class="fp-hd"></div>'+TT_DOWS.map(d=>`<div class="fp-hd${d===today?' today':''}">${TT_DOW_LABEL[d]}</div>`).join('');
  for(let p=1;p<=7;p++){
    g+=`<div class="fp-pd">${p}</div>`;
    TT_DOWS.forEach(d=>{
      const k=`${d}-${p}`,r=ttpFreeData.at[`${n}|${k}`],sel=k===ttpFreeSlot;
      const both=multi&&!r&&ttpFreeOpens.every(m=>!ttpFreeData.at[`${m}|${k}`]);
      g+=r?`<div class="fp-c on${sel?' sel':''}" data-k="${k}"><b>${r.subject||''}</b><span>${r.room||''}</span></div>`
          :`<div class="fp-c${sel?' sel free':''}${both?' both':''}" data-k="${k}">${both?'<i class="fp-ok"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" fill="#378ADD"/><path d="M7.5 12.4l3 3 6-6.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></i>':''}</div>`;
    });
  }
  return`<div class="fp-card${enter?' enter':''}" data-fp="${n}">
    <div class="fp-top"><div class="fp-who"><b>${n} 선생님</b>${pp&&!multi?`<span>${pp.depts.join(' · ')}${pp.home?` · ${pp.home} 담임`:''}</span>`:''}</div>
      <div class="fp-act">${pp?`<span class="ttp-ext">☎ ${pp.ext}</span>`:''}${multi?'':`<button class="ttp-btn ttp-back" onclick="ttpTeacher='${q}';ttpSwitchSub('view')">시간표로 가기</button>`}<button class="fp-x" onclick="ttpFreeToggle('${q}')" title="닫기">✕</button></div></div>
    <div class="fp-grid">${g}</div></div>`;
}
function ttpFreePanelsHtml(enterName){
  return`<div class="fp-row n${ttpFreeOpens.length}">${ttpFreeOpens.map(n=>ttpFreePanelHtml(n,n===enterName)).join('')}</div>${ttpFreeOpens.length>1?'':'<div class="fp-hint">다른 선생님을 누르면 옆에 나란히 비교돼요 (최대 3명)</div>'}`;
}
// 한 선생님 시간표의 칸에 마우스를 올리면 나란히 열린 다른 선생님들의 같은 교시도 함께 강조
document.addEventListener('mouseover',e=>{
  const c=e.target.closest?.('#fcPanelIn .fp-c');const k=c?.dataset.k||null;
  if(k===window._fpHovK)return;window._fpHovK=k;
  document.querySelectorAll('#fcPanelIn .fp-c.hov,#fcPanelIn .fp-hd.hov,#fcPanelIn .fp-pd.hov').forEach(x=>x.classList.remove('hov'));
  if(!k)return;
  const [d,p]=k.split('-').map(Number);
  document.querySelectorAll(`#fcPanelIn .fp-c[data-k="${k}"]`).forEach(x=>x.classList.add('hov'));
  document.querySelectorAll('#fcPanelIn .fp-grid').forEach(g=>{g.querySelectorAll('.fp-hd')[TT_DOWS.indexOf(d)+1]?.classList.add('hov');g.querySelectorAll('.fp-pd')[p-1]?.classList.add('hov');});
});
function ttpFreeMark(){
  document.querySelectorAll('.fc.open,.pd-row.open,.sl.open').forEach(el=>el.classList.remove('open'));
  ttpFreeOpens.forEach(n=>document.querySelector(`.pd-table [data-n="${CSS.escape(n)}"]`)?.classList.add('open'));
}
function ttpFreeToggle(n){
  const panel=document.getElementById('fcPanel'),inner=document.getElementById('fcPanelIn');if(!panel||!inner)return;
  const wasOpen=ttpFreeOpens.length>0;
  if(ttpFreeOpens.includes(n)){
    // 닫기: 그 카드만 스르륵 빠지고 나머지가 자리를 채움
    const card=inner.querySelector(`.fp-card[data-fp="${CSS.escape(n)}"]`);
    ttpFreeOpens=ttpFreeOpens.filter(m=>m!==n);ttpFreeMark();
    if(!ttpFreeOpens.length){panel.classList.remove('open');return;}
    if(card){card.classList.add('leave');setTimeout(()=>{inner.innerHTML=ttpFreePanelsHtml();},320);}else inner.innerHTML=ttpFreePanelsHtml();
    return;
  }
  if(ttpFreeOpens.length>=3)ttpFreeOpens.shift(); // 4번째를 누르면 가장 먼저 연 분이 빠짐
  ttpFreeOpens.push(n);ttpFreeMark();
  inner.innerHTML=ttpFreePanelsHtml(wasOpen?n:null);
  if(!wasOpen){requestAnimationFrame(()=>panel.classList.add('open'));setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),250);}
}

// 3) 회의 시간 잡기: 고른 선생님 모두 비는 칸 = 가능
let ttpMeetShow='busy';
function ttpFreeMeetHtml(){
  const sel=ttpMeet.filter(m=>ttpFreeData.teachers.includes(m));
  const groups=ttpGroups();
  const chips=sel.map(n=>`<span class="ttp-meet-chip">${n}<button onclick="ttpMeetToggle('${n.replace(/'/g,"\\'")}')">×</button></span>`).join('');
  let grid='';
  if(sel.length>=2){
    const today=new Date().getDay();
    let h='<div class="fn-hd"></div>'+TT_DOWS.map(d=>`<div class="fn-hd${d===today?' today':''}">${TT_DOW_LABEL[d]}</div>`).join('');
    let n=0;
    for(let p=1;p<=7;p++){
      h+=`<div class="fn-pd"><b>${p}교시</b><span>${TT_PERIOD_TIMES[p].s}</span></div>`;
      TT_DOWS.forEach(d=>{
        const busy=sel.filter(m=>ttpBusy(m,`${d}-${p}`));
        if(!busy.length){n++;h+=`<div class="mt-ok"><span class="mt-ok-in"><svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".16"/><path d="M7.5 12.4l3 3 6-6.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>모두 가능</span></div>`;}
        else if(ttpMeetShow==='free'){const fr=sel.filter(m=>!busy.includes(m));h+=`<div class="mt-no fr"><span>${fr.length?fr.join(' · '):'—'}</span></div>`;}
        else h+=`<div class="mt-no"><span>${busy.join(' · ')}</span></div>`;
      });
    }
    grid=`<div class="mt-bar"><div class="mt-count">모두 비는 시간 <b>${n}</b>칸</div><div class="ttp-seg sm"><button class="${ttpMeetShow==='free'?'on':''}" onclick="ttpMeetShow='free';ttpDrawFree()">공강 선생님</button><button class="${ttpMeetShow!=='free'?'on':''}" onclick="ttpMeetShow='busy';ttpDrawFree()">수업 있는 선생님</button></div></div><div class="fn-grid">${h}</div>`;
  }else grid='<div class="ttp-empty-note">선생님을 두 명 이상 고르세요</div>';
  return`<div class="ttp-meet-pick">${ttpSearchBoxHtml('선생님 추가','meet','','Meet')}
      ${groups.length?`<span class="ttp-pick"><span>부서 불러오기</span>${ttpIcon('caret',15)}<select onchange="ttpMeetLoadGroup(this.value)"><option value="">부서 불러오기</option>${groups.map(g=>`<option value="${g.name.replace(/"/g,'&quot;')}">${g.name}</option>`).join('')}</select></span>`:''}
      <div class="ttp-meet-chips">${chips}</div>
    </div>${grid}`;
}
function ttpMeetToggle(n){const i=ttpMeet.indexOf(n);if(i>=0)ttpMeet.splice(i,1);else ttpMeet.push(n);localStorage.setItem('ttpMeet',JSON.stringify(ttpMeet));ttpDrawFree();}
function ttpMeetLoadGroup(name){const g=ttpGroups().find(x=>x.name===name);if(!g)return;g.members.forEach(m=>{if(!ttpMeet.includes(m))ttpMeet.push(m);});localStorage.setItem('ttpMeet',JSON.stringify(ttpMeet));ttpDrawFree();}


// 그룹 만들기/수정 (이 브라우저에 저장)
let ttpGroupDraft=null;
function ttpDrawGroupEditor(){
  const m=document.getElementById('mcConfirm');if(!m||!ttpGroupDraft)return;
  const g=ttpGroupDraft;
  m.innerHTML=`<div class="modal" style="width:420px;max-width:calc(100vw - 32px);">
    <h3>${g.orig?'그룹 수정':'새 그룹'}</h3>
    <div class="modal-field"><label>그룹 이름</label><input autocomplete="off" id="ttpGrpName" value="${g.name.replace(/"/g,'&quot;')}" placeholder="예: 2학년부, 사회과" oninput="ttpGroupDraft.name=this.value"/></div>
    <div class="modal-field"><label>선생님 (${g.members.length}명)</label>${ttpSearchBoxHtml('이름 검색해서 추가','grp','','Grp')}</div>
    <div class="ttp-meet-chips" style="max-height:180px;overflow:auto;">${g.members.map(n=>`<span class="ttp-meet-chip">${n}<button onclick="ttpGroupDraft.members=ttpGroupDraft.members.filter(x=>x!=='${n.replace(/'/g,"\\'")}');ttpDrawGroupEditor()">×</button></span>`).join('')||'<span class="ttp-muted">아직 없어요</span>'}</div>
    <div class="modal-btns">${g.orig?`<button onclick="ttpDeleteGroup()" style="color:#dc2626;margin-right:auto;">삭제</button>`:''}<button onclick="document.getElementById('mcConfirm')?.remove();ttpDrawFree()">취소</button><button class="ok" onclick="ttpSaveGroupDraft()">저장</button></div>
  </div>`;
}
function ttpSaveGroupDraft(){
  const g=ttpGroupDraft;const name=(g.name||'').trim();
  if(!name){alert('그룹 이름을 적어주세요');return;}
  if(!g.members.length){alert('선생님을 한 명 이상 추가해주세요');return;}
  if(ttpDeptGroups().some(x=>x.name===name)){alert('부서 이름과 겹쳐요. 다른 이름을 써주세요');return;}
  let all=ttpCustomGroups().filter(x=>x.name!==g.orig&&x.name!==name);
  all.push({name,members:g.members});ttpSaveGroups(all);
  ttpFreeGroup=name;localStorage.setItem('ttpFreeGroup',name);
  document.getElementById('mcConfirm')?.remove();ttpDrawFree();
}
function ttpDeleteGroup(){
  const g=ttpGroupDraft;if(!g.orig||!confirm(`"${g.orig}" 그룹을 삭제할까요?`))return;
  ttpSaveGroups(ttpCustomGroups().filter(x=>x.name!==g.orig));

let ttpSearchSfx='';
const ttpSEl=(sfx)=>({inp:document.getElementById('ttpSearch'+sfx),list:document.getElementById('ttpSearchList'+sfx)});
async function ttpSearchInput(sfx){
  sfx=sfx||'';ttpSearchSfx=sfx;

  document.querySelectorAll('.ttp-search-list').forEach(l=>{if(l!==list)l.style.display='none';});

  if(mode.includes('student')){
    const all=await ttpStuAll();
    ttpSearchHits=all.filter(s=>ttpNameMatch(s.name,q)||s.no.startsWith(q)).sort((a,b)=>a.no.localeCompare(b.no)).slice(0,12)
      .map(s=>({label:s.name,meta:`${s.grade}-${s.class_num} ${parseInt(s.no.slice(3))}번`,stu:s}));
  }else{
    if(!ttTeacherList.length)await loadTtTeacherList();

function ttpDrawSearchList(){

  if(!ttpSearchHits.length){list.innerHTML=`<div class="ttp-search-empty">일치하는 ${mode.includes('student')?'학생':'선생님'}이 없어요</div>`;return;}
  list.innerHTML=ttpSearchHits.map((h,i)=>`<div class="ttp-search-item ${i===ttpSearchIdx?'on':''}" onmousedown="event.preventDefault()" onclick="ttpPickHit(${i})" onmouseenter="ttpHoverItem(${i})">
    <span>${h.label}${h.me?' <span class="ttp-me">나</span>':''}</span>${h.meta?`<span class="ttp-search-num">${h.meta}</span>`:''}</div>`).join('');
}
function ttpHoverItem(i){ttpSearchIdx=i;const{list}=ttpSEl(ttpSearchSfx);list?.querySelectorAll('.ttp-search-item').forEach((el,j)=>el.classList.toggle('on',j===i));}
function ttpSearchKey(e,sfx){
  ttpSearchSfx=sfx||'';
  const{list}=ttpSEl(ttpSearchSfx);
  if(e.key==='ArrowDown'&&ttpSearchHits.length){e.preventDefault();ttpSearchIdx=(ttpSearchIdx+1)%ttpSearchHits.length;ttpDrawSearchList();}
  else if(e.key==='ArrowUp'&&ttpSearchHits.length){e.preventDefault();ttpSearchIdx=(ttpSearchIdx-1+ttpSearchHits.length)%ttpSearchHits.length;ttpDrawSearchList();}
  else if(e.key==='Enter'){e.preventDefault();if(ttpSearchHits.length)ttpPickHit(ttpSearchIdx);}
  else if(e.key==='Escape'){if(list)list.style.display='none';e.target.blur();}
}
function ttpPickHit(i){
  const h=ttpSearchHits[i];if(!h)return;
  ttpSearchHits=[];
  const{inp,list}=ttpSEl(ttpSearchSfx);
  const mode=inp?.dataset.mode||'teacher';
  if(mode==='freefind'){if(inp){inp.value='';inp.blur();}if(list)list.style.display='none';if(!ttpFreeOpens.includes(h.teacher))ttpFreeToggle(h.teacher);const el=document.querySelector(`.pd-table [data-n="${CSS.escape(h.teacher)}"]`);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400);}return;}
  if(mode==='meet'||mode==='grp'){
    if(inp){inp.value='';}if(list)list.style.display='none';
    if(mode==='meet'){if(!ttpMeet.includes(h.teacher)){ttpMeet.push(h.teacher);localStorage.setItem('ttpMeet',JSON.stringify(ttpMeet));}ttpDrawFree();setTimeout(()=>document.getElementById('ttpSearchMeet')?.focus(),0);}

  if(mode.startsWith('dash')||mode.startsWith('cmp')){if(inp){inp.value='';inp.blur();}if(list)list.style.display='none';}
  if(mode.startsWith('cmp-')){ttpCmpSet(mode.slice(-1),h.stu?h.stu.no:h.teacher);ttpRenderCompare();return;}
  if(h.stu){
    localStorage.setItem('ttpStuCls',`${h.stu.grade}-${h.stu.class_num}`);ttpStudentNo=h.stu.no;

// 좁은 칸에 맞게 과목명을 줄임: 역사로 탐구하는 현대 세계B → 역탐B, 일본어 회화E → 일어E, 여행지리C → 여지C
function ttpShortSubject(subj){
  const m=String(subj||'').match(/^(.*?)([A-Z])?$/);let base=(m[1]||'').trim();const g=m[2]||'';
  const words=base.split(/\s+/).filter(Boolean);
  let short;
  if(words.length>=2)short=/어$/.test(words[0])?words[0][0]+'어':words[0][0]+words[1][0];
  else short=base.length>=4?base[0]+base[2]:base;
  return short+g;
}

    const{data}=await sb.from('class_timetable').select('*').eq('user_id',user.id).eq('grade',g).eq('class_num',c);

    }else{
      const{rows,error}=await fetchWeekTimetableFor(g,c);
      if(ttpTab!==tab)return;
      if(error){ttpDrawGrid(error);return;}
      (rows||[]).forEach(r=>{
        const dow=ymdToDow(r.ALL_TI_YMD);if(dow<1||dow>5)return;
        ttpMap[`${dow}-${r.PERIO}`]={subject:r.ITRT_CNTNT||'',sub:''};

function ttpDrawGrid(emptyMsg){
  const grid=document.getElementById('ttpGrid');if(!grid)return;
  if(ttpTab==='student'&&ttpStuEmpty){
    grid.className='ttp-grid ttp-empty-wrap';
    grid.innerHTML=`<div class="ttp-empty">${ttpIcon('cap',30)}<div>아직 올린 학생 시간표가 없어요</div><button class="ttp-btn" onclick="openTtManage()">학생 시간표 올리기</button></div>`;
    ttpRenderSide();
    return;
  }
  grid.className='ttp-grid'+(ttpTab==='room'?' purple':'')+(ttpEdit?' editing':'');
  const today=new Date().getDay();
  const info=getCurrentPeriodInfo();
  let html='<div class="ttp-hd ttp-corner"></div>'+TT_DOWS.map(d=>`<div class="ttp-hd ${d===today?'today':''}">${TT_DOW_LABEL[d]}</div>`).join('');
  for(let p=1;p<=7;p++){
    const t=TT_PERIOD_TIMES[p];
    html+=`<div class="ttp-pd"><span class="ttp-pd-n">${p}교시</span><span class="ttp-pd-t">${t.s} ~ ${t.e}</span></div>`;
    TT_DOWS.forEach(d=>{
      const cell=ttpVisibleCell(d,p);
      const isNow=info&&!info.onBreak&&info.dow===d&&info.perio===p;
      const isBreak=info&&info.onBreak&&info.dow===d&&info.afterPerio===p;
      const cls=`ttp-cell${d===today?' today':''}${isNow?' now':''}${cell?' filled':''}${isBreak?' break-line':''}`;
      const click=ttpEdit?` onclick="ttpEditCell(${d},${p})"`:'';
      html+=cell
        ?`<div class="${cls}"${click}><span class="ttp-c-main">${cell.subject}</span>${cell.sub?`<span class="ttp-c-sub">${cell.sub}</span>`:''}</div>`
        :`<div class="${cls}"${click}>${ttpEdit?'<span class="ttp-c-add">+</span>':''}</div>`;
    });
  }
  grid.innerHTML=html;
  if(emptyMsg)grid.insertAdjacentHTML('beforeend',`<div class="ttp-note">${emptyMsg}</div>`);
  // 주당 수업 시수
  const cnt=document.getElementById('ttpCount');
  if(cnt){let n=0;TT_DOWS.forEach(d=>{for(let p=1;p<=7;p++)if(ttpVisibleCell(d,p))n++;});cnt.textContent=`${n}시수`;}
  ttpRenderSide();
}

// 오른쪽 "오늘" 패널: 지금 상태 + 오늘 수업 목록
// 초 단위 카운트: 오늘 HH:MM의 시각(ms), 경과/남은 시간을 "N분 N초"로
function ttpTodayAt(hm){const[h,m]=hm.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return d.getTime();}
function ttpFmtDur(ms){
  const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return h?`${h}시간 ${m}분 ${s}초`:m?`${m}분 ${s}초`:`${s}초`;
}
if(!window._ttpSecTick){
  window._ttpSecTick=true;
  setInterval(()=>{
    let flip=false;
    document.querySelectorAll('.ttp-tag[data-until]').forEach(el=>{const left=Number(el.dataset.until)-Date.now();if(left<=0)flip=true;else el.textContent=`${ttpFmtDur(left)} 후`;});
    document.querySelectorAll('.ttp-tag[data-since]').forEach(el=>{el.textContent=`${ttpFmtDur(Date.now()-Number(el.dataset.since))}째`;});
    if(flip&&document.getElementById('ttpGrid')&&ttpCurSub()==='view'){if(document.getElementById('ttpGrid')&&!ttpEdit)ttpDrawGrid();else ttpRenderSide();}
  },1000);
}
function ttpRenderSide(){
  const box=document.getElementById('ttpSide');if(!box)return;
  const now=new Date(),dow=now.getDay();
  const info=getCurrentPeriodInfo();
  const nowMin=now.getHours()*60+now.getMinutes();
  const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m;};
  let status;
  if(!info)status='지금은 수업 시간이 아니에요';
  else if(info.onBreak){const t=TT_PERIOD_TIMES[info.beforePerio];status=`쉬는 시간 · 다음 <b>${info.beforePerio}교시</b> ${t.s} 시작`;}
  else{const t=TT_PERIOD_TIMES[info.perio];status=`<b>${info.perio}교시</b> 진행 중 · ${t.e} 종료`;}
  const dateLb=`${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[dow]}요일`;
  let list='';
  if(dow<1||dow>5){list='<div class="ttp-side-empty">주말이에요</div>';}
  else{
    let any=false,nextMarked=false;
    for(let p=1;p<=7;p++){
      const cell=ttpVisibleCell(dow,p);if(!cell)continue;any=true;
      const t=TT_PERIOD_TIMES[p];
      const past=nowMin>=toMin(t.e);
      const cur=info&&!info.onBreak&&info.perio===p;
      let tag='';
      if(cur)tag=`<span class="ttp-tag now" data-since="${ttpTodayAt(t.s)}">${ttpFmtDur(Date.now()-ttpTodayAt(t.s))}째</span>`;
      else if(!past&&!nextMarked){nextMarked=true;tag=`<span class="ttp-tag" data-until="${ttpTodayAt(t.s)}">${ttpFmtDur(ttpTodayAt(t.s)-Date.now())} 후</span>`;}
      list+=`<div class="ttp-side-row${past?' past':''}${cur?' cur':''}">
        <span class="ttp-side-p">${p}교시</span>
        <span class="ttp-side-c"><span><b>${cell.subject}</b>${cell.sub?`<span class="ttp-side-sub"> · ${cell.sub}</span>`:''}</span><em>${t.s} ~ ${t.e}</em></span>${tag}</div>`;
    }
    if(!any)list='<div class="ttp-side-empty">오늘은 수업이 없어요</div>';
  }
  box.innerHTML=`<div class="ttp-side-hd">${ttpIcon('clock',16)}<span>오늘</span><span class="ttp-side-date">${dateLb}</span></div>
    <div class="ttp-side-status">${status}</div>
    <div class="ttp-side-list">${list}</div>`;
}

// 기존 파서가 읽을 수 있는 양식인지 확인 (교사: '교사명' 머리행 + 시트/파일명에 요일, 반별: '학년' 머리칸)
function ttpIsKnownFormat(kind,wb,file){
  const sn=wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1});
  if(kind==='teacher'){
    const hasHead=rows.some(r=>r.some(c=>String(c||'').includes('교사명')));
    const hasDow=/\([일월화수목금토]\)/.test(sn)||/[일월화수목금토]/.test(file.name);
    return hasHead&&hasDow;
  }
  return rows.some(r=>r.some(c=>String(c||'')==='학년'));
}

const TTP_AI_SCHEMA={
  type:'OBJECT',
  properties:{rows:{type:'ARRAY',items:{type:'OBJECT',properties:{

    cells:{type:'ARRAY',items:{type:'STRING',description:'"요일 교시 과목 부가정보" 형식 한 줄 (예: "월 1 윤탐B 205")'}}
  },required:['who','cells']}}},
  required:['rows']

function ttpAiSystem(kind){
  const common=`당신은 한국 고등학교 시간표 문서를 읽어 구조화하는 도우미입니다. 문서에 실제로 적힌 내용만 옮기고, 없는 칸을 추측해서 채우지 마세요.
- 요일은 월/화/수/목/금 한 글자, 교시는 1~7 숫자로 쓰세요.
- cells의 각 항목은 "요일 교시 과목 부가정보" 순서로 공백으로 구분한 한 줄입니다. 과목명 안의 공백은 없애서 붙여 쓰세요(예: "현대사회와 윤리" → "현대사회와윤리"). 부가정보가 없으면 생략하세요.
- 빈 칸(수업 없음)은 넣지 마세요.`;
  if(kind==='student')return common+`\n- 학생 개인별 시간표입니다. who에는 "학번 이름" (예: "20101 홍길동")을, 부가정보에는 교실 번호를 쓰세요. 과목명 끝의 분반 알파벳(A~E)은 그대로 두세요. 빈 칸은 자기 반 교실 수업이니 넣지 마세요.`;
  return kind==='teacher'
    ?common+`\n- 교사 시간표입니다. who에는 교사 이름만, 부가정보에는 교실/반 번호(예: 205, 2-4)를 쓰세요.`
    :common+`\n- 반별(학급) 시간표입니다. who에는 "학년-반" (예: "2-4")만, 부가정보에는 담당 교사 이름을 쓰세요(없으면 생략).`;
}
// AI 한 번 호출: part={pdfB64} 또는 {text}. 응답이 잘리면 TTP_TRUNC 에러를 던져서 호출한 쪽이 더 잘게 쪼개게 함
async function ttpAiCall(kind,part,extra){
  const system=ttpAiSystem(kind);
  const ask='이 시간표를 JSON으로 옮겨주세요.'+(extra?'\n'+extra:'');
  const engine=getAttEngine();
  const claudeSys=system+'\n반드시 {"rows":[{"who":"...","cells":["월 1 과목 부가정보"]}]} 형식의 JSON만 출력하세요.';
  let raw;
  try{
    if(part.pdfB64){
      if(engine==='gemini')raw=await attGemini(system,[{inlineData:{mimeType:'application/pdf',data:part.pdfB64}},{text:ask}],TTP_AI_SCHEMA);
      else raw=await attClaude(claudeSys,[{type:'document',source:{type:'base64',media_type:'application/pdf',data:part.pdfB64}},{type:'text',text:ask}],16000);
    }else{
      const txt=`다음은 엑셀 시간표를 CSV로 바꾼 내용의 일부입니다.\n\n${part.text}\n\n${ask}`;
      if(engine==='gemini')raw=await attGemini(system,[{text:txt}],TTP_AI_SCHEMA);
      else raw=await attClaude(claudeSys,[{type:'text',text:txt}],16000);
    }
  }catch(e){
    const m=e?.message||'';
    if(m.includes('잘렸')||m.includes('MAX_TOKENS')||m.includes('AI_TRUNCATED')||m.includes('AI_PARSE_FAIL'))throw new Error('TTP_TRUNC');
    throw e;
  }
  let data;
  try{data=attParseJSON(raw);}catch(e){throw new Error('TTP_TRUNC');}
  const out=[];
  (data?.rows||[]).forEach(r=>{
    const who=String(r.who||'').trim();if(!who)return;
    (r.cells||[]).forEach(line=>{
      const m=String(line).trim().match(/^([월화수목금])\s*(\d)\s+(\S+)(?:\s+(.+))?$/);
      if(!m)return;
      const perio=parseInt(m[2]);if(perio<1||perio>7)return;
      out.push({who,dow:DOW_CHAR_TO_NUM[m[1]],perio,subject:m[3].trim(),extra:(m[4]||'').trim()});
    });
  });
  return out;
}
// 조각이 너무 커서 응답이 잘리면: 더 작은 조각으로 반씩 나누고, 한 조각(한 쪽/몇 줄)도 잘리면 요일별로 나눠서 다시 요청
async function ttpAiByDay(kind,part,prog){
  const out=[];
  for(const d of ['월','화','수','목','금']){
    prog.tick(`${d}요일만 다시 읽는 중`);
    out.push(...await ttpAiCall(kind,part,`이번에는 ${d}요일 칸만 옮기세요. 다른 요일은 넣지 마세요.`));
  }
  return out;
}
let _pdfLibLoading=null;

  return _pdfLibLoading;
}
function ttpBytesToB64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
async function ttpAiPdf(kind,file,prog){
  await ttpEnsurePdfLib();
  const src=await PDFLib.PDFDocument.load(await file.arrayBuffer(),{ignoreEncryption:true});
  const n=src.getPageCount();
  const pagesB64=async idx=>{const doc=await PDFLib.PDFDocument.create();(await doc.copyPages(src,idx)).forEach(p=>doc.addPage(p));return ttpBytesToB64(await doc.save());};
  const run=async idx=>{
    prog.tick(`${file.name} ${idx.length>1?`${idx[0]+1}~${idx[idx.length-1]+1}쪽`:`${idx[0]+1}쪽`}`);
    const part={pdfB64:await pagesB64(idx)};
    try{return await ttpAiCall(kind,part);}
    catch(e){
      if(e.message!=='TTP_TRUNC')throw e;
      if(idx.length>1){const h=Math.ceil(idx.length/2);return[...await run(idx.slice(0,h)),...await run(idx.slice(h))];}
      return await ttpAiByDay(kind,part,prog);
    }
  };
  const out=[];
  const all=[...Array(n).keys()];
  for(let i=0;i<all.length;i+=2)out.push(...await run(all.slice(i,i+2))); // 기본 2쪽씩
  return out;
}
async function ttpAiExcel(kind,file,wb,prog){
  const out=[];
  for(const sn of wb.SheetNames){
    const lines=XLSX.utils.sheet_to_csv(wb.Sheets[sn],{blankrows:false}).split('\n').filter(l=>l.replace(/,/g,'').trim());
    if(!lines.length)continue;
    const head=lines.slice(0,3),body=lines.slice(3);
    const run=async rows=>{
      prog.tick(`${file.name} [${sn}]`);
      const part={text:`[시트: ${sn}]\n${[...head,...rows].join('\n')}`};
      try{return await ttpAiCall(kind,part);}
      catch(e){
        if(e.message!=='TTP_TRUNC')throw e;
        if(rows.length>4){const h=Math.ceil(rows.length/2);return[...await run(rows.slice(0,h)),...await run(rows.slice(h))];}
        return await ttpAiByDay(kind,part,prog);
      }
    };
    if(!body.length){out.push(...await run([]));continue;}
    for(let i=0;i<body.length;i+=40)out.push(...await run(body.slice(i,i+40))); // 기본 40줄씩
  }
  return out;
}

    let{error}=await sb.from('class_timetable').insert(rows);
    if(error&&/teacher/i.test(error.message||'')){({error}=await sb.from('class_timetable').insert(rows.map(({teacher,...r})=>r)));}
    if(error)throw error;

// ----- 학생 개별 시간표: PDF 파서 (학번+이름+월~금×1~7교시 격자가 한 쪽에 여러 개 있는 양식) -----
// pdf.js 글자 좌표로 칸을 복원함 — AI 없이 정확하고 무료. 이 양식이 아니면 0명이 나오고, 그때는 AI로 넘김
async function ttpParseStudentPdf(file){
  if(typeof pdfjsLib==='undefined')throw new Error('PDF 도구를 불러오지 못했어요');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const students=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const pg=await pdf.getPage(pn);const H=pg.getViewport({scale:1}).height;
    const items=(await pg.getTextContent()).items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],w:i.width,t:H-i.transform[5],h:i.height||8}))
      .map(i=>({...i,cx:i.x+i.w/2,cy:i.t-i.h/2}));
    const ids=items.filter(i=>/^\d{5}$/.test(i.s));
    for(const id of ids){
      const days=['월','화','수','목','금'].map(d=>items.filter(i=>i.s===d&&i.x>id.x&&Math.abs(i.cy-id.cy)<14).sort((a,b)=>a.x-b.x)[0]);
      if(days.some(d=>!d))continue;
      const nameIt=items.filter(i=>i!==id&&i.x<days[0].x-4&&i.cy>id.cy+2&&i.cy<id.cy+20&&Math.abs(i.x-id.x)<20&&!/^\d+$/.test(i.s)).sort((a,b)=>a.cy-b.cy)[0];
      const pers=[];
      for(let p=1;p<=7;p++)pers.push(items.filter(i=>i.s===String(p)&&i.cx<days[0].x&&Math.abs(i.x-id.x)<30&&i.cy>id.cy+4&&i.cy<id.cy+260).sort((a,b)=>a.cy-b.cy)[0]||null);
      if(pers.some(p=>!p))continue;
      const colB=[days[0].cx-(days[1].cx-days[0].cx)/2];
      for(let d=0;d<4;d++)colB.push((days[d].cx+days[d+1].cx)/2);
      colB.push(days[4].cx+(days[4].cx-days[3].cx)/2);
      const rowB=[pers[0].cy-(pers[1].cy-pers[0].cy)/2];
      for(let p=0;p<6;p++)rowB.push((pers[p].cy+pers[p+1].cy)/2);
      rowB.push(pers[6].cy+(pers[6].cy-pers[5].cy)/2);
      const cells={};
      for(let d=0;d<5;d++)for(let p=0;p<7;p++){
        const inCell=items.filter(i=>i.cx>colB[d]&&i.cx<colB[d+1]&&i.cy>rowB[p]&&i.cy<rowB[p+1]).sort((a,b)=>a.cy-b.cy||a.x-b.x);
        if(!inCell.length)continue;
        const lines=[];inCell.forEach(i=>{const L=lines[lines.length-1];if(L&&Math.abs(L.cy-i.cy)<3)L.parts.push(i.s);else lines.push({cy:i.cy,parts:[i.s]});});
        const txt=lines.map(l=>l.parts.join(' ')).join('').replace(/#N\/A/g,'').trim();
        if(!txt)continue;
        const m=txt.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
        cells[`${d+1}-${p+1}`]={subject:ttpStuNorm(m?m[1]:txt),room:m?m[2].trim():''};
      }
      const name=(nameIt?.s||'').replace(/#N\/A/g,'').trim();
      if(!name&&!Object.keys(cells).length)continue; // 빈 양식(#N/A만 있는 학생)은 건너뜀
      students.push({no:id.s,name,grade:parseInt(id.s[0]),class_num:parseInt(id.s.slice(1,3)),cells});
    }
  }
  return students;
}

function ttpAiCellsToStudents(cells){
  const map={};
  cells.forEach(c=>{
    const m=String(c.who).match(/(\d{5})\s*(\S*)/);if(!m)return;
    const st=map[m[1]]||(map[m[1]]={no:m[1],name:m[2]||'',grade:parseInt(m[1][0]),class_num:parseInt(m[1].slice(1,3)),cells:{}});
    if(!st.name&&m[2])st.name=m[2];
    st.cells[`${c.dow}-${c.perio}`]={subject:ttpStuNorm(c.subject),room:c.extra||''};
  });
  return Object.values(map);
}

async function ttpLoadStudent(){
  const all=await ttpStuAll();
  const clsSet={};all.forEach(s=>{clsSet[`${s.grade}-${s.class_num}`]=1;});
  ttpStuClassList=Object.keys(clsSet).sort((a,b)=>{const[ag,ac]=a.split('-').map(Number),[bg,bc]=b.split('-').map(Number);return ag-bg||ac-bc;});
  if(!ttpStuClassList.length){ttpStuInClass=[];return{empty:true};}
  let key=localStorage.getItem('ttpStuCls');
  if(!ttpStuClassList.includes(key)){const gc=getMyGradeClass();key=gc&&ttpStuClassList.includes(`${gc.grade}-${gc.cls}`)?`${gc.grade}-${gc.cls}`:ttpStuClassList[0];}
  localStorage.setItem('ttpStuCls',key);
  const[g,c]=key.split('-').map(Number);
  ttpStuInClass=all.filter(s=>s.grade===g&&s.class_num===c).sort((a,b)=>a.no.localeCompare(b.no));
  let st=ttpStuInClass.find(s=>s.no===ttpStudentNo)||ttpStuInClass[0];
  ttpStudentNo=st.no;

  const map={};
  for(const d of TT_DOWS)for(let p=1;p<=7;p++){
    const k=`${d}-${p}`,sc=st.cells[k];
    if(sc&&sc.subject){map[k]={subject:sc.subject,sub:sc.room||'',elective:true};continue;}

    if(cc&&cc.subject&&!ttpIsElective(cc.subject))map[k]={subject:cc.subject,sub:cc.sub||''};

    const whoCnt=new Set(all.map(c=>c.who)).size;
    const unit=kind==='teacher'?'선생님':'반';
    if(!confirm(`${unit} ${whoCnt}${kind==='teacher'?'명':'개'}, 총 ${all.length}칸을 읽었어요. 저장할까요?\n(같은 ${unit}의 해당 요일 시간표는 새 내용으로 바뀌어요)${failed.length?'\n\n읽지 못한 파일:\n'+failed.join('\n'):''}`))return;
    try{
      ttpToast('저장 중...');
      await ttpSaveAiCells(kind,all);
      ttpToast(`${unit} ${whoCnt}${kind==='teacher'?'명':'개'} 시간표를 저장했어요`,true);

  }else if(bad.length){alert(`읽을 수 없는 파일이에요: ${bad.join(', ')}`);}
}

function ttpSavePeriods(){

async function ttpSaveNotify(){
  const on=document.getElementById('ttpNsOn').checked;
  const min=parseInt(document.getElementById('ttpNsMin').value)||5;
  if(on&&('Notification' in window)&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}
  localStorage.setItem('ttNotify',JSON.stringify({on,min}));
  document.getElementById('mcConfirm')?.remove();
  if(on){await ttpEnsureNotifyCache(true);if(('Notification' in window)&&Notification.permission==='granted')new Notification('시간표 알림이 켜졌어요',{body:`수업 시작 ${min}분 전에 알려드릴게요`});}
}
async function ttpEnsureNotifyCache(force){
  if(ttpNotifyCache&&!force)return;
  if(!user||!profile?.name)return;
  const{data}=await sb.from('staff_timetable').select('*').eq('user_id',user.id).eq('teacher_name',profile.name);
  ttpNotifyCache={};
  (data||[]).forEach(r=>{ttpNotifyCache[`${r.dow}-${r.perio}`]={subject:r.subject||'',sub:r.room||''};});
}
async function ttpNotifyTick(){
  const cfg=getTtNotify();
  if(!cfg.on||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date();const dow=now.getDay();if(dow<1||dow>5)return;
  await ttpEnsureNotifyCache(false);if(!ttpNotifyCache)return;
  const nowMin=now.getHours()*60+now.getMinutes();
  const dateKey=now.toISOString().slice(0,10);
  for(let p=1;p<=7;p++){
    const cell=ttpNotifyCache[`${dow}-${p}`];if(!cell||!cell.subject)continue;
    const[h,mm]=TT_PERIOD_TIMES[p].s.split(':').map(Number);
    const diff=h*60+mm-nowMin;
    if(diff>0&&diff<=cfg.min){
      let done;try{done=JSON.parse(localStorage.getItem('ttNotified')||'null');}catch(e){}
      if(!done||done.d!==dateKey)done={d:dateKey,p:[]};
      if(done.p.includes(p))continue;
      done.p.push(p);localStorage.setItem('ttNotified',JSON.stringify(done));
      new Notification(`${diff}분 뒤 ${p}교시 수업`,{body:`${cell.sub?cell.sub+' · ':''}${cell.subject} (${TT_PERIOD_TIMES[p].s}~${TT_PERIOD_TIMES[p].e})`});
    }
  }
}

// ===== 교사 시간표 엑셀 업로드 (시트 1개 = 선생님 1명) =====
const DOW_CHAR_TO_NUM={'월':1,'화':2,'수':3,'목':4,'금':5};

function parseTtCell(raw){
  const s=String(raw||'').trim();
  if(!s)return null;
  const m=s.match(/^(\d{3})(.*)$/); // 앞 3자리 숫자 = 교실, 나머지 = 과목
  if(m)return{room:m[1],subject:m[2].trim()};
  return{room:'',subject:s};
}

// ===== 반 시간표 엑셀 업로드 (행=교실번호(학년+반), 열=교시, 요일별 파일) =====
function importClassTimetableExcel(inp){
  const files=Array.from(inp.files||[]);if(!files.length)return;
  let done=0,totalClasses=new Set(),totalCells=0,failed=[],totalTeachersFound=0,teacherColumnMissing=false;
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1});
        const hdIdx=rows.findIndex(r=>r.some(c=>String(c||'')==='학년'));
        if(hdIdx<0){failed.push(f.name);done++;checkDone();return;}
        const dayRow=rows[hdIdx],perioRow=rows[hdIdx+1];
        const cols=[];let lastDow=null;
        const totalCols=Math.max(dayRow.length,perioRow.length);
        for(let c=2;c<totalCols;c++){
          const raw=dayRow[c];
          if(raw){const m=String(raw).match(/[월화수목금]/);if(m)lastDow=DOW_CHAR_TO_NUM[m[0]];}
          cols.push({dow:lastDow,perio:parseInt(perioRow[c])||null});
        }
        const dataStart=hdIdx+2;
        const inserts=[];
        const classesTouched=new Set();
        const dowsTouched=new Set();
        let lastGrade=null;
        for(let r=dataStart;r<rows.length;r++){
          const row=rows[r];if(!row)continue;
          const gradeRaw=row[0];
          if(gradeRaw!==undefined&&gradeRaw!==null&&gradeRaw!=='')lastGrade=parseInt(gradeRaw)||lastGrade;
          const grade=lastGrade,classNum=parseInt(row[1]);
          if(!grade||!classNum)continue;
          classesTouched.add(`${grade}-${classNum}`);
          for(let ci=0;ci<cols.length;ci++){
            const{dow,perio}=cols[ci];
            if(!dow||!perio)continue;
            dowsTouched.add(dow);
            const cellRaw=row[ci+2];
            if(cellRaw===undefined||cellRaw===null||cellRaw==='')continue;
            const normalized=String(cellRaw).replace(/_x000[AD]_/gi,'\n').replace(/\r\n|\r|\u2028|\u2029/g,'\n');
            const lines=normalized.split('\n').map(s=>s.trim()).filter(Boolean);
            const subject=lines[0]||'';
            const teacher=lines[1]||'';
            if(subject){
              const cell={user_id:user.id,grade,class_num:classNum,dow,perio,subject};
              if(teacher){cell.teacher=teacher;totalTeachersFound++;}
              inserts.push(cell);
            }
          }
        }
        for(const key of classesTouched){
          const[grade,classNum]=key.split('-');
          for(const dow of dowsTouched){
            await sb.from('class_timetable').delete().eq('user_id',user.id).eq('grade',grade).eq('class_num',classNum).eq('dow',dow);
          }
        }
        if(inserts.length){
          let{error}=await sb.from('class_timetable').insert(inserts);
          if(error&&/teacher/i.test(error.message||'')){
            teacherColumnMissing=true;
            const stripped=inserts.map(r=>{const{teacher,...rest}=r;return rest;});
            ({error}=await sb.from('class_timetable').insert(stripped));
          }
          if(!error){totalCells+=inserts.length;classesTouched.forEach(k=>totalClasses.add(k));}else failed.push(f.name);
        }
      }catch(err){failed.push(f.name);}
      done++;checkDone();
    };
    reader.readAsArrayBuffer(f);
  });
  function checkDone(){
    if(done<files.length)return;
    inp.value='';
    const teacherMsg=teacherColumnMissing
      ?`\n교사명 인식: ${totalTeachersFound}개 (⚠️ DB에 teacher 컬럼이 없어서 저장은 안 됐어요)`
      :`\n교사명 인식: ${totalTeachersFound}개`;
    alert(`완료: 반 ${totalClasses.size}개, 총 ${totalCells}칸 업로드됨${teacherMsg}${failed.length?`\n실패: ${failed.join(', ')}`:''}`);
    onGradeTimetableSelChange();
  }
}

function importTeacherTimetableExcel(inp){
  const files=Array.from(inp.files||[]);if(!files.length)return;
  let done=0,totalTeachers=new Set(),totalCells=0,failed=[];
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary'});
        const sheetName=wb.SheetNames[0];
        const ws=wb.Sheets[sheetName];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1});
        // 요일 판별: 시트 이름 괄호 안 글자 → 실패시 파일명 → 실패시 시트 전체에서 검색
        let dow=null;
        const dowMatch=(sheetName.match(/\(([일월화수목금토])\)/)||[])[1]||(f.name.match(/[일월화수목금토]/)||[])[0];
        if(dowMatch)dow=DOW_CHAR_TO_NUM[dowMatch];
        if(!dow){alert(`"${f.name}"에서 요일을 찾지 못했어요. 시트 이름에 (월) 같은 표시가 있는지 확인해줘.`);done++;checkDone();return;}
        const headerIdx=rows.findIndex(r=>r.some(c=>String(c||'').includes('교사명')));
        if(headerIdx<0){failed.push(f.name);done++;checkDone();return;}
        const header=rows[headerIdx];
        const nameCol=header.findIndex(c=>String(c||'').includes('교사명'));
        const numCol=header.findIndex(c=>String(c||'').includes('순'));
        const perioCols=[];
        for(let p=1;p<=7;p++){
          const idx=header.findIndex(c=>String(c||'')===`${p}교시`);
          perioCols.push(idx);
        }
        const inserts=[];
        const teacherNamesToday=new Set();
        for(let r=headerIdx+1;r<rows.length;r++){
          const row=rows[r];if(!row)continue;
          const teacherName=String(row[nameCol]||'').trim();
          if(!teacherName)continue;
          teacherNamesToday.add(teacherName);
          const teacherNum=numCol>=0&&row[numCol]!==undefined?parseInt(row[numCol])||null:null;
          for(let p=1;p<=7;p++){
            const colIdx=perioCols[p-1];if(colIdx<0)continue;
            const cell=parseTtCell(row[colIdx]);
            if(cell)inserts.push({user_id:user.id,teacher_name:teacherName,dow,perio:p,subject:cell.subject,room:cell.room,teacher_num:teacherNum});
          }
        }
        // 이 요일(dow)에 해당하는 기존 데이터만 지우고 새로 채움 (다른 요일 데이터는 유지)
        for(const tn of teacherNamesToday){
          await sb.from('staff_timetable').delete().eq('user_id',user.id).eq('teacher_name',tn).eq('dow',dow);
          tn.length&&totalTeachers.add(tn);
        }
        if(inserts.length){
          const{error}=await sb.from('staff_timetable').insert(inserts);
          if(!error)totalCells+=inserts.length;else failed.push(f.name);
        }
      }catch(err){failed.push(f.name);}
      done++;checkDone();
    };
    reader.readAsBinaryString(f);
  });
  function checkDone(){
    if(done<files.length)return;
    inp.value='';
    alert(`완료: 선생님 ${totalTeachers.size}명, 총 ${totalCells}칸 업로드됨${failed.length?`\n실패: ${failed.join(', ')}`:''}`);
    ttpRoomTeacher=null;loadMyTimetableGrid();
  }
}

// ===== 학년별 시간표 (NEIS, 오늘) =====
async function fetchWeekTimetableFor(grade,cls){
  if(!neisApiKey)return{error:'설정에서 NEIS 인증키를 입력해 주세요'};
  try{
    const{ofcdc,schul}=await resolveNeisSchool();
    const{ay,sem}=neisSemInfo();
    const now=new Date();
    const dow0=now.getDay();
    const diffToMon=dow0===0?-6:1-dow0;
    const monday=new Date(now);monday.setDate(now.getDate()+diffToMon);
    const friday=new Date(monday);friday.setDate(monday.getDate()+4);
    const fromYmd=neisYmd(monday),toYmd=neisYmd(friday);
    const url=`https://open.neis.go.kr/hub/hisTimetable?KEY=${encodeURIComponent(neisApiKey)}&Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=${ofcdc}&SD_SCHUL_CODE=${schul}&AY=${ay}&SEM=${sem}&GRADE=${grade}&CLASS_NM=${cls}&TI_FROM_YMD=${fromYmd}&TI_TO_YMD=${toYmd}`;
    const res=await fetch(url);const data=await res.json();
    if(data?.RESULT&&data.RESULT.CODE!=='INFO-000')return{rows:[]};
    return{rows:data?.hisTimetable?.[1]?.row||[]};
  }catch(e){return{error:e.message||'시간표를 불러오지 못했어요'};}
}

function ymdToDow(ymd){

async function onGradeTimetableSelChange(){
  if(typeof ttpReloadIfMounted==='function')ttpReloadIfMounted();
  const g=document.getElementById('gtGrade')?.dataset.value,c=document.getElementById('gtClass')?.dataset.value;
  if(!g||!c)return;
  localStorage.setItem('gtGrade',g);localStorage.setItem('gtClass',c);
  const box=document.getElementById('gradeTimetableBox');if(!box)return;
  box.innerHTML='<p style="font-size:12px;color:#bbb;">불러오는 중...</p>';
  const box2b=document.getElementById('gradeTimetableBox');if(!box2b)return;
  // 1) 업로드된 반시간표(class_timetable)가 있으면 그걸 우선 사용
  const{data:uploaded}=await sb.from('class_timetable').select('*').eq('user_id',user.id).eq('grade',g).eq('class_num',c);
  const map={};
  let hasUploaded=false;
  if(uploaded&&uploaded.length){
    hasUploaded=true;
    uploaded.forEach(r=>{map[`${r.dow}-${r.perio}`]={subject:r.subject||'',teacher:r.teacher||''};});
  }else{
    // 2) 없으면 NEIS 주간조회로 폴백
    const{rows,error}=await fetchWeekTimetableFor(g,c);
    const box2=document.getElementById('gradeTimetableBox');if(!box2)return;
    if(error){box2.innerHTML=`<p style="font-size:12px;color:#bbb;">${error}</p>`;return;}
    (rows||[]).forEach(r=>{
      const dow=ymdToDow(r.ALL_TI_YMD);
      if(dow<1||dow>5)return;
      map[`${dow}-${r.PERIO}`]={subject:r.ITRT_CNTNT||'',teacher:''};
    });
  }
  const box2=document.getElementById('gradeTimetableBox');if(!box2)return;
  let html='<div class="tt-hd"></div>'+TT_DOWS.map(d=>`<div class="tt-hd">${TT_DOW_LABEL[d]}</div>`).join('');
  for(let p=1;p<=7;p++){

const SB_ICON_DEFAULT_ORDER=["export", "upload", "delete", "review", "search"];
function getSbIconOrder(){
  try{
    const saved=JSON.parse(localStorage.getItem('sbIconOrder')||'null');
    if(Array.isArray(saved)&&saved.length){
      // 저장된 순서 + 혹시 새로 추가된 아이콘은 뒤에 붙임
      const merged=[...saved.filter(id=>SB_ICON_HTML[id])];
      SB_ICON_DEFAULT_ORDER.forEach(id=>{if(!merged.includes(id))merged.push(id);});
      return merged;
    }
  }catch(e){}
  return [...SB_ICON_DEFAULT_ORDER];
}
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.().catch(()=>{});
  }
}

function renderSbIcons(){
  const el=document.getElementById('sbIconRow');if(!el)return;
  const order=getSbIconOrder();
  el.innerHTML=order.map(id=>SB_ICON_HTML[id]||'').join('');
}
let sbIconDragSrc=null;
function sbIconDragStart(e){
  sbIconDragSrc=e.currentTarget.dataset.iconId;
  e.dataTransfer.effectAllowed='move';
}
function sbIconDrop(e){
  e.preventDefault();
  const targetId=e.currentTarget.dataset.iconId;
  if(!sbIconDragSrc||sbIconDragSrc===targetId)return;
  const order=getSbIconOrder();
  const from=order.indexOf(sbIconDragSrc);
  const to=order.indexOf(targetId);
  if(from<0||to<0)return;
  order.splice(from,1);
  order.splice(to,0,sbIconDragSrc);
  localStorage.setItem('sbIconOrder',JSON.stringify(order));
  sbIconDragSrc=null;
  renderSbIcons();
}

let dragSrcIdx=null;
function onClsDragStart(e,idx){dragSrcIdx=idx;e.dataTransfer.effectAllowed='move';}
function onClsDragOver(e,idx){
  e.preventDefault();e.dataTransfer.dropEffect='move';
  if(dragSrcIdx===idx)return;
  document.querySelectorAll('.cls-row').forEach((el,i)=>{
    el.style.borderTop=i===idx&&dragSrcIdx!==idx?'2px solid #378ADD':'';
  });
}
function onClsDragLeave(e){
  document.querySelectorAll('.cls-row').forEach(el=>el.style.borderTop='');
}
function onClsDrop(e,idx){
  e.preventDefault();
  document.querySelectorAll('.cls-row').forEach(el=>el.style.borderTop='');
  if(dragSrcIdx===null||dragSrcIdx===idx)return;
  const moved=classes.splice(dragSrcIdx,1)[0];
  classes.splice(idx,0,moved);
  dragSrcIdx=null;
  renderSb();
}

// 참고자료(refs) 일괄 삭제 — 기존 생기부 파일, 우수사례, 탭별/전체 공통파일은 건드리지 않음.
// 6개 탭(haengdong/setech/jayul/dongari/jinro/dokseo) × 해당 반 학생 전체를 IndexedDB에서 훑어서
// refs 배열만 비우고 나머지(old, example, verifiedContent 등)는 그대로 둠.
const BULK_TAB_IDS=['haengdong','setech','jayul','dongari','jinro','dokseo'];
async function openBulkRefDelete(clsName,preMode){
  closeCtxMenu();
  const c=classes.find(c=>c.name===clsName);if(!c)return;
  // 새 통합 삭제 모달에서 mode를 미리 받은 경우 바로 실행
  if(preMode){
    const label=preMode==='formrefs'?'폼 응답':preMode==='refs'?'참고자료 전체':preMode==='memo'?'메모':'참고자료 전체 + 메모';
    if(!confirm(`'${clsName}' 반 전체 학생의 ${label}를 삭제할까요? 되돌릴 수 없습니다.`))return;
    await runBulkRefDeleteDirect(clsName,preMode);
    return;
  }
  // 기존 컨텍스트 메뉴에서 직접 호출된 경우 기존 모달 표시
  const d=document.createElement('div');d.className='modal-bg';d.id='mc';d.onclick=e=>{if(e.target===d)closeModal();};
  d.innerHTML=`<div class="modal" style="max-width:460px;"><h3>📁 일괄 삭제</h3>
    <p style="font-size:13px;color:#666;margin-bottom:12px;">'${clsName}' 반 전체 학생에게 적용됩니다.</p>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="radio" name="bulkDelMode" value="formrefs" checked> 폼 응답만</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="radio" name="bulkDelMode" value="refs"> 참고자료 전체</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="radio" name="bulkDelMode" value="memo"> 메모만</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="radio" name="bulkDelMode" value="both"> 참고자료 전체 + 메모 모두</label>
    </div>
    <div class="modal-btns"><button onclick="closeModal()">취소</button><button class="ok danger" onclick="runBulkRefDelete('${clsName}')">삭제</button></div>
  </div>`;
  document.getElementById('app').appendChild(d);
}
async function runBulkRefDelete(clsName){
  const mode=document.querySelector('input[name="bulkDelMode"]:checked')?.value||'refs';
  const label=mode==='formrefs'?'폼 응답':mode==='refs'?'참고자료 전체':mode==='memo'?'메모':'참고자료 전체 + 메모';
  if(!confirm(`'${clsName}' 반 전체 학생의 ${label}를 삭제할까요? 되돌릴 수 없습니다.`))return;
  closeModal();
  await runBulkRefDeleteDirect(clsName,mode);
}
async function runBulkRefDeleteDirect(clsName,mode){
  const c=classes.find(x=>x.name===clsName);if(!c)return;
  const label=mode==='formrefs'?'폼 응답':mode==='refs'?'참고자료 전체':mode==='memo'?'메모':'참고자료 전체 + 메모';
  for(const s of c.students){
    // 참고자료 삭제 (전체 or 폼응답만)
    if(mode==='refs'||mode==='both'||mode==='formrefs'){
      for(const tabId of BULK_TAB_IDS){
        try{
          const v=await idbGet(`files_${s.id}_${tabId}`);
          if(v&&Array.isArray(v.refs)&&v.refs.some(r=>r)){
            if(mode==='formrefs'){
              // 폼 응답(type=text)만 null로
              v.refs=v.refs.map(r=>r&&r.type==='text'?null:r);
            } else {
              v.refs=[];
            }
            await idbSet(`files_${s.id}_${tabId}`,v);
          }
        }catch(e){}
      }
      await refreshStudentFileFlag(s.id);
      if(mode==='formrefs'){formResponseIds.delete(String(s.id));}
    }
    // 메모 삭제
    if(mode==='memo'||mode==='both'){
      // 행동특성 메모
      s.memo='';
      await sb.from('students').update({memo:''}).eq('id',s.id);
      // 세특 메모
      try{
        const setech=JSON.parse(s.setech||'{}');
        Object.keys(setech).forEach(sub=>{if(setech[sub])setech[sub].memo='';});
        s.setech=JSON.stringify(setech);
        await sb.from('students').update({setech:s.setech}).eq('id',s.id);
      }catch(e){}
      // 창의적 체험활동 메모
      try{
        const changye=JSON.parse(s.changye||'{}');
        ['jayul','dongari','jinro','dokseo'].forEach(tab=>{if(changye[tab])changye[tab].memo='';});
        s.changye=JSON.stringify(changye);
        await sb.from('students').update({changye:s.changye}).eq('id',s.id);
      }catch(e){}
    }
  }
  if(mode==='formrefs')localStorage.setItem(FORM_RESP_KEY,JSON.stringify([...formResponseIds]));
  closeModal();
  renderSb();
  if(getStu())restoreStoredFiles();
  if(getStu())renderMain();
  alert(`${label} 일괄 삭제가 완료됐어요.`);
}

async function doEditStu(stuId){

  await sb.from('students').update({name,number:num}).eq('id',stuId);

async function deleteStu(stuId){

// 대시보드 위젯 설정 (localStorage에 저장)
// ===== NEIS 공개 API 연동 (오늘 시간표 / 이번달 학사일정) =====
function getMyGradeClass(){
  const m=(profile.role||'').match(/(\d)\s*학년\s*(\d+)\s*반/);
  return m?{grade:m[1],cls:m[2]}:null;
}

function neisSemInfo(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth()+1;
  const ay=m>=3?y:y-1;const sem=(m>=3&&m<=8)?1:2;
  return {ay,sem};
}
function neisYmd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}

async function resolveNeisSchool(){
  if(neisOfcdc&&neisSchul)return{ofcdc:neisOfcdc,schul:neisSchul};
  if(!neisApiKey)throw new Error('설정에서 NEIS 인증키를 먼저 입력해 주세요');
  if(!profile.school)throw new Error('설정에서 학교 이름을 먼저 입력해 주세요');
  const url=`https://open.neis.go.kr/hub/schoolInfo?KEY=${encodeURIComponent(neisApiKey)}&Type=json&pIndex=1&pSize=5&SCHUL_NM=${encodeURIComponent(profile.school)}`;
  const res=await fetch(url);
  const data=await res.json();
  const row=data?.schoolInfo?.[1]?.row?.[0];
  if(!row)throw new Error('NEIS에서 학교 정보를 찾지 못했어요 (학교 이름 확인)');
  neisOfcdc=row.ATPT_OFCDC_SC_CODE;neisSchul=row.SD_SCHUL_CODE;
  neisSchoolAddr=row.ORG_RDNM||row.ADRES||'';
  localStorage.setItem('neisOfcdc',neisOfcdc);localStorage.setItem('neisSchul',neisSchul);
  localStorage.setItem('neisSchoolAddr',neisSchoolAddr);
  return{ofcdc:neisOfcdc,schul:neisSchul};
}
function resetNeisSchoolCache(){
  neisOfcdc='';neisSchul='';neisSchoolAddr='';
  localStorage.removeItem('neisOfcdc');localStorage.removeItem('neisSchul');localStorage.removeItem('neisSchoolAddr');
  localStorage.removeItem('kmaAutoLat');localStorage.removeItem('kmaAutoLon');
  kmaAutoLat='';kmaAutoLon='';
}

async function fetchTodayTimetable(){
  if(!neisApiKey)return{error:'설정에서 NEIS 인증키를 입력해 주세요'};
  const gc=getMyGradeClass();
  if(!gc)return{error:'프로필의 "역할"에 학년/반을 적어주세요 (예: 2학년 4반 담임)'};
  try{
    const{ofcdc,schul}=await resolveNeisSchool();
    const{ay,sem}=neisSemInfo();
    const today=neisYmd(new Date());
    const url=`https://open.neis.go.kr/hub/hisTimetable?KEY=${encodeURIComponent(neisApiKey)}&Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=${ofcdc}&SD_SCHUL_CODE=${schul}&AY=${ay}&SEM=${sem}&GRADE=${gc.grade}&CLASS_NM=${gc.cls}&ALL_TI_YMD=${today}`;
    const res=await fetch(url);
    const data=await res.json();
    if(data?.RESULT&&data.RESULT.CODE!=='INFO-000')return{rows:[]};
    const rows=(data?.hisTimetable?.[1]?.row||[]).slice().sort((a,b)=>parseInt(a.PERIO)-parseInt(b.PERIO));
    return{rows};
  }catch(e){return{error:e.message||'시간표를 불러오지 못했어요'};}
}


let _dashTimetableFetching=false;
async function loadDashTimetable(){
  const box=document.getElementById('dashTimetableBox');if(!box)return;
  if(_dashTimetableFetching)return; // 이전 요청이 아직 안 끝났으면 겹쳐서 또 부르지 않음
  _dashTimetableFetching=true;
  let rows,error;
  try{ ({rows,error}=await fetchTodayTimetable()); }
  finally{ _dashTimetableFetching=false; }
  const box2=document.getElementById('dashTimetableBox');if(!box2)return; // 그 사이 다른 화면으로 이동했으면 중단
  if(error){box2.innerHTML=`<p style="font-size:12px;color:#bbb;">${error}</p>`;return;}
  if(!rows.length){box2.innerHTML=`<p style="font-size:12px;color:#bbb;">오늘은 시간표 정보가 없어요 (주말·방학 등)</p>`;return;}
  box2.innerHTML=rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 9px;background:#f8f8ff;border-radius:7px;margin-bottom:4px;">
    <span style="font-size:11px;font-weight:700;color:#378ADD;width:32px;flex-shrink:0;">${r.PERIO}교시</span>
    <span style="font-size:12px;flex:1;">${r.ITRT_CNTNT||''}</span>
  </div>`).join('');
}
// 대시보드가 켜져있는 동안 1분마다 오늘 시간표를 다시 불러와서, 학교가 나이스에 교체수업 등을
// 새로 입력하면 새로고침 없이도 반영되게 함 (대시보드 화면이 아니면 loadDashTimetable이 알아서 건너뜀)
if(!window._dashTimetableIntervalBound){
  window._dashTimetableIntervalBound=true;
  setInterval(loadDashTimetable,60000);
}

async function addReviewFile(file){
  const isPptx=/\.pptx$/i.test(file.name);
  const isTxt=/\.txt$/i.test(file.name);
  const isLegacyPpt=/\.ppt$/i.test(file.name)&&!isPptx;
  if(isLegacyPpt){alert('구버전 .ppt는 지원하지 않아요. .pptx로 다시 저장한 후 올려주세요.');return;}
  try{
    let fileData;
    if(isPptx){
      const extractedText=await extractPptxText(file);
      fileData={name:file.name,type:'pptx',extractedText,id:Date.now()};
    }else if(isTxt){
      const extractedText=await file.text();
      fileData={name:file.name,type:'txt',extractedText,id:Date.now()};
    }else{
      const base64=await fileToBase64(file);
      fileData={name:file.name,base64,type:file.type||'application/pdf',id:Date.now()};
    }
    reviewFiles.push(fileData);
    await persistReviewFiles();
    renderReviewFileList();
  }catch(e){alert('파일 읽기 실패: '+(e.message||''));}
}

async function persistReviewFiles(){
  try{await idbSet('reviewFiles_global',reviewFiles);}catch(e){console.warn('저장 공간 초과:',e);}
}
async function loadReviewFiles(){
  try{
    const stored=await idbGet('reviewFiles_global');
    if(stored){reviewFiles.length=0;stored.forEach(f=>reviewFiles.push(f));}
  }catch(e){}
}

function removeReviewFile(id){
  const idx=reviewFiles.findIndex(f=>f.id===id);
  if(idx>-1)reviewFiles.splice(idx,1);
  persistReviewFiles();
  renderReviewFileList();
}

  try{

let pendingHighlight=null;
function jumpToSearchResult(stuId,clsName,tab,subject,word){
  selCls=clsName;selStu=stuId;selTab=tab;
  if(tab==='setech'&&subject)selSubject=subject;
  pendingHighlight=word?{word}:null;
  renderSb();renderMain();
  setTimeout(applyPendingHighlight,80);
}
// 검색으로 찾은 표현을 결과 칸에서 잠깐 선택 표시(형광펜 느낌)해줌. 마감/평소 열람 시엔 아무 표시도 안 남음.
function applyPendingHighlight(){
  if(!pendingHighlight)return;
  const word=pendingHighlight.word;
  pendingHighlight=null;
  const ta=document.getElementById('tabResArea')||document.getElementById('resArea');
  if(!ta||!word)return;
  const norm=s=>(s||'').replace(/\s+/g,' ');
  const hay=ta.value;
  const hayNorm=norm(hay);
  // 1) 완전일치 시도 2) 공백 정규화 후 시도 3) 앞부분만 점점 줄여가며 시도 (AI가 살짝 다르게 인용했을 경우 대비)
  let idx=hay.indexOf(word);
  let matchLen=word.length;
  if(idx<0){
    const wNorm=norm(word);
    idx=hayNorm.indexOf(wNorm);
    matchLen=wNorm.length;
  }
  if(idx<0){
    for(const len of [15,10,6]){
      const head=norm(word).slice(0,len);
      if(head.length<len)continue;
      idx=hayNorm.indexOf(head);
      if(idx>=0){matchLen=head.length;break;}
    }
  }
  if(idx<0)return;
  ta.focus();
  ta.setSelectionRange(idx,idx+matchLen);
  const before=hay.slice(0,idx);
  const approxLine=before.split('\n').length;
  ta.scrollTop=Math.max(0,(approxLine-3)*20);
}

// ←(이전)/→(다음) 화살표로 지금 반 안에서 학생 간 이동. 사이드바에 보이는 순서(검색 중이면 검색 결과 순서)를 그대로 따름.
function navigateStudent(dir){
  const c=classes.find(c=>c.name===selCls);
  if(!c)return;
  const q=(searchQ||'').toLowerCase();
  const stus=q?c.students.filter(s=>s.name.includes(q)):c.students;
  if(!stus.length)return;
  const idx=stus.findIndex(s=>s.id===selStu);
  const newIdx=idx<0?0:idx+dir;
  if(newIdx<0||newIdx>=stus.length)return; // 첫/마지막 학생에서는 그냥 멈춤
  selStudent(stus[newIdx].id);
  setTimeout(()=>{document.querySelector('.stu-row.active')?.scrollIntoView({block:'nearest'});},0);
}
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const tag=(document.activeElement?.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||document.activeElement?.isContentEditable)return; // 텍스트 입력 중엔 커서 이동이 우선
  if(document.getElementById('mc'))return; // 모달 열려있을 땐 학생 이동 안 함
  if(!selCls)return;
  e.preventDefault();
  navigateStudent(e.key==='ArrowLeft'?-1:1);
});

async function addCommonFile(stuId,file){
  const files=getCommonFiles(stuId);
  if(files.length>=10){alert('최대 10개까지 업로드 가능해요.');return;}
  const isPptx=/\.pptx$/i.test(file.name);
  const isTxt=/\.txt$/i.test(file.name);
  const isLegacyPpt=/\.ppt$/i.test(file.name)&&!isPptx;
  if(isLegacyPpt){alert('구버전 .ppt는 지원하지 않아요. .pptx로 다시 저장한 후 올려주세요.');return;}
  try{
    let fileData;
    if(isPptx){
      const extractedText=await extractPptxText(file);
      fileData={name:file.name,type:'pptx',extractedText,id:Date.now()};
    }else if(isTxt){
      const extractedText=await file.text();
      fileData={name:file.name,type:'txt',extractedText,id:Date.now()};
    }else{
      const base64=await fileToBase64(file);
      fileData={name:file.name,base64,type:file.type||'application/pdf',id:Date.now()};
    }
    files.push(fileData);
    await persistCommonFiles(stuId);
    renderCommonFileList(stuId);
  }catch(e){alert('파일 읽기 실패: '+(e.message||''));}
}

// ===== 과세특 정량평가 (시험 점수 기반 학업성취도, 5등급제) =====
function computeSetechGrade(label,studentId){
  const pool=[];
  allStudents().forEach(st=>{
    let setech={};try{setech=JSON.parse(st.setech||'{}');}catch(e){}
    const d=setech[label];
    if(d&&d.examScores&&d.examScores.s1!=null&&d.examScores.s2!=null){
      pool.push({id:st.id,total:d.examScores.s1+d.examScores.s2});
    }
  });
  if(!pool.length)return null;
  pool.sort((a,b)=>b.total-a.total);
  const n=pool.length;
  const idx=pool.findIndex(p=>p.id===studentId);
  if(idx===-1)return null;
  const rank=idx+1;
  const cum=[0.10,0.34,0.66,0.90,1.00].map(p=>Math.round(n*p));
  let grade=5;
  for(let i=0;i<cum.length;i++){if(rank<=cum[i]){grade=i+1;break;}}
  return{grade,rank,n,total:pool[idx].total};
}

const SETECH_SUBJECTS=['국어','수학','영어','사회','과학','역사','기술가정','체육','음악','미술','기타'];
// 설정에서 "가르치는 과목"을 직접 입력해두면(1~N개), 그게 세특 과목 목록 전체를 대체함(라벨만이 아니라
// 실제 저장 키 값도 그 이름이라 나이스 내보내기 등에서도 정확한 과목명이 그대로 쓰임). 아직 설정 안 했으면
// 일반적인 11개 과목 분류를 그대로 보여줌(첫 사용자 기본값).
function getEffectiveSetechSubjects(){
  return teacherSubjects.length?teacherSubjects:SETECH_SUBJECTS;
}
function getDefaultSubject(){
  return teacherSubjects[0]||'국어';
}
// 과목 설정을 바꾸면 예전 과목명(예: "사회")으로 저장된 세특 데이터가 화면 목록에서 안 보이게 될 수 있음.
// 데이터 자체는 지워지지 않고 그 키 그대로 DB에 남아있지만, "데이터가 사라졌다"는 착각을 주기 쉬워서
// 설정 저장 시마다 지금 과목 목록에 없는 키에 실제 내용이 남아있는지 확인해서 옮길 기회를 줌.
function findOrphanedSetechSubjects(currentSubjects){
  const counts={};
  allStudents().forEach(s=>{
    let d={};try{d=JSON.parse(s.setech||'{}');}catch(e){}
    Object.keys(d).forEach(key=>{
      if(currentSubjects.includes(key))return;
      const v=d[key]||{};
      const hasContent=(v.memo&&v.memo.trim())||(v.keywords&&v.keywords.length)||(v.result&&v.result.trim());
      if(hasContent)counts[key]=(counts[key]||0)+1;
    });
  });
  return Object.entries(counts).map(([subject,count])=>({subject,count})).sort((a,b)=>b.count-a.count);
}
// oldKey 밑에 있던 세특 데이터를 newKey로 옮김. newKey에 이미 데이터가 있으면 덮어쓰지 않고 병합
// (메모는 이어붙이고, 키워드는 합치고, 결과·예시·명령어는 비어있는 쪽만 채움).
async function migrateSetechSubject(oldKey,newKey){
  const targets=allStudents().filter(s=>{
    let d={};try{d=JSON.parse(s.setech||'{}');}catch(e){}
    return!!d[oldKey];
  });
  for(const s of targets){
    let d={};try{d=JSON.parse(s.setech||'{}');}catch(e){}
    const oldData=d[oldKey];
    if(!oldData||newKey===oldKey)continue;
    const existing=d[newKey];
    if(existing&&((existing.memo||'').trim()||existing.result||(existing.keywords||[]).length)){
      d[newKey]={
        memo:[existing.memo,oldData.memo].filter(Boolean).join('\n'),
        keywords:[...(existing.keywords||[]),...(oldData.keywords||[])],
        result:existing.result||oldData.result||'',
        example:existing.example||oldData.example||'',
        command:existing.command||oldData.command||''
      };
    }else{
      d[newKey]=oldData;
    }
    delete d[oldKey];
    s.setech=JSON.stringify(d);
    await sb.from('students').update({setech:s.setech}).eq('id',s.id);
  }
  renderSb();
  if(getStu())renderMain();
}

function parseJsonArrayLoose(raw){
  const s=raw.indexOf('['),e=raw.lastIndexOf(']');
  let clean=raw;
  if(s!==-1&&e!==-1&&e>s)clean=raw.slice(s,e+1);
  const parsed=JSON.parse(clean);
  if(!Array.isArray(parsed))throw new Error('not array');
  return parsed;
}

// 나이스 교과목별 일람표 PDF를 클라이언트에서 직접 파싱
async function extractScoreTable(){
  const files=scoreUploadState.files;
  if(files.length!==2){alert('1차·2차 PDF를 두 개 모두 올려주세요.');return;}
  const area=document.getElementById('scoreUploadArea');
  if(area)area.innerHTML='<p style="font-size:12px;color:#888;">⏳ 표를 읽는 중...</p>';
  try{
    if(typeof pdfjsLib==='undefined'){
      if(area)area.innerHTML='<p style="font-size:12px;color:#cf1322;">PDF 파서가 아직 로딩 중이에요. 잠시 후 다시 시도해 주세요.</p>';
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    // x좌표 기반 열 구분으로 빈 칸(결시/전출 등)을 정확히 처리
    const parsePdf=async(file)=>{
      const buf=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      // 모든 아이템을 y좌표 그룹으로 묶기 (여러 페이지 합산)
      const byY={};
      let fullText='';
      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const tc=await page.getTextContent();
        tc.items.forEach(item=>{
          fullText+=item.str+' ';
          const y=Math.round(item.transform[5]);
          if(!byY[y])byY[y]=[];
          byY[y].push({x:item.transform[4],str:item.str.trim()});
        });
      }
      const round_num=fullText.includes('1차')?1:fullText.includes('2차')?2:0;

      // 과목명 자동 감지: "교과목 : 사회..." 패턴에서 추출
      let detectedSubject=null;
      const subjectMatch=fullText.match(/교과목\s*:\s*([가-힣(]+)/);
      if(subjectMatch){
        const raw=subjectMatch[1];
        // SETECH_SUBJECTS 중 일치하는 것 찾기
        const SUBJECTS=['국어','수학','영어','사회','과학','역사','기술가정','체육','음악','미술'];
        detectedSubject=SUBJECTS.find(s=>raw.includes(s))||null;
      }

      // y 내림차순(위→아래)으로 행 정렬
      const sortedYs=Object.keys(byY).map(Number).sort((a,b)=>b-a);
      const rowsRaw=sortedYs.map(y=>byY[y].sort((a,b)=>a.x-b.x).filter(i=>i.str));

      // 반 헤더 행 찾기: 정수만 있고 1~9 범위, 2개 이상
      let banHeaders=[];
      let banHeaderXs=[];
      let dataYStart=null;
      for(let i=0;i<rowsRaw.length;i++){
        const strs=rowsRaw[i].map(c=>c.str);
        if(strs.length>=2&&strs.length<=8&&
           strs.every(s=>/^\d+$/.test(s))&&strs.every(s=>parseInt(s)>=1&&parseInt(s)<=9)){
          banHeaders=strs.map(Number);
          banHeaderXs=rowsRaw[i].map(c=>c.x);
          dataYStart=i+1;
          break;
        }
      }
      if(!banHeaders.length)return{round_num,banHeaders:[],rows:[]};

      // 각 반 열의 x범위: 헤더 x좌표 ± 허용 오차
      const colWidth=banHeaderXs.length>1?(banHeaderXs[1]-banHeaderXs[0]):40;
      const getColIdx=(x)=>{
        let best=-1,bestDist=Infinity;
        banHeaderXs.forEach((hx,i)=>{const d=Math.abs(x-hx);if(d<bestDist&&d<colWidth*0.7){bestDist=d;best=i;}});
        return best;
      };

      const rows=[];
      for(let i=dataYStart;i<rowsRaw.length;i++){
        const cells=rowsRaw[i];
        if(!cells.length)continue;
        // 첫 번째 셀이 번호(1~40 정수)인지 확인
        const hoStr=cells[0].str;
        const ho=parseInt(hoStr);
        if(!ho||ho<1||ho>40||isNaN(ho))continue;
        // 나머지 셀을 x좌표로 반 열에 매핑
        const scoreByCol={};
        cells.slice(1).forEach(cell=>{
          const col=getColIdx(cell.x);
          if(col>=0){
            const v=parseFloat(cell.str);
            if(!isNaN(v)&&v>=0&&v<=100)scoreByCol[col]=v;
            // 전출/결시/미인정결 등 비숫자는 무시 (점수 없음으로 처리)
          }
        });
        rows.push({ho,scoreByCol});
      }
      return{round_num,banHeaders,banHeaderXs,rows,detectedSubject};
    };

    if(area)area.innerHTML='<p style="font-size:12px;color:#888;">⏳ 1차 파일 읽는 중...</p>';
    const r1=await parsePdf(files[0]);
    if(area)area.innerHTML='<p style="font-size:12px;color:#888;">⏳ 2차 파일 읽는 중...</p>';
    const r2=await parsePdf(files[1]);

    // 과목명 자동 세팅 (둘 중 하나라도 감지되면 적용)
    const autoSubject=r1.detectedSubject||r2.detectedSubject;
    if(autoSubject&&autoSubject!==scoreUploadState.label){
      scoreUploadState.label=autoSubject;
      // UI 버튼도 갱신
      renderScoreSubjectBtns();
      if(area)area.innerHTML=`<p style="font-size:12px;color:#378ADD;">📌 PDF에서 과목 자동 감지: <b>${autoSubject}</b></p>`;
      await new Promise(r=>setTimeout(r,600));
    }

    const first=r1.round_num===1?r1:(r2.round_num===1?r2:r1);
    const second=r1.round_num===2?r1:(r2.round_num===2?r2:r2);

    const buildMap=(parsed,key)=>{
      const m=new Map();
      parsed.rows.forEach(({ho,scoreByCol})=>{
        Object.entries(scoreByCol).forEach(([col,val])=>{
          const ban=parsed.banHeaders[parseInt(col)];
          if(!ban)return;
          const k=`${ban}_${ho}`;
          const ex=m.get(k)||{ban,ho};
          ex[key]=val;
          m.set(k,ex);
        });
      });
      return m;
    };

    const m1=buildMap(first,'s1');
    const m2=buildMap(second,'s2');
    const allRows=[];
    m1.forEach((v,k)=>{const s2=m2.get(k);if(s2?.s2!=null)allRows.push({...v,s2:s2.s2});});

    if(!allRows.length){
      if(area)area.innerHTML='<p style="font-size:12px;color:#cf1322;">PDF 파싱 실패. API 키가 있다면 AI로 재시도해요.</p>';
      if(apiKey)await extractScoreTableByAI(files,area);
      return;
    }
    scoreUploadState.parsed=allRows;
    if(area)area.innerHTML=`<p style="font-size:12px;color:#389e0d;">✅ ${allRows.length}명 추출 완료</p>`;
    setTimeout(()=>renderBanMapping(),400);
  }catch(e){
    if(area)area.innerHTML='<p style="font-size:12px;color:#888;">⏳ 오류 발생, AI로 재시도 중...</p>';
    if(apiKey)await extractScoreTableByAI(files,area);
    else if(area)area.innerHTML=`<p style="font-size:12px;color:#cf1322;">오류: ${e.message}</p>`;
  }
}

      try{

// 학번 5자리(예: 20314) → {ban:3, ho:14}
function realBanHoFromStudentId(sid){
  const s=String(sid||'').replace(/\D/g,'');
  if(s.length!==5)return null;
  return{ban:parseInt(s[2]),ho:parseInt(s.slice(3))};
}

async function applyScoreUpload(){
  const{label,parsed}=scoreUploadState;
  const area=document.getElementById('scoreUploadArea');
  let matched=0;
  const unmatchedKeys=[];
  // 성적표 반·번호 → 학생 맵
  const stuMap=new Map();
  allStudents().forEach(s=>{
    const bh=realBanHoFromStudentId(s.student_id);
    if(bh)stuMap.set(`${bh.ban}_${bh.ho}`,s);
  });
  const targets=[];
  for(const row of parsed){
    const key=`${Number(row.ban)}_${Number(row.ho)}`;
    const st=stuMap.get(key);
    if(!st){unmatchedKeys.push(`${row.ban}반${row.ho}번`);continue;}
    targets.push({st,row});
  }
  for(let i=0;i<targets.length;i++){
    const{st,row}=targets[i];
    if(area)area.innerHTML=`<p style="font-size:12px;color:#888;">⏳ 저장 중... (${i+1}/${targets.length})</p>`;
    let setech={};try{setech=JSON.parse(st.setech||'{}');}catch(e){}
    setech[label]={...(setech[label]||{}),examScores:{s1:Number(row.s1),s2:Number(row.s2)}};
    st.setech=JSON.stringify(setech);
    await sb.from('students').update({setech:st.setech}).eq('id',st.id);
    matched++;
  }
  let html=`<p style="font-size:12px;color:${matched?'#389e0d':'#cf1322'};">${matched?'✅':'⚠️'} ${matched}명 반영 완료${unmatchedKeys.length?`, ${unmatchedKeys.length}명 매칭 실패`:''}</p>`;
  if(unmatchedKeys.length){
    html+=`<p style="font-size:11px;color:#cf1322;margin-top:4px;">매칭 실패 (성적표에만 있고 수강반 명단에 없거나 결시): ${unmatchedKeys.join(', ')}</p>`;
  }
  if(area)area.innerHTML=html;
  if(matched)showToast(`📊 ${matched}명의 학업 성취도가 계산됐어요`);
  setTimeout(()=>{closeModal();renderSb();renderMain();},2500);
}
