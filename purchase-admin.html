<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물품 신청</title>
<link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* 도구상자 › 물품 신청 (purchase-admin.html)
   - 신청 = 학습지 한 장: custom_html '<html data-sdt-src="/games/purchase.html">' (학생 화면은 games/purchase.html)
   - 품의 완료 = 연결 파일에 data-locked="1" → 학생은 고치기·취소 불가
   - 제출: worksheet_submissions.answers = {fields:{items}, rows:[{name,qty,unit,price,link,shop,ship}], total, cancelled} */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#fff;color:#1D1D1F;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-size:15px;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{display:flex;flex-wrap:wrap;min-height:100vh;align-items:stretch}
.side{flex:0 1 280px;min-width:240px;background:#F5F5F7;border-right:1px solid rgba(0,0,0,.08);padding:20px 14px 40px}
.main{flex:999 1 640px;min-width:0;padding:32px 40px 60px;max-width:1160px}
.newb{display:flex;align-items:center;gap:8px;height:44px;border:0;background:none;color:#0071E3;font-size:15px;font-weight:600;padding:0 4px}
.list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.li{position:relative;display:block;width:100%;text-align:left;padding:12px 44px 12px 14px;border-radius:12px;border:0;background:transparent}
.more{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;opacity:0}
.li:hover .more,.li.on .more{opacity:1}
.more:hover{background:rgba(0,0,0,.08)}.li.on .more:hover{background:rgba(255,255,255,.2)}
.pop{position:fixed;z-index:30;background:#fff;color:#1D1D1F;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;width:240px}
.pop button{display:block;width:100%;text-align:left;height:40px;padding:0 12px;border:0;background:none;border-radius:8px;font-size:15px}
.pop button:hover{background:#F2F2F7}
.pop button.red{color:#FF3B30}
.pop .tg{padding:6px 12px 8px}
.pop .tg div{font-size:12px;color:#8E8E93;margin-bottom:4px}
.pop select{width:100%;height:36px;border:1px solid #D2D2D7;border-radius:8px;font-size:14px;padding:0 8px;background:#fff}
.pop hr{border:0;height:1px;background:rgba(0,0,0,.08);margin:4px 6px}
.ttl{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;border:0;outline:0;background:transparent;padding:2px 6px;margin-left:-6px;border-radius:8px;width:100%;max-width:640px;font-family:inherit;color:#1D1D1F}
.ttl:hover{background:#F5F5F7}.ttl:focus{background:#F5F5F7;box-shadow:0 0 0 2px #0071E3}
.stu{display:grid;grid-template-columns:22px minmax(0,1fr) auto 120px 74px 14px;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 16px;border:0;background:none;text-align:left;font-size:16px;cursor:pointer}
.stu:hover{background:#FAFAFC}
.stu .c{color:#8E8E93;font-size:14px;white-space:nowrap}
.stu .a{text-align:right;font-weight:700;white-space:nowrap}
.stu svg{transition:transform .15s}.stu.open svg{transform:rotate(90deg)}
.stu .wn{color:#C93400;font-size:13px;margin-left:8px;font-weight:500}
.sub{background:#FAFAFC;border-top:1px solid rgba(60,60,67,.08)}
.sub{padding:0}
.head>div:first-child{flex:1;min-width:0}
.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;table-layout:fixed}
.tb th{font-size:12.5px;font-weight:600;color:#8E8E93;background:#FAFAFC;height:34px;padding:0 6px;text-align:center}
.tb td{height:40px;padding:4px 6px;text-align:center;word-break:break-all;background:#fff}
.tb th,.tb td{border-right:1px solid rgba(60,60,67,.12);border-bottom:1px solid rgba(60,60,67,.12)}
.tb th:last-child,.tb td:last-child{border-right:0}
.tb tfoot td{font-weight:800;height:42px;border-bottom:0;background:#FAFAFC}
.tb.out{border:1px solid rgba(60,60,67,.18);border-radius:12px;overflow:hidden}
.tb.flush{border-top:1px solid rgba(60,60,67,.12)}
.tb td.no{color:#8E8E93}
.tb td.nm a{color:#0071E3;text-decoration:none}.tb td.nm a:hover{text-decoration:underline}
.tb td.sp{color:#6E6E73;font-size:13.5px}
.tb td.am{font-weight:600}
.tb .w{display:block;font-size:12px;color:#C93400}
.sh{display:flex;justify-content:space-between;align-items:center;margin:24px 4px 8px;font-size:15px;font-weight:700}
.sh span{color:#6E6E73;font-weight:600}
.sh .r{display:flex;align-items:center;gap:12px}
.btn.sm{height:32px;padding:0 14px;font-size:13.5px}
.tb tr.in td{text-decoration:line-through;color:#AEAEB2}.tb tr.in td a{color:#AEAEB2}
.bar2 .cst{font-size:14px;font-weight:600;color:#0071E3;white-space:nowrap}.bar2 .cst.bad{color:#C93400}
.clog{margin:0 0 10px;border:1px solid rgba(60,60,67,.12);border-radius:12px;background:#FAFAFC;padding:8px 14px;font-size:13.5px;line-height:1.9;max-height:260px;overflow:auto}
.clog .ok{color:#1E7B34}.clog .bad{color:#C93400}.clog .ing{color:#0071E3}
.box{border:1px solid rgba(0,0,0,.1);border-radius:14px;overflow:hidden;margin-top:14px}
.box .bh{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 16px;font-size:14px;font-weight:700;background:#fff}
.box .bh span{color:#6E6E73;font-weight:600}
.doc{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.doc .fm{border:1px solid rgba(0,0,0,.1);border-radius:14px;overflow:hidden}
.doc .fm label{display:block;padding:10px 16px 0;font-size:12.5px;color:#8E8E93}
.doc .fm input{display:block;width:100%;border:0;outline:0;padding:4px 16px 12px;font-size:15px;background:none}
.doc .fm .sep{margin-left:16px}
.doc .pv{border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:22px 26px;background:#fff}
.doc .pv h2{font-size:17px;margin:0 0 14px;font-weight:800}
.doc .pv pre{margin:0;font-family:inherit;font-size:15px;line-height:1.9;white-space:pre-wrap}
.doc .cp{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.doc .meta{font-size:13px;color:#8E8E93;margin-bottom:10px}
@media(max-width:900px){.doc{grid-template-columns:1fr}}
.ck{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;border:1.5px solid #C7C7CC;background:#fff;color:#fff;font-size:13px;font-weight:800;cursor:pointer;padding:0}
.ck.on{background:#0071E3;border-color:#0071E3}
.pill{justify-self:center;text-align:center;min-width:64px;flex:none;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:#F2F2F7;color:#8E8E93;white-space:nowrap;border:0}
button.pill{cursor:pointer}button.pill:not(.ok):hover{box-shadow:0 0 0 2px #D2D2D7}
.btn.pg,.pill.pg{position:relative;cursor:pointer}
.pg .pgs{position:absolute;inset:0;display:flex;align-items:stretch;opacity:0;transform:translateY(3px);transition:opacity .18s,transform .18s;border-radius:inherit;overflow:hidden;background:rgba(29,29,31,.5);backdrop-filter:blur(1.5px)}
.pg .pgs b{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;white-space:nowrap;font-size:.92em;transition:background .15s,transform .15s}
.pg .pgs b:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}.pg .pgs b[data-pg=end]:hover{background:rgba(255,59,48,.55)}
.pg .pgs i{width:1px;margin:6px 0;background:rgba(255,255,255,.45)}
.pg .pgx{transition:opacity .18s}.pg:hover .pgx,.pg.paused .pgx{opacity:.3}.pg:hover .pgs,.pg.paused .pgs{opacity:1;transform:none}
.pill.pg{min-width:96px}.btn.pg{min-width:150px}
.pg:not(.paused)::after{content:'';position:absolute;top:0;bottom:0;left:0;width:var(--p,0%);border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:200% 100%;animation:pgShine 1.4s linear infinite}
@keyframes pgShine{from{background-position:150% 0}to{background-position:-50% 0}}
.pg.paused{filter:saturate(.6)}
.btn.pg,.pill.pg{background:linear-gradient(90deg,#0071E3 var(--p,0%),#9CC3F5 var(--p,0%))!important;color:#fff!important;opacity:1!important;font-variant-numeric:tabular-nums}
.pill.req{background:#0071E3;color:#fff}.pill.req:hover{background:#0077ED}.pill.req:disabled{opacity:.5;cursor:default}
.pill.ok{background:#E3F6E8;color:#1E7B34;cursor:pointer}.pill.ok:hover{box-shadow:0 0 0 2px #A7E3B6}
.nmi{border:0;background:transparent;font:inherit;color:inherit;padding:2px 6px;margin:-2px -6px;border-radius:7px;field-sizing:content;min-width:2em;max-width:100%;cursor:text}.nmi:hover{background:#ECECF0}.nmi:focus{outline:2px solid #0071E3;background:#fff}
.tb th .srt{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}.tb th .srt i{font-style:normal;font-size:10px;color:#AEAEB2}.tb th .srt.on i{color:#0071E3}
.bar2{display:flex;align-items:center;gap:14px;margin-top:20px;padding:10px 12px 10px 16px;background:#F5F5F7;border-radius:14px;flex-wrap:wrap}
.bar2 .sm{flex:1;display:flex;align-items:center;gap:10px;font-size:15px;color:#6E6E73;white-space:nowrap}
.bar2 .sm b{color:#1D1D1F;font-size:16px}.bar2 .sm i{width:1px;height:14px;background:#D2D2D7}
.stu.done>span:not(.pill){opacity:.55}
.li:hover{background:rgba(0,0,0,.05)}
.li.on{background:#0071E3;color:#fff}
.li.on span{color:rgba(255,255,255,.85)}
.li.on .dot{background:#fff}
.li.on .dot.gray{background:rgba(255,255,255,.5)}
.li b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li span{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:#6E6E73}
.dot{width:7px;height:7px;border-radius:4px;background:#34C759;flex:none}
.dot.gray{background:#C7C7CC}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
.head .sub{font-size:15px;color:#6E6E73;margin-top:4px}
.acts{display:flex;gap:8px;position:relative}
.btn{height:40px;padding:0 18px;border:0;border-radius:20px;background:#E8E8ED;font-size:15px;font-weight:600;white-space:nowrap}
.btn.pri{background:#0071E3;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.menu{position:absolute;top:46px;right:0;z-index:20;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;height:42px;padding:0 14px;border:0;background:none;border-radius:8px;font-size:15px}
.menu button:hover{background:#F2F2F7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:28px;background:#F5F5F7;border-radius:16px;padding:18px 0}
.stats>div{padding:0 24px;border-left:1px solid rgba(0,0,0,.08)}
.stats>div:first-child{border-left:0}
.stats .k{font-size:13px;color:#6E6E73}
.stats .n{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.stats .n small{font-size:18px;color:#6E6E73;font-weight:600}
.seg{display:inline-flex;gap:2px;padding:2px;background:#E3E3E8;border-radius:9px;margin-top:32px}
.seg button{height:32px;padding:0 18px;border:0;border-radius:7px;background:transparent;font-size:14px;font-weight:600}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cap{display:flex;justify-content:space-between;gap:12px;margin:24px 16px 8px;font-size:13px;color:#6E6E73}
.grp{background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.sep{height:1px;background:rgba(60,60,67,.12);margin-left:16px}
.r{display:grid;grid-template-columns:minmax(0,1fr) 80px 130px;align-items:center;min-height:52px;padding:8px 16px;font-size:16px;gap:8px}
.r .q{text-align:center;color:#6E6E73;white-space:nowrap}
.r .a{text-align:right;white-space:nowrap}
.r .w{display:block;font-size:13px;color:#C93400;margin-top:2px}
.r .who{display:block;font-size:13px;color:#8E8E93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r a{color:inherit;text-decoration:none}
.r a:hover{color:#0071E3}
.empty{padding:60px 20px;text-align:center;color:#8E8E93;font-size:15px}
.form .f{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.form label{flex:none;width:52px;font-size:16px}
.form input,.form select{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;height:50px}
.form .bt{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1D1D1F;color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:12px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <button type="button" class="newb" id="newB"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>새 신청</button>
    <div class="list" id="list"></div>
  </div>
  <div class="main" id="main"><div class="empty">불러오는 중</div></div>
</div>
<script>
const PA_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co';
const PA_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const paSb=supabase.createClient(PA_URL,PA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});
const PA_SRC='/games/purchase.html';
let paOpenStu=new Set(),paSel=new Set(),paUser=null,paList=[],paCur=null,paStu=[],paSubs={},paView='stu',paAllStu=[];

const paEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paWon=n=>Number(n||0).toLocaleString('ko-KR');
const paLocked=w=>/data-locked=["']1["']/.test(String(w&&w.custom_html||'').slice(0,600));
const paDoneSet=w=>new Set(((String(w&&w.custom_html||'').slice(0,4000).match(/data-done=["']([^"']*)["']/)||[])[1]||'').split(/\s+/).filter(Boolean)); // 품의 완료한 학생(제출 student_id)
const paKey=s=>String(s&&s.number!=null?s.number:'').trim(); // 학번 5자리 — 담임반·교과반에 같은 학생이 따로 있어도 한 사람으로
function paToast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
function paOk(s){const a=s&&s.answers;return !!(s&&s.submitted&&a&&!a.cancelled&&Array.isArray(a.rows)&&a.rows.length);}

async function paInit(){
  const{data:{session}}=await paSb.auth.getSession();
  if(!session){document.getElementById('main').innerHTML='<div class="empty">싯다르타 로그인 필요</div>';return;}
  paUser=session.user;
  const r=await paSb.from('students').select('id,class_name,class_category,name,number').eq('user_id',paUser.id);
  paAllStu=(r.data||[]).filter(s=>s.name&&String(s.name).trim());
  const seen=new Set();paStu=paAllStu.filter(s=>{const k=paKey(s);if(!/^\d{5}$/.test(k)||seen.has(k))return false;seen.add(k);return true;});
  await paLoadList();
  if(paList.length)await paOpen(paList[0].id);else paRenderMain();
  setInterval(()=>{const a=document.activeElement;if(!document.hidden&&paCur&&!(a&&(a.id==='ttl'||(a.dataset&&(a.dataset.dk||a.dataset.nm)))))paOpen(paCur.id,true);},20000); // 제목을 고치는 중에는 새로 그리지 않음
}
async function paLoadList(){
  const r=await paSb.from('worksheets').select('id,title,class_name,class_category,custom_html,created_at').eq('user_id',paUser.id).ilike('custom_html','%'+PA_SRC+'%').order('created_at',{ascending:false});
  paList=r.data||[];
  const tg=paList.filter(w=>w.class_name||w.class_category);  // 신청은 2학년 누구나: 대상 지정이 남아 있으면 비움
  if(tg.length){await paSb.from('worksheets').update({class_name:null,class_category:null}).in('id',tg.map(w=>w.id));tg.forEach(w=>{w.class_name=null;w.class_category=null;});}
  const ids=paList.map(w=>w.id),cnt={},dn={};
  if(ids.length){const s=await paSb.from('worksheet_submissions').select('worksheet_id,student_id,submitted,answers').in('worksheet_id',ids);const seen={};
    (s.data||[]).forEach(x=>{if(!paOk(x))return;const st=paStuOf(x.student_id),k=x.worksheet_id+'|'+(/^\d{5}$/.test(paKey(st))?paKey(st):x.student_id);if(seen[k])return;seen[k]=1;cnt[x.worksheet_id]=(cnt[x.worksheet_id]||0)+1;const w0=paList.find(w=>w.id===x.worksheet_id);if(w0&&paDoneSet(w0).has(String(x.student_id)))dn[x.worksheet_id]=(dn[x.worksheet_id]||0)+1;});}
  paList.forEach(w=>{w._n=cnt[w.id]||0;w._d=dn[w.id]||0;});
  paRenderList();
}
function paRenderList(){
  document.getElementById('list').innerHTML=paList.map(w=>{const L=paLocked(w);
    return `<div class="li${paCur&&paCur.id===w.id?' on':''}" data-id="${w.id}" role="button" tabindex="0"><b>${paEsc(w.title)}</b><span><i class="dot${L?' gray':''}"></i>${L?'품의 완료':'받는 중'} · ${w._n}명${w._d?' · 완료 '+w._d:''}</span><button type="button" class="more" data-del="${w.id}" aria-label="삭제"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;}).join('');
}
async function paOpen(id,quiet){
  const w=paList.find(x=>x.id===id);if(!w)return;
  const chg=!paCur||paCur.id!==id;paCur=w;if(chg){paCartLoad();setTimeout(paCartSync,300);}await paDocLoad(id);
  const r=await paSb.from('worksheet_submissions').select('student_id,submitted,answers,submitted_at,updated_at').eq('worksheet_id',id);
  paSubs={};(r.data||[]).forEach(s=>paSubs[s.student_id]=s);
  {const E=paEntries(),D=paDoneSet(w);w._n=E.length;w._d=E.filter(e=>D.has(e.sid)).length;}
  [...paSel].forEach(k=>{if(!paEntries().some(e=>e.sid===k))paSel.delete(k);});
  paRenderList();paRenderMain();
}

/* ---------- 집계 ---------- */
function paStuOf(id){return paStu.find(s=>s.id===id)||paAllStu.find(s=>s.id===id)||{id,name:'(명단 없음)',class_name:'',number:''};}
function paStuLabel(s){const k=paKey(s);return (/^\d{5}$/.test(k)?k+' ':'')+s.name;}
// 학생 한 명의 신청 → 품목 줄(옵션은 한 줄로 합침, 추가금이 다르면 값마다 따로)
function paLinesOf(sub){
  const a=sub.answers||{},items=a.fields&&Array.isArray(a.fields.items)?a.fields.items:null,out=[];
  const shopOf=u=>/11st/i.test(u)?'11번가':/gmarket|gmkt/i.test(u)?'G마켓':'기타';
  if(!items){(a.rows||[]).forEach(r=>out.push({name:r.name,link:r.link,shop:r.shop||shopOf(r.link||''),unit:r.unit,price:+r.price,qty:+r.qty,opts:{},ship:!!r.ship}));return out;}
  items.forEach(it=>{const link=it.l||'',shop=shopOf(link),unit=it.u||'개';

    await paHold();if(paPg.stop)return;
    if(ok!==n){paMsg(`장바구니 ${ok}/${n} · 못 담은 ${n-ok}개`,true);return;}
    paPgSet(65,80);const e1=await paEstimate('st');if(e1)paPgSet(80,99);const e2=e1&&await paEstimate('gm');
    if(e1&&e2){paPgSet(100);paMsg('견적서 저장 · 바탕화면');await paSetDone([...paSel],true);}
  }finally{if(paPg.stop)paMsg('중지',true);paCartBusy=false;paRenderMain();}
}

/* ---------- 품의서 ---------- */
let paDocVals={},paDocT=null;
// 한글 금액: 198,100 → 일십구만팔천일백 (일을 생략하지 않음)
function paHangul(n){n=Math.floor(+n||0);if(!n)return '영';const d='영일이삼사오육칠팔구'.split(''),u=['','십','백','천'],B=['','만','억','조'];let out='',g=0;
  while(n>0){const c=n%10000;if(c){let t='';String(c).padStart(4,'0').split('').forEach((ch,i)=>{const v=+ch;if(v)t+=d[v]+u[3-i];});out=t+B[g]+out;}n=Math.floor(n/10000);g++;}return out;}
function paDocTarget(ents){const D=paDoneSet(paCur);return paSel.size?ents.filter(e=>paSel.has(e.sid)):ents.filter(e=>!D.has(e.sid));}
const paShopName=s=>s==='G마켓'?'지마켓':s;
// 구입처마다 품의 하나 (향남고 양식)
function paDocList(ents){
  const v=paDocVals[paCur.id]||{},T=paDocTarget(ents),all=paMerge(T.flatMap(e=>e.lines)),y=new Date().getFullYear();
  const shops=[...new Set(all.map(l=>l.shop||'기타'))].sort((a,b)=>(a==='G마켓'?0:a==='11번가'?1:2)-(b==='G마켓'?0:b==='11번가'?1:2));
  return shops.map(sh=>{
    const lines=all.filter(l=>(l.shop||'기타')===sh),goods=lines.filter(l=>!l.ship),tot=lines.reduce((a,l)=>a+l.qty*l.price,0),nm=paShopName(sh);
    const title=`${y}학년도 ${paCur.title} 물품 구입`+(shops.length>1?`(${nm})`:'');
    const body=['1. 관련: '+(v.docNo||''),
      `2. ${y}학년도 ${paCur.title}에 필요한 물품을 아래와 같이 구입하고자 합니다.`,
      '  가. 품목: '+(goods.length?goods[0].name+(goods.length>1?' 외 '+(goods.length-1)+'종':''):''),
      '  나. 구입처: '+nm,
      '  다. 금액: '+paWon(tot)+'원.(금'+paHangul(tot)+'원)',
      '',
      `붙임 ${paCur.title} 견적서 1부.  끝.`].join('\n');
    return {shop:sh,title,body,lines,tot,n:T.length};
  });
}
function paDocHtml(ents){
  const v=paDocVals[paCur.id]||{},docs=paDocList(ents),T=paDocTarget(ents);
  let h=`<div class="doc"><div><div class="fm"><label for="dNo">관련 문서</label><input id="dNo" data-dk="docNo" value="${paEsc(v.docNo||'')}" placeholder="향남고등학교-" autocomplete="off"><div class="sep"></div>
    <label for="dBu">예산</label><input id="dBu" data-dk="budget" value="${paEsc(v.budget||'')}" placeholder="산출내역" autocomplete="off"></div>
    <div class="meta" style="margin-top:12px">${paSel.size?'선택':'대기'} ${T.length}명 · 품의 ${docs.length}건</div></div><div>`;
  docs.forEach((d,i)=>{h+=`<div class="pv" style="${i?'margin-top:20px':''}"><div class="meta">${paShopTag(d.shop)} ${paWon(d.tot)}원</div><h2>${paEsc(d.title)}</h2><pre data-body="${i}">${paEsc(d.body)}</pre>
    <div class="cp"><button type="button" class="btn" data-cp="title" data-i="${i}">제목 복사</button><button type="button" class="btn" data-cp="body" data-i="${i}">개요 복사</button><button type="button" class="btn pri" data-cp="items" data-i="${i}">품목 복사</button></div>
    <div style="margin-top:16px">${paTable(d.lines,null,'shop')}</div></div>`;});
  if(!docs.length)h+='<div class="empty">품의할 신청 없음</div>';
  return h+'</div></div>';
}
async function paDocLoad(id){
  if(paDocVals[id])return;paDocVals[id]={};
  const r=await paSb.from('app_kv').select('value').eq('user_id',paUser.id).eq('key','purchase_doc_'+id).maybeSingle();
  if(r.data&&r.data.value)paDocVals[id]=r.data.value;
}
function paDocSave(){const id=paCur.id,v=paDocVals[id];clearTimeout(paDocT);paDocT=setTimeout(()=>paSb.from('app_kv').upsert({user_id:paUser.id,key:'purchase_doc_'+id,value:v,updated_at:new Date().toISOString()},{onConflict:'user_id,key'}).then(r=>{if(r&&r.error)paToast('저장 실패: '+r.error.message);}),600);} // then이 있어야 실제로 보내짐
async function paClip(t,msg){try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}paToast(msg);}
function paItemsTsv(lines){return lines.map(l=>[l.ship?'배송비':l.name,paSpec(l),l.qty,l.unit,l.price,l.qty*l.price].join('\t')).join('\n');}

/* ---------- 내보내기 · 잠금 · 새 신청 ---------- */
function paExportEnts(){const E=paEntries();return paSel.size?E.filter(e=>paSel.has(e.sid)):E;}
function paStudentUrl(){return location.origin+'/student.html?t='+encodeURIComponent(paUser.id)+'&ws='+paCur.id+'&p=1&v=6';}
async function paCopyLink(){const u=paStudentUrl();try{await navigator.clipboard.writeText(u);paToast('학생 링크 복사됨');}catch(e){prompt('',u);}}
async function paCopyEdu(){const L=paMerge(paExportEnts().flatMap(e=>e.lines));paClip(paItemsTsv(L),'품목 복사됨 · '+L.length+'줄');}
function paCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[['학번','이름','품명','옵션','구입처','수량','단위','단가','금액','링크'].map(q).join(',')]
    .concat(paExportEnts().flatMap(e=>e.lines.map(l=>[paKey(e.stu),e.stu.name,l.name,paSpec(l),l.shop,l.qty,l.unit,l.price,l.qty*l.price,l.link].map(q).join(','))));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'}));a.download=paCur.title+' 물품 목록.csv';a.click();
}
async function paSetDone(ids,on){
  const w=paCur,D=paDoneSet(w);ids.forEach(k=>on?D.add(k):D.delete(k));
  let h=String(w.custom_html||'').replace(/\s*data-done=["'][^"']*["']/,'');
  if(D.size)h=h.replace(/<html\b([^>]*)>/i,(m,at)=>'<html'+at+' data-done="'+[...D].join(' ')+'">'); // data-sdt-src 뒤에 붙임(학생 화면은 앞 600자에서 연결 파일을 찾음)
  const{error}=await paSb.from('worksheets').update({custom_html:h}).eq('id',w.id);
  if(error){paToast('저장 실패: '+error.message);return;}
  w.custom_html=h;if(on)paSel.clear();await paOpen(w.id,true);
}
async function paToggleLock(){
  const w=paCur,L=paLocked(w);
  if(!L&&!confirm('품의 완료로 잠글까요?'))return;
  let h=String(w.custom_html||'');
  h=L?h.replace(/\s*data-locked=["']1["']/,''):h.replace(/<html\b/i,'<html data-locked="1"');
  const{error}=await paSb.from('worksheets').update({custom_html:h}).eq('id',w.id);
  if(error){paToast('저장 실패: '+error.message);return;}
  w.custom_html=h;paRenderList();paRenderMain();
}
async function paUpdate(id,upd){
  const{error}=await paSb.from('worksheets').update(upd).eq('id',id);
  if(error){paToast('저장 실패: '+error.message);return false;}
  const w=paList.find(x=>x.id===id);if(w)Object.assign(w,upd);return true;
}
async function paRename(v){
  const w=paCur;v=String(v||'').trim();
  if(!w||!v||v===w.title){const t=document.getElementById('ttl');if(t&&w)t.value=w.title;return;}
  if(await paUpdate(w.id,{title:v})){paRenderList();paToast('이름 바꿈');}
}
async function paDelete(id){
  const w=paList.find(x=>x.id===id)||paCur,n=Object.values(paSubs).filter(paOk).length;
  if(!confirm((n?'학생 신청 '+n+'건과 함께 ':'')+'"'+w.title+'"을 삭제할까요? 되돌릴 수 없습니다.'))return;
  const{error}=await paSb.from('worksheets').delete().eq('id',w.id);
  if(error){paToast('삭제 실패: '+error.message);return;}
  if(paCur&&paCur.id===w.id)paCur=null;await paLoadList();if(paCur){paRenderMain();return;}if(paList.length)await paOpen(paList[0].id);else paRenderMain();
}
async function paCreate(){
  const row={title:'새 신청',internal_name:null,class_name:null,class_category:null,access_code:null,
    kind:'custom_html',custom_html:'<html data-sdt-src="'+PA_SRC+'"></html>',steps:[],user_id:paUser.id,active:true};
  const{data,error}=await paSb.from('worksheets').insert(row).select('id').single();
  if(error){paToast('만들지 못함: '+error.message);return;}
  await paLoadList();await paOpen(data.id);
  const t=document.getElementById('ttl');if(t){t.focus();t.select();}
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.nmi'))return;
  const so=t.closest('[data-sort]');if(so){const k=so.dataset.sort;paSort=paSort.k!==k?{k,d:-1}:paSort.d<0?{k,d:1}:{k:'',d:-1};paRenderMain();return;}
  const dl=t.closest('[data-del]');if(dl){e.stopPropagation();const id=paList.find(x=>String(x.id)===dl.dataset.del)?.id;if(id!=null)paDelete(id);return;}
  const ck=t.closest('[data-ck]');if(ck){const k=ck.dataset.ck;paSel.has(k)?paSel.delete(k):paSel.add(k);paRenderMain();return;}
  if(t.closest('[data-all]')){const E=paEntries(),all=E.length&&E.every(x=>paSel.has(x.sid));E.forEach(x=>all?paSel.delete(x.sid):paSel.add(x.sid));paRenderMain();return;}
  const un=t.closest('[data-undo]');if(un){paSetDone([un.dataset.undo],false);return;}
  const pgb=t.closest('[data-pg]');if(pgb){pgb.dataset.pg==='end'?paStop():paPause();return;}
  if(t.closest('.pg'))return;
  if(t.closest('#reqB')){paRequest();return;}
  const rq=t.closest('[data-req]');if(rq){if(paCartBusy)return;paSel.clear();paSel.add(rq.dataset.req);paRequest();return;}
  const stu=t.closest('[data-stu]');if(stu){const k=stu.dataset.stu;paOpenStu.has(k)?paOpenStu.delete(k):paOpenStu.add(k);paRenderMain();return;}
  const li=t.closest('.li');if(li){const id=paList.find(x=>String(x.id)===li.dataset.id)?.id;if(id!=null)paOpen(id);return;}
  const v=t.closest('[data-v]');if(v){paView=v.dataset.v;paRenderMain();return;}
  if(t.closest('#exB')){document.getElementById('exM').hidden=!document.getElementById('exM').hidden;return;}
  const ex=t.closest('[data-ex]');if(ex){document.getElementById('exM').hidden=true;ex.dataset.ex==='edu'?paCopyEdu():paCsv();return;}
  if(t.closest('#newB')){paCreate();return;}
  const cp=t.closest('[data-cp]');if(cp){const d=paDocList(paEntries())[+cp.dataset.i||0];if(!d)return;if(cp.dataset.cp==='title')paClip(d.title,'제목 복사됨');else if(cp.dataset.cp==='body')paClip(d.body,'개요 복사됨');else paClip(paItemsTsv(d.lines),'품목 복사됨 · '+d.lines.length+'줄');return;}
  if(t.closest('#lnB')){paCopyLink();return;}
  if(t.closest('#svB')){window.open(paStudentUrl(),'_blank');return;}
  const m=document.getElementById('exM');if(m&&!m.hidden&&!t.closest('#exM'))m.hidden=true;
});
document.addEventListener('keydown',e=>{if(e.target.id!=='ttl')return;
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();e.target.blur();}
  else if(e.key==='Escape'){e.target.value=paCur?paCur.title:'';e.target.blur();}});
document.addEventListener('focusout',e=>{if(e.target.id==='ttl')paRename(e.target.value);if(e.target.dataset&&e.target.dataset.nm!=null)paNameSave(e.target);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.nm!=null&&!CSS.supports('field-sizing','content'))t.size=Math.max(2,[...t.value].reduce((a,c)=>a+(c.charCodeAt(0)>255?2:1),0)+1);});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||t.dataset.nm==null)return;if(e.key==='Enter'){e.preventDefault();t.blur();}else if(e.key===' ')e.stopPropagation();});
// 신청자 이름 바꾸기 (이 신청 안에서만, 학생 명부는 그대로)
function paNameSave(inp){if(!paCur)return;const sid=inp.dataset.nm,v=inp.value.trim(),d=paDocVals[paCur.id]=paDocVals[paCur.id]||{},N=d.names=d.names||{};
  const orig=(paStuOf(+sid)||{}).name||'';if(!v||v===orig)delete N[sid];else N[sid]=v;paDocSave();paRenderMain();}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.dk;if(!k||!paCur)return;(paDocVals[paCur.id]=paDocVals[paCur.id]||{})[k]=e.target.value;paDocSave();
  paDocList(paEntries()).forEach((d,i)=>{const b=document.querySelector('[data-body="'+i+'"]');if(b)b.textContent=d.body;});});
paInit();
</script>
