.btn{height:40px;padding:0 18px;border:0;border-radius:20px;background:#E8E8ED;font-size:15px;font-weight:600;white-space:nowrap}
.btn.pri{background:#0071E3;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.menu{position:absolute;top:46px;right:0;z-index:20;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;height:42px;padding:0 14px;border:0;background:none;border-radius:8px;font-size:15px}
.menu button:hover{background:#F2F2F7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:28px;background:#F5F5F7;border-radius:16px;padding:18px 0}
.stats>div{padding:0 24px;border-left:1px solid rgba(0,0,0,.08)}
.stats>div:first-child{border-left:0}
.stats .k{font-size:13px;color:#6E6E73}
.stats .n{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.stats .n small{font-size:18px;color:#6E6E73;font-weight:600}
.seg{display:inline-flex;gap:2px;padding:2px;background:#E3E3E8;border-radius:9px;margin-top:32px}
.seg button{height:32px;padding:0 18px;border:0;border-radius:7px;background:transparent;font-size:14px;font-weight:600}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cap{display:flex;justify-content:space-between;gap:12px;margin:24px 16px 8px;font-size:13px;color:#6E6E73}
.grp{background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.sep{height:1px;background:rgba(60,60,67,.12);margin-left:16px}
.r{display:grid;grid-template-columns:minmax(0,1fr) 80px 130px;align-items:center;min-height:52px;padding:8px 16px;font-size:16px;gap:8px}
.r .q{text-align:center;color:#6E6E73;white-space:nowrap}
.r .a{text-align:right;white-space:nowrap}
.r .w{display:block;font-size:13px;color:#C93400;margin-top:2px}
.r .who{display:block;font-size:13px;color:#8E8E93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r a{color:inherit;text-decoration:none}
.r a:hover{color:#0071E3}
.empty{padding:60px 20px;text-align:center;color:#8E8E93;font-size:15px}
.form .f{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.form label{flex:none;width:52px;font-size:16px}
.form input,.form select{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;height:50px}
.form .bt{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1D1D1F;color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:12px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <button type="button" class="newb" id="newB"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>새 신청</button>
    <div class="list" id="list"></div>
  </div>
  <div class="main" id="main"><div class="empty">불러오는 중</div></div>
</div>
<script>
const PA_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co';
const PA_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const paSb=supabase.createClient(PA_URL,PA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});
const PA_SRC='/games/purchase.html';
let paOpenStu=new Set(),paSel=new Set(),paUser=null,paList=[],paCur=null,paStu=[],paSubs={},paView='stu',paAllStu=[];

const paEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paWon=n=>Number(n||0).toLocaleString('ko-KR');
const paLocked=w=>/data-locked=["']1["']/.test(String(w&&w.custom_html||'').slice(0,600));
const paDoneSet=w=>new Set(((String(w&&w.custom_html||'').slice(0,4000).match(/data-done=["']([^"']*)["']/)||[])[1]||'').split(/\s+/).filter(Boolean)); // 품의 완료한 학생(제출 student_id)
const paKey=s=>String(s&&s.number!=null?s.number:'').trim(); // 학번 5자리 — 담임반·교과반에 같은 학생이 따로 있어도 한 사람으로
function paToast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
function paToastLong(t){const d=document.createElement('div');d.className='toast';d.style.maxWidth='80vw';d.style.whiteSpace='normal';d.textContent=t;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),12000);}
function paOk(s){const a=s&&s.answers;return !!(s&&s.submitted&&a&&!a.cancelled&&Array.isArray(a.rows)&&a.rows.length);}

async function paInit(){
  const{data:{session}}=await paSb.auth.getSession();
  if(!session){document.getElementById('main').innerHTML='<div class="empty">싯다르타 로그인 필요</div>';return;}
  paUser=session.user;
  const r=await paSb.from('students').select('id,class_name,class_category,name,number').eq('user_id',paUser.id);
  paAllStu=(r.data||[]).filter(s=>s.name&&String(s.name).trim());
  const seen=new Set();paStu=paAllStu.filter(s=>{const k=paKey(s);if(!/^\d{5}$/.test(k)||seen.has(k))return false;seen.add(k);return true;});
  await paLoadList();
  if(paList.length)await paOpen(paList[0].id);else paRenderMain();
  setInterval(()=>{const a=document.activeElement;if(!document.hidden&&paCur&&!(a&&(a.id==='ttl'||(a.dataset&&(a.dataset.dk||a.dataset.nm)))))paOpen(paCur.id,true);},20000); // 제목을 고치는 중에는 새로 그리지 않음
}
async function paLoadList(){
  const r=await paSb.from('worksheets').select('id,title,class_name,class_category,custom_html,created_at').eq('user_id',paUser.id).ilike('custom_html','%'+PA_SRC+'%').order('created_at',{ascending:false});
  paList=r.data||[];
  const tg=paList.filter(w=>w.class_name||w.class_category);  // 신청은 2학년 누구나: 대상 지정이 남아 있으면 비움
  if(tg.length){await paSb.from('worksheets').update({class_name:null,class_category:null}).in('id',tg.map(w=>w.id));tg.forEach(w=>{w.class_name=null;w.class_category=null;});}
  const ids=paList.map(w=>w.id),cnt={},dn={};
  if(ids.length){const s=await paSb.from('worksheet_submissions').select('worksheet_id,student_id,submitted,answers').in('worksheet_id',ids);const seen={};
    (s.data||[]).forEach(x=>{if(!paOk(x))return;const st=paStuOf(x.student_id),k=x.worksheet_id+'|'+(/^\d{5}$/.test(paKey(st))?paKey(st):x.student_id);if(seen[k])return;seen[k]=1;cnt[x.worksheet_id]=(cnt[x.worksheet_id]||0)+1;const w0=paList.find(w=>w.id===x.worksheet_id);if(w0&&paDoneSet(w0).has(String(x.student_id)))dn[x.worksheet_id]=(dn[x.worksheet_id]||0)+1;});}
  paList.forEach(w=>{w._n=cnt[w.id]||0;w._d=dn[w.id]||0;});
  paRenderList();
}
function paRenderList(){
  document.getElementById('list').innerHTML=paList.map(w=>{const L=paLocked(w);
    return `<div class="li${paCur&&paCur.id===w.id?' on':''}" data-id="${w.id}" role="button" tabindex="0"><b>${paEsc(w.title)}</b><span><i class="dot${L?' gray':''}"></i>${L?'마감':'받는 중'}, ${w._n}명${w._d?', 완료 '+w._d:''}</span><button type="button" class="more" data-del="${w.id}" aria-label="삭제"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;}).join('');
}
async function paOpen(id,quiet){
  const w=paList.find(x=>x.id===id);if(!w)return;
  const chg=!paCur||paCur.id!==id;paCur=w;if(chg){paCartLoad();paCredLoad().then(()=>setTimeout(paCartSync,300));}await paDocLoad(id);
  const r=await paSb.from('worksheet_submissions').select('student_id,submitted,answers,submitted_at,updated_at').eq('worksheet_id',id);
  paSubs={};(r.data||[]).forEach(s=>paSubs[s.student_id]=s);
  {const E=paEntries(),D=paDoneSet(w);w._n=E.length;w._d=E.filter(e=>D.has(e.sid)).length;}
  [...paSel].forEach(k=>{if(!paEntries().some(e=>e.sid===k))paSel.delete(k);});
  paRenderList();paRenderMain();
}

/* ---------- 집계 ---------- */
function paStuOf(id){return paStu.find(s=>s.id===id)||paAllStu.find(s=>s.id===id)||{id,name:'(명단 없음)',class_name:'',number:''};}
function paStuLabel(s){const k=paKey(s);return (/^\d{5}$/.test(k)?k+' ':'')+s.name;}
// 학생 한 명의 신청 → 품목 줄(옵션은 한 줄로 합침, 추가금이 다르면 값마다 따로)
function paLinesOf(sub){
  const a=sub.answers||{},items=a.fields&&Array.isArray(a.fields.items)?a.fields.items:null,out=[];
  const shopOf=u=>/11st/i.test(u)?'11번가':/gmarket|gmkt/i.test(u)?'G마켓':'기타';
  if(!items){(a.rows||[]).forEach(r=>out.push({name:r.name,link:r.link,shop:r.shop||shopOf(r.link||''),unit:r.unit,price:+r.price,qty:+r.qty,opts:{},ship:!!r.ship}));return out;}
  items.forEach(it=>{const link=it.l||'',shop=shopOf(link),unit=it.u||'개';
    if(it.opts&&it.opts.length){const g={};it.opts.forEach(o=>{const x=+o.x||0;(g[x]=g[x]||{}),g[x][o.n]=(g[x][o.n]||0)+(+o.q||0);});
      Object.keys(g).forEach(x=>{const op=g[x];out.push({name:it.nm,link,shop,unit,price:(+it.p||0)+(+x),qty:Object.values(op).reduce((s,v)=>s+v,0),opts:op});});}
    else out.push({name:it.nm,link,shop,unit,price:+it.p||0,qty:+it.q||0,opts:{}});
    if(+it.s)out.push({name:'배송비',link,shop,unit:'식',price:+it.s,qty:1,opts:{},ship:true,of:it.nm});});
  return out;
}
const paSpec=l=>{if(l.ship)return l.of||'';const k=Object.keys(l.opts||{});if(!k.length)return '';if(k.length===1&&l.opts[k[0]]===l.qty)return k[0];return k.map(n=>n+' '+l.opts[n]).join(', ');};
// 여러 학생 줄 합치기: 같은 링크·품명·단가면 한 줄
function paMerge(lines){const g={};lines.forEach(l=>{const k=[String(l.link).split('#')[0],l.name,l.price,l.ship?1:0,l.ship?l.of:''].join('\u0001');
  const o=g[k]=g[k]||{name:l.name,link:l.link,shop:l.shop,unit:l.unit,price:l.price,price0:l.price0,qty:0,opts:{},ship:l.ship,of:l.of,who:[]};
  o.qty+=l.qty;Object.keys(l.opts||{}).forEach(n=>o.opts[n]=(o.opts[n]||0)+l.opts[n]);if(l.who&&o.who.indexOf(l.who)<0)o.who.push(l.who);});return Object.values(g);}
// 학생이 단가를 잘못 넣었을 때(옵션 추가금 빠짐 등) 장바구니의 실제 금액으로 고친 단가 — 원래 값은 price0로 남겨 표에 줄 긋고 빨간 글씨로 보여 줌
function paEstKeep(){const T=paDocTarget(paEntries());return T.length===1&&paCur?paCur.id+'_'+T[0].sid:'';}
function paEstDone(sid){return !!(((paCur&&paDocVals[paCur.id])||{}).est||{})[sid];}
function paEstMark(ids){if(!paCur)return;const v=paDocVals[paCur.id]=paDocVals[paCur.id]||{};v.est=Object.assign({},v.est||{});ids.forEach(k=>v.est[k]=Date.now());paDocSave();}
function paFixGet(){return ((paCur&&paDocVals[paCur.id])||{}).fix||{};}
function paFixSet(url,unit,from){if(!paCur)return;const v=paDocVals[paCur.id]=paDocVals[paCur.id]||{};v.fix=Object.assign({},v.fix||{},{[url]:{unit,from}});paDocSave();}
function paDropKey(l){return [String(l.link||'').split('#')[0],l.name,l.ship?'ship:'+l.shop:'',JSON.stringify(l.opts||{})].join('|');}
function paDropSet(sid,dk,on){if(!paCur||!dk)return;const v=paDocVals[paCur.id]=paDocVals[paCur.id]||{},d=v.drop=Object.assign({},v.drop||{}),a=new Set(d[sid]||[]);on?a.add(dk):a.delete(dk);d[sid]=[...a];paDocSave();paRenderMain();}
function paEntries(){
  const by={},FX=paFixGet();
  const NM=((paCur&&paDocVals[paCur.id])||{}).names||{};
  Object.values(paSubs).filter(paOk).forEach(s=>{let stu=paStuOf(s.student_id);if(NM[s.student_id])stu=Object.assign({},stu,{name:NM[s.student_id]});const k=/^\d{5}$/.test(paKey(stu))?paKey(stu):'id:'+s.student_id;
    if(!by[k]||String(s.updated_at||'')>String(by[k].sub.updated_at||''))by[k]={stu,sub:s};});
  return Object.values(by).map(({stu,sub})=>{const lines=paLinesOf(sub).map(l=>{Object.assign(l,{who:stu.name});
        const ck=l.shop==='G마켓'?'gm':l.shop==='11번가'?'st':'',f=!l.ship&&ck&&FX[paGoodsUrl(ck,l.link)];
        if(f&&+l.price===+f.from&&+f.unit!==+l.price){l.price0=l.price;l.price=+f.unit;}return l;});
      const ES=(((paCur&&paDocVals[paCur.id])||{}).ship||{})[String(sub.student_id)]||{}; // 견적서 배송비가 있으면 그 구입처 배송비는 견적서 값으로
      Object.keys(ES).forEach(sh=>{if(!ES[sh]||!(ES[sh].ship||ES[sh].known))return;for(let i=lines.length-1;i>=0;i--)if(lines[i].ship&&lines[i].shop===sh)lines.splice(i,1);
        if(+ES[sh].ship)lines.push({name:'배송비',link:'',shop:sh,unit:'식',price:+ES[sh].ship,qty:1,opts:{},ship:true,of:'',who:stu.name});});
      const DR=new Set(((((paCur&&paDocVals[paCur.id])||{}).drop||{})[String(sub.student_id)])||[]),keep=[],dropped=[];
      lines.forEach(l=>{l.dk=paDropKey(l);(DR.has(l.dk)?dropped:keep).push(l);});
      return {stu,sid:String(sub.student_id),topic:String((sub.answers&&sub.answers.topic)||''),pend:sub.answers&&sub.answers.pending&&typeof sub.answers.pending==='object'?sub.answers.pending:null,rows:sub.answers.rows,lines:keep,dropped,total:keep.reduce((a,x)=>a+x.qty*x.price,0)};})
    .sort((a,b)=>paKey(a.stu).localeCompare(paKey(b.stu),'ko',{numeric:true})||String(a.stu.name).localeCompare(String(b.stu.name),'ko'));
}
// 확인할 것: 같은 상품 링크에 배송비가 여러 번 / 같은 상품인데 학생마다 가격이 다름
function paWarnings(ents){
  const ship={},price={},key=l=>String(l.link||'').split('#')[0];
  ents.forEach(e=>e.lines.forEach(l=>{const k=key(l);if(!k)return;
    if(l.ship)ship[k]=(ship[k]||0)+1;else(price[k+'\u0001'+l.name]=price[k+'\u0001'+l.name]||new Set()).add(+l.price);}));
  return l=>{const k=key(l);
    if(l.ship)return ship[k]>1?'같은 상품 배송비 '+ship[k]+'번':'';
    const s=price[k+'\u0001'+l.name];return s&&s.size>1?'학생마다 가격 다름':'';};
}
const paShopTag=s=>paEsc(s||'기타');
// 장바구니에 담을 때 읽은 실제 금액(옵션 추가금 포함)이 신청 금액과 다르면 '장바구니 ○원'
function paCartDiff(l){if(l.ship)return '';const ck=l.shop==='G마켓'?'gm':l.shop==='11번가'?'st':'';const r=ck&&paCartSt[paGoodsUrl(ck,l.link)];
  if(paFixGet()[paGoodsUrl(ck,l.link)])return '';
  return r&&r.ok&&r.amt&&r.exp&&r.amt>r.exp?'장바구니 '+paWon(r.amt)+'원, 신청 '+paWon(r.exp)+'원':'';}
function paInCart(l){if(l.ship)return false;const ck=l.shop==='G마켓'?'gm':l.shop==='11번가'?'st':'';const r=ck&&paCartSt[paGoodsUrl(ck,l.link)];return !!(r&&r.ok);}
// 표 순서: 구입처끼리 묶고(11번가 → G마켓 → 기타), 그 안에서 기본은 품명 짧은 순 / 단가·금액 ▽ 누르면 내림·오름
let paSort={k:'',d:-1};
const PA_SHOP_ORD=s=>({'11번가':0,'G마켓':1}[s]??2);
function paSorted(lines){const v=l=>paSort.k==='price'?l.price:paSort.k==='amt'?l.qty*l.price:0;
  return lines.slice().sort((a,b)=>PA_SHOP_ORD(a.shop)-PA_SHOP_ORD(b.shop)||String(a.shop||'').localeCompare(String(b.shop||''))||(a.ship?1:0)-(b.ship?1:0)
    ||(paSort.k?(v(a)-v(b))*-paSort.d:0)||String(a.name||'').length-String(b.name||'').length||String(a.name||'').localeCompare(String(b.name||''),'ko'));}
const paSortTh=(k,t)=>`<th><button type="button" class="srt${paSort.k===k?' on':''}" data-sort="${k}">${t}<i>${paSort.k===k?(paSort.d<0?'▼':'▲'):'▽'}</i></button></th>`;
// 학생 표: 맨 앞 칸에 구입처(11번가·G마켓)를 묶어 세로로 합치고, 묶음마다 상품 → 배송비 → 소계(오른쪽 금액 칸)
function paTableShop(lines,warn,flush,o){
  lines=paSorted(lines);const tot=lines.reduce((a,l)=>a+l.qty*l.price,0);
  const DR=(o&&o.dropped)||[],shops=[...new Set(lines.map(l=>l.shop||'기타').concat(DR.map(l=>l.shop||'기타')))];let n=0;
  const row=(l,first,span)=>{const t=[warn?warn(l):'',paCartDiff(l)].filter(Boolean).join(', ');const num=l.ship?'':String(++n);
    return `<tr${paInCart(l)?' class="in"':''}>${first?`<td class="shc" rowspan="${span}">${paEsc(l.shop||'기타')}</td>`:''}<td class="no${o&&o.sid?' xn':''}"><span class="nn">${num}</span>${o&&o.sid?`<button type="button" class="dx" data-drop="${paEsc(o.sid)}" data-dk="${paEsc(l.dk||'')}">빼기</button>`:''}</td><td class="nm">${l.link?`<a href="${paEsc(l.link)}" target="_blank" rel="noopener">${paEsc(l.name)}</a>`:`<span>${paEsc(l.name)}</span>`}${t?`<span class="w">${paEsc(t)}</span>`:''}${l.price0!=null?`<span class="fxn">학생 입력 오류, 단가 ${paWon(l.price0)} → ${paWon(l.price)}</span>`:''}</td><td class="sp">${paEsc(paSpec(l))}</td><td>${l.qty}${paEsc(l.unit)}</td><td class="mn">${l.price0!=null?`<s class="fo">${paWon(l.price0)}</s><span class="fx">${paWon(l.price)}</span>`:paWon(l.price)}</td><td class="am mn">${l.price0!=null?`<s class="fo">${paWon(l.qty*l.price0)}</s><span class="fx">${paWon(l.qty*l.price)}</span>`:paWon(l.qty*l.price)}</td></tr>`;};
  const drow=(l,first,span)=>`<tr class="dr">${first?`<td class="shc" rowspan="${span}">${paEsc(l.shop||'기타')}</td>`:''}<td class="no xn"><button type="button" class="dx un" data-undrop="${paEsc(o.sid)}" data-dk="${paEsc(l.dk||'')}">되돌리기</button></td><td class="nm"><span>${paEsc(l.name)}</span></td><td class="sp">${paEsc(paSpec(l))}</td><td>${l.qty}${paEsc(l.unit)}</td><td class="mn">${paWon(l.price)}</td><td class="am mn">${paWon(l.qty*l.price)}</td></tr>`;
  return `<table class="tb ${flush?'flush':'out'}"><colgroup><col style="width:9%"><col style="width:6%"><col style="width:30%"><col style="width:19%"><col style="width:9%"><col style="width:12%"><col style="width:15%"></colgroup>

  const at=pd.at?new Date(pd.at):null;
  const m=document.createElement('div');m.className='ac-bg cf-bg';
  m.innerHTML=`<div class="ac cf rq"><div class="cf-t">${paEsc(paStuLabel(stu))} 수정 요청</div><div class="cf-s">${at&&!isNaN(at)?(at.getMonth()+1)+'월 '+at.getDate()+'일 '+String(at.getHours()).padStart(2,'0')+':'+String(at.getMinutes()).padStart(2,'0'):''}${(pd.topic||'')!==(a.topic||'')?' · 주제 '+paEsc(a.topic||'없음')+' → '+paEsc(pd.topic||'없음'):''}</div>
    ${pd.reason?`<div class="rq-why"><b>수정 이유</b>${paEsc(pd.reason)}</div>`:''}
    <div class="rq-g"><div><div class="rq-h">지금</div>${list(a)}</div><div><div class="rq-h new">요청</div>${list(pd)}</div></div>
    <div class="cf-b"><button type="button" class="btn pri" data-rqa="ok">반영</button><button type="button" class="btn" data-rqa="no">거절</button><button type="button" class="btn" data-rqa="x">닫기</button></div></div>`;
  const close=()=>{m.classList.add('out');setTimeout(()=>m.remove(),180);};
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-rqa]');if(e.target===m||(b&&b.dataset.rqa==='x')){close();return;}if(!b)return;
    let na;if(b.dataset.rqa==='ok'){na=Object.assign({},pd);delete na.at;}else{na=Object.assign({},a);delete na.pending;}
    b.disabled=true;const u=await paSb.from('worksheet_submissions').update({answers:na,updated_at:new Date().toISOString()}).eq('worksheet_id',paCur.id).eq('student_id',+sid);
    if(u.error){b.disabled=false;paToast('저장 실패');return;}
    sub.answers=na;close();paToast(b.dataset.rqa==='ok'?'반영함':'거절함');paRenderMain();});
  document.body.appendChild(m);}
// 확인 창 (브라우저 기본 창 대신, 화면과 같은 모양 + 튀어나오는 효과)
function paConfirm(msg,ok,danger,sub){return new Promise(res=>{
  const m=document.createElement('div');m.className='ac-bg cf-bg';
  m.innerHTML=`<div class="ac cf"><div class="cf-t">${paEsc(msg)}</div>${sub?`<div class="cf-s">${paEsc(sub)}</div>`:''}<div class="cf-b"><button type="button" class="btn ${danger?'red':'pri'}" data-cf="1">${paEsc(ok||'확인')}</button><button type="button" class="btn" data-cf="0">취소</button></div></div>`;
  const done=v=>{if(m.classList.contains('out'))return;m.classList.add('out');document.removeEventListener('keydown',kd,true);setTimeout(()=>m.remove(),180);res(v);};
  const kd=e=>{if(e.key==='Escape'){e.preventDefault();done(false);}else if(e.key==='Enter'){e.preventDefault();done(true);}};
  m.addEventListener('click',e=>{const b=e.target.closest('[data-cf]');if(b)done(b.dataset.cf==='1');else if(e.target===m)done(false);});
  document.addEventListener('keydown',kd,true);document.body.appendChild(m);setTimeout(()=>{const b=m.querySelector('[data-cf="1"]');if(b)b.focus();},30);});}
async function paToggleLock(){
  const w=paCur,L=paLocked(w);
  if(!L&&!(await paConfirm('신청을 마감할까요?','마감',false,'학생은 새로 신청하거나 고칠 수 없습니다.')))return;
  const tb=document.getElementById('lkB');if(tb){tb.classList.toggle('off',!L);const tx=tb.querySelector('.tx');if(tx)tx.textContent=L?'ON':'OFF';await new Promise(r=>setTimeout(r,420));} // 미끄러지는 효과를 본 뒤 저장
  let h=String(w.custom_html||'');
  h=L?h.replace(/\s*data-locked=["']1["']/,''):h.replace(/<html\b/i,'<html data-locked="1"');
  const{error}=await paSb.from('worksheets').update({custom_html:h}).eq('id',w.id);
  if(error){paToast('저장 실패: '+error.message);return;}
  w.custom_html=h;paRenderList();paRenderMain();
}
async function paUpdate(id,upd){
  const{error}=await paSb.from('worksheets').update(upd).eq('id',id);
  if(error){paToast('저장 실패: '+error.message);return false;}
  const w=paList.find(x=>x.id===id);if(w)Object.assign(w,upd);return true;
}
async function paRename(v){
  const w=paCur;v=String(v||'').trim();
  if(!w||!v||v===w.title){const t=document.getElementById('ttl');if(t&&w)t.value=w.title;return;}
  if(await paUpdate(w.id,{title:v})){paRenderList();paToast('이름 바꿈');}
}
async function paDelete(id){
  const w=paList.find(x=>x.id===id)||paCur,n=Object.values(paSubs).filter(paOk).length;
  if(!(await paConfirm('"'+w.title+'"을 삭제할까요?','삭제',true,(n?'학생 신청 '+n+'건도 함께 지워지고, ':'')+'되돌릴 수 없습니다.')))return;
  const{error}=await paSb.from('worksheets').delete().eq('id',w.id);
  if(error){paToast('삭제 실패: '+error.message);return;}
  if(paCur&&paCur.id===w.id)paCur=null;await paLoadList();if(paCur){paRenderMain();return;}if(paList.length)await paOpen(paList[0].id);else paRenderMain();
}
async function paCreate(){
  const row={title:'새 신청',internal_name:null,class_name:null,class_category:null,access_code:null,
    kind:'custom_html',custom_html:'<html data-sdt-src="'+PA_SRC+'"></html>',steps:[],user_id:paUser.id,active:true};
  const{data,error}=await paSb.from('worksheets').insert(row).select('id').single();
  if(error){paToast('만들지 못함: '+error.message);return;}
  await paLoadList();await paOpen(data.id);
  const t=document.getElementById('ttl');if(t){t.focus();t.select();}
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.nmi')||t.closest('.tp-row'))return;
  const dp=t.closest('[data-drop]');if(dp){paDropSet(dp.dataset.drop,dp.dataset.dk,true);return;}
  const ud=t.closest('[data-undrop]');if(ud){paDropSet(ud.dataset.undrop,ud.dataset.dk,false);return;}
  const so=t.closest('[data-sort]');if(so){const k=so.dataset.sort;paSort=paSort.k!==k?{k,d:-1}:paSort.d<0?{k,d:1}:{k:'',d:-1};paRenderMain();return;}
  const dl=t.closest('[data-del]');if(dl){e.stopPropagation();const id=paList.find(x=>String(x.id)===dl.dataset.del)?.id;if(id!=null)paDelete(id);return;}
  const ck=t.closest('[data-ck]');if(ck){const k=ck.dataset.ck;paSel.has(k)?paSel.delete(k):paSel.add(k);paRenderMain();return;}
  if(t.closest('[data-all]')){const E=paEntries(),all=E.length&&E.every(x=>paSel.has(x.sid));E.forEach(x=>all?paSel.delete(x.sid):paSel.add(x.sid));paRenderMain();return;}
  const rqb=t.closest('[data-rq]');if(rqb){e.stopPropagation();paReqOpen(rqb.dataset.rq);return;}
  const un=t.closest('[data-undo]');if(un){paSetDone([un.dataset.undo],false);return;}
  const ed=t.closest('[data-estd]');if(ed){if(paCartBusy)return;paSel.clear();paSel.add(ed.dataset.estd);paRequest();return;}
  const xl=t.closest('[data-xl]');if(xl){paEduXlsDown(xl.dataset.xl);return;}
  const dd=t.closest('[data-dodone]');if(dd){paSetDone([dd.dataset.dodone],true);return;}
  const mk=t.closest('[data-mkdone]');if(mk){if(paCartBusy)return;paSel.clear();paSel.add(mk.dataset.mkdone);paRequest();return;}
  const pgb=t.closest('[data-pg]');if(pgb){pgb.dataset.pg==='end'?paStop():paPause();return;}
  if(t.closest('.pg'))return;
  if(t.closest('#reqB')){paRequest();return;}
  const rq=t.closest('[data-req]');if(rq){if(paCartBusy)return;paSel.clear();paSel.add(rq.dataset.req);paRequest();return;}
  const stu=t.closest('[data-stu]');if(stu){const k=stu.dataset.stu;paOpenStu.has(k)?paOpenStu.delete(k):paOpenStu.add(k);paRenderMain();return;}
  const li=t.closest('.li');if(li){const id=paList.find(x=>String(x.id)===li.dataset.id)?.id;if(id!=null)paOpen(id);return;}
  if(t.closest('#pqB')){paDocSetOpen();return;}
  const v=t.closest('[data-v]');if(v){paView=v.dataset.v;paRenderMain();return;}
  if(t.closest('#exB')){document.getElementById('exM').hidden=!document.getElementById('exM').hidden;return;}
  const ex=t.closest('[data-ex]');if(ex){document.getElementById('exM').hidden=true;ex.dataset.ex==='edu'?paCopyEdu():paCsv();return;}
  if(t.closest('#newB')){paCreate();return;}
  const cp=t.closest('[data-cp]');if(cp){const d=paDocList(paEntries())[+cp.dataset.i||0];if(!d)return;if(cp.dataset.cp==='title')paClip(d.title,'제목 복사됨');else if(cp.dataset.cp==='body')paClip(d.body,'개요 복사됨');else paClip(paItemsTsv(d.lines),'품목 복사됨, '+d.lines.length+'줄');return;}
  if(t.closest('#eduB')){const sdt=paSdt();if(!sdt||!sdt.web){paToast('싯다르타 PC 프로그램 필요');return;}sdt.web('open',{key:'edu',url:'https://goe.eduptl.kr/bpm_man_mn00_001.do',show:true}).catch(e=>paToast(String(e.message||e)));return;}
  if(t.closest('#eduSendB')){paEduSend();return;}
  if(t.closest('#eduDumpB')){const sdt=paSdt();if(!sdt||!sdt.web)return;sdt.web('dump',{key:'edu',name:'에듀파인_화면_'+new Date().toTimeString().slice(0,8).replace(/:/g,'')}).then(r=>paToast('바탕화면, 창 '+(r&&r.frames||0)+'개')).catch(e=>paToast(String(e.message||e).slice(0,60)));return;}
  if(t.closest('#acB')){paAcctOpen();return;}
  if(t.closest('#pinB')){paPinOpen();return;}
  if(t.closest('#lkB')){paToggleLock();return;}
  if(t.closest('#lnB')){paCopyLink();return;}
  if(t.closest('#svB')){window.open(paStudentUrl(),'_blank');return;}
  const m=document.getElementById('exM');if(m&&!m.hidden&&!t.closest('#exM'))m.hidden=true;
});
document.addEventListener('keydown',e=>{if(e.target.id!=='ttl')return;
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();e.target.blur();}
  else if(e.key==='Escape'){e.target.value=paCur?paCur.title:'';e.target.blur();}});
document.addEventListener('focusout',e=>{if(e.target.id==='ttl')paRename(e.target.value);if(e.target.dataset&&e.target.dataset.nm!=null)paNameSave(e.target);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.nm!=null&&!CSS.supports('field-sizing','content'))t.size=Math.max(2,[...t.value].reduce((a,c)=>a+(c.charCodeAt(0)>255?2:1),0)+1);});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||t.dataset.nm==null)return;if(e.key==='Enter'){e.preventDefault();t.blur();}else if(e.key===' ')e.stopPropagation();});
// 신청자 이름 바꾸기 (이 신청 안에서만, 학생 명부는 그대로)
function paNameSave(inp){if(!paCur)return;const sid=inp.dataset.nm,v=inp.value.trim(),d=paDocVals[paCur.id]=paDocVals[paCur.id]||{},N=d.names=d.names||{};
  const orig=(paStuOf(+sid)||{}).name||'';if(!v||v===orig)delete N[sid];else N[sid]=v;paDocSave();paRenderMain();}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.dk;if(!k||!paCur)return;(paDocVals[paCur.id]=paDocVals[paCur.id]||{})[k]=e.target.value;paDocSave();
  paDocRefresh();});
document.addEventListener('input',e=>{const sid=e.target.dataset&&e.target.dataset.ti;if(sid==null||!paCur)return;const d=paDocVals[paCur.id]=paDocVals[paCur.id]||{};d.titles=Object.assign({},d.titles||{});const v=e.target.value.trim();if(v)d.titles[sid]=v;else delete d.titles[sid];paDocSave();});
document.addEventListener('input',e=>{const sid=e.target.dataset&&e.target.dataset.tp;if(sid==null||!paCur)return;const d=paDocVals[paCur.id]=paDocVals[paCur.id]||{};(d.topics=d.topics||{})[sid]=e.target.value.trim();paDocSave();paDocRefresh();});
// 개요 보기: 붙임 둘째 줄부터 '붙임 ' 폭만큼 들여서 번호가 1.과 같은 줄에 서게
function paBodyHtml(b,sid,topic){return String(b||'').split('\n').map(l=>{const m=/^\s{5}(\d+\..*)$/.exec(l);
  if(sid!=null&&/^\s*가\. 주제:/.test(l))return `<div>&nbsp;&nbsp;&nbsp;가. 주제: <input class="tpi-in" data-tp="${paEsc(sid)}" value="${paEsc(topic||'')}" aria-label="주제" autocomplete="off" spellcheck="false"></div>`;
  return '<div>'+(m?'<span class="ph">붙임 </span>'+paEsc(m[1]):(paEsc(l).replace(/^( +)/,x=>'&nbsp;'.repeat(x.length))||'&nbsp;'))+'</div>';}).join('');}
function paDocRefresh(){paEntries().forEach(e=>{const d=paDocList([e],true)[0];if(!d)return;const b=document.querySelector('[data-body="'+e.sid+'"]');if(b&&!b.contains(document.activeElement))b.innerHTML=paBodyHtml(d.body,e.sid,d.topic);const t=document.querySelector('[data-ti="'+e.sid+'"]');if(t&&t!==document.activeElement)t.value=d.title;});}
paInit();
</script>
