<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>온라인 학습지</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Pretendard','Malgun Gothic',sans-serif;background:#f5f6fa;color:#1a1a2e;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
.hd{font-size:18px;font-weight:700;margin:10px 0 18px;text-align:center;}
.card{background:#fff;border:1px solid #e0e0ee;border-radius:14px;padding:16px;margin-bottom:12px;}
.btn{display:block;width:100%;padding:14px;font-size:14px;border-radius:10px;border:1px solid #e0e0ee;background:#fff;color:#1a1a2e;cursor:pointer;text-align:left;margin-bottom:8px;font-family:inherit;}
.btn:hover{background:#f8f8ff;}
.btn.primary{background:#3B82F6;color:#fff;border:none;text-align:center;font-weight:600;}
.btn.primary:disabled{background:#c7d2fe;cursor:default;}
.btn.ghost{border:1px solid #e0e0ee;background:#fff;color:#555;text-align:center;}
.back{font-size:12.5px;color:#555;font-weight:600;cursor:pointer;margin-bottom:14px;display:inline-flex;align-items:center;gap:4px;padding:7px 15px;border-radius:999px;background:#fff;border:1px solid #e0e0ee;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.back:hover{background:#eef4ff;border-color:#adc6ff;color:#1D4ED8;}
.identity-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;padding:20px 16px;}
.identity-card{background:#fff;border:1px solid #e0e0ee;border-radius:16px;padding:32px 26px;max-width:340px;width:100%;text-align:center;}
.identity-card .who{font-size:17px;font-weight:800;margin:14px 0 4px;}
.identity-card .meta{font-size:12px;color:#999;margin-bottom:22px;}
.identity-btns{display:flex;gap:8px;}
.identity-btns button{flex:1;padding:12px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.identity-btns .yes{background:#3B82F6;color:#fff;border:none;}
.identity-btns .no{background:#fff;color:#888;border:1px solid #e0e0ee;}
.loading{text-align:center;color:#999;font-size:13px;padding:30px 0;}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;}
.pill.done{background:#f6ffed;color:#389e0d;}
.pill.draft{background:#fffbe6;color:#d48806;}
.pill.new{background:#f0f5ff;color:#1D4ED8;}
label{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:6px;}
textarea,input[type=text]{width:100%;padding:11px;border:1px solid #e0e0ee;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;}
textarea{min-height:110px;}
textarea:disabled,input:disabled{background:#f8f8fa;color:#555;}
.qwrap{margin-bottom:16px;}
.banner{padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;}
.banner.done{background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f;}
.banner.saving{background:#f0f5ff;color:#1D4ED8;border:1px solid #adc6ff;}
.name-btn{display:flex;justify-content:space-between;align-items:center;}
.stepper{display:flex;justify-content:space-between;margin-bottom:18px;overflow-x:auto;gap:4px;}
.step-dot{flex:1;text-align:center;min-width:44px;}
.step-dot .circle{width:26px;height:26px;border-radius:50%;background:#eee;color:#999;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0 auto 4px;}
.step-dot.active .circle{background:#e5533d;color:#fff;}
.step-dot.done .circle{background:#3B82F6;color:#fff;}
.step-dot .lbl{font-size:10px;color:#999;}
.step-dot.active .lbl{color:#e5533d;font-weight:600;}
.step-title{font-size:15px;font-weight:700;margin-bottom:12px;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media (max-width:480px){.choice-grid{grid-template-columns:1fr;}}
.choice-card{border:2px solid #e0e0ee;border-radius:10px;padding:12px;cursor:pointer;background:#fff;}
.choice-card.selected{border-color:#e5533d;background:#fff5f3;}
.choice-card .ct{font-weight:700;color:#c0392b;margin-bottom:6px;}
.choice-card ul{margin:0;padding-left:16px;font-size:12px;color:#555;line-height:1.6;}
.share-item{border:1px solid #e0e0ee;border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13px;}
.share-item .who{font-size:11px;color:#999;margin-bottom:3px;}
.bar-row{margin-bottom:10px;}
.bar-row .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bar-track{background:#f0f0f5;border-radius:6px;height:10px;overflow:hidden;}
.bar-fill{background:#3B82F6;height:100%;border-radius:6px;}
.nav-row{display:flex;gap:8px;margin-top:16px;}
.nav-row .btn{margin-bottom:0;}
.pin-box{width:52px;height:60px;font-size:26px;font-weight:700;text-align:center;border:2px solid #e0e0ee;border-radius:14px;font-family:inherit;color:#1a1a2e;}
.pin-box:focus{outline:none;border-color:#e5533d;box-shadow:0 0 0 3px rgba(229,83,61,.12);}
.scale-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.scale-btn{width:38px;height:38px;border-radius:50%;border:2px solid #e0e0ee;background:#fff;font-size:13px;font-weight:700;color:#555;cursor:pointer;flex-shrink:0;}
.scale-btn.selected{border-color:#e5533d;background:#e5533d;color:#fff;}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:8px;padding:0 2px;}

/* ===== 사상가 찾기(philosopher_quiz) 전용 - 다른 화면 스타일과 안 겹치게 전부 pq- 접두사 ===== */
.pq-overlay{position:fixed;inset:0;z-index:500;overflow-y:auto;
  background:radial-gradient(1200px 800px at 15% -10%, #33452f 0%, transparent 60%),
             radial-gradient(1000px 700px at 110% 10%, #33452f 0%, transparent 55%), #182319;
  font-family:'Pretendard',sans-serif; padding:32px 16px 60px;}
.pq-stage{width:100%;max-width:600px;margin:0 auto;}
.pq-masthead{text-align:center;margin-bottom:18px;color:#efe7d3;}
.pq-masthead .eyebrow{font-size:12px;letter-spacing:.28em;color:#c9a86a;text-transform:uppercase;margin-bottom:6px;}
.pq-masthead h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(24px,5vw,32px);margin:0;letter-spacing:-.01em;}
.pq-masthead .sub{font-size:12.5px;color:#c9c3ab;margin-top:6px;}
.pq-doc{position:relative;background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(0,0,0,.028) 27px 28px),#efe7d3;
  border:1px solid #cabb92;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 6px rgba(255,255,255,.15);
  border-radius:3px;padding:30px 24px 26px;min-height:400px;color:#1c231c;}
.pq-doc::before{content:"";position:absolute;inset:10px;border:1px solid #cabb92;pointer-events:none;opacity:.7;}
.pq-case-no{font-family:'Noto Serif KR',serif;font-weight:800;font-size:12.5px;letter-spacing:.05em;color:#a9863f;
  display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1c231c;padding-bottom:10px;margin-bottom:20px;}
.pq-case-no .file{color:#7a6f4d;font-weight:600;}
.pq-tag{display:inline-block;font-weight:700;font-size:11px;color:#efe7d3;background:#8c2f26;padding:3px 9px;border-radius:2px;letter-spacing:.04em;margin-bottom:10px;}
.pq-q{font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(18px,4vw,22px);line-height:1.5;margin:0 0 20px;word-break:keep-all;}
.pq-opts{display:flex;flex-direction:column;gap:10px;}
.pq-opt{text-align:left;background:transparent;border:1.5px solid #b8ab80;border-radius:3px;padding:13px 16px;
  font-size:14px;line-height:1.5;color:#1c231c;cursor:pointer;font-family:inherit;}
.pq-opt:hover{border-color:#8c2f26;background:rgba(140,47,38,.06);}
.pq-opt .mark{font-family:'Noto Serif KR',serif;font-weight:800;color:#8c2f26;margin-right:8px;}
.pq-foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;}
.pq-progress{flex:1;height:5px;background:#d9cca0;border-radius:3px;overflow:hidden;margin-right:14px;}
.pq-progress i{display:block;height:100%;width:0%;background:#a9863f;transition:width .3s ease;}
.pq-stamp-hint{font-size:11px;color:#8a7f5c;white-space:nowrap;}
.pq-match-headline{text-align:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(19px,5vw,24px);margin-bottom:16px;}
.pq-name-cn{font-family:'Noto Serif KR',serif;font-weight:800;font-size:clamp(22px,6vw,28px);text-align:center;}
.pq-name-en{font-size:11px;color:#8a7f5c;letter-spacing:.14em;margin-top:2px;text-transform:uppercase;text-align:center;}
.pq-quote{font-family:'Noto Serif KR',serif;font-size:14px;line-height:1.7;text-align:center;color:#2a2a20;margin:14px 0 8px;padding:0 6px;}
.pq-blurb{font-size:12.5px;line-height:1.65;color:#4a4632;text-align:center;padding:0 4px;margin-bottom:12px;}
.pq-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
.pq-tags span{font-size:11px;font-weight:600;color:#8c2f26;background:rgba(140,47,38,.08);border:1px solid rgba(140,47,38,.28);border-radius:20px;padding:4px 11px;}
.pq-section{margin-top:24px;}
.pq-section-h{font-weight:700;font-size:13px;color:#8c2f26;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.pq-section-h::before{content:"";width:14px;height:2px;background:#8c2f26;display:inline-block;}
.pq-essence{font-family:'Noto Serif KR',serif;font-size:14px;line-height:1.85;color:#2a2a20;background:rgba(0,0,0,.03);border-left:3px solid #a9863f;padding:14px 16px;}
.pq-essence p{margin:0 0 12px;}
.pq-essence p:last-child{margin-bottom:0;}
.pq-signs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.pq-signs li{font-size:13px;line-height:1.5;padding-left:22px;position:relative;}
.pq-signs li::before{content:"✔";position:absolute;left:0;top:.1em;color:#a9863f;font-size:11px;font-weight:700;}
.pq-cardrow{display:flex;flex-direction:column;gap:10px;}
@media(min-width:480px){.pq-cardrow.two{flex-direction:row;}.pq-cardrow.two .pq-card{flex:1;}}
.pq-card{background:#e9e0c8;border:1px solid #cabb92;border-radius:3px;padding:12px 14px;}
.pq-card .t{font-weight:700;font-size:12.5px;margin-bottom:4px;}
.pq-card .d{font-size:12px;line-height:1.55;color:#4a4632;}
.pq-card.strength .t{color:#3d5a3f;}
.pq-card.pitfall .t{color:#8c2f26;}
.pq-closing{margin-top:24px;background:#28372a;color:#efe7d3;text-align:center;padding:13px;border-radius:3px;font-weight:700;font-size:13px;}
.pq-toggle{font-size:11.5px;color:#8a7f5c;text-align:center;text-decoration:underline;cursor:pointer;margin-top:18px;}
.pq-panel{margin-top:14px;background:rgba(0,0,0,.035);border:1px dashed #b8ab80;border-radius:4px;padding:14px 14px 4px;}
.pq-panel-note{font-size:11px;color:#7a6f4d;margin-bottom:12px;line-height:1.6;}
.pq-vrow{margin-bottom:11px;}
.pq-vrow .top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;}
.pq-vrow .track{height:9px;background:#e2d5b3;border-radius:5px;overflow:hidden;}
.pq-vrow .fill{height:100%;background:#8c2f26;border-radius:5px;}
.pq-vrow.winner .fill{background:#3d5a3f;}
.pq-vrow.winner .top{color:#3d5a3f;}
.pq-retry{margin:16px auto 0;display:block;background:#1c231c;color:#efe7d3;border:none;padding:11px 24px;border-radius:3px;font-weight:600;font-size:13px;cursor:pointer;}
.pq-footnote{text-align:center;color:#a79c7b;font-size:11px;margin-top:16px;}
.hide{display:none !important;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">불러오는 중...</div></div>
<script>
const SUPABASE_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co';
const SUPABASE_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// 커스텀 HTML 학습지(iframe)의 "제출하기"가 window.parent로 보내는 결과를 받아서 Supabase에 저장함.
// 원본 파일 자체는 손대지 않고, 그 파일이 이미 계산해둔 결과(student/winner/scores/rawAnswers)를 그대로 받아옴.
window.addEventListener('message', async (event)=>{
  if(event.data?.type!=='sittdartha_ws_submit')return;
  const frame=document.getElementById('cwFrame');
  if(!frame||event.source!==frame.contentWindow)return; // 우리가 띄운 iframe에서 온 메시지가 맞는지 확인
  if(PREVIEW_MODE||!curWorksheet||curWorksheet.id==='preview')return; // 미리보기에서는 저장 안 함
  const{winner,winnerKey,scores,rawAnswers,student}=event.data;
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers:{winner,winnerKey,scores,rawAnswers,studentInputEcho:student},submitted:true,current_step:1,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  try{
    const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
    curSub=data||payload;
  }catch(e){}
  const banner=document.createElement('div');
  banner.textContent='제출되었어요.';
  banner.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:600;background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f;padding:9px 16px;border-radius:8px;font-size:13px;font-family:Pretendard,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.2);';
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(),3500);
});

// 커스텀 HTML 학습지(iframe)에서 "본인이 맞나요?" 확인에 "아니요"를 눌렀을 때 오는 메시지 -
// 학생을 다시 고를 수 있게 자동으로 이름 선택 화면으로 돌려보냄(iframe 자체는 그대로 사라짐, app 전체를 새로 그림).
window.addEventListener('message', (event)=>{
  if(event.data?.type!=='sittdartha_ws_wrong_identity')return;
  const frame=document.getElementById('cwFrame');
  if(!frame||event.source!==frame.contentWindow)return;
  if(PREVIEW_MODE)return;
  switchStudent();
});

const params=new URLSearchParams(location.search);
const TEACHER_ID=params.get('t')||localStorage.getItem('ws_teacher_id')||'';
if(TEACHER_ID)localStorage.setItem('ws_teacher_id',TEACHER_ID);
// 선생님이 학습지 관리 화면에서 "미리보기" 버튼을 누르면 이 모드로 열림 - 저장 전 초안도 볼 수 있게
// localStorage로 title/steps만 잠깐 건네받고, DB 조회·저장은 전혀 하지 않음(제출/답글도 다 비활성)
const PREVIEW_MODE=params.get('preview')==='1';
const PREVIEW_TOKEN=params.get('draft')||'';
// 선생님이 학습지 관리 목록에서 특정 학습지 이름(알약 버튼)을 눌러서 들어온 경우 - 학생이 반/이름만 고르면
// 학습지 목록 화면을 건너뛰고 바로 이 학습지로 들어감
const WS_PARAM=params.get('ws')||'';

let roster=[],selClass=localStorage.getItem('ws_sel_class')||'',selStudent=null;
let wsTargetFilter=null; // ?ws= 로 들어왔을 때 그 학습지의 대상({class_name,class_category}) - 반 선택 화면 필터링용

function escHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function esc(s){return String(s??'').replace(/'/g,"\\'");}

async function init(){
  const app=document.getElementById('app');
  if(PREVIEW_MODE){
    let draft=null;
    try{draft=JSON.parse(localStorage.getItem('ws_preview_'+PREVIEW_TOKEN)||'null');}catch(e){}
    if(!draft||(!draft.steps&&!draft.customHtml)){
      app.innerHTML='<div class="hd">미리보기</div><div class="card">미리보기 정보를 찾을 수 없어요. 학습지 관리 화면에서 미리보기 버튼을 다시 눌러주세요.</div>';
      return;
    }
    if(draft.kind==='custom_html'){
      curWorksheet={id:'preview',title:draft.title,kind:'custom_html',custom_html:draft.customHtml,access_code:null};
      renderCustomHtmlWorksheet(true);
      return;
    }
    curWorksheet={id:'preview',title:draft.title,steps:draft.steps,access_code:null};
    curSub=null;curAnswers={};curStepIdx=0;curAccessUnlocked=true;
    selStudent={id:'preview',name:'미리보기'};selClass='';
    renderStepWizard();
    return;
  }
  if(!TEACHER_ID){
    app.innerHTML='<div class="hd">온라인 학습지</div><div class="card">링크가 올바르지 않아요. 선생님께 받은 링크로 다시 들어와 주세요.</div>';
    return;
  }
  const{data,error}=await sb.from('public_roster').select('*').eq('user_id',TEACHER_ID).order('class_name').order('number');
  if(error){
    app.innerHTML=`<div class="hd">온라인 학습지</div><div class="card">명단을 불러오지 못했어요.<br/><span style="color:#999;font-size:11px;">${escHtml(error.message)}</span></div>`;
    return;
  }
  roster=data||[];
  // 특정 학습지 링크(?ws=)로 들어온 경우, 그 학습지의 대상(반 하나 또는 분류)에 안 맞는 반은
  // 애초에 반 선택 화면에 안 보이게 미리 걸러둠(예: 교과 전용 학습지 링크인데 담임반이 뜨는 걸 방지)
  if(WS_PARAM&&!wsTargetFilter){
    const{data:wsRow}=await sb.from('worksheets').select('class_name,class_category').eq('id',Number(WS_PARAM)).maybeSingle();
    if(wsRow)wsTargetFilter=wsRow;
  }
  const savedStudentId=localStorage.getItem('ws_sel_student_'+selClass);
  if(selClass&&savedStudentId){
    const s=roster.find(r=>String(r.id)===savedStudentId&&r.class_name===selClass);
    if(s)selStudent=s;
  }
  // 예전에 이 브라우저에서 골랐던 반/학생이 그대로 남아있으면, 그게 지금 쓰는 사람과 같은 사람인지
  // 말없이 넘어가지 않고 한 번 확인부터 함(다른 학생이 같은 기기를 쓰다가 엉뚱한 사람으로 이어지는 걸 방지).
  if(selStudent)renderReturningIdentityGate();
  else if(selClass)renderStudentPicker();
  else renderClassPicker();
}
// "이전에 이 기기에서 선택했던 사람이 당신이 맞나요?" 확인 화면 - 반/학생 선택을 매번 새로 하지 않아도 되게
// 기억은 해두되, 그 기억을 실제로 쓰기 전에 반드시 한 번 확인받음. "네"면 원래 흐름(비밀번호 확인)으로,
// "아니요"면 기억을 지우고 반 선택부터 새로 시작함.
function renderReturningIdentityGate(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="identity-wrap"><div class="identity-card">
    <div style="font-size:30px;">🙋</div>
    <div class="who">${escHtml(selStudent.name)}님이 맞나요?</div>
    <div class="meta">${escHtml(selClass)}</div>
    <div class="identity-btns">
      <button class="yes" onclick="renderPinGate()">네, 맞아요</button>
      <button class="no" onclick="notMeGoBack()">아니요</button>
    </div>
  </div></div>`;
}
function notMeGoBack(){
  localStorage.removeItem('ws_sel_student_'+selClass);
  localStorage.removeItem('ws_sel_class');
  selStudent=null;selClass='';
  renderClassPicker();
}
// 학생이 정해진 다음 어디로 갈지: ws 파라미터로 들어왔으면 그 학습지로 바로, 아니면 평소처럼 목록으로
function proceedAfterStudentKnown(){
  if(WS_PARAM){openWorksheet(Number(WS_PARAM));return;}
  renderWorksheetList();
}
// 학습지 쪽으로 넘어가기 전에 매번(반/학생을 다시 고르지 않고 이어서 들어와도) 4자리 고유번호를 확인함.
// 처음 쓰는 학생이면(고유번호가 아직 없으면) 지금 입력한 값이 그대로 고유번호로 등록됨(check_student_pin RPC가 처리).
function renderPinGate(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="switchStudent()">← 다른 사람으로 전환</span>
    <div class="hd">${escHtml(selStudent.name)}님</div>
    <div class="card" style="text-align:center;">
      <div style="font-size:13px;color:#555;margin-bottom:18px;">비밀번호 4자리를 입력하세요</div>
      <div style="display:flex;gap:10px;justify-content:center;">
        ${[0,1,2,3].map(i=>`<input class="pin-box" id="pinBox${i}" maxlength="1" inputmode="numeric" pattern="[0-9]*" oninput="pinBoxInput(${i},this)" onkeydown="pinBoxKeydown(${i},event)"/>`).join('')}
      </div>
      <div id="wsPinErr" style="color:#dc2626;font-size:12px;margin-top:14px;min-height:16px;"></div>
      <button class="btn primary" style="margin-top:6px;" onclick="checkPin()">확인</button>
    </div>`;
  setTimeout(()=>document.getElementById('pinBox0')?.focus(),0);
}
function pinBoxesValue(){
  return [0,1,2,3].map(i=>document.getElementById('pinBox'+i)?.value||'').join('');
}
function pinBoxInput(i,el){
  el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);
  if(el.value&&i<3)document.getElementById('pinBox'+(i+1))?.focus();
  if(pinBoxesValue().length===4)checkPin();
}
function pinBoxKeydown(i,e){
  if(e.key==='Backspace'&&!e.target.value&&i>0)document.getElementById('pinBox'+(i-1))?.focus();
  if(e.key==='Enter')checkPin();
}
function pinBoxesClear(){
  [0,1,2,3].forEach(i=>{const b=document.getElementById('pinBox'+i);if(b)b.value='';});
  document.getElementById('pinBox0')?.focus();
}
async function checkPin(){
  const v=pinBoxesValue();
  const errEl=document.getElementById('wsPinErr');
  if(!/^\d{4}$/.test(v)){if(errEl)errEl.textContent='숫자 4자리를 모두 입력해주세요.';return;}
  const{data,error}=await sb.rpc('check_student_pin',{p_student_id:selStudent.id,p_pin:v});
  if(error){
    console.error('check_student_pin RPC error:',error);
    if(errEl)errEl.textContent=`확인 중 오류: ${error.message||error.code||'알 수 없는 오류'} (선생님께 이 문구를 보여주세요)`;
    return;
  }
  if(!data){
    if(errEl)errEl.textContent='비밀번호가 맞지 않아요. 잘 모르겠으면 선생님께 여쭤보세요.';
    pinBoxesClear();
    return;
  }
  proceedAfterStudentKnown();
}

function renderClassPicker(){
  let classNames=[...new Set(roster.map(r=>r.class_name))];
  if(wsTargetFilter?.class_name){
    classNames=classNames.filter(cn=>cn===wsTargetFilter.class_name);
  }else if(wsTargetFilter?.class_category){
    const catByClass={};
    roster.forEach(r=>{catByClass[r.class_name]=r.class_category||'교과';});
    classNames=classNames.filter(cn=>catByClass[cn]===wsTargetFilter.class_category);
  }
  const app=document.getElementById('app');
  app.innerHTML=`<div class="hd">🧭 온라인 학습지</div>
    <div class="card"><label>반을 선택하세요</label>
    ${classNames.map(cn=>`<button class="btn" onclick="pickClass('${esc(cn)}')">${escHtml(cn)}</button>`).join('')||'<div style="color:#999;font-size:12px;">등록된 반이 없어요.</div>'}
    </div>`;
}
function pickClass(cn){
  selClass=cn;localStorage.setItem('ws_sel_class',cn);
  renderStudentPicker();
}
function renderStudentPicker(){
  const app=document.getElementById('app');
  const students=roster.filter(r=>r.class_name===selClass);
  app.innerHTML=`<span class="back" onclick="selClass='';renderClassPicker();">← 반 다시 고르기</span>
    <div class="hd">${escHtml(selClass)}</div>
    <div class="card"><label>본인 이름을 선택하세요</label>
    ${students.map(s=>`<button class="btn name-btn" onclick='pickStudent(${JSON.stringify(s.id)})'><span>${escHtml(`${s.number||''} ${s.name}`)}</span></button>`).join('')||'<div style="color:#999;font-size:12px;">학생이 없어요.</div>'}
    </div>`;
}
function pickStudent(id){
  const s=roster.find(r=>r.id===id);
  if(!s)return;
  selStudent=s;
  localStorage.setItem('ws_sel_student_'+selClass,String(id));
  renderPinGate();
}
function switchStudent(){
  selStudent=null;
  renderStudentPicker();
}

async function renderWorksheetList(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="switchStudent()">← 다른 사람으로 전환</span>
    <div class="hd">${escHtml(selStudent.name)}님, 안녕하세요 👋</div>
    <div class="loading">학습지 목록을 불러오는 중...</div>`;
  const{data:allSheets}=await sb.from('worksheets').select('*').eq('user_id',TEACHER_ID).eq('active',true).order('created_at',{ascending:false});
  const myCategory=selStudent.class_category||'교과';
  const sheets=(allSheets||[]).filter(w=>{
    if(w.class_name)return w.class_name===selClass;
    if(w.class_category)return w.class_category===myCategory;
    return true; // 특정 반도 분류도 지정 안 됐으면 전체 반 공통
  });
  const ids=(sheets||[]).map(w=>w.id);
  let subs=[];
  if(ids.length){
    const{data}=await sb.from('worksheet_submissions').select('*').eq('student_id',selStudent.id).in('worksheet_id',ids);
    subs=data||[];
  }
  const subByWs={};subs.forEach(s=>subByWs[s.worksheet_id]=s);
  app.innerHTML=`<span class="back" onclick="switchStudent()">← 다른 사람으로 전환</span>
    <div class="hd">${escHtml(selStudent.name)}님, 안녕하세요 👋</div>
    <div class="card"><label>학습지를 선택하세요</label>
    ${(sheets||[]).map(w=>{
      const sub=subByWs[w.id];
      const pill=sub?.submitted?'<span class="pill done">제출완료</span>':(sub?'<span class="pill draft">작성중</span>':'<span class="pill new">새 학습지</span>');
      return `<button class="btn name-btn" onclick="openWorksheet(${w.id})"><span>${escHtml(w.title)}</span>${pill}</button>`;
    }).join('')||'<div style="color:#999;font-size:12px;">지금 볼 수 있는 학습지가 없어요.</div>'}
    </div>`;
}

let curWorksheet=null,curSub=null,curAnswers={},curStepIdx=0,curAccessUnlocked=false;

async function openWorksheet(wsId){
  const app=document.getElementById('app');
  app.innerHTML='<div class="loading">불러오는 중...</div>';
  const{data:w}=await sb.from('worksheets').select('*').eq('id',wsId).single();
  if(!w){app.innerHTML='<div class="card">학습지를 찾을 수 없어요.</div>';return;}
  const{data:sub}=await sb.from('worksheet_submissions').select('*').eq('worksheet_id',wsId).eq('student_id',selStudent.id).maybeSingle();
  curWorksheet=w;curSub=sub;curAnswers=sub?.answers?{...sub.answers}:{};
  curStepIdx=sub?.current_step||0;
  curAccessUnlocked=!w.access_code||!!sub; // 이미 시작한 적 있으면(제출물 존재) 코드 다시 안 물어봄
  if(sub?.submitted){renderSubmittedScreen();return;}
  if(w.access_code&&!curAccessUnlocked){renderAccessGate();return;}
  // 통째로 붙여넣은 커스텀 HTML 학습지(예: 사상가 찾기)는 iframe으로 그대로 띄우고, "제출하기"를 누르면
  // postMessage로 결과가 날아와서 여기서 Supabase에 저장함 (renderCustomHtmlWorksheet 안에서 처리)
  if(w.kind==='custom_html'){renderCustomHtmlWorksheet(false);return;}
  // "사상가 찾기"처럼 완전히 커스텀 디자인/채점 방식인 학습지는 steps[0].type이 'philosopher_quiz'로 표시돼 있음 -
  // 일반 단계형 위저드 대신 통째로 별도 엔진(pq*)으로 넘겨서, 그 학습지만의 화면을 그대로 씀
  if((w.steps||[])[0]?.type==='philosopher_quiz'){pqStart(w.steps[0]);return;}
  const needsGroup=(w.steps||[]).some(s=>s.scope==='group');
  if(needsGroup&&!sub?.group_code){renderGroupGate();return;}
  renderStepWizard();
}
function renderAccessGate(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    <div class="card"><label>선생님이 알려주신 입장 코드를 입력하세요</label>
    <input type="text" id="wsAccessInp" placeholder="입장 코드"/>
    <div id="wsAccessErr" style="color:#dc2626;font-size:12px;margin-top:6px;"></div>
    <button class="btn primary" style="margin-top:10px;" onclick="checkAccessCode()">입장하기</button>
    </div>`;
}
function checkAccessCode(){
  const v=(document.getElementById('wsAccessInp')?.value||'').trim();
  if(v!==curWorksheet.access_code){
    const e=document.getElementById('wsAccessErr');if(e)e.textContent='코드가 맞지 않아요. 다시 확인해주세요.';
    return;
  }
  curAccessUnlocked=true;
  const needsGroup=(curWorksheet.steps||[]).some(s=>s.scope==='group');
  if(needsGroup&&!curSub?.group_code){renderGroupGate();return;}
  renderStepWizard();
}
function renderGroupGate(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    <div class="card"><label>모둠 이름을 입력하세요 (같은 모둠 친구들과 똑같이 입력해주세요)</label>
    <input type="text" id="wsGroupInp" placeholder="예: 3모둠"/>
    <button class="btn primary" style="margin-top:10px;" onclick="saveGroupCode()">시작하기</button>
    </div>`;
}
async function saveGroupCode(){
  const v=(document.getElementById('wsGroupInp')?.value||'').trim();
  if(!v){alert('모둠 이름을 입력해주세요.');return;}
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers:curAnswers,submitted:false,group_code:v,current_step:curStepIdx,updated_at:new Date().toISOString()};
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  curSub=data||payload;
  renderStepWizard();
}
function renderSubmittedScreen(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    <div class="banner done">✅ 제출 완료 - 더 이상 수정할 수 없어요.</div>
    <div class="card" style="text-align:center;color:#888;font-size:13px;padding:30px 16px;">수고했어요! 학습지 목록으로 돌아가서 다른 학습지를 진행할 수 있어요.</div>`;
}

// ===== 단계 진행 =====
function renderStepper(){
  const steps=curWorksheet.steps||[];
  return `<div class="stepper">${steps.map((s,i)=>`<div class="step-dot ${i===curStepIdx?'active':(i<curStepIdx?'done':'')}">
    <div class="circle">${i<curStepIdx?'✓':i+1}</div><div class="lbl">${escHtml(s.label||s.title||'')}</div>
  </div>`).join('')}</div>`;
}
function curStep(){return (curWorksheet.steps||[])[curStepIdx];}
function isLastStep(){return curStepIdx===(curWorksheet.steps||[]).length-1;}

async function renderStepWizard(){
  const step=curStep();
  if(!step)return;
  const app=document.getElementById('app');
  let bodyHtml='<div class="loading">불러오는 중...</div>';
  app.innerHTML=`${PREVIEW_MODE?`<span class="back" onclick="window.close()">✕ 미리보기 닫기</span><div class="banner saving">🔍 미리보기 모드 - 여기서 입력한 내용은 저장되지 않아요</div>`:`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>`}
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    ${renderStepper()}
    ${PREVIEW_MODE?'':'<div id="wsSaveBanner" class="banner saving" style="display:none;">저장 중...</div>'}
    <div class="card" id="wsStepBody">${bodyHtml}</div>`;
  await renderStepBody();
}
async function renderStepBody(){
  const step=curStep();
  const bodyEl=document.getElementById('wsStepBody');
  if(!bodyEl||!step)return;
  let inner='';
  if(step.type==='intro'){
    inner=`<div class="step-title">${escHtml(step.title||'')}</div><div style="font-size:13px;color:#555;white-space:pre-wrap;line-height:1.7;">${escHtml(step.body||'')}</div>`;
  }else if(step.type==='choice'){
    const sel=curAnswers[step.id]||{};
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      <div class="choice-grid">${(step.options||[]).map(o=>`<div class="choice-card ${sel.optionId===o.id?'selected':''}" onclick="pickChoiceOption('${esc(step.id)}','${esc(o.id)}')">
        <div class="ct">${escHtml(o.title)}</div>
        <ul>${(o.bullets||[]).map(b=>`<li>${escHtml(b)}</li>`).join('')}</ul>
      </div>`).join('')}</div>
      ${step.followup?`<label>${escHtml(step.followup.label||'')}</label><input type="text" id="wsFollowupInp" value="${escHtml(sel.followupText||'')}" oninput="onFollowupChange('${esc(step.id)}',this.value)"/>`:''}`;
  }else if(step.type==='scale'){
    const min=step.min??1,max=step.max??5;
    const val=curAnswers[step.id];
    const opts=[];for(let v=min;v<=max;v++)opts.push(v);
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:14px;">${escHtml(step.prompt||'')}</div>
      <div class="scale-row">${opts.map(v=>`<button type="button" class="scale-btn ${val===v?'selected':''}" onclick="pickScaleValue('${esc(step.id)}',${v})">${v}</button>`).join('')}</div>
      ${step.labels?`<div class="scale-labels"><span>${escHtml(step.labels[0]||'')}</span><span>${escHtml(step.labels[1]||'')}</span></div>`:''}`;
  }else if(step.type==='text'||step.type==='reflection'){
    const val=curAnswers[step.id]||'';
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      ${step.multiline===false
        ?`<input type="text" value="${escHtml(val)}" oninput="onTextAnswerChange('${esc(step.id)}',this.value)"/>`
        :`<textarea oninput="onTextAnswerChange('${esc(step.id)}',this.value)">${escHtml(val)}</textarea>`}`;
  }else if(step.type==='share'){
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      <div class="loading">다른 학생 답변을 불러오는 중...</div>`;
    bodyEl.innerHTML=inner;
    await renderShareStep(step);
    return;
  }else if(step.type==='reveal_stats'){
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      <div class="loading">집계하는 중...</div>`;
    bodyEl.innerHTML=inner;
    await renderStatsStep(step);
    return;
  }
  bodyEl.innerHTML=inner+renderNavRow();
}
function renderNavRow(){
  const step=curStep();
  const canGoNext=isStepAnswerValid(step);
  return `<div class="nav-row">
    ${curStepIdx>0?`<button class="btn ghost" style="flex:1;" onclick="goStep(-1)">← 이전</button>`:''}
    <button class="btn primary" style="flex:2;" ${canGoNext?'':'disabled'} onclick="${isLastStep()?'finalSubmit()':'goStep(1)'}">${isLastStep()?'제출하기':'다음 →'}</button>
  </div>${isLastStep()?'<div style="font-size:11px;color:#aaa;text-align:center;margin-top:6px;">제출하면 더 이상 수정할 수 없어요. 신중하게 확인한 뒤 눌러주세요.</div>':''}`;
}
function isStepAnswerValid(step){
  if(!step)return false;
  if(step.type==='intro'||step.type==='share'||step.type==='reveal_stats')return true;
  if(step.type==='choice'){
    const sel=curAnswers[step.id];
    if(!sel||!sel.optionId)return false;
    if(step.followup?.required&&!(sel.followupText||'').trim())return false;
    return true;
  }
  if(step.type==='scale')return curAnswers[step.id]!=null;
  if(step.type==='text'||step.type==='reflection')return !!(curAnswers[step.id]||'').trim();
  return true;
}
function pickScaleValue(stepId,val){
  curAnswers[stepId]=val;
  renderStepBody();
  scheduleSave();
}
function pickChoiceOption(stepId,optId){
  const sel=curAnswers[stepId]||{};
  sel.optionId=optId;
  curAnswers[stepId]=sel;
  renderStepBody();
  scheduleSave();
}
function onFollowupChange(stepId,val){
  const sel=curAnswers[stepId]||{};
  sel.followupText=val;
  curAnswers[stepId]=sel;
  updateNavButtonState();
  scheduleSave();
}
function onTextAnswerChange(stepId,val){
  curAnswers[stepId]=val;
  updateNavButtonState();
  scheduleSave();
}
function updateNavButtonState(){
  // 매 글자마다 전체를 다시 그리면 입력 포커스가 끊기므로, 다음 버튼의 활성/비활성만 가볍게 갱신
  const step=curStep();
  const nav=document.querySelector('.nav-row .btn.primary');
  if(nav)nav.disabled=!isStepAnswerValid(step);
}
async function renderShareStep(step){
  const bodyEl=document.getElementById('wsStepBody');
  if(!bodyEl)return;
  const others=await fetchOtherSubmissions(step.scope);
  const refStep=(curWorksheet.steps||[]).find(s=>s.id===step.basedOn);
  const items=others.map(o=>{
    let text='';
    const a=(o.answers||{})[step.basedOn];
    if(refStep?.type==='choice'){
      const opt=(refStep.options||[]).find(x=>x.id===a?.optionId);
      text=opt?`${opt.title}${a.followupText?' · '+a.followupText:''}`:'';
    }else{
      text=a||'';
    }
    if(!text)return '';
    const who=step.anonymous?'':escHtml(o.studentLabel);
    return `<div class="share-item">${who?`<div class="who">${who}</div>`:''}<div>${escHtml(text)}</div></div>`;
  }).filter(Boolean).join('');
  const val=curAnswers[step.id]||'';
  const replyHtml=step.allowReply?`<label style="margin-top:12px;">내 생각 남기기</label><textarea oninput="onTextAnswerChange('${esc(step.id)}',this.value)">${escHtml(val)}</textarea>`:'';
  bodyEl.innerHTML=`<div class="step-title">${escHtml(step.title||'')}</div>
    <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
    ${items||'<div style="color:#bbb;font-size:12px;">아직 다른 학생의 답변이 없어요. 잠시 후 다시 확인해보세요.</div>'}
    ${replyHtml}`+renderNavRow();
}
async function renderStatsStep(step){
  const bodyEl=document.getElementById('wsStepBody');
  if(!bodyEl)return;
  const others=await fetchOtherSubmissions(step.scope);
  const refStep=(curWorksheet.steps||[]).find(s=>s.id===step.basedOn);
  const counts={};(refStep?.options||[]).forEach(o=>counts[o.id]=0);
  let total=0;
  others.forEach(o=>{
    const a=(o.answers||{})[step.basedOn];
    if(a?.optionId&&counts[a.optionId]!==undefined){counts[a.optionId]++;total++;}
  });
  const bars=(refStep?.options||[]).map(o=>{
    const n=counts[o.id]||0;
    const pct=total?Math.round(n/total*100):0;
    return `<div class="bar-row"><div class="bl"><span>${escHtml(o.title)}</span><span>${n}명 · ${pct}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div></div>`;
  }).join('');
  bodyEl.innerHTML=`<div class="step-title">${escHtml(step.title||'')}</div>
    <div style="font-size:13px;color:#333;margin-bottom:14px;">${escHtml(step.prompt||'')}</div>
    ${total?bars:'<div style="color:#bbb;font-size:12px;">아직 집계할 응답이 없어요.</div>'}`+renderNavRow();
}
// share/reveal_stats에서 "다른 학생들"을 가져옴. scope가 group이면 같은 모둠(group_code)만, class면 같은 반 전체.
// 본인 것도 포함(자기 의견도 비교해볼 수 있게), 익명 처리를 위해 이름은 "학생 N" 인덱스로 라벨링해둠.
async function fetchOtherSubmissions(scope){
  if(PREVIEW_MODE)return []; // 미리보기에서는 실제 학생 데이터를 조회하지 않음
  const{data}=await sb.from('worksheet_submissions').select('*').eq('worksheet_id',curWorksheet.id);
  let list=data||[];
  if(scope==='group'){
    const myGroup=curSub?.group_code;
    list=list.filter(s=>s.group_code&&s.group_code===myGroup);
  }else{
    const classIds=new Set(roster.filter(r=>r.class_name===selClass).map(r=>r.id));
    list=list.filter(s=>classIds.has(s.student_id));
  }
  list.forEach((s,i)=>{
    const r=roster.find(x=>x.id===s.student_id);
    s.studentLabel=r?`${r.number||''} ${r.name}`:`학생 ${i+1}`;
  });
  return list;
}
function goStep(dir){
  curStepIdx=Math.max(0,Math.min((curWorksheet.steps||[]).length-1,curStepIdx+dir));
  renderStepWizard();
  scheduleSave();
}
let saveTimer=null;
function scheduleSave(){
  if(PREVIEW_MODE)return; // 미리보기에서는 저장하지 않음(배너도 안 띄움)
  const banner=document.getElementById('wsSaveBanner');
  if(banner){banner.style.display='block';banner.textContent='저장 중...';}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    await saveDraft();
    if(banner){banner.textContent='임시 저장됨 ✓';setTimeout(()=>{if(banner)banner.style.display='none';},1200);}
  },500);
}
async function saveDraft(){
  if(PREVIEW_MODE)return;
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers:curAnswers,submitted:false,current_step:curStepIdx,updated_at:new Date().toISOString()};
  if(curSub?.group_code)payload.group_code=curSub.group_code;
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  if(data)curSub=data;
}
async function finalSubmit(){
  if(PREVIEW_MODE){alert('미리보기 모드예요. 학생용 링크로 접속했을 때만 실제로 제출돼요.');return;}
  if(!confirm('제출하면 더 이상 수정할 수 없어요. 제출할까요?'))return;
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers:curAnswers,submitted:true,current_step:curStepIdx,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  if(curSub?.group_code)payload.group_code=curSub.group_code;
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  curSub=data||payload;
  renderSubmittedScreen();
}

// ================= 커스텀 HTML 학습지(kind='custom_html') 렌더러 =================
// 선생님이 완성된 HTML 파일을 통째로 붙여넣은 학습지를 iframe으로 그대로 띄움. 디자인/로직은 원본 그대로고,
// 반/번호/이름은 이미 위에서 확인된 값을 그 파일의 접수 화면에 미리 채워 넣고 자동으로 시작시켜줌
// (그 파일 안의 입력칸 id가 inClass/inNumber/inName/startBtn일 때만 동작 - 없으면 그냥 원본 화면 그대로 보임).
//
// 이와 별개로, iframe이 다 로드되면 부모가 postMessage로 학생 신원(teacherId 포함)을 한 번 더 보내줌.
// "나와 맞는 사상가 찾기"처럼 저 특정 id(inClass 등)에 기대지 않는 학습지(예: 윤리토론장)는 이 메시지를
// 직접 받아서 "OOO님이 맞나요?" 같은 자체 확인 화면을 그릴 수 있음. 두 방식은 서로 배타적이지 않고 공존함
// (기존 학습지는 bootstrap 스크립트만 보고, 새로 만드는 학습지는 postMessage만 봐도 됨).
function renderCustomHtmlWorksheet(isPreview){
  const app=document.getElementById('app');
  const html=curWorksheet.custom_html||'';
  let srcdoc=html;
  if(!isPreview){
    const bootstrap=`<script>
window.addEventListener('DOMContentLoaded', function(){
  try{
    var c=document.getElementById('inClass'), n=document.getElementById('inNumber'), nm=document.getElementById('inName');
    var wantedCls=${JSON.stringify((selClass||'').replace(/반$/,''))};
    if(c){ c.value=wantedCls; if(c.value!==wantedCls) c.value=${JSON.stringify(selClass||'')}; }
    if(n) n.value=${JSON.stringify(String(selStudent.number||''))};

    if(btn && c && c.value) btn.click();
  }catch(e){}
});
<\/script>`;
    srcdoc=html.match(/<\/body>/i)?html.replace(/<\/body>/i,bootstrap+'</body>'):html+bootstrap;

  frame.srcdoc=srcdoc; // 속성이 아니라 프로퍼티로 지정 - 큰 HTML 안 따옴표/특수문자 이스케이프 걱정 없음
  // iframe 문서가 완전히 로드된 뒤(=그 안의 스크립트가 message 리스너를 이미 등록해뒀을 시점)에
  // 학생 신원을 한 번 보내줌. 미리보기에선 실제 학생이 없으니 안내용 더미 정보를 보냄(teacherId도 없음).
  frame.addEventListener('load',function(){
    try{
      const identity=isPreview
        ?{teacherId:null,preview:true,student:{class:'',number:'',name:'미리보기',id:null}}
        :{teacherId:TEACHER_ID,preview:false,student:{class:selClass||'',number:selStudent.number||'',name:selStudent.name||'',id:selStudent.id}};
      frame.contentWindow.postMessage(Object.assign({type:'sittdartha_identity'},identity),'*');

// ================= 사상가 찾기(philosopher_quiz) 전용 엔진 =================
// 학습지 steps[0]에 { type:'philosopher_quiz', title, subtitle, philosophers:{...PH}, basicItems:[...], caseItems:[...] }
// 형태로 통째로 저장돼 있는 학습지를 위한 별도 화면. 반/번호/이름·PIN은 이미 위에서 확인됐으므로 여기선 안 물어봄.
//
// mode:'axis'인 경우: 문항마다 철학자 투표가 아니라 축(예: 정치/젠더/계급/개방성) 하나 + 방향(+1/-1)만 태깅됨.
// (opts 형식: [텍스트, 축이름, 방향]). 응답을 다 모아 축별 점수를 -5~+5로 재조정한 뒤, 가장 강하게 기운 축
// 하나로 cfg.axisPhilosophers[축][방향]에 정의된 철학자를 매칭시킴. 학생에겐 매칭된 철학자만 보이고,
// 축 점수·4글자 코드는 교사 전용 패널에만 나옴 - 사실상 성향 검사를 심리테스트로 위장하는 구조.
// mode가 없으면(기존 학습지) 예전처럼 옵션마다 철학자 키를 직접 투표하는 방식 그대로 동작함.
let pqCfg=null, pqIdx=0, pqAnswers={}, pqAnswerLog=[], pqRawAnswers=[], pqScores={}, pqDomainScores={}, pqAllQ=[], pqWinner=null;
const PQ_AXIS_LETTERS={정치:['C','P'],젠더:['E','F'],계급:['M','S'],개방성:['T','O']}; // [음(-)쪽 글자, 양(+)쪽 글자]
const PQ_AXIS_LABELS={정치:['보수','진보'],젠더:['이퀄','페미'],계급:['능력주의','평등지향'],개방성:['전통','개방']};
function pqStart(cfg){
  pqCfg=cfg;

      <div class="pq-foot">

function pqChoose(oi){
  const cur=pqAllQ[pqIdx];
  const o=cur.opts[oi];
  const label=o[0];
  if(cur.phase==='dilemma'){
    if(pqCfg.mode==='axis'){

      pqDomainScores[domain]=(pqDomainScores[domain]||0)+dir;
      pqAnswerLog.push({q:cur.q,domain,dir});

      const key=o[1];
      pqScores[key]=(pqScores[key]||0)+1;
      pqAnswerLog.push({scene:cur.scene,key});

// 축 점수를 -5~+5로 재조정 (그 축에 해당하는 문항 수 기준으로 나눔 - 문항 수가 축마다 달라도 정확히 계산됨)
function pqRescaleAxisScores(){
  const counts={};
  (pqCfg.caseItems||[]).forEach(it=>{
    (it.opts||[]).forEach(o=>{ if(o[1])counts[o[1]]=(counts[o[1]]||0); });
  });
  Object.keys(pqDomainScores).forEach(d=>{
    counts[d]=(pqCfg.caseItems||[]).filter(it=>(it.opts||[]).some(o=>o[1]===d)).length||1;
  });
  const rescaled={};
  Object.keys(pqDomainScores).forEach(d=>{
    rescaled[d]=Math.round((pqDomainScores[d]/counts[d])*5*10)/10;
  });
  return rescaled;
}
function pqAxisCode(rescaled){
  return Object.keys(pqCfg.axisPhilosophers||{}).filter(d=>d in rescaled).map(d=>{
    const pair=PQ_AXIS_LETTERS[d]||['-','+'];
    return rescaled[d]>=0?pair[1]:pair[0];
  }).join('');
}
function pqAxisBarsHtml(rescaled){
  return Object.keys(pqCfg.axisPhilosophers||{}).filter(d=>d in rescaled).map(d=>{
    const score=rescaled[d];
    const pct=Math.round((score+5)/10*100);
    const lab=PQ_AXIS_LABELS[d]||['-','+'];
    return `<div class="pq-vrow"><div class="top"><span>${escHtml(lab[0])}</span><span>${escHtml(d)} ${score>0?'+':''}${score}</span><span>${escHtml(lab[1])}</span></div><div class="track"><div class="fill" style="width:${pct}%;"></div></div></div>`;
  }).join('');
}

        <div class="pq-cardrow two">${(w.strengths||[]).map(([t,d])=>`<div class="pq-card strength"><div class="t">${escHtml(t)}</div><div class="d">${escHtml(d)}</div></div>`).join('')}</div>

      </div>
      <div class="pq-closing">${escHtml(w.closing||'')}</div>
      <div class="pq-toggle" onclick="document.getElementById('pqPanel').classList.toggle('hide')">🔒 (교사 전용) 상세 성향 분석 보기</div>
      <div class="pq-panel hide" id="pqPanel">
        <div class="pq-panel-note">학생 눈엔 위 결과만 보여요. 아래는 조 편성 등에 참고하시라고 교사에게만 보이는 성향 분석이에요.</div>
        <div style="text-align:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;color:#1c231c;margin-bottom:14px;letter-spacing:.05em;">${escHtml(pqAxisCode(rescaled))}</div>
        ${pqAxisBarsHtml(rescaled)}
      </div>
      <button class="pq-retry" onclick="pqRetry()">🔄 다시 판결받기</button>
    </div>
    <div class="pq-footnote">판결은 재미로만 참고해 주세요.</div>
  </div></div>`;
  pqSaveAxis(rescaled,dominant,winnerKey);
}
async function pqSaveAxis(rescaled,dominant,winnerKey){
  if(PREVIEW_MODE)return;
  const PH=pqCfg.philosophers;
  const answers={
    winner:winnerKey, winnerName:PH[winnerKey]?.cn||'',
    axisScores:rescaled,
    axisCode:pqAxisCode(rescaled),
    dominantAxis:dominant.domain,
    rawAnswers:pqAnswerLog
  };
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers,submitted:true,current_step:1,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  curSub=data||payload;
}
async function pqSave(){
  if(PREVIEW_MODE)return; // 미리보기 모드에선 저장 안 함
  const PH=pqCfg.philosophers;
  const answers={
    winner:pqWinner, winnerName:PH[pqWinner]?.cn||'',
    scores:pqScores,
    basicAnswers:pqRawAnswers.map(r=>r.a),
    matchedScenes:pqAnswerLog
  };
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers,submitted:true,current_step:1,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  curSub=data||payload;
}
function pqRetry(){ pqStart(pqCfg); }
// ============================================================================

init();
</script>
