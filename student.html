<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>온라인 학습지</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Pretendard','Malgun Gothic',sans-serif;background:#f5f6fa;color:#1a1a2e;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
.hd{font-size:18px;font-weight:700;margin:10px 0 18px;text-align:center;}
.card{background:#fff;border:1px solid #e0e0ee;border-radius:14px;padding:16px;margin-bottom:12px;}
.btn{display:block;width:100%;padding:14px;font-size:14px;border-radius:10px;border:1px solid #e0e0ee;background:#fff;color:#1a1a2e;cursor:pointer;text-align:left;margin-bottom:8px;font-family:inherit;}
.btn:hover{background:#f8f8ff;}
.btn.primary{background:#3B82F6;color:#fff;border:none;text-align:center;font-weight:600;}
.btn.primary:disabled{background:#c7d2fe;cursor:default;}
.btn.ghost{border:1px solid #e0e0ee;background:#fff;color:#555;text-align:center;}
.back{font-size:12px;color:#888;cursor:pointer;margin-bottom:10px;display:inline-block;}
.loading{text-align:center;color:#999;font-size:13px;padding:30px 0;}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;}
.pill.done{background:#f6ffed;color:#389e0d;}
.pill.draft{background:#fffbe6;color:#d48806;}
.pill.new{background:#f0f5ff;color:#1D4ED8;}
label{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:6px;}
textarea,input[type=text]{width:100%;padding:11px;border:1px solid #e0e0ee;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;}
textarea{min-height:110px;}
textarea:disabled,input:disabled{background:#f8f8fa;color:#555;}
.qwrap{margin-bottom:16px;}
.banner{padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;}
.banner.done{background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f;}
.banner.saving{background:#f0f5ff;color:#1D4ED8;border:1px solid #adc6ff;}
.name-btn{display:flex;justify-content:space-between;align-items:center;}
.stepper{display:flex;justify-content:space-between;margin-bottom:18px;overflow-x:auto;gap:4px;}
.step-dot{flex:1;text-align:center;min-width:44px;}
.step-dot .circle{width:26px;height:26px;border-radius:50%;background:#eee;color:#999;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0 auto 4px;}
.step-dot.active .circle{background:#e5533d;color:#fff;}
.step-dot.done .circle{background:#3B82F6;color:#fff;}
.step-dot .lbl{font-size:10px;color:#999;}
.step-dot.active .lbl{color:#e5533d;font-weight:600;}
.step-title{font-size:15px;font-weight:700;margin-bottom:12px;}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media (max-width:480px){.choice-grid{grid-template-columns:1fr;}}
.choice-card{border:2px solid #e0e0ee;border-radius:10px;padding:12px;cursor:pointer;background:#fff;}
.choice-card.selected{border-color:#e5533d;background:#fff5f3;}
.choice-card .ct{font-weight:700;color:#c0392b;margin-bottom:6px;}
.choice-card ul{margin:0;padding-left:16px;font-size:12px;color:#555;line-height:1.6;}
.share-item{border:1px solid #e0e0ee;border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13px;}
.share-item .who{font-size:11px;color:#999;margin-bottom:3px;}
.bar-row{margin-bottom:10px;}
.bar-row .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bar-track{background:#f0f0f5;border-radius:6px;height:10px;overflow:hidden;}
.bar-fill{background:#3B82F6;height:100%;border-radius:6px;}
.nav-row{display:flex;gap:8px;margin-top:16px;}
.nav-row .btn{margin-bottom:0;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">불러오는 중...</div></div>
<script>
const SUPABASE_URL='https://uxycuvpzsyfvsbwnrexv.supabase.co';
const SUPABASE_KEY='sb_publishable_1aMfdIKdr6sUwI0vshYKXw_e9qVrPJj';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const TEACHER_ID=params.get('t')||localStorage.getItem('ws_teacher_id')||'';
if(TEACHER_ID)localStorage.setItem('ws_teacher_id',TEACHER_ID);
// 선생님이 학습지 관리 화면에서 "미리보기" 버튼을 누르면 이 모드로 열림 - 저장 전 초안도 볼 수 있게
// localStorage로 title/steps만 잠깐 건네받고, DB 조회·저장은 전혀 하지 않음(제출/답글도 다 비활성)
const PREVIEW_MODE=params.get('preview')==='1';
const PREVIEW_TOKEN=params.get('draft')||'';
// 선생님이 학습지 관리 목록에서 특정 학습지 이름(알약 버튼)을 눌러서 들어온 경우 - 학생이 반/이름만 고르면
// 학습지 목록 화면을 건너뛰고 바로 이 학습지로 들어감
const WS_PARAM=params.get('ws')||'';

let roster=[],selClass=localStorage.getItem('ws_sel_class')||'',selStudent=null;

function escHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function esc(s){return String(s??'').replace(/'/g,"\\'");}

async function init(){
  const app=document.getElementById('app');
  if(PREVIEW_MODE){
    let draft=null;
    try{draft=JSON.parse(localStorage.getItem('ws_preview_'+PREVIEW_TOKEN)||'null');}catch(e){}
    if(!draft||!draft.steps){
      app.innerHTML='<div class="hd">미리보기</div><div class="card">미리보기 정보를 찾을 수 없어요. 학습지 관리 화면에서 미리보기 버튼을 다시 눌러주세요.</div>';
      return;
    }
    curWorksheet={id:'preview',title:draft.title,steps:draft.steps,access_code:null};
    curSub=null;curAnswers={};curStepIdx=0;curAccessUnlocked=true;
    selStudent={id:'preview',name:'미리보기'};selClass='';
    renderStepWizard();
    return;
  }
  if(!TEACHER_ID){
    app.innerHTML='<div class="hd">온라인 학습지</div><div class="card">링크가 올바르지 않아요. 선생님께 받은 링크로 다시 들어와 주세요.</div>';
    return;
  }
  const{data,error}=await sb.from('public_roster').select('*').eq('user_id',TEACHER_ID).order('class_name').order('number');
  if(error){
    app.innerHTML=`<div class="hd">온라인 학습지</div><div class="card">명단을 불러오지 못했어요.<br/><span style="color:#999;font-size:11px;">${escHtml(error.message)}</span></div>`;
    return;
  }
  roster=data||[];
  const savedStudentId=localStorage.getItem('ws_sel_student_'+selClass);
  if(selClass&&savedStudentId){
    const s=roster.find(r=>String(r.id)===savedStudentId&&r.class_name===selClass);
    if(s)selStudent=s;
  }
  if(selStudent)renderPinGate();
  else if(selClass)renderStudentPicker();
  else renderClassPicker();
}
// 학생이 정해진 다음 어디로 갈지: ws 파라미터로 들어왔으면 그 학습지로 바로, 아니면 평소처럼 목록으로
function proceedAfterStudentKnown(){
  if(WS_PARAM){openWorksheet(Number(WS_PARAM));return;}
  renderWorksheetList();
}
// 학습지 쪽으로 넘어가기 전에 매번(반/학생을 다시 고르지 않고 이어서 들어와도) 4자리 고유번호를 확인함.
// 처음 쓰는 학생이면(고유번호가 아직 없으면) 지금 입력한 값이 그대로 고유번호로 등록됨(check_student_pin RPC가 처리).
function renderPinGate(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="switchStudent()">← 다른 사람으로 전환</span>
    <div class="hd">${escHtml(selStudent.name)}님</div>
    <div class="card"><label>고유번호 4자리를 입력하세요 (처음이면 지금 입력한 번호로 새로 만들어져요)</label>
    <input type="text" id="wsPinInp" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" style="letter-spacing:10px;font-size:22px;text-align:center;" onkeydown="if(event.key==='Enter')checkPin()"/>
    <div id="wsPinErr" style="color:#dc2626;font-size:12px;margin-top:6px;"></div>
    <button class="btn primary" style="margin-top:12px;" onclick="checkPin()">확인</button>
    </div>`;
  setTimeout(()=>document.getElementById('wsPinInp')?.focus(),0);
}
async function checkPin(){
  const inp=document.getElementById('wsPinInp');
  const v=(inp?.value||'').trim();
  const errEl=document.getElementById('wsPinErr');
  if(!/^\d{4}$/.test(v)){if(errEl)errEl.textContent='숫자 4자리를 입력해주세요.';return;}
  const{data,error}=await sb.rpc('check_student_pin',{p_student_id:selStudent.id,p_pin:v});
  if(error){if(errEl)errEl.textContent='확인 중 오류가 발생했어요. 다시 시도해주세요.';return;}
  if(!data){if(errEl)errEl.textContent='고유번호가 맞지 않아요. 잘 모르겠으면 선생님께 여쭤보세요.';if(inp){inp.value='';inp.focus();}return;}
  proceedAfterStudentKnown();
}

function renderClassPicker(){
  const classNames=[...new Set(roster.map(r=>r.class_name))];
  const app=document.getElementById('app');
  app.innerHTML=`<div class="hd">🧭 온라인 학습지</div>
    <div class="card"><label>반을 선택하세요</label>
    ${classNames.map(cn=>`<button class="btn" onclick="pickClass('${esc(cn)}')">${escHtml(cn)}</button>`).join('')||'<div style="color:#999;font-size:12px;">등록된 반이 없어요.</div>'}
    </div>`;
}
function pickClass(cn){
  selClass=cn;localStorage.setItem('ws_sel_class',cn);
  renderStudentPicker();
}
function renderStudentPicker(){
  const app=document.getElementById('app');
  const students=roster.filter(r=>r.class_name===selClass);
  app.innerHTML=`<span class="back" onclick="selClass='';renderClassPicker();">← 반 다시 고르기</span>
    <div class="hd">${escHtml(selClass)}</div>
    <div class="card"><label>본인 이름을 선택하세요</label>
    ${students.map(s=>`<button class="btn name-btn" onclick='pickStudent(${JSON.stringify(s.id)})'><span>${escHtml(`${s.number||''} ${s.name}`)}</span></button>`).join('')||'<div style="color:#999;font-size:12px;">학생이 없어요.</div>'}
    </div>`;
}
function pickStudent(id){
  const s=roster.find(r=>r.id===id);
  if(!s)return;
  selStudent=s;
  localStorage.setItem('ws_sel_student_'+selClass,String(id));
  renderPinGate();
}
function switchStudent(){
  selStudent=null;
  renderStudentPicker();
}

async function renderWorksheetList(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="switchStudent()">← 다른 사람으로 전환</span>
    <div class="hd">${escHtml(selStudent.name)}님, 안녕하세요 👋</div>
    <div class="loading">학습지 목록을 불러오는 중...</div>`;
  const{data:sheets}=await sb.from('worksheets').select('*').eq('user_id',TEACHER_ID).eq('active',true)
    .or(`class_name.is.null,class_name.eq.${selClass}`).order('created_at',{ascending:false});
  const ids=(sheets||[]).map(w=>w.id);
  let subs=[];
  if(ids.length){
    const{data}=await sb.from('worksheet_submissions').select('*').eq('student_id',selStudent.id).in('worksheet_id',ids);
    subs=data||[];
  }
  const subByWs={};subs.forEach(s=>subByWs[s.worksheet_id]=s);
  app.innerHTML=`<span class="back" onclick="switchStudent()">← 다른 사람으로 전환</span>
    <div class="hd">${escHtml(selStudent.name)}님, 안녕하세요 👋</div>
    <div class="card"><label>학습지를 선택하세요</label>
    ${(sheets||[]).map(w=>{
      const sub=subByWs[w.id];
      const pill=sub?.submitted?'<span class="pill done">제출완료</span>':(sub?'<span class="pill draft">작성중</span>':'<span class="pill new">새 학습지</span>');
      return `<button class="btn name-btn" onclick="openWorksheet(${w.id})"><span>${escHtml(w.title)}</span>${pill}</button>`;
    }).join('')||'<div style="color:#999;font-size:12px;">지금 볼 수 있는 학습지가 없어요.</div>'}
    </div>`;
}

let curWorksheet=null,curSub=null,curAnswers={},curStepIdx=0,curAccessUnlocked=false;

async function openWorksheet(wsId){
  const app=document.getElementById('app');
  app.innerHTML='<div class="loading">불러오는 중...</div>';
  const{data:w}=await sb.from('worksheets').select('*').eq('id',wsId).single();
  if(!w){app.innerHTML='<div class="card">학습지를 찾을 수 없어요.</div>';return;}
  const{data:sub}=await sb.from('worksheet_submissions').select('*').eq('worksheet_id',wsId).eq('student_id',selStudent.id).maybeSingle();
  curWorksheet=w;curSub=sub;curAnswers=sub?.answers?{...sub.answers}:{};
  curStepIdx=sub?.current_step||0;
  curAccessUnlocked=!w.access_code||!!sub; // 이미 시작한 적 있으면(제출물 존재) 코드 다시 안 물어봄
  if(sub?.submitted){renderSubmittedScreen();return;}
  if(w.access_code&&!curAccessUnlocked){renderAccessGate();return;}
  const needsGroup=(w.steps||[]).some(s=>s.scope==='group');
  if(needsGroup&&!sub?.group_code){renderGroupGate();return;}
  renderStepWizard();
}
function renderAccessGate(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    <div class="card"><label>선생님이 알려주신 입장 코드를 입력하세요</label>
    <input type="text" id="wsAccessInp" placeholder="입장 코드"/>
    <div id="wsAccessErr" style="color:#dc2626;font-size:12px;margin-top:6px;"></div>
    <button class="btn primary" style="margin-top:10px;" onclick="checkAccessCode()">입장하기</button>
    </div>`;
}
function checkAccessCode(){
  const v=(document.getElementById('wsAccessInp')?.value||'').trim();
  if(v!==curWorksheet.access_code){
    const e=document.getElementById('wsAccessErr');if(e)e.textContent='코드가 맞지 않아요. 다시 확인해주세요.';
    return;
  }
  curAccessUnlocked=true;
  const needsGroup=(curWorksheet.steps||[]).some(s=>s.scope==='group');
  if(needsGroup&&!curSub?.group_code){renderGroupGate();return;}
  renderStepWizard();
}
function renderGroupGate(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    <div class="card"><label>모둠 이름을 입력하세요 (같은 모둠 친구들과 똑같이 입력해주세요)</label>
    <input type="text" id="wsGroupInp" placeholder="예: 3모둠"/>
    <button class="btn primary" style="margin-top:10px;" onclick="saveGroupCode()">시작하기</button>
    </div>`;
}
async function saveGroupCode(){
  const v=(document.getElementById('wsGroupInp')?.value||'').trim();
  if(!v){alert('모둠 이름을 입력해주세요.');return;}
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers:curAnswers,submitted:false,group_code:v,current_step:curStepIdx,updated_at:new Date().toISOString()};
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  curSub=data||payload;
  renderStepWizard();
}
function renderSubmittedScreen(){
  const app=document.getElementById('app');
  app.innerHTML=`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    <div class="banner done">✅ 제출 완료 - 더 이상 수정할 수 없어요.</div>
    <div class="card" style="text-align:center;color:#888;font-size:13px;padding:30px 16px;">수고했어요! 학습지 목록으로 돌아가서 다른 학습지를 진행할 수 있어요.</div>`;
}

// ===== 단계 진행 =====
function renderStepper(){
  const steps=curWorksheet.steps||[];
  return `<div class="stepper">${steps.map((s,i)=>`<div class="step-dot ${i===curStepIdx?'active':(i<curStepIdx?'done':'')}">
    <div class="circle">${i<curStepIdx?'✓':i+1}</div><div class="lbl">${escHtml(s.label||s.title||'')}</div>
  </div>`).join('')}</div>`;
}
function curStep(){return (curWorksheet.steps||[])[curStepIdx];}
function isLastStep(){return curStepIdx===(curWorksheet.steps||[]).length-1;}

async function renderStepWizard(){
  const step=curStep();
  if(!step)return;
  const app=document.getElementById('app');
  let bodyHtml='<div class="loading">불러오는 중...</div>';
  app.innerHTML=`${PREVIEW_MODE?`<span class="back" onclick="window.close()">✕ 미리보기 닫기</span><div class="banner saving">🔍 미리보기 모드 - 여기서 입력한 내용은 저장되지 않아요</div>`:`<span class="back" onclick="renderWorksheetList()">← 학습지 목록으로</span>`}
    <div class="hd">${escHtml(curWorksheet.title)}</div>
    ${renderStepper()}
    ${PREVIEW_MODE?'':'<div id="wsSaveBanner" class="banner saving" style="display:none;">저장 중...</div>'}
    <div class="card" id="wsStepBody">${bodyHtml}</div>`;
  await renderStepBody();
}
async function renderStepBody(){
  const step=curStep();
  const bodyEl=document.getElementById('wsStepBody');
  if(!bodyEl||!step)return;
  let inner='';
  if(step.type==='intro'){
    inner=`<div class="step-title">${escHtml(step.title||'')}</div><div style="font-size:13px;color:#555;white-space:pre-wrap;line-height:1.7;">${escHtml(step.body||'')}</div>`;
  }else if(step.type==='choice'){
    const sel=curAnswers[step.id]||{};
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      <div class="choice-grid">${(step.options||[]).map(o=>`<div class="choice-card ${sel.optionId===o.id?'selected':''}" onclick="pickChoiceOption('${esc(step.id)}','${esc(o.id)}')">
        <div class="ct">${escHtml(o.title)}</div>
        <ul>${(o.bullets||[]).map(b=>`<li>${escHtml(b)}</li>`).join('')}</ul>
      </div>`).join('')}</div>
      ${step.followup?`<label>${escHtml(step.followup.label||'')}</label><input type="text" id="wsFollowupInp" value="${escHtml(sel.followupText||'')}" oninput="onFollowupChange('${esc(step.id)}',this.value)"/>`:''}`;
  }else if(step.type==='text'||step.type==='reflection'){
    const val=curAnswers[step.id]||'';
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      ${step.multiline===false
        ?`<input type="text" value="${escHtml(val)}" oninput="onTextAnswerChange('${esc(step.id)}',this.value)"/>`
        :`<textarea oninput="onTextAnswerChange('${esc(step.id)}',this.value)">${escHtml(val)}</textarea>`}`;
  }else if(step.type==='share'){
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      <div class="loading">다른 학생 답변을 불러오는 중...</div>`;
    bodyEl.innerHTML=inner;
    await renderShareStep(step);
    return;
  }else if(step.type==='reveal_stats'){
    inner=`<div class="step-title">${escHtml(step.title||'')}</div>
      <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
      <div class="loading">집계하는 중...</div>`;
    bodyEl.innerHTML=inner;
    await renderStatsStep(step);
    return;
  }
  bodyEl.innerHTML=inner+renderNavRow();
}
function renderNavRow(){
  const step=curStep();
  const canGoNext=isStepAnswerValid(step);
  return `<div class="nav-row">
    ${curStepIdx>0?`<button class="btn ghost" style="flex:1;" onclick="goStep(-1)">← 이전</button>`:''}
    <button class="btn primary" style="flex:2;" ${canGoNext?'':'disabled'} onclick="${isLastStep()?'finalSubmit()':'goStep(1)'}">${isLastStep()?'제출하기':'다음 →'}</button>
  </div>${isLastStep()?'<div style="font-size:11px;color:#aaa;text-align:center;margin-top:6px;">제출하면 더 이상 수정할 수 없어요. 신중하게 확인한 뒤 눌러주세요.</div>':''}`;
}
function isStepAnswerValid(step){
  if(!step)return false;
  if(step.type==='intro'||step.type==='share'||step.type==='reveal_stats')return true;
  if(step.type==='choice'){
    const sel=curAnswers[step.id];
    if(!sel||!sel.optionId)return false;
    if(step.followup?.required&&!(sel.followupText||'').trim())return false;
    return true;
  }
  if(step.type==='text'||step.type==='reflection')return !!(curAnswers[step.id]||'').trim();
  return true;
}
function pickChoiceOption(stepId,optId){
  const sel=curAnswers[stepId]||{};
  sel.optionId=optId;
  curAnswers[stepId]=sel;
  renderStepBody();
  scheduleSave();
}
function onFollowupChange(stepId,val){
  const sel=curAnswers[stepId]||{};
  sel.followupText=val;
  curAnswers[stepId]=sel;
  updateNavButtonState();
  scheduleSave();
}
function onTextAnswerChange(stepId,val){
  curAnswers[stepId]=val;
  updateNavButtonState();
  scheduleSave();
}
function updateNavButtonState(){
  // 매 글자마다 전체를 다시 그리면 입력 포커스가 끊기므로, 다음 버튼의 활성/비활성만 가볍게 갱신
  const step=curStep();
  const nav=document.querySelector('.nav-row .btn.primary');
  if(nav)nav.disabled=!isStepAnswerValid(step);
}
async function renderShareStep(step){
  const bodyEl=document.getElementById('wsStepBody');
  if(!bodyEl)return;
  const others=await fetchOtherSubmissions(step.scope);
  const refStep=(curWorksheet.steps||[]).find(s=>s.id===step.basedOn);
  const items=others.map(o=>{
    let text='';
    const a=(o.answers||{})[step.basedOn];
    if(refStep?.type==='choice'){
      const opt=(refStep.options||[]).find(x=>x.id===a?.optionId);
      text=opt?`${opt.title}${a.followupText?' · '+a.followupText:''}`:'';
    }else{
      text=a||'';
    }
    if(!text)return '';
    const who=step.anonymous?'':escHtml(o.studentLabel);
    return `<div class="share-item">${who?`<div class="who">${who}</div>`:''}<div>${escHtml(text)}</div></div>`;
  }).filter(Boolean).join('');
  const val=curAnswers[step.id]||'';
  const replyHtml=step.allowReply?`<label style="margin-top:12px;">내 생각 남기기</label><textarea oninput="onTextAnswerChange('${esc(step.id)}',this.value)">${escHtml(val)}</textarea>`:'';
  bodyEl.innerHTML=`<div class="step-title">${escHtml(step.title||'')}</div>
    <div style="font-size:13px;color:#333;margin-bottom:10px;">${escHtml(step.prompt||'')}</div>
    ${items||'<div style="color:#bbb;font-size:12px;">아직 다른 학생의 답변이 없어요. 잠시 후 다시 확인해보세요.</div>'}
    ${replyHtml}`+renderNavRow();
}
async function renderStatsStep(step){
  const bodyEl=document.getElementById('wsStepBody');
  if(!bodyEl)return;
  const others=await fetchOtherSubmissions(step.scope);
  const refStep=(curWorksheet.steps||[]).find(s=>s.id===step.basedOn);
  const counts={};(refStep?.options||[]).forEach(o=>counts[o.id]=0);
  let total=0;
  others.forEach(o=>{
    const a=(o.answers||{})[step.basedOn];
    if(a?.optionId&&counts[a.optionId]!==undefined){counts[a.optionId]++;total++;}
  });
  const bars=(refStep?.options||[]).map(o=>{
    const n=counts[o.id]||0;
    const pct=total?Math.round(n/total*100):0;
    return `<div class="bar-row"><div class="bl"><span>${escHtml(o.title)}</span><span>${n}명 · ${pct}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div></div>`;
  }).join('');
  bodyEl.innerHTML=`<div class="step-title">${escHtml(step.title||'')}</div>
    <div style="font-size:13px;color:#333;margin-bottom:14px;">${escHtml(step.prompt||'')}</div>
    ${total?bars:'<div style="color:#bbb;font-size:12px;">아직 집계할 응답이 없어요.</div>'}`+renderNavRow();
}
// share/reveal_stats에서 "다른 학생들"을 가져옴. scope가 group이면 같은 모둠(group_code)만, class면 같은 반 전체.
// 본인 것도 포함(자기 의견도 비교해볼 수 있게), 익명 처리를 위해 이름은 "학생 N" 인덱스로 라벨링해둠.
async function fetchOtherSubmissions(scope){
  if(PREVIEW_MODE)return []; // 미리보기에서는 실제 학생 데이터를 조회하지 않음
  const{data}=await sb.from('worksheet_submissions').select('*').eq('worksheet_id',curWorksheet.id);
  let list=data||[];
  if(scope==='group'){
    const myGroup=curSub?.group_code;
    list=list.filter(s=>s.group_code&&s.group_code===myGroup);
  }else{
    const classIds=new Set(roster.filter(r=>r.class_name===selClass).map(r=>r.id));
    list=list.filter(s=>classIds.has(s.student_id));
  }
  list.forEach((s,i)=>{
    const r=roster.find(x=>x.id===s.student_id);
    s.studentLabel=r?`${r.number||''} ${r.name}`:`학생 ${i+1}`;
  });
  return list;
}
function goStep(dir){
  curStepIdx=Math.max(0,Math.min((curWorksheet.steps||[]).length-1,curStepIdx+dir));
  renderStepWizard();
  scheduleSave();
}
let saveTimer=null;
function scheduleSave(){
  if(PREVIEW_MODE)return; // 미리보기에서는 저장하지 않음(배너도 안 띄움)
  const banner=document.getElementById('wsSaveBanner');
  if(banner){banner.style.display='block';banner.textContent='저장 중...';}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    await saveDraft();
    if(banner){banner.textContent='임시 저장됨 ✓';setTimeout(()=>{if(banner)banner.style.display='none';},1200);}
  },500);
}
async function saveDraft(){
  if(PREVIEW_MODE)return;
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers:curAnswers,submitted:false,current_step:curStepIdx,updated_at:new Date().toISOString()};
  if(curSub?.group_code)payload.group_code=curSub.group_code;
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  if(data)curSub=data;
}
async function finalSubmit(){
  if(PREVIEW_MODE){alert('미리보기 모드예요. 학생용 링크로 접속했을 때만 실제로 제출돼요.');return;}
  if(!confirm('제출하면 더 이상 수정할 수 없어요. 제출할까요?'))return;
  const payload={worksheet_id:curWorksheet.id,student_id:selStudent.id,answers:curAnswers,submitted:true,current_step:curStepIdx,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  if(curSub?.group_code)payload.group_code=curSub.group_code;
  const{data}=await sb.from('worksheet_submissions').upsert(payload,{onConflict:'worksheet_id,student_id'}).select().maybeSingle();
  curSub=data||payload;
  renderSubmittedScreen();
}

init();
</script>
